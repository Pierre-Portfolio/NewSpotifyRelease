name: Update actu feed

# Récupère les sources de la section Actu (Presse FR, Tendances Google, fuites de
# données, Hacker News) côté serveur et commit data/actu.json. L'app statique le lit
# en same-origin (CORS natif) — les proxies CORS publics côté navigateur sont trop
# peu fiables (throttle/pannes) et ne servent plus que de repli si le JSON périme.

on:
  schedule:
    # Toutes les 2 h, tous les jours (l'actu ne s'arrête pas le week-end).
    # Minute décalée (23) pour éviter les pics de charge des crons GitHub à H:00.
    - cron: '23 */2 * * *'
  workflow_dispatch: {}   # déclenchement manuel (utile juste après le déploiement)

permissions:
  contents: write

concurrency:
  group: update-actu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch actu sources
        run: python3 scripts/fetch_actu.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/actu.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/actu.json
            git commit -m "chore: update actu feed data"
            git push
          else
            echo "data/actu.json inchangé — rien à committer."
          fi
