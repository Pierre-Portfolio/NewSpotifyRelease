// SÃ©rie Â« Ã  jour Â» (rattrapÃ©e) : tous les Ã©pisodes DIFFUSÃ‰S sont vus et le prochain Ã©pisode
// Ã  regarder n'est pas encore sorti (nextEp dans le futur). Une telle sÃ©rie ne doit PAS
// apparaÃ®tre dans EN COURS (rien Ã  regarder maintenant) â€” seulement dans PROCHAINES SORTIES.
function tvCaughtUp(item) {
  if (!item || item.type !== 'tv' || !item.nextEp || !item.nextEp.date) return false;
  if (tvDaysUntil(item.nextEp.date) <= 0) return false;   // le prochain Ã©pisode est dÃ©jÃ  sorti â†’ Ã  regarder
  const nk = tvNextToWatch(item);   // 1er Ã©pisode non vu, ou null si tout vu
  if (!nk) return true;
  const m = nk.match(/^S(\d+)E(\d+)$/);
  if (!m) return true;
  const ns = +m[1], ne = +m[2];
  // Ã€ jour si le 1er Ã©pisode non vu est le prochain Ã  diffuser (non sorti) ou au-delÃ  :
  // tous les Ã©pisodes dÃ©jÃ  diffusÃ©s sont donc vus.
  return ns > item.nextEp.s || (ns === item.nextEp.s && ne >= item.nextEp.e);
}

// DÃ©compte des Ã©pisodes vus PAR SAISON (membres du set) â€” pour la fiche sÃ©rie.
// Retourne [{ n, eps, watched }] (chaque saison indÃ©pendante des autres)
function tvSeasonBreakdown(item) {
  const set = new Set(tvWatchedSet(item));
  return (item.seasons || []).map(s => {
    let watched = 0;
    for (let e = 1; e <= s.eps; e++) if (set.has(`S${s.n}E${e}`)) watched++;
    return { n: s.n, eps: s.eps, watched };
  });
}

// Ã‰pisodes spÃ©ciaux (saison 0) vus â€” modÃ¨le par Ã©p. INDIVIDUEL (cocher un spÃ©cial ne
// coche PAS les prÃ©cÃ©dents, contrairement aux saisons officielles qui restent cumulatives).
// Migration de l'ancien compteur plat `watchedSpecials` (int) â†’ [1..n] (les Ã©p. de saison 0
// TMDB sont gÃ©nÃ©ralement numÃ©rotÃ©s 1..N).
function tvSpecialsSeen(item) {
  if (Array.isArray(item.specialsSeen)) return item.specialsSeen;
  const n = Math.min(item.watchedSpecials || 0, item.specialEps || 0);
  return n > 0 ? Array.from({ length: n }, (_, i) => i + 1) : [];
}

// Ã‰pisodes d'une saison (fiche sÃ©rie dÃ©pliÃ©e) â€” 1 requÃªte /tv/{id}/season/{n} PAR SAISON,
// uniquement au 1er dÃ©pliage, puis cache localStorage 7 j (+ cache mÃ©moire session).
// Retourne [{ e, name, still }] ou null (erreur rÃ©seau / clÃ© absente â€” le caller gÃ©nÃ¨re
// alors des Ã©pisodes placeholder pour que les coches restent utilisables hors-ligne).
const _tvEpsCache = {};   // mÃ©moire session â€” Ã©vite de re-parser le localStorage Ã  chaque render
async function tvFetchSeasonEps(tvId, n) {
  const key = `${tvId}:${n}`;
  if (_tvEpsCache[key]) return _tvEpsCache[key];
  let store = {};
  try { store = JSON.parse(localStorage.getItem(TVTIME_EPS_LS)) || {}; } catch {}
  const hit = store[key];
  if (hit && Date.now() - (hit.at || 0) < TV_EPS_TTL) { _tvEpsCache[key] = hit.eps; return hit.eps; }
  const d = await tmdbGet(`/tv/${tvId}/season/${n}`);
  if (!d || !Array.isArray(d.episodes)) return (hit && hit.eps) || null;  // Ã©chec â†’ cache pÃ©rimÃ© plutÃ´t que rien
  const eps = d.episodes.map(ep => ({ e: ep.episode_number, name: ep.name || '', still: ep.still_path || null, date: ep.air_date || null }));
  _tvEpsCache[key] = eps;
  store[key] = { at: Date.now(), eps };
  // Ã‰viction des saisons les plus anciennes si le cache grossit trop
  const keys = Object.keys(store);
  if (keys.length > TV_EPS_CACHE_MAX) {
    keys.sort((a, b) => (store[a].at || 0) - (store[b].at || 0))
      .slice(0, keys.length - TV_EPS_CACHE_MAX).forEach(k => delete store[k]);
  }
  try { localStorage.setItem(TVTIME_EPS_LS, JSON.stringify(store)); } catch {}
  return eps;
}

// Statut de production TMDB â†’ libellÃ© FR pour la fiche sÃ©rie
function tvStatusFR(s) {
  if (/ended/i.test(s || '')) return 'TerminÃ©e';
  if (/canceled/i.test(s || '')) return 'AnnulÃ©e';
  if (/returning/i.test(s || '')) return 'En cours de diffusion';
  if (/production|planned|pilot/i.test(s || '')) return 'En production';
  return s || '';
}

// Jours avant une date ISO 'YYYY-MM-DD' (minuit local) â€” 0 = aujourd'hui, nÃ©gatif = passÃ©e
function tvDaysUntil(iso) {
  if (!iso) return null;
  // TolÃ¨re les dates PARTIELLES de TMDB (film annoncÃ© "2027" ou "2027-06") : on complÃ¨te
  // au 1er jour de la pÃ©riode (YYYY â†’ YYYY-01-01, YYYY-MM â†’ YYYY-MM-01). Sans Ã§a,
  // new Date('2027T00:00:00') = Invalid â†’ NaN â†’ le film disparaissait des Prochaines sorties.
  let d = String(iso);
  if (/^\d{4}$/.test(d)) d += '-01-01';
  else if (/^\d{4}-\d{2}$/.test(d)) d += '-01';
  const t = new Date(d + 'T00:00:00');
  if (isNaN(t)) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((t - today) / 86400000);
}

// RafraÃ®chit les PROCHAINES SORTIES suivies dont le cache a plus de 24h :
// - sÃ©ries non 'done' et non terminÃ©es (prochain Ã©pisode Ã  diffuser)
// - films non vus dont la date de sortie est absente (backfill des films ajoutÃ©s avant
//   cette feature) ou encore Ã  venir (aujourd'hui/futur) â€” une date passÃ©e est figÃ©e,
//   plus aucune requÃªte.
// SÃ‰QUENTIEL, 1 requÃªte /tv|movie/{id} par titre. Retourne une Map "<type><id>" â†’ champs
// frais (jamais watchedEps/status : les compteurs perso ne sont pas touchÃ©s).
async function tvRefreshShows(items, force) {
  const out = new Map();
  if (!tmdbKey()) return out;
  const stale = items.filter(it => {
    if (it.type === 'youtube') return false;   // YouTube : actualisÃ© via ytCheckNewVideos / bouton â†»
    if (it.type === 'tv') {
      // SÃ©rie 'done' : refetch UNIQUEMENT si elle a Ã©tÃ© Â« validÃ©e sans voir les Ã©pisodes
      // manquants Â» (dropped=false, pas tout vu) â†’ dÃ©tecter un nouvel Ã©pisode diffusÃ© et la
      // rÃ©activer (applyFresh). Une sÃ©rie Â« tout vu Â» ou Â« plus suivie Â» (dropped) n'est jamais refetch.
      if (it.status === 'done' && (it.dropped || (it.watchedEps || 0) >= (it.totalEps || 0))) return false;
      return !/^(Ended|Canceled)$/i.test(it.tvStatus || '')
        && (force || Date.now() - (it.refreshedAt || 0) > TV_REFRESH_TTL);
    }
    if (it.status === 'done') return false;
    // Films : suit uniquement la date des films PAS ENCORE VUS
    if (it.releaseDate === undefined) return true;                     // backfill (ajoutÃ© avant la feature)
    const upcoming = !it.releaseDate || tvDaysUntil(it.releaseDate) >= 0;
    return upcoming && (force || Date.now() - (it.refreshedAt || 0) > TV_REFRESH_TTL);
  });
  for (let i = 0; i < stale.length; i++) {
    const it = stale[i];
    if (i > 0) await sleep(120);   // throttle : Ã©vite un burst si beaucoup de titres Ã  backfill
    const f = await tmdbFetchItem(it.type, it.id);
    if (!f) continue;   // Ã©chec â†’ refreshedAt inchangÃ© : nouvel essai au prochain montage du panneau
    if (it.type === 'tv') out.set('tv' + it.id, { seasons: f.seasons, specialEps: f.specialEps, totalEps: f.totalEps, epRuntime: f.epRuntime, tvStatus: f.tvStatus, nextEp: f.nextEp, poster: f.poster || it.poster, refreshedAt: Date.now() });
    else out.set('movie' + it.id, { releaseDate: f.releaseDate, runtime: f.runtime || it.runtime, year: f.year || it.year, poster: f.poster || it.poster, refreshedAt: Date.now() });
  }
  return out;
}

// Stats TV Time (collapse Â« Stats Film Â» d'Ã€ propos) â€” 100% depuis le cache localStorage,
// AUCUNE requÃªte API. Films : comptÃ©s/temps quand status='done'. SÃ©ries : Ã©pisodes vus
// (watchedEps, posÃ© Ã  totalEps quand une sÃ©rie est marquÃ©e terminÃ©e) Ã— durÃ©e moyenne/Ã©p.
function tvTimeStats() {
  let movies = 0, movieMin = 0, episodes = 0, epMin = 0, series = 0;
  let movieRemainMin = 0, epRemainMin = 0;   // temps restant Ã  voir (films non vus / Ã©pisodes non vus)
  // Manga : label posÃ© sur un film/sÃ©rie (fiche) â€” non affichÃ© dans les listes, exploitÃ© ici
  let mangaTitles = 0, mangaEpisodes = 0, mangaMin = 0;
  // Dessin animÃ© (cartoon) : mÃªme mÃ©canique de label que manga
  let cartoonTitles = 0, cartoonEpisodes = 0, cartoonMin = 0;
  // YouTube : chaÃ®nes/playlists suivies (vidÃ©os vues cochÃ©es individuellement)
  let ytChannels = 0, ytVideos = 0, ytMin = 0, ytRemainMin = 0;
  // SÃ©ries par statut (en cours = watching/paused, terminÃ©e = done)
  let seriesOngoing = 0, seriesDone = 0;
  // Temps de visionnage dÃ©taillÃ© par sÃ©rie (pour le top 5 sous le temps total)
  const seriesTimes = [];
  for (const it of loadTvItems()) {
    let watchedMin = 0, watchedCount = 0;   // vu pour CE titre (film / Ã©pisodes / vidÃ©os)
    if (it.type === 'movie') {
      if (it.status === 'done') { movies++; movieMin += it.runtime || 0; watchedMin = it.runtime || 0; }
      else movieRemainMin += it.runtime || 0;   // film Ã  voir (towatch/watching)
    } else if (it.type === 'youtube') {
      const seen = new Set(it.watchedIds || []);
      ytChannels++;
      for (const v of (it.videos || [])) { if (seen.has(v.id)) { ytMin += v.dur || 0; } else { ytRemainMin += v.dur || 0; } }
      watchedCount = seen.size;
      watchedMin = (it.videos || []).reduce((a, v) => a + (seen.has(v.id) ? (v.dur || 0) : 0), 0);
      ytVideos += watchedCount;
    } else {
      // Les spÃ©ciaux vus (specialsSeen, cochÃ©s individuellement) comptent dans les stats
      // d'Ã©pisodes, mais jamais dans la progression / le passage en Â« Vu Â» d'une sÃ©rie
      const w = (it.watchedEps || 0) + Math.min(tvSpecialsSeen(it).length, it.specialEps || 0);
      if (w > 0) series++;
      episodes += w;
      watchedCount = w;
      watchedMin = w * (it.epRuntime || 0);
      epMin += watchedMin;
      if (watchedMin > 0) seriesTimes.push({ title: it.title || 'SÃ©rie inconnue', min: watchedMin, eps: w, epRuntime: it.epRuntime || 0 });
      // Restant = Ã©pisodes non vus (hors spÃ©ciaux, non comptÃ©s dans totalEps)
      const remain = Math.max(0, (it.totalEps || 0) - (it.watchedEps || 0));
      epRemainMin += remain * (it.epRuntime || 0);
      // Statut de la sÃ©rie : terminÃ©e (done) vs encore en cours (watching/paused/towatch)
      if (it.status === 'done') seriesDone++; else seriesOngoing++;
    }
    if (it.manga) {
      mangaTitles++;
      if (it.type !== 'movie') mangaEpisodes += watchedCount;
      mangaMin += watchedMin;
    }
    if (it.cartoon) {
      cartoonTitles++;
      if (it.type !== 'movie') cartoonEpisodes += watchedCount;
      cartoonMin += watchedMin;
    }
  }
  // Top sÃ©ries par temps de visionnage (desc) â€” alimente le classement sous le temps total
  const topSeries = seriesTimes.sort((a, b) => b.min - a.min).slice(0, 5);
  return { movies, movieMin, episodes, epMin, series, movieRemainMin, epRemainMin, mangaTitles, mangaEpisodes, mangaMin, cartoonTitles, cartoonEpisodes, cartoonMin, ytChannels, ytVideos, ytMin, ytRemainMin, seriesOngoing, seriesDone, topSeries };
}

// â”€â”€ Fiche sÃ©rie (popup au clic sur l'affiche) â€” progression dÃ©cortiquÃ©e par saison.
// Concept type TV Time : Â« Continuer le suivi Â» (prochain Ã©p. + coche), une ligne par
// saison (barre + x/y + coche verte). Les Ã©pisodes spÃ©ciaux (saison 0) sont SUIVABLES
// (ligne dÃ©pliable + coches INDIVIDUELLES, liste specialsSeen) mais JAMAIS comptÃ©s dans
// les 100 % ni requis pour que la sÃ©rie passe en Â« Vu Â».
function TvDetailModal({ item, onClose, onBump, onSeasonToggle, onToggleEp, onSetSpecials, onStatus, onManga, onCartoon }) {
  const isMovie = item.type === 'movie';
  const total   = item.totalEps || 0;
  const wset    = new Set(tvWatchedSet(item));   // Ã©pisodes vus (clÃ©s "S{n}E{e}") â€” cochage individuel

// La composition des repas ne sert qu'au suivi du jour â†’ on purge les jours > 90 j
// pour borner le localStorage (les totaux quotidiens, eux, sont conservÃ©s sans limite).
function saveFoodMeals(m) {
  const cutoff = new Date(Date.now() - 90 * 86400000);
  const min = `${cutoff.getFullYear()}-${String(cutoff.getMonth() + 1).padStart(2, '0')}-${String(cutoff.getDate()).padStart(2, '0')}`;
  const out = {};
  for (const k of Object.keys(m)) if (k >= min) out[k] = m[k];
  lsSet(FOOD_MEALS_KEY, JSON.stringify(out));
  return out;
}
// MÃ©tabolisme de base (Mifflin-St Jeor) puis besoin quotidien = BMR Ã— activitÃ© + objectif
function foodBmr(p) {
  if (!p || !p.weight || !p.height || !p.age) return 0;
  return Math.round(10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'f' ? -161 : 5));
}
function foodTarget(p) {
  const bmr = foodBmr(p);
  if (!bmr) return 0;
  const goal = FOOD_GOALS.find(g => g[0] === (p.goal || 'keep')) || FOOD_GOALS[1];
  return Math.max(1200, Math.round(bmr * parseFloat(p.activity || '1.2') + goal[2]));
}

// Recherche nutritionnelle via Open Food Facts (base ouverte, GRATUITE, sans clÃ©, CORS
// natif â€” origine ajoutÃ©e Ã  la CSP connect-src). Renvoie une liste
// { name, brand, kcal100 } oÃ¹ kcal100 = calories pour 100 g/100 ml. Parsing dÃ©fensif :
// certains produits n'exposent que l'Ã©nergie en kJ (`energy_100g`) â†’ conversion /4.184.
const FOOD_SEARCH_CACHE = {};   // { query(lower) : results[] } â€” Ã©vite de re-fetcher en session
async function foodSearchNutrition(query) {
  const q = (query || '').trim();
  if (q.length < 2) return [];
  const key = q.toLowerCase();
  if (FOOD_SEARCH_CACHE[key]) return FOOD_SEARCH_CACHE[key];
  const url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms=' +
    encodeURIComponent(q) + '&search_simple=1&action=process&json=1&page_size=24' +
    '&fields=product_name,product_name_fr,generic_name_fr,brands,nutriments';
  const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error('openfoodfacts ' + res.status);
  const data = await res.json();
  const out = [];
  const seen = new Set();
  for (const p of (data.products || [])) {
    const n = p.nutriments || {};
    let kcal = n['energy-kcal_100g'];
    if (kcal == null) kcal = n['energy-kcal'];
    if (kcal == null && n['energy_100g'] != null) kcal = n['energy_100g'] / 4.184; // kJ â†’ kcal
    kcal = Math.round(parseFloat(kcal));
    const name = (p.product_name_fr || p.product_name || p.generic_name_fr || '').trim();
    if (!name || !kcal || kcal <= 0 || !isFinite(kcal)) continue;
    const brand = (p.brands || '').split(',')[0].trim();
    const dedupe = (name + '|' + brand + '|' + kcal).toLowerCase();
    if (seen.has(dedupe)) continue;
    seen.add(dedupe);
    out.push({ name, brand, kcal100: kcal });
    if (out.length >= 12) break;
  }
  FOOD_SEARCH_CACHE[key] = out;
  return out;
}

  ['daily',  'Quotidien',       'ðŸ”'],

  ['week',   'Dans la semaine', 'ðŸ—“'],

// Jour courant au format 'YYYY-MM-DD' (local) â€” sert au reset quotidien des tÃ¢ches "Quotidien"
function todoTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Journal des tÃ¢ches terminÃ©es (validÃ©es) â€” { ts, fav } â€” alimente les stats To do.
// EnregistrÃ© quand une tÃ¢che est supprimÃ©e (Ã—) ou qu'une tÃ¢che Quotidien est validÃ©e pour le jour.
const TODO_DONE_KEY = 'spotifyplus_todos_done';
function loadTodoDone() { try { return JSON.parse(localStorage.getItem(TODO_DONE_KEY)) || []; } catch { return []; } }
function saveTodoDone(d) { lsSet(TODO_DONE_KEY, JSON.stringify(d)); }
function recordTodoDone(fav) {
  const d = loadTodoDone();
  d.push({ ts: Date.now(), fav: !!fav });
  if (d.length > 2000) d.splice(0, d.length - 2000); // borne mÃ©moire
  saveTodoDone(d);
}
// Compteurs : tÃ¢ches terminÃ©es aujourd'hui / ce mois / cette annÃ©e + total des favorites ("compliquÃ©es")
function todoDoneStats() {
  const d = loadTodoDone();
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), day = now.getDate();
  let today = 0, month = 0, year = 0, fav = 0;
  for (const e of d) {
    const dt = new Date(e.ts);
    if (dt.getFullYear() === y) {
      year++;
      if (dt.getMonth() === m) { month++; if (dt.getDate() === day) today++; }
    }
    if (e.fav) fav++;
  }
  return { today, month, year, fav };
}

// Jours restants jusqu'Ã  la date (nÃ©gatif = en retard), ou null si pas de date.
function rappelDelta(dateStr) {
  if (!dateStr) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  return Math.round((d - t) / 86400000);
}
function rappelBadge(days) {

// Tous les rappels datÃ©s (fixes + persos) avec leur nb de jours restants
// { key, label, days, date } â€” `key` = identifiant stable ("<section>.<item>" pour les
// fixes, "custom.<id>" pour les persos), utilisÃ© pour dÃ©doublonner l'ajout auto au To do.
function rememberAllWithDelta() {
  const out = [];
  const dates = loadRappels();
  const times = loadRappelTimes();
  RAPPEL_SECTIONS.forEach(sec => sec.items.forEach(([ik, label]) => {
    const k = sec.key + '.' + ik;
    const d = rappelDelta(dates[k]);
    if (d != null) out.push({ key: k, label, days: d, date: dates[k], time: times[k] || '' });
  }));
  RAPPEL_EXTRA.forEach(e => { const d = rappelDelta(dates[e.key]); if (d != null) out.push({ key: e.key, label: e.label, days: d, date: dates[e.key], time: times[e.key] || '' }); });
  loadRemembers().forEach(r => { const d = rappelDelta(r.date); if (d != null) out.push({ key: 'custom.' + r.id, label: r.label, days: d, date: r.date, time: r.time || '' }); });
  return out;
}

function rememberStats() {

  const overdue  = all.filter(r => r.days < 0).length;

const REMEMBER_TODO_LEAD_DAYS = 3;

    todos.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2), text: 'ðŸ”” ' + r.label + (r.time ? ` (${r.time})` : ''), bucket: 'today', fav: false, rememberKey: r.key });

// Veilles Techno â€” sous-sections du collapse Â« ðŸ›°ï¸ VEILLES TECHNO Â» de Remember.
// Chacune se connecte Ã  une API tierce via un token/clÃ© perso stockÃ© en localStorage
// (comme les clÃ©s TMDB/Riot). GitHub (api.github.com) envoie des en-tÃªtes CORS â†’ fetch
// DIRECT, jamais via les proxies CORS ouverts : le token ne transite QUE vers api.github.com.
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
const VEILLE_COLOR     = '#6ea8fe';                    // bleu Â« veille techno Â» (collapse parent)

const GH_TOKEN_LS = 'spotifyplus_github_token';        // PAT GitHub (classic, scope repo)
const GH_CACHE_LS = 'spotifyplus_dependabot';          // rÃ©sultat cachÃ© (re-fetchable, TTL 30 min â†’ PAS dans buildBackup)
const GH_TTL      = 30 * 60000;                        // 30 min
const DEP_SEV_ORDER = ['critical', 'high', 'medium', 'low'];
const DEP_SEV_LABEL = { critical:'Critiques', high:'Ã‰levÃ©es', medium:'Moyennes', low:'Faibles' };
const DEP_SEV_COLOR = { critical:'#f85149', high:'#f0883e', medium:'#e3b341', low:'#8b949e' };
function ghToken() { try { return (localStorage.getItem(GH_TOKEN_LS) || '').trim(); } catch { return ''; } }

// Alertes Dependabot OUVERTES de tous les dÃ©pÃ´ts possÃ©dÃ©s, via l'API GraphQL GitHub
// (1 requÃªte / 100 dÃ©pÃ´ts, au lieu d'1 requÃªte PAR dÃ©pÃ´t en REST). `vulnerabilityAlerts`
// = les alertes Dependabot ; `securityVulnerability.severity` âˆˆ LOW/MODERATE/HIGH/CRITICAL.
// Erreurs typÃ©es : 'CONFIG' (pas de token) | 'KEY' (401) | 'SCOPE' (FORBIDDEN) | 'NET'.
async function ghFetchDependabot(force) {
  const token = ghToken();
  if (!token) return { error: 'CONFIG' };
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(GH_CACHE_LS)); } catch {}
  if (!force && cache && Date.now() - cache.fetchedAt < GH_TTL) return cache;
  const query = `query($cursor:String){viewer{login repositories(first:100,after:$cursor,ownerAffiliations:OWNER,isFork:false){pageInfo{hasNextPage endCursor}nodes{nameWithOwner url vulnerabilityAlerts(states:OPEN,first:100){totalCount nodes{securityVulnerability{severity}}}}}}}`;
  const repos = [];
  let login = '', cursor = null, pages = 0;
  try {
    while (pages < 5) {                                 // cap 500 dÃ©pÃ´ts
      const r = await fetch('https://api.github.com/graphql', {
        method: 'POST',
        headers: { 'Authorization': 'bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables: { cursor } }),
      });
      if (r.status === 401) return { error: 'KEY' };
      if (!r.ok) return { error: 'NET' };
      const j = await r.json();
      if (j.errors && j.errors.length) return { error: j.errors[0].type === 'FORBIDDEN' ? 'SCOPE' : 'NET' };
      const v = j.data && j.data.viewer;
      if (!v) return { error: 'NET' };
      login = v.login;
      v.repositories.nodes.forEach(n => {
        const va = n.vulnerabilityAlerts;
        if (!va || !va.totalCount) return;
        const sev = { critical:0, high:0, medium:0, low:0 };
        (va.nodes || []).forEach(a => {
          const s = ((a.securityVulnerability && a.securityVulnerability.severity) || '').toLowerCase();
          const k = s === 'moderate' ? 'medium' : s;
          if (sev[k] != null) sev[k]++;
        });
        repos.push({ name: n.nameWithOwner, url: n.url, total: va.totalCount, ...sev });
      });
      pages++;
      if (!v.repositories.pageInfo.hasNextPage) break;
      cursor = v.repositories.pageInfo.endCursor;
    }
  } catch { return { error: 'NET' }; }
  const weight = r => r.critical * 1000 + r.high * 100 + r.medium * 10 + r.low;   // le plus critique d'abord
  repos.sort((a, b) => weight(b) - weight(a) || b.total - a.total);
  const out = { fetchedAt: Date.now(), login, repos, totalAlerts: repos.reduce((s, r) => s + r.total, 0), totalRepos: repos.length };
  try { localStorage.setItem(GH_CACHE_LS, JSON.stringify(out)); } catch {}
  return out;
}

// Stats de profil GitHub Â« fun Â» via la MÃŠME API GraphQL (MÃŠME token que Dependabot) :
// dÃ©pÃ´ts, Ã©toiles reÃ§ues, forks, abonnÃ©s, contributions sur 1 an, langage prÃ©fÃ©rÃ©, sÃ©rie
// de jours actifs (streak). 1 SEULE requÃªte. Erreurs typÃ©es comme ghFetchDependabot.
async function ghFetchProfile(force) {
  const token = ghToken();
  if (!token) return { error: 'CONFIG' };
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(GH_STATS_LS)); } catch {}
  if (!force && cache && Date.now() - cache.fetchedAt < GH_TTL) return cache;
  const query = `query{viewer{login name avatarUrl url createdAt followers{totalCount}following{totalCount}contributionsCollection{totalCommitContributions totalPullRequestContributions totalIssueContributions contributionCalendar{totalContributions weeks{contributionDays{contributionCount date}}}}repositories(first:100,ownerAffiliations:OWNER,isFork:false,orderBy:{field:STARGAZERS,direction:DESC}){totalCount nodes{name stargazerCount forkCount primaryLanguage{name}}}}}`;
  let j;
  try {
    const r = await fetch('https://api.github.com/graphql', {
      method: 'POST',
      headers: { 'Authorization': 'bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ query }),
    });
    if (r.status === 401) return { error: 'KEY' };
    if (!r.ok) return { error: 'NET' };
    j = await r.json();
  } catch { return { error: 'NET' }; }
  if (j.errors && j.errors.length) return { error: j.errors[0].type === 'FORBIDDEN' ? 'SCOPE' : 'NET' };
  const v = j.data && j.data.viewer;
  if (!v) return { error: 'NET' };
  const nodes = (v.repositories && v.repositories.nodes) || [];
  const totalStars = nodes.reduce((s, n) => s + (n.stargazerCount || 0), 0);
  const totalForks = nodes.reduce((s, n) => s + (n.forkCount || 0), 0);
  const langCount = {};
  nodes.forEach(n => { const l = n.primaryLanguage && n.primaryLanguage.name; if (l) langCount[l] = (langCount[l] || 0) + 1; });
  const topLang = Object.keys(langCount).sort((a, b) => langCount[b] - langCount[a])[0] || '';
  const topRepo = nodes.find(n => n.stargazerCount > 0) || null;
  // SÃ©ries de jours actifs depuis le calendrier de contributions (365 derniers jours)
  const cc = v.contributionsCollection || {};
  const cal = cc.contributionCalendar || {};
  const cdays = [];
  (cal.weeks || []).forEach(w => (w.contributionDays || []).forEach(d => cdays.push(d)));
  cdays.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  let maxStreak = 0, streakRun = 0;
  cdays.forEach(d => { if (d.contributionCount > 0) { streakRun++; if (streakRun > maxStreak) maxStreak = streakRun; } else streakRun = 0; });
  let curStreak = 0;
  for (let i = cdays.length - 1; i >= 0; i--) { if (cdays[i].contributionCount > 0) curStreak++; else break; }
  const out = {
    fetchedAt: Date.now(), login: v.login, name: v.name || v.login, avatar: v.avatarUrl || '', url: v.url || '',
    createdAt: v.createdAt || '', followers: (v.followers || {}).totalCount || 0, following: (v.following || {}).totalCount || 0,
    repoCount: (v.repositories || {}).totalCount || 0, totalStars, totalForks, topLang,
    topRepo: topRepo ? { name: topRepo.name, stars: topRepo.stargazerCount } : null,
    contribYear: cal.totalContributions || 0, commits: cc.totalCommitContributions || 0,
    prs: cc.totalPullRequestContributions || 0, issues: cc.totalIssueContributions || 0,
    curStreak, maxStreak,
  };
  try { localStorage.setItem(GH_STATS_LS, JSON.stringify(out)); } catch {}
  return out;
}

// â”€â”€ Veilles Techno Â· Speedrun â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// Nombre de runs EN ATTENTE DE VALIDATION (status=new) sur les jeux que tu MODÃˆRES,
// via l'API publique speedrun.com. 100% endpoints PUBLICS (pseudo â†’ user id â†’ jeux
// modÃ©rÃ©s â†’ runs status:new) : GET simples (en-tÃªte Accept, CORS-safelisted â†’ pas de
// preflight), AUCUNE clÃ© API Ã  stocker. speedrun.com envoie des en-tÃªtes CORS â†’ fetch DIRECT.
const SPEEDRUN_COLOR = '#e0b83a';                      // or Â« trophÃ©e Â» speedrun
const SR_USER_LS  = 'spotifyplus_speedrun_user';       // pseudo speedrun.com
const SR_CACHE_LS = 'spotifyplus_speedrun';            // rÃ©sultat cachÃ© (re-fetchable, TTL 15 min â†’ PAS dans buildBackup)
const SR_TTL      = 15 * 60000;                        // 15 min
const SR_API      = 'https://www.speedrun.com/api/v1';
function srUser() { try { return (localStorage.getItem(SR_USER_LS) || '').trim(); } catch { return ''; } }

// GET JSON speedrun.com. Renvoie l'objet parsÃ©, ou { __status } sur erreur HTTP.
async function srGet(url) {
  try {
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) return { __status: r.status };
    return await r.json();
  } catch { return { __status: 0 }; }
}
// Pagine un endpoint listant (games/runs) et renvoie tous les Ã©lÃ©ments (cap `hardCap`).
async function srPaginate(baseUrl, hardCap) {
  const out = []; let offset = 0;
  while (out.length < hardCap) {
    const j = await srGet(`${baseUrl}&max=200&offset=${offset}`);
    if (!j || j.__status || !Array.isArray(j.data)) break;
    out.push(...j.data);
    const size = (j.pagination && j.pagination.size) != null ? j.pagination.size : j.data.length;
    if (size < 200) break;                              // derniÃ¨re page
    offset += 200;
    await new Promise(res => setTimeout(res, 120));     // respire (rate-limit speedrun.com ~100/min)
  }
  return out;
}

// Runs Ã  valider par jeu modÃ©rÃ©. Erreurs typÃ©es : 'CONFIG' (pas de pseudo) | 'USER'
// (pseudo introuvable) | 'NET'.
async function srFetchQueue(force) {
  const name = srUser();
  if (!name) return { error: 'CONFIG' };
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(SR_CACHE_LS)); } catch {}
  if (!force && cache && cache.name === name && Date.now() - cache.fetchedAt < SR_TTL) return cache;
  // 1. pseudo â†’ user id (public)
  const u = await srGet(`${SR_API}/users/${encodeURIComponent(name)}`);
  if (u && u.__status === 404) return { error: 'USER' };
  if (!u || u.__status || !u.data || !u.data.id) return { error: 'NET' };
  const uid = u.data.id;
  const userName = (u.data.names && u.data.names.international) || name;
  const userUrl  = u.data.weblink || '';
  // 2. jeux modÃ©rÃ©s (public, mode bulk = id + noms uniquement)
  const games = await srPaginate(`${SR_API}/games?moderator=${uid}&_bulk=true`, 400);
  // 3. compte les runs status=new par jeu (sÃ©quentiel, cap 80 jeux)
  const rows = [];
  let totalPending = 0;
  for (const g of games.slice(0, 80)) {
    const runs = await srPaginate(`${SR_API}/runs?game=${g.id}&status=new`, 600);
    const pending = runs.length;
    totalPending += pending;
    if (pending > 0) rows.push({ name: (g.names && g.names.international) || g.abbreviation || g.id, url: g.weblink || '', pending });
    await new Promise(res => setTimeout(res, 120));
  }
  rows.sort((a, b) => b.pending - a.pending);
  const out = { fetchedAt: Date.now(), name, userName, userUrl, games: rows, totalPending, totalGames: games.length };
  try { localStorage.setItem(SR_CACHE_LS, JSON.stringify(out)); } catch {}
  return out;
}

const SR_STATS_LS = 'spotifyplus_speedrun_stats';      // stats speedrun cachÃ©es (re-fetchable, TTL 15 min â†’ PAS dans buildBackup)

// Stats Â« fun Â» de mon profil speedrun.com (MÃŠMES endpoints publics, MÃŠME pseudo) :
// records du monde, podiums, personal bests, jeux courus, temps cumulÃ©. Le champ `place`
// des personal-bests donne le classement (1 = WR). Erreurs : 'CONFIG' | 'USER' | 'NET'.
async function srFetchStats(force) {
  const name = srUser();
  if (!name) return { error: 'CONFIG' };
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(SR_STATS_LS)); } catch {}
  if (!force && cache && cache.name === name && Date.now() - cache.fetchedAt < SR_TTL) return cache;
  const u = await srGet(`${SR_API}/users/${encodeURIComponent(name)}`);
  if (u && u.__status === 404) return { error: 'USER' };
  if (!u || u.__status || !u.data || !u.data.id) return { error: 'NET' };
  const uid = u.data.id;
  const userName = (u.data.names && u.data.names.international) || name;
  const userUrl  = u.data.weblink || '';
  const signup   = u.data.signup || '';
  // Personal bests (embed du jeu pour le nom + le jeu favori)
  const pb = await srGet(`${SR_API}/users/${uid}/personal-bests?embed=game`);
  if (!pb || pb.__status || !Array.isArray(pb.data)) return { error: 'NET' };
  let wr = 0, podiums = 0, totalSec = 0, best = 0;
  const gameCount = {};
  pb.data.forEach(e => {
    const place = e.place || 0;
    if (place === 1) wr++;
    if (place >= 1 && place <= 3) podiums++;
    if (place >= 1 && (best === 0 || place < best)) best = place;
    const t = e.run && e.run.times && e.run.times.primary_t;
    if (t) totalSec += t;
    const g = e.game && e.game.data;
    const gname = g && g.names && g.names.international;
    if (gname) gameCount[gname] = (gameCount[gname] || 0) + 1;
  });
  const gnames = Object.keys(gameCount);
  const favGame = gnames.sort((a, b) => gameCount[b] - gameCount[a])[0] || '';
  const out = {
    fetchedAt: Date.now(), name, userName, userUrl, signup,
    pbs: pb.data.length, wr, podiums, games: gnames.length, favGame, bestPlace: best, totalSec,
  };
  try { localStorage.setItem(SR_STATS_LS, JSON.stringify(out)); } catch {}
  return out;
}

function RappelPanel() {
  const [dates, setDates]   = React.useState(loadRappels);
  const [times, setTimes]   = React.useState(loadRappelTimes);   // heure OPTIONNELLE des items fixes
  const [customs, setCustoms] = React.useState(loadRemembers);

  const [cTime, setCTime]   = React.useState('');

  // Heure OPTIONNELLE : masquÃ©e par dÃ©faut, on l'affiche/masque en cliquant sur le libellÃ©.

  // reste visible aprÃ¨s un reload.
  const [openTimes, setOpenTimes] = React.useState(() => {
    const s = new Set();
    const t = loadRappelTimes(); Object.keys(t).forEach(k => { if (t[k]) s.add(k); });
    loadRemembers().forEach(c => { if (c.time) s.add(c.id); });

    if (!val) { const nt = { ...times }; delete nt[key]; setTimes(nt); saveRappelTimes(nt); }  // pas de date â†’ on oublie l'heure

  const updateCustoms = next => { setCustoms(next); saveRemembers(next); try { syncRemembersToTodos(); } catch {} };

// HISTORIQUE PANEL â€” derniers titres Ã©coutÃ©s (non purgÃ©s)
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function formatListenedAt(s) {
  if (!s) return '';
  const str = String(s).trim();
  // Deux formats possibles : 'YYYY-MM-DD HH:MM:SS' (datetime('now'), UTC) et 'YYYY-MM-DD'
  // seul (last_scraped_at posÃ© par la ligne Â« lÃ©gÃ¨re Â» d'un scan partiel). Une date sans
  // heure suffixÃ©e 'Z' donne Invalid Date â†’ on la parse Ã  midi local (delta en jours correct).
  const d = /^\d{4}-\d{2}-\d{2}$/.test(str)
    ? new Date(str + 'T12:00:00')
    : new Date(str.replace(' ', 'T') + 'Z');
  if (isNaN(d)) return '';
  const diff = Date.now() - d.getTime();
  const min  = Math.floor(diff / 60000);
  if (min < 1)  return "Ã  l'instant";
  if (min < 60) return `il y a ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24)   return `il y a ${h} h`;
  const j = Math.floor(h / 24);
  if (j === 1)  return 'hier';
  if (j < 7)    return `il y a ${j} j`;
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}

// Formatage compact des grands nombres (abonnÃ©s) : 1234 â†’ "1,2 k", 2_500_000 â†’ "2,5 M"
function fmtCompactNum(n) {
  if (n == null || isNaN(n)) return 'â€”';
  if (n < 1000) return String(n);
  if (n < 1e6)  return (n / 1e3).toFixed(n < 1e4 ? 1 : 0).replace('.', ',') + ' k';
  return (n / 1e6).toFixed(1).replace('.', ',') + ' M';
}

// COMPACT PLAYER â€” vue ultra-compacte (split-screen / fenÃªtre du bas sur tel)
// N'affiche QUE les contrÃ´les : prÃ©cÃ©dent / play-pause / suivant
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function CompactPlayer() {
  const { now, feed, filteredFeed, filteredFeedIndex, seek, setTrackLiked, likedTracks, markListened } = useStore();
  const [isLiked, setIsLiked] = React.useState(false);

  // VÃ©rifier si le titre en cours est likÃ© â€” local d'abord, API seulement si inconnu
  React.useEffect(() => {
    const feedItem = now?.uri ? feed.find(f => f.spotifyUri === now.uri) : null;
    const inLocal  = likedTracks.some(t => t.spotifyUri === now?.uri) || !!feedItem?.liked;
    setIsLiked(inLocal);
    if (!now?.uri) return;
    if (feedItem || inLocal) return;
    libraryContains([now.uri])
      .then(data => { if (data) setIsLiked(data[0]); })
      .catch(() => {});
  }, [now?.uri]);

  const _cu = _effUri(now?.uri);
  const currentIndex = _cu ? (filteredFeedIndex.get(_cu) ?? -1) : -1;
  const hasFeed      = filteredFeed.length > 0;

  const togglePlayPause = async () => {
    if (!now) return;
    if (now.playing) await apiPut('https://api.spotify.com/v1/me/player/pause');
    else             await apiPut('https://api.spotify.com/v1/me/player/play');
  };
  const prevTrack = async () => {
    const idx = currentIndex > 0 ? currentIndex - 1 : filteredFeed.length - 1;
    if (filteredFeed[idx]) await playTrack(filteredFeed[idx].spotifyUri);
  };
  const nextTrack = async () => {
    // URI du titre quittÃ© (avant calcul du suivant) : on le retire tout de suite, sans
    // attendre le poll 5s. Couvre le double-clic rapide oÃ¹ now.uri saute le titre intermÃ©diaire.
    const leaving = currentIndex >= 0 ? filteredFeed[currentIndex]?.spotifyUri : null;
    const idx = currentIndex >= 0 && currentIndex < filteredFeed.length - 1 ? currentIndex + 1 : 0;
    if (!filteredFeed[idx]) return;
    await playTrack(filteredFeed[idx].spotifyUri);
    const dur = filteredFeed[idx].duration_ms;
    if (dur > 0) setTimeout(() => seek(Math.floor(dur * 0.25)), 400);
    if (leaving) markListened(leaving);
  };

  const toggleLike = async () => {
    if (!now?.uri) return;
    if (isLiked) {
      const res = await libraryRemove(now.uri);
      if (libraryWriteFailed(res)) return;
      setIsLiked(false);
      setTrackLiked(now.uri, false);
    } else {
      const res = await librarySave(now.uri);
      if (libraryWriteFailed(res)) return;
      setIsLiked(true);
      setTrackLiked(now.uri, true);
    }
  };

  const btn = { background:'none', border:'none', cursor:'pointer', padding:12, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 };

  return (
    <div style={{ width:'100%', height:'100%', background:'linear-gradient(180deg,#131313 0%,#0a0a0a 100%)', color:C.text, display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center', gap:10, padding:'8px 16px', overflow:'hidden' }}>
      {now ? (
        <>
          {/* Titre + artiste (une ligne chacun) */}
          <div style={{ textAlign:'center', maxWidth:'100%', minWidth:0 }}>
            <div style={{ fontSize:13, fontWeight:700, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', color:C.text }}>{now.title}</div>
            <div style={{ fontSize:11, color:C.muted, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
              {now.artist}{currentIndex >= 0 ? ` Â· ${currentIndex + 1}/${filteredFeed.length}` : ''}
            </div>
          </div>
          {/* ContrÃ´les : prÃ©cÃ©dent / play-pause / suivant */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:18 }}>
            <button onClick={prevTrack} style={{ ...btn, opacity: hasFeed ? 1 : 0.3 }} title="PrÃ©cÃ©dent">
              <svg width="28" height="28" viewBox="0 0 16 16" fill={C.muted}><rect x="1" y="1" width="2" height="14" rx="1"/><path d="M13 1L4 8l9 7V1z"/></svg>
            </button>
            <button onClick={togglePlayPause} style={{ width:60, height:60, borderRadius:'50%', background:C.accent, border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }} title={now.playing ? 'Pause' : 'Lecture'}>
              {now.playing
                ? <svg width="18" height="20" viewBox="0 0 12 14" fill="#000"><rect x="0" y="0" width="4" height="14" rx="1"/><rect x="8" y="0" width="4" height="14" rx="1"/></svg>
                : <svg width="18" height="20" viewBox="0 0 12 14" fill="#000"><path d="M1 0l11 7-11 7V0z"/></svg>}
            </button>
            <button onClick={nextTrack} style={{ ...btn, opacity: hasFeed ? 1 : 0.3 }} title="Suivant">
              <svg width="28" height="28" viewBox="0 0 16 16" fill={C.muted}><rect x="13" y="1" width="2" height="14" rx="1"/><path d="M3 1l9 7-9 7V1z"/></svg>
            </button>
            <button onClick={toggleLike} style={{ ...btn }} title={isLiked ? 'Retirer des likÃ©s' : 'Liker'}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill={isLiked ? '#e05050' : 'none'} stroke={isLiked ? '#e05050' : C.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </button>
          </div>
        </>
      ) : (
        <span style={{ fontFamily:'DM Mono,monospace', fontSize:11, color:C.dim, textAlign:'center' }}>Aucune lecture en cours sur Spotifyâ€¦</span>
      )}
    </div>
  );
}

// Toast "â†© Annuler" affichÃ© 5 s aprÃ¨s un retrait de titre (croix rouge / swipe gauche)
function UndoToast() {
  const { undoToast, undoRemove, clearUndo } = useStore();
  React.useEffect(() => {
    if (!undoToast) return;
    const id = setTimeout(() => clearUndo(), 5000);
    return () => clearTimeout(id);
  }, [undoToast]);
  if (!undoToast) return null;
  const it = undoToast.item || {};
  return (
    <div style={{ position:'fixed', left:'50%', bottom:96, transform:'translateX(-50%)', zIndex:9998, background:C.surfaceHigh, border:`1px solid ${C.border}`, borderRadius:10, padding:'9px 10px 9px 14px', display:'flex', alignItems:'center', gap:12, boxShadow:'0 8px 24px rgba(0,0,0,0.55)', maxWidth:'92vw' }}>
      <div style={{ minWidth:0 }}>
        <div style={{ fontSize:11, color:C.text, fontWeight:700 }}>Titre retirÃ©</div>
        <div style={{ fontSize:10, color:C.muted, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', maxWidth:200 }}>{[it.artist, it.title].filter(Boolean).join(' â€” ') || 'â€”'}</div>
      </div>
      <button onClick={undoRemove} style={{ background:`${C.accent}18`, border:`1px solid ${C.accent}55`, color:C.accent, borderRadius:8, padding:'6px 12px', fontSize:11, fontWeight:700, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>â†© Annuler</button>
    </div>
  );
}

}

function App() {
