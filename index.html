      <div onClick={e => e.stopPropagation()} style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:'16px 18px', width:'100%', maxWidth:420, maxHeight:'85vh', overflowY:'auto', boxShadow:'0 20px 60px rgba(0,0,0,0.6)' }}>
        {/* En-tête : affiche + titre + méta */}
        <div style={{ display:'flex', alignItems:'flex-start', gap:12, marginBottom:12 }}>
          {item.poster
            ? <img src={TMDB_IMG + item.poster} alt="" style={{ width:48, height:72, borderRadius:6, objectFit:'cover', flexShrink:0, background:'#111' }} />
            : <div style={{ width:48, height:72, borderRadius:6, background:'#111', display:'flex', alignItems:'center', justifyContent:'center', fontSize:20, flexShrink:0 }}>📺</div>}
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:15, fontWeight:800, color:C.text, lineHeight:1.25 }}>{item.title}</div>
            <div style={{ fontSize:10, color:C.muted, fontFamily:'DM Mono,monospace', marginTop:3 }}>
              {item.year ? `${item.year} · ` : ''}{rows.length} saison{rows.length > 1 ? 's' : ''} · {total} ép.{prodLbl ? ` · ${prodLbl}` : ''}
            </div>
            {/* Progression globale */}
            <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:8 }}>
              <div style={{ flex:1 }}><Bar v={watched} max={total} color={allSeen ? '#4caf50' : TVTIME_COLOR} h={6} /></div>
              <div style={{ fontSize:11, fontWeight:800, fontFamily:'DM Mono,monospace', color: allSeen ? '#4caf50' : TVTIME_COLOR, flexShrink:0 }}>{pct}%</div>
            </div>
            <div style={{ fontSize:9, color:C.dim, fontFamily:'DM Mono,monospace', marginTop:3 }}>{watched}/{total} épisodes vus</div>
          </div>
          <button onClick={onClose} style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:8, color:C.muted, fontSize:16, lineHeight:1, padding:'3px 9px', cursor:'pointer', flexShrink:0 }}>×</button>
        </div>

        {/* Statut dans mes listes */}
        <div style={{ display:'flex', gap:5, marginBottom:12 }}>
          {STATUSES.map(([k, label, color]) => {
            const active = item.status === k;
            return (
              <button key={k} onClick={() => onStatus(k)}
                style={{ flex:1, background: active ? `${color}22` : 'none', border:`1px solid ${active ? color + '88' : C.border}`, borderRadius:6, color: active ? color : C.dim, fontSize:10, fontWeight:700, padding:'5px 0', cursor:'pointer', fontFamily:'DM Mono,monospace' }}>
                {label}
              </button>
            );
          })}
        </div>

        {/* Continuer le suivi */}
        <div style={{ fontSize:10, fontWeight:800, color:TVTIME_COLOR, letterSpacing:'0.05em', marginBottom:6 }}>▶ CONTINUER LE SUIVI</div>
        <div style={{ display:'flex', alignItems:'center', gap:10, background:C.surfaceHigh, borderRadius:10, padding:'10px 12px', marginBottom:12 }}>
          {allSeen ? (
            <div style={{ flex:1, fontSize:11, fontWeight:700, color:'#4caf50' }}>Série entière vue ✓ <span style={{ color:C.dim, fontWeight:400 }}>(hors épisodes spéciaux)</span></div>
          ) : (
            <>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:16, fontWeight:900, fontFamily:'DM Mono,monospace', color:C.text }}>
                  {nextSeason ? `S${String(nextSeason.n).padStart(2, '0')} | E${String(nextSeason.watched + 1).padStart(2, '0')}` : '—'}
                </div>
                <div style={{ fontSize:9, color:C.muted, fontFamily:'DM Mono,monospace', marginTop:2 }}>prochain épisode à regarder</div>
              </div>
              <button onClick={() => onBump(-1)} disabled={watched === 0} title="−1 épisode vu"
                style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:8, color: watched === 0 ? '#333' : C.muted, fontSize:14, lineHeight:1, padding:'6px 10px', cursor: watched === 0 ? 'default' : 'pointer', flexShrink:0 }}>−</button>
              <button onClick={() => onBump(+1)} title="Épisode vu (+1)"
                style={{ width:34, height:34, borderRadius:'50%', flexShrink:0, cursor:'pointer', background:TVTIME_COLOR, border:'none', color:'#0c1210', fontSize:15, fontWeight:900, lineHeight:1, padding:0 }}>✓</button>
            </>
          )}
        </div>

        {/* Saisons */}
        <div style={{ fontSize:10, fontWeight:800, color:TVTIME_COLOR, letterSpacing:'0.05em', marginBottom:6 }}>TOUTES LES SAISONS</div>
        <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
          {allRows.map(s => {
            const done = s.watched >= s.eps;
            const open = openSeason === s.n;
            // Ligne spéciaux : compteur séparé (watchedSpecials), coches via onSetSpecials,
            // rendu grisé — même mécanique de dépliage que les vraies saisons (saison 0 TMDB)
            const cnt = s.special ? spW : (item.watchedEps || 0);
            const setTo = s.special ? onSetSpecials : onSetEps;
            return (
              <div key={s.n} style={{ background: s.special ? '#111' : C.surfaceHigh, borderRadius:10, padding:'8px 12px' }}>
                <div onClick={() => toggleSeason(s)} title={open ? 'Replier' : 'Voir les épisodes'}
                  style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6, cursor:'pointer', userSelect:'none' }}>
                  <span style={{ display:'inline-block', color:C.dim, fontSize:10, lineHeight:1, flexShrink:0, transform: open ? 'rotate(90deg)' : 'none', transition:'transform 0.15s' }}>▶</span>
                  <div style={{ flex:1, fontSize:12, fontWeight:800, color: s.special ? C.dim : C.text }}>{s.special ? 'Épisodes spéciaux' : `Saison ${s.n}`}</div>
                  <div style={{ fontSize:10, fontFamily:'DM Mono,monospace', color: done ? '#4caf50' : (s.special ? C.dim : C.muted), fontWeight:700 }}>{s.watched}/{s.eps}{s.special ? ' · non comptés' : ''}</div>
                  <Check done={done} onClick={e => { e.stopPropagation(); s.special ? onSetSpecials(done ? 0 : s.eps) : onSeasonToggle(s); }}
                    title={s.special
                      ? (done ? 'Décocher tous les épisodes spéciaux' : 'Marquer tous les épisodes spéciaux vus')
                      : (done ? `Décocher (revenir au début de la saison ${s.n})` : `Marquer vue jusqu'à la fin de la saison ${s.n}`)} />
                </div>
                <Bar v={s.watched} max={s.eps} color={done ? '#4caf50' : (s.special ? C.dim : TVTIME_COLOR)} />
                {/* Liste des épisodes (dépliée) — vignette + S02 | E05 + nom + coche */}
                {open && (
                  epsLoading === s.n
                    ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'8px 0 2px', fontFamily:'DM Mono,monospace' }}>Chargement des épisodes…</div>
                    : (epsMap[s.n] || []).length > 0 && (
                        <div style={{ display:'flex', flexDirection:'column', gap:5, marginTop:8 }}>
                          {epsMap[s.n].map(ep => {
                            const seen = s.cumStart + ep.e <= cnt;
                            return (
                              <div key={ep.e} style={{ display:'flex', alignItems:'center', gap:10, background: s.special ? '#0a0a0a' : '#111', borderRadius:8, padding:6, minHeight:52 }}>
                                {ep.still
                                  ? <img src={TMDB_STILL + ep.still} alt="" loading="lazy" style={{ width:82, height:46, borderRadius:6, objectFit:'cover', flexShrink:0, background:'#1a1a1a' }} />
                                  : <div style={{ width:82, height:46, borderRadius:6, background:'#1a1a1a', display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, flexShrink:0 }}>📺</div>}
                                <div style={{ flex:1, minWidth:0 }}>
                                  <div style={{ fontSize:13, fontWeight:900, fontFamily:'DM Mono,monospace', color:C.text }}>
                                    S{String(s.n).padStart(2, '0')} | E{String(ep.e).padStart(2, '0')}
                                  </div>
                                  {ep.name && <div style={{ fontSize:10, color:C.muted, marginTop:2, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{ep.name}</div>}
                                </div>
                                <Check done={seen}
                                  onClick={() => setTo(seen ? s.cumStart + ep.e - 1 : s.cumStart + ep.e)}
                                  title={seen ? `Décocher (vu jusqu'à S${s.n}E${ep.e - 1})` : `Vu jusqu'à S${s.n}E${ep.e}`} />
                              </div>
                            );
                          })}
                        </div>
                      )
                )}
              </div>
            );
          })}
        </div>
        <div style={{ fontSize:9, color:C.dim, fontStyle:'italic', lineHeight:1.5, marginTop:10 }}>
          ℹ Les épisodes hors-série (saison 0) sont suivables (coches) mais ne comptent pas dans la progression : pas besoin de les voir pour atteindre 100 % — la série passe automatiquement en « Vu » dès que tous les épisodes normaux sont vus. Cocher une saison marque la série vue jusqu'à la fin de cette saison ; cocher un épisode la marque vue jusqu'à cet épisode inclus.
        </div>
      </div>
    </div>
  );
}

function TvTimePanel() {
  const [items, setItems]     = React.useState(loadTvItems);
  const [query, setQuery]     = React.useState('');
  const [results, setResults] = React.useState(null); // null = pas de résultats affichés
  const [busy, setBusy]       = React.useState(false);
  const [refreshing, setRefreshing] = React.useState(false);
  const [showKey, setShowKey] = React.useState(false);
  const [keyInput, setKeyInput] = React.useState('');
  // Sections repliables (header cliquable + chevron) — seule EN COURS ouverte par défaut
  const [secOpen, setSecOpen] = React.useState({ watching: true, towatch: false, upcoming: false, done: false });
  const toggleSec = k => setSecOpen(o => ({ ...o, [k]: !o[k] }));
  // Fiche série ouverte au clic sur l'affiche — { type, id } ; l'item est relu dans `items`
  // à chaque render pour que la fiche reflète les ±1 / coches saison en direct
  const [detail, setDetail] = React.useState(null);
  const detailItem = detail ? items.find(it => it.type === detail.type && it.id === detail.id) : null;
  // Filtre Films/Séries persisté — 'all' | 'movie' | 'tv'
  const [mediaFilter, setMediaFilter] = React.useState(() => {
    try { const v = localStorage.getItem(TVTIME_FILTER_LS); return (v === 'movie' || v === 'tv') ? v : 'all'; } catch { return 'all'; }
  });
  const pickFilter = f => { setMediaFilter(f); try { localStorage.setItem(TVTIME_FILTER_LS, f); } catch {} };
  // Tri des listes (persisté) + filtre texte sur le nom (non persisté) — appliqués aux
  // sections En cours / À voir / Vus (Prochaines sorties garde son tri par date de diffusion)
  const [sortBy, setSortBy] = React.useState(() => {
    try { const v = localStorage.getItem(TVTIME_SORT_LS); return TVTIME_SORTS.some(s => s[0] === v) ? v : 'added_desc'; } catch { return 'added_desc'; }
  });
  const pickSort = v => { setSortBy(v); try { localStorage.setItem(TVTIME_SORT_LS, v); } catch {} };
  const [listFilter, setListFilter] = React.useState('');
  const hasKey = !!tmdbKey();

  const update = next => { setItems(next); saveTvItems(next); };
  // Applique les champs frais du refresh SUR le dernier état persisté (une action utilisateur
  // pendant le refresh — ép. +1, ajout… — passe par update() qui sauvegarde : rien n'est perdu)
  const applyFresh = m => {
    if (!m || m.size === 0) return;
    const cur = loadTvItems();
    update(cur.map(it => m.has(it.type + it.id) ? { ...it, ...m.get(it.type + it.id) } : it));
  };

  // Refresh auto des prochaines sorties au montage (TTL 24h — 0 requête si cache frais)
  React.useEffect(() => {
    if (!hasKey) return;
    let cancelled = false;
    (async () => { const m = await tvRefreshShows(loadTvItems(), false); if (!cancelled) applyFresh(m); })();
    return () => { cancelled = true; };
  }, []);

  const doRefresh = async () => {
    if (refreshing) return;
    setRefreshing(true);
    applyFresh(await tvRefreshShows(loadTvItems(), true));
    setRefreshing(false);
  };

  const saveKey = () => {
    const k = keyInput.trim();
    if (!k) return;
    try { localStorage.setItem(TMDB_KEY_LS, k); } catch {}
    setKeyInput(''); setShowKey(false);
  };

  // Filtre de RECHERCHE Films/Séries — 'all' (« Les deux », défaut) | 'movie' | 'tv'.
  // Non persisté : repart sur « Les deux » à chaque montage. 'all' → /search/multi,
  // sinon /search/movie ou /search/tv (toujours 1 seule requête, résultats plus
  // pertinents qu'un filtrage client du multi).
  const [searchType, setSearchType] = React.useState('all');
  const search = async (type = searchType) => {
    const q = query.trim();
    if (!q || busy) return;
    setBusy(true);
    const path = type === 'all' ? '/search/multi' : (type === 'movie' ? '/search/movie' : '/search/tv');
    const d = await tmdbGet(path, { query: q, include_adult: 'false' });
    // /search/movie et /search/tv ne renvoient pas media_type → on le pose depuis le filtre
    setResults(d ? (d.results || [])
      .map(r => ({ ...r, media_type: r.media_type || type }))
      .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
      .slice(0, 8) : []);
    setBusy(false);
  };
  const pickSearchType = t => {
    setSearchType(t);
    // Des résultats sont affichés → re-cherche immédiate avec le nouveau type
    if (results !== null && query.trim()) search(t);
  };

  const setStatus = (item, status) => update(items.map(it => (it.id !== item.id || it.type !== item.type) ? it : {
    ...it, status,
    // ✓ série terminée = tout vu (alimente les stats d'épisodes)
    watchedEps: (status === 'done' && it.type === 'tv') ? (it.totalEps || it.watchedEps || 0) : it.watchedEps,
    doneAt: status === 'done' ? Date.now() : it.doneAt,
  }));

  const addItem = async (r, status) => {
    if (busy) return;
    const exist = items.find(it => it.id === r.id && it.type === r.media_type);
    if (exist) { setStatus(exist, status); setResults(null); setQuery(''); return; }
    setBusy(true);
    const it = await tmdbFetchItem(r.media_type, r.id);   // 1 seule requête, tout est mis en cache
    setBusy(false);
    if (!it) { alert('Impossible de récupérer les détails TMDB (clé invalide ou réseau).'); return; }
    if (status === 'done') { if (it.type === 'tv') it.watchedEps = it.totalEps; it.doneAt = Date.now(); }
    update([{ ...it, status }, ...items]);
    setResults(null); setQuery('');
  };

  // Clamp du compteur + STATUT AUTO : tous les épisodes normaux vus (les spéciaux ne
  // comptent pas) → la série passe automatiquement en « ✓ Vu » ; redescendre sous le
  // total la repasse en « ▶ En cours » (une série 'done' a toujours watchedEps=totalEps)
  const withEps = (it, v) => {
    const w = Math.min(it.totalEps || 9999, Math.max(0, v));
    const next = { ...it, watchedEps: w };
    if (it.type === 'tv' && (it.totalEps || 0) > 0) {
      if (w >= it.totalEps && it.status !== 'done') { next.status = 'done'; next.doneAt = Date.now(); }
      else if (w < it.totalEps && it.status === 'done') next.status = 'watching';
    }
    return next;
  };
  // +1 / −1 épisode vu (bornés 0..totalEps) — aucune requête, tout est déjà en cache
  const bump = (item, d) => update(items.map(it => (it.id !== item.id || it.type !== item.type) ? it :
    withEps(it, (it.watchedEps || 0) + d)));
  // Pose le compteur à une valeur absolue (coche saison / épisode de la fiche série)
  const setWatchedTo = (item, v) => update(items.map(it => (it.id !== item.id || it.type !== item.type) ? it :
    withEps(it, v)));
  // Compteur des épisodes SPÉCIAUX vus (saison 0) — suivi à part, aucun effet sur le
  // statut ni la progression (pas besoin de les voir pour terminer la série)
  const setSpecialsTo = (item, v) => update(items.map(it => (it.id !== item.id || it.type !== item.type) ? it :
    { ...it, watchedSpecials: Math.min(it.specialEps || 0, Math.max(0, v)) }));

  const removeItem = item => {
    if (confirm(`Retirer « ${item.title} » de TV Time ?`)) update(items.filter(it => it.id !== item.id || it.type !== item.type));
  };

  // Les sections par statut sont calculées sur la liste filtrée Films/Séries + nom, puis
  // triée (tri persisté). PROCHAINES SORTIES est 100% séries : masquée en mode Films
  // (pas d'état vide inutile) et garde son propre tri par date de diffusion.
  const tvCmp = (a, b) => {
    if (sortBy === 'name')      return (a.title || '').localeCompare(b.title || '', 'fr', { sensitivity: 'base' });
    if (sortBy === 'year_desc') return (parseInt(b.year) || 0) - (parseInt(a.year) || 0);
    if (sortBy === 'year_asc')  return (parseInt(a.year) || 9999) - (parseInt(b.year) || 9999);
    if (sortBy === 'added_asc') return (a.addedAt || 0) - (b.addedAt || 0);
    return (b.addedAt || 0) - (a.addedAt || 0); // 'added_desc' (défaut)
  };
  const nameQ = listFilter.trim().toLowerCase();
  const visible = (mediaFilter === 'all' ? items : items.filter(it => it.type === mediaFilter))
    .filter(it => !nameQ || (it.title || '').toLowerCase().includes(nameQ))
    .slice().sort(tvCmp);
  const nbMovies = items.reduce((a, it) => a + (it.type === 'movie' ? 1 : 0), 0);
  const watching = visible.filter(it => it.status === 'watching');
  const towatch  = visible.filter(it => it.status === 'towatch');
  const done     = visible.filter(it => it.status === 'done');
  const upcoming = items.filter(it => it.type === 'tv' && it.status !== 'done' && it.nextEp && it.nextEp.date)
    .sort((a, b) => a.nextEp.date < b.nextEp.date ? -1 : 1);

  const inputStyle = { flex:1, minWidth:0, background:'#111', border:`1px solid ${C.border}`, borderRadius:6, padding:'5px 10px', fontSize:11, color:C.text, outline:'none', fontFamily:'inherit', boxSizing:'border-box' };
  const abtn = (color, title) => ({ background:'none', border:'none', color, fontSize:13, lineHeight:1, padding:'0 3px', cursor:'pointer', flexShrink:0 });
  const secTitle = (secKey, icon, label, count, extra) => (
    <div onClick={() => toggleSec(secKey)} style={{ display:'flex', alignItems:'center', gap:6, marginTop:2, cursor:'pointer', userSelect:'none' }}>
      <div style={{ flex:1, fontSize:10, fontWeight:800, color:TVTIME_COLOR, letterSpacing:'0.05em' }}>
        {icon} {label}{count > 0 && <span style={{ color:C.muted, fontWeight:400 }}> · {count}</span>}
      </div>
      {extra}
      <span style={{ display:'inline-block', color:C.dim, fontSize:11, lineHeight:1, flexShrink:0, transform: secOpen[secKey] ? 'rotate(90deg)' : 'none', transition:'transform 0.15s' }}>▶</span>
    </div>
  );
  // Affiche cliquable pour les séries de la liste (pas les résultats de recherche, qui
  // n'ont pas encore de `seasons`) → ouvre la fiche série TvDetailModal
  const poster = it => {
    const clickable = it.type === 'tv' && (it.seasons || []).length > 0;
    const onClick = clickable ? () => setDetail({ type: it.type, id: it.id }) : undefined;
    const st = { width:26, height:39, borderRadius:4, objectFit:'cover', flexShrink:0, background:'#111', cursor: clickable ? 'pointer' : undefined };
    return it.poster
      ? <img src={TMDB_IMG + it.poster} alt="" loading="lazy" onClick={onClick} title={clickable ? 'Détail des saisons' : undefined} style={st} />
      : <div onClick={onClick} title={clickable ? 'Détail des saisons' : undefined} style={{ ...st, display:'flex', alignItems:'center', justifyContent:'center', fontSize:12 }}>{it.type === 'movie' ? '🎬' : '📺'}</div>;
  };
  const row = (it, subtitle, buttons) => (
    <div key={it.type + it.id} style={{ display:'flex', alignItems:'center', gap:8, background:C.surfaceHigh, borderRadius:8, padding:'6px 8px' }}>
      {poster(it)}
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontSize:11, fontWeight:600, color:C.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
          {it.title}{it.year ? <span style={{ color:C.dim, fontWeight:400 }}> · {it.year}</span> : null}
        </div>
        <div style={{ fontSize:9, color:C.muted, fontFamily:'DM Mono,monospace', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{subtitle}</div>
      </div>
      {buttons}
    </div>
  );
  // Libellé de progression d'une série en cours : "5/20 ép. · prochain S2E5" / "à jour ✓"
  const progLabel = it => {
    if (it.type === 'movie') return `Film${it.runtime ? ` · ${it.runtime} min` : ''}`;
    const nxt = tvNextToWatch(it);
    return `${it.watchedEps || 0}/${it.totalEps || '?'} ép.${nxt ? ` · prochain ${nxt}` : ' · à jour ✓'}`;
  };

  return (
    <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:'10px 12px', display:'flex', flexDirection:'column', gap:8 }}>
      {/* Clé API TMDB */}
      {!hasKey && (
        <div style={{ fontSize:10, color:C.muted, lineHeight:1.55, background:'#111', borderRadius:8, padding:'8px 10px' }}>
          🔑 <b style={{ color:C.text }}>Clé API TMDB requise</b> — crée un compte gratuit sur <span style={{ color:TVTIME_COLOR }}>themoviedb.org</span>, génère une clé <i>API v3</i> dans <i>Paramètres → API</i> et colle-la ci-dessous. Elle est stockée uniquement sur cet appareil. L'API gratuite n'a pas de plafond journalier.
        </div>
      )}
      {(!hasKey || showKey) && (
        <div style={{ display:'flex', gap:6 }}>
          <input type="password" value={keyInput} placeholder="Clé API TMDB (v3)…" autoComplete="off"
            onChange={e => setKeyInput(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') saveKey(); }}
            style={{ ...inputStyle, borderColor: keyInput ? TVTIME_COLOR : C.border }} />
          <button onClick={saveKey} style={{ background:`${TVTIME_COLOR}22`, border:`1px solid ${TVTIME_COLOR}66`, borderRadius:6, color:TVTIME_COLOR, fontSize:11, fontWeight:700, padding:'0 11px', cursor:'pointer', flexShrink:0 }}>OK</button>
        </div>
      )}

      {hasKey && (
        <>
          {/* Recherche TMDB (films + séries en 1 requête /search/multi) */}
          <div style={{ display:'flex', gap:6 }}>
            <input type="text" value={query} placeholder="Chercher un film, une série…"
              onChange={e => setQuery(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') search(); }}
              style={{ ...inputStyle, borderColor: query ? TVTIME_COLOR : C.border }} />
            <button onClick={search} disabled={busy}
              style={{ background:`${TVTIME_COLOR}22`, border:`1px solid ${TVTIME_COLOR}66`, borderRadius:6, color:TVTIME_COLOR, fontSize:12, fontWeight:700, padding:'0 11px', cursor:'pointer', flexShrink:0, opacity: busy ? 0.5 : 1 }}>
              {busy ? '…' : '🔎'}
            </button>
            <button onClick={() => setShowKey(o => !o)} title="Changer la clé API TMDB"
              style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:6, color:C.dim, fontSize:11, padding:'0 8px', cursor:'pointer', flexShrink:0 }}>⚙</button>
          </div>

          {/* Filtre du TYPE recherché — « Les deux » par défaut, re-cherche au clic si des résultats sont affichés */}
          <div style={{ display:'flex', gap:5 }}>
            {[['all', 'Les deux'], ['tv', '📺 Séries'], ['movie', '🎬 Films']].map(([k, label]) => {
              const active = searchType === k;
              return (
                <button key={k} onClick={() => pickSearchType(k)}
                  style={{ flex:1, background: active ? `${TVTIME_COLOR}22` : 'none', border:`1px solid ${active ? TVTIME_COLOR + '66' : C.border}`, borderRadius:6, color: active ? TVTIME_COLOR : C.dim, fontSize:9, fontWeight:700, padding:'3px 0', cursor:'pointer', fontFamily:'DM Mono,monospace' }}>
                  {label}
                </button>
              );
            })}
          </div>

          {/* Résultats de recherche */}
          {results !== null && (
            <div style={{ display:'flex', flexDirection:'column', gap:5, background:'#111', borderRadius:8, padding:'6px 6px' }}>
              <div style={{ display:'flex', alignItems:'center' }}>
                <div style={{ flex:1, fontSize:9, fontWeight:700, color:C.dim, letterSpacing:'0.05em' }}>RÉSULTATS · {results.length}</div>
                <button onClick={() => { setResults(null); setQuery(''); }} style={abtn(C.dim)}>×</button>
              </div>
              {results.length === 0 && <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'4px 0' }}>Aucun résultat</div>}
              {results.map(r => {
                // ★ si le titre est déjà suivi : vert = déjà vu, vert-cyan = en cours
                const exist = items.find(it => it.id === r.id && it.type === r.media_type);
                const mark  = exist && (exist.status === 'done' || exist.status === 'watching');
                return row(
                  { id: r.id, type: r.media_type, title: (r.media_type === 'movie' ? (r.title || r.original_title) : (r.name || r.original_name)) || '?', year: ((r.media_type === 'movie' ? r.release_date : r.first_air_date) || '').slice(0, 4), poster: r.poster_path },
                  <>
                    {r.media_type === 'movie' ? 'Film' : 'Série'}
                    {mark && <span style={{ color: exist.status === 'done' ? '#4caf50' : TVTIME_COLOR, fontWeight:700 }}> · ★ {exist.status === 'done' ? 'Déjà vu' : 'En cours'}</span>}
                  </>,
                  <>
                    {mark && <span title={exist.status === 'done' ? 'Déjà vu' : 'En cours'} style={{ color: exist.status === 'done' ? '#4caf50' : TVTIME_COLOR, fontSize:12, flexShrink:0, padding:'0 2px' }}>★</span>}
                    <button onClick={() => addItem(r, 'towatch')}  title="À voir"    style={abtn('#f5b81f')}>📌</button>
                    <button onClick={() => addItem(r, 'watching')} title="En cours"  style={abtn(TVTIME_COLOR)}>▶</button>
                    <button onClick={() => addItem(r, 'done')}     title="Déjà vu"   style={abtn('#4caf50')}>✓</button>
                  </>
                );
              })}
            </div>
          )}

          {/* Filtre Films / Séries (persisté) */}
          {items.length > 0 && (
            <div style={{ display:'flex', gap:5 }}>
              {[['all', `Tous · ${items.length}`], ['tv', `📺 Séries · ${items.length - nbMovies}`], ['movie', `🎬 Films · ${nbMovies}`]].map(([k, label]) => {
                const active = mediaFilter === k;
                return (
                  <button key={k} onClick={() => pickFilter(k)}
                    style={{ flex:1, background: active ? `${TVTIME_COLOR}22` : 'none', border:`1px solid ${active ? TVTIME_COLOR + '66' : C.border}`, borderRadius:6, color: active ? TVTIME_COLOR : C.dim, fontSize:10, fontWeight:700, padding:'4px 0', cursor:'pointer', fontFamily:'DM Mono,monospace' }}>
                    {label}
                  </button>
                );
              })}
            </div>
          )}

          {/* Filtre par nom + tri des listes (tri persisté) */}
          {items.length > 0 && (
            <div style={{ display:'flex', gap:6 }}>
              <input type="text" value={listFilter} placeholder="Filtrer par nom…"
                onChange={e => setListFilter(e.target.value)}
                style={{ ...inputStyle, padding:'3px 8px', fontSize:10, borderColor: listFilter ? TVTIME_COLOR : C.border }} />
              {listFilter && (
                <button onClick={() => setListFilter('')} title="Effacer le filtre"
                  style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:6, color:C.dim, fontSize:11, padding:'0 7px', cursor:'pointer', flexShrink:0 }}>×</button>
              )}
              <select value={sortBy} onChange={e => pickSort(e.target.value)} title="Trier les listes"
                style={{ background:'#111', border:`1px solid ${sortBy !== 'added_desc' ? TVTIME_COLOR + '66' : C.border}`, borderRadius:6, padding:'3px 7px', fontSize:10, color: sortBy !== 'added_desc' ? TVTIME_COLOR : C.muted, outline:'none', cursor:'pointer', flexShrink:0, fontFamily:'DM Mono,monospace' }}>
                {TVTIME_SORTS.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
              </select>
            </div>
          )}

          {/* En cours de visionnage */}
          {secTitle('watching', '▶', 'EN COURS', watching.length)}
          {secOpen.watching && (watching.length === 0
            ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'2px 0', fontFamily:'DM Mono,monospace' }}>Rien en cours — cherche une série ci-dessus</div>
            : watching.map(it => row(it, progLabel(it),
                <>
                  {it.type === 'tv' && <button onClick={() => bump(it, -1)} title="−1 épisode vu" style={abtn(C.muted)}>−</button>}
                  {it.type === 'tv' && <button onClick={() => bump(it, +1)} title="+1 épisode vu" style={abtn(TVTIME_COLOR)}>＋</button>}
                  {it.type === 'movie' && <button onClick={() => setStatus(it, 'towatch')} title="Repasser en À voir" style={abtn('#f5b81f')}>📌</button>}
                  <button onClick={() => setStatus(it, 'done')} title={it.type === 'tv' ? 'Série terminée (tout vu)' : 'Film vu'} style={abtn('#4caf50')}>✓</button>
                  <button onClick={() => removeItem(it)} title="Retirer" style={abtn('#e05050')}>×</button>
                </>
              )))}

          {/* À voir */}
          {secTitle('towatch', '📌', 'À VOIR', towatch.length)}
          {secOpen.towatch && (towatch.length === 0
            ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'2px 0', fontFamily:'DM Mono,monospace' }}>Liste vide</div>
            : towatch.map(it => row(it, it.type === 'movie' ? `Film${it.runtime ? ` · ${it.runtime} min` : ''}` : `Série · ${it.totalEps || '?'} ép.`,
                <>
                  <button onClick={() => setStatus(it, 'watching')} title="Commencer" style={abtn(TVTIME_COLOR)}>▶</button>
                  <button onClick={() => setStatus(it, 'done')} title="Déjà vu" style={abtn('#4caf50')}>✓</button>
                  <button onClick={() => removeItem(it)} title="Retirer" style={abtn('#e05050')}>×</button>
                </>
              )))}

          {/* Prochaines sorties (nextEp mis en cache, refresh TTL 24h ou ↻ manuel) — séries only, masquée en mode Films */}
          {mediaFilter !== 'movie' && (
            <>
              {secTitle('upcoming', '📅', 'PROCHAINES SORTIES', upcoming.length,
                <button onClick={e => { e.stopPropagation(); doRefresh(); }} disabled={refreshing} title="Actualiser les prochaines sorties (séries suivies)"
                  style={{ background:'none', border:'none', color: refreshing ? C.dim : TVTIME_COLOR, fontSize:12, cursor:'pointer', padding:'0 2px', flexShrink:0 }}>{refreshing ? '…' : '↻'}</button>
              )}
              {secOpen.upcoming && (upcoming.length === 0
                ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'2px 0', fontFamily:'DM Mono,monospace' }}>Aucun épisode annoncé pour tes séries</div>
                : upcoming.map(it => {
                    const dj = tvDaysUntil(it.nextEp.date);
                    const when = dj === null ? '' : dj < 0 ? 'diffusé' : dj === 0 ? "aujourd'hui" : dj === 1 ? 'demain' : `dans ${dj} j`;
                    return row(it,
                      `S${it.nextEp.s}E${it.nextEp.e}${it.nextEp.name ? ` « ${it.nextEp.name} »` : ''} · ${new Date(it.nextEp.date + 'T00:00:00').toLocaleDateString('fr-FR')}`,
                      <span style={{ fontSize:9, fontFamily:'DM Mono,monospace', fontWeight:700, color: dj !== null && dj <= 1 ? TVTIME_COLOR : C.muted, flexShrink:0 }}>{when}</span>
                    );
                  }))}
            </>
          )}

          {/* Vus / terminés (repliés par défaut) */}
          {secTitle('done', '✓', 'VUS', done.length)}
          {secOpen.done && (done.length === 0
            ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'2px 0', fontFamily:'DM Mono,monospace' }}>Aucun film ou série vu·e</div>
            : done.map(it => row(it,
                it.type === 'movie' ? `Film${it.runtime ? ` · ${it.runtime} min` : ''}` : `${it.watchedEps || 0} ép. vus`,
                <>
                  <button onClick={() => setStatus(it, 'watching')} title="Repasser en cours" style={abtn(C.muted)}>↩</button>
                  <button onClick={() => removeItem(it)} title="Retirer" style={abtn('#e05050')}>×</button>
                </>
              )))}
        </>
      )}

      {/* Fiche série (clic sur une affiche) */}
      {detailItem && <TvDetailModal item={detailItem}
        onClose={() => setDetail(null)}
        onBump={d => bump(detailItem, d)}
        onSeasonToggle={s => setWatchedTo(detailItem, s.watched >= s.eps ? s.cumStart : s.cumEnd)}
        onSetEps={v => setWatchedTo(detailItem, v)}
        onSetSpecials={v => setSpecialsTo(detailItem, v)}
        onStatus={st => setStatus(detailItem, st)} />}
    </div>
  );
}

// ════════════════════════════════════════════════
// TO DO — tâches à faire, classées par échéance via un carrousel
// (persistance localStorage, aucune dépendance backend)
// ════════════════════════════════════════════════
const TODO_PURPLE = '#b18cff';
const TODO_BUCKETS = [
  ['daily',  'Quotidien',       '🔁'],
  ['today',  "Aujourd'hui",     '📌'],
  ['week',   'Dans la semaine', '🗓'],
  ['month',  'Dans le mois',    '📆'],
  ['year',   "Dans l'année",    '🎯'],
  ['someday','À faire un jour', '💭'],
];
const TODO_LS_KEY = 'spotifyplus_todos';
function loadTodos() { try { return JSON.parse(localStorage.getItem(TODO_LS_KEY)) || []; } catch { return []; } }
function saveTodos(t) { try { localStorage.setItem(TODO_LS_KEY, JSON.stringify(t)); } catch {} }

// Jour courant au format 'YYYY-MM-DD' (local) — sert au reset quotidien des tâches "Quotidien"
function todoTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Journal des tâches terminées (validées) — { ts, fav } — alimente les stats To do.
// Enregistré quand une tâche est supprimée (×) ou qu'une tâche Quotidien est validée pour le jour.
const TODO_DONE_KEY = 'spotifyplus_todos_done';
function loadTodoDone() { try { return JSON.parse(localStorage.getItem(TODO_DONE_KEY)) || []; } catch { return []; } }
function saveTodoDone(d) { try { localStorage.setItem(TODO_DONE_KEY, JSON.stringify(d)); } catch {} }
function recordTodoDone(fav) {
  const d = loadTodoDone();
  d.push({ ts: Date.now(), fav: !!fav });
  if (d.length > 2000) d.splice(0, d.length - 2000); // borne mémoire
  saveTodoDone(d);
}
// Compteurs : tâches terminées aujourd'hui / ce mois / cette année + total des favorites ("compliquées")
function todoDoneStats() {
  const d = loadTodoDone();
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), day = now.getDate();
  let today = 0, month = 0, year = 0, fav = 0;
  for (const e of d) {
    const dt = new Date(e.ts);
    if (dt.getFullYear() === y) {
      year++;
      if (dt.getMonth() === m) { month++; if (dt.getDate() === day) today++; }
    }
    if (e.fav) fav++;
  }
  return { today, month, year, fav };
}

function TodoPanel() {
  const [todos, setTodos]       = React.useState(loadTodos);
  const [bucketIdx, setBucketIdx] = React.useState(0);
  const [text, setText]         = React.useState('');
  const [, forceTick]           = React.useReducer(x => x + 1, 0);
  const bucket = TODO_BUCKETS[bucketIdx];
  const isDaily = bucket[0] === 'daily';
  const today = todoTodayStr();
  // Re-render au changement de jour → les tâches Quotidien validées repartent actives à 00h
  React.useEffect(() => {
    let day = today;
    const id = setInterval(() => { const d = todoTodayStr(); if (d !== day) { day = d; forceTick(); } }, 60000);
    return () => clearInterval(id);
  }, []);

  const update = next => { setTodos(next); saveTodos(next); };
  const add = () => {
    const v = text.trim();
    if (!v) return;
    update([...todos, { id: Date.now() + '_' + Math.random().toString(36).slice(2), text: v, bucket: bucket[0], fav: false }]);
    setText('');
  };
  const remove = id => {
    const t = todos.find(x => x.id === id);
    if (t) recordTodoDone(t.fav); // suppression = tâche terminée → compte dans les stats To do
    update(todos.filter(x => x.id !== id));
  };
  // Étoile favorite
  const toggleFav = id => update(todos.map(t => t.id === id ? { ...t, fav: !t.fav } : t));
  // Quotidien : valide la tâche pour aujourd'hui (elle repart active demain à 00h) → compte dans les stats
  const validateDaily = id => update(todos.map(t => {
    if (t.id !== id || t.doneDate === today) return t;
    recordTodoDone(t.fav);
    return { ...t, doneDate: today };
  }));
  // Déplace une tâche d'un cran dans le carrousel (échéance plus proche/lointaine)
  const move = (id, dir) => update(todos.map(t => {
    if (t.id !== id) return t;
    const i = TODO_BUCKETS.findIndex(b => b[0] === t.bucket);
    const ni = Math.min(TODO_BUCKETS.length - 1, Math.max(0, i + dir));
    // En sortant de Quotidien on efface la validation du jour (redevient une tâche normale)
    return { ...t, bucket: TODO_BUCKETS[ni][0], doneDate: TODO_BUCKETS[ni][0] === 'daily' ? t.doneDate : undefined };
  }));
  const goBucket = dir => setBucketIdx(i => (i + dir + TODO_BUCKETS.length) % TODO_BUCKETS.length);

  const items = todos.filter(t => t.bucket === bucket[0]);
  const arrowBtn = { background:'none', border:`1px solid ${C.border}`, borderRadius:8, color:TODO_PURPLE, fontSize:16, lineHeight:1, padding:'4px 10px', cursor:'pointer', flexShrink:0 };

  return (
    <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:'10px 12px', display:'flex', flexDirection:'column', gap:8 }}>
      {/* Carrousel d'échéance */}
      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
        <button onClick={() => goBucket(-1)} style={arrowBtn} title="Échéance précédente">‹</button>
        <div style={{ flex:1, textAlign:'center', minWidth:0 }}>
          <div style={{ fontSize:13, fontWeight:800, color:C.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{bucket[2]} {bucket[1]}</div>
          <div style={{ fontSize:9, color:C.muted, fontFamily:'DM Mono,monospace' }}>{items.length} tâche{items.length > 1 ? 's' : ''}</div>
        </div>
        <button onClick={() => goBucket(1)} style={arrowBtn} title="Échéance suivante">›</button>
      </div>
      {/* Points indicateurs */}
      <div style={{ display:'flex', justifyContent:'center', gap:5 }}>
        {TODO_BUCKETS.map((b, i) => (
          <span key={b[0]} onClick={() => setBucketIdx(i)} title={b[1]}
            style={{ width:6, height:6, borderRadius:'50%', background: i === bucketIdx ? TODO_PURPLE : C.border, cursor:'pointer' }} />
        ))}
      </div>
      {/* Ajout */}
      <div style={{ display:'flex', gap:6 }}>
        <input type="text" value={text} placeholder="Nouvelle tâche…"
          onChange={e => setText(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') add(); }}
          style={{ flex:1, minWidth:0, background:'#111', border:`1px solid ${text ? TODO_PURPLE : C.border}`, borderRadius:6, padding:'5px 10px', fontSize:11, color:C.text, outline:'none', fontFamily:'inherit', boxSizing:'border-box' }} />
        <button onClick={add} style={{ background:`${TODO_PURPLE}22`, border:`1px solid ${TODO_PURPLE}66`, borderRadius:6, color:TODO_PURPLE, fontSize:16, lineHeight:1, padding:'0 11px', cursor:'pointer', flexShrink:0 }}>+</button>
      </div>
      {/* Liste */}
      {items.length === 0 ? (
        <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'6px 0', fontFamily:'DM Mono,monospace' }}>Aucune tâche ici</div>
      ) : (
        <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
          {items.map(t => {
            const bi = TODO_BUCKETS.findIndex(b => b[0] === t.bucket);
            const doneToday = isDaily && t.doneDate === today;
            return (
              <div key={t.id} style={{ display:'flex', alignItems:'center', gap:6, background:C.surfaceHigh, borderRadius:8, padding:'6px 8px', opacity: doneToday ? 0.5 : 1 }}>
                <button onClick={() => toggleFav(t.id)} title={t.fav ? 'Retirer des favorites' : 'Marquer comme favorite'}
                  style={{ background:'none', border:'none', color: t.fav ? '#f5c518' : C.dim, fontSize:13, lineHeight:1, padding:'0 2px', cursor:'pointer', flexShrink:0 }}>{t.fav ? '★' : '☆'}</button>
                <div style={{ flex:1, minWidth:0, fontSize:11, color:C.text, wordBreak:'break-word', textDecoration: doneToday ? 'line-through' : 'none' }}>{t.text}</div>
                <button onClick={() => move(t.id, -1)} disabled={bi === 0} title="Échéance plus proche"
                  style={{ background:'none', border:'none', color: bi === 0 ? C.dim : TODO_PURPLE, fontSize:13, lineHeight:1, padding:'0 2px', cursor: bi === 0 ? 'default' : 'pointer', flexShrink:0 }}>‹</button>
                <button onClick={() => move(t.id, 1)} disabled={bi === TODO_BUCKETS.length - 1} title="Échéance plus lointaine"
                  style={{ background:'none', border:'none', color: bi === TODO_BUCKETS.length - 1 ? C.dim : TODO_PURPLE, fontSize:13, lineHeight:1, padding:'0 2px', cursor: bi === TODO_BUCKETS.length - 1 ? 'default' : 'pointer', flexShrink:0 }}>›</button>
                <button onClick={() => isDaily ? validateDaily(t.id) : remove(t.id)} disabled={doneToday}
                  title={isDaily ? (doneToday ? 'Validée pour aujourd’hui' : 'Valider pour aujourd’hui (repart demain)') : 'Supprimer'}
                  style={{ background:'none', border:'none', color: doneToday ? '#4caf50' : '#e05050', fontSize:14, lineHeight:1, padding:'0 2px', cursor: doneToday ? 'default' : 'pointer', flexShrink:0 }}>{doneToday ? '✓' : '×'}</button>
              </div>
            );
          })}
        </div>
      )}
      {isDaily && (
        <div style={{ fontSize:9, color:C.dim, textAlign:'center', fontFamily:'DM Mono,monospace' }}>
          × = valider pour aujourd’hui · repart à 00h
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════
// GESTION MDP — coffre d'identifiants CHIFFRÉ par un mot de passe maître.
// Chiffrement AES-GCM 256, clé dérivée par PBKDF2 (300k itérations, SHA-256) via la
// Web Crypto API native (aucune lib, aucune origine réseau → rien à ajouter à la CSP).
// Le localStorage ne contient QUE { salt, iv, ct } chiffrés ; le mot de passe maître
// n'est JAMAIS stocké (demandé à l'ouverture). L'export = ce blob chiffré (sauvegarde).
// ⚠ Ne protège PAS contre un malware actif sur l'appareil (qui peut lire la mémoire /
// keylogger le mot de passe maître) — seulement contre une fuite passive du stockage.
// ⚠ Mot de passe maître oublié = données irrécupérables (pas de backend, pas de reset).
// ════════════════════════════════════════════════
const MDP_PURPLE = '#a78bfa';
const MDP_VAULT_KEY = 'spotifyplus_mdp_vault';   // blob chiffré { v, salt, iv, ct }
const MDP_LEGACY_KEY = 'spotifyplus_mdp';        // ancien stockage EN CLAIR (migré au 1er déverrouillage/création)
const _mdpTextEnc = new TextEncoder();
const _mdpTextDec = new TextDecoder();
// base64 ⇄ bytes (boucle pour éviter le débordement de pile sur String.fromCharCode(...))
function _mdpB64(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
function _mdpUnb64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
// Versionnage du blob : v1 = 300k itérations PBKDF2, v2 = 600k (recommandation OWASP
// pour PBKDF2-SHA-256). Un coffre v1 est re-chiffré en v2 au déverrouillage (upgrade
// transparent dans unlock) — le déchiffrement lit les itérations selon blob.v.
const MDP_VAULT_V  = 2;
const MDP_KDF_ITER = { 1: 300000, 2: 600000 };
async function _mdpDeriveKey(password, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', _mdpTextEnc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);
}
async function mdpEncrypt(password, dataObj) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await _mdpDeriveKey(password, salt, MDP_KDF_ITER[MDP_VAULT_V]);
  const ct   = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, _mdpTextEnc.encode(JSON.stringify(dataObj)));
  return { v:MDP_VAULT_V, salt:_mdpB64(salt), iv:_mdpB64(iv), ct:_mdpB64(ct) };
}
async function mdpDecrypt(password, blob) {
  const iter = MDP_KDF_ITER[blob.v] || MDP_KDF_ITER[1];
  const key = await _mdpDeriveKey(password, _mdpUnb64(blob.salt), iter);
  const pt  = await crypto.subtle.decrypt({ name:'AES-GCM', iv:_mdpUnb64(blob.iv) }, key, _mdpUnb64(blob.ct));
  return JSON.parse(_mdpTextDec.decode(pt));
}
function loadVaultBlob() { try { return JSON.parse(localStorage.getItem(MDP_VAULT_KEY)) || null; } catch { return null; } }
function saveVaultBlob(b) { try { localStorage.setItem(MDP_VAULT_KEY, JSON.stringify(b)); } catch {} }
function isVaultBlob(b) { return b && b.v && typeof b.salt === 'string' && typeof b.iv === 'string' && typeof b.ct === 'string'; }
// Sécurise une URL avant de la rendre en <a href> : n'autorise QUE http/https. Bloque
// javascript:/data:/vbscript: — une entrée importée d'un backup malveillant ne peut donc
// pas exécuter de JS au clic (self-XSS). Ajoute https:// si l'utilisateur a tapé "site.com".
function safeHref(url) {
  if (!url) return null;
  const t = String(url).trim();
  const withScheme = /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(t) ? t : 'https://' + t;
  try {
    const u = new URL(withScheme);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
  } catch { return null; }
}
// Session en mémoire : conserve le mot de passe maître + entrées déchiffrées tant que
// l'app vit (survit au changement d'onglet mobile), effacée au reload (verrouillage auto).
let _mdpSession = { unlocked:false, pw:null, entries:null };

// Copie d'un mot de passe : le presse-papiers est PURGÉ 10 minutes après la copie
// (sinon le mot de passe y reste indéfiniment — presse-papiers parfois synchronisé
// cross-device par l'OS). L'écriture peut échouer si l'onglet n'a plus le focus → best-effort.
let _mdpClipTimer = null;
function mdpCopyPassword(pw) {
  try { navigator.clipboard.writeText(pw).catch(() => {}); } catch {}
  if (_mdpClipTimer) clearTimeout(_mdpClipTimer);
  _mdpClipTimer = setTimeout(() => {
    _mdpClipTimer = null;
    try { navigator.clipboard.writeText('').catch(() => {}); } catch {}
  }, 10 * 60 * 1000);
}

function GestionMdpPanel() {
  const [phase, setPhase] = React.useState(
    () => _mdpSession.unlocked ? 'unlocked' : (loadVaultBlob() ? 'locked' : 'setup'));
  const [entries, setEntries] = React.useState(() => _mdpSession.entries || []);
  const [pw, setPw]           = React.useState('');     // saisie mot de passe maître (setup/unlock)
  const [pw2, setPw2]         = React.useState('');     // confirmation (setup)
  const [err, setErr]         = React.useState('');
  const [busy, setBusy]       = React.useState(false);
  const [form, setForm]       = React.useState({ identifiant:'', mdp:'', url:'', comment:'' });
  const [shown, setShown]     = React.useState({});
  const [msg, setMsg]         = React.useState('');
  const [showAdd, setShowAdd] = React.useState(false);  // formulaire d'ajout repliable
  const [query, setQuery]     = React.useState('');      // recherche
  const masterRef = React.useRef(_mdpSession.pw);       // mot de passe maître courant (mémoire only)
  const fileRef   = React.useRef(null);

  // Persiste les entrées : (re)chiffre avec le mot de passe maître courant et écrit le blob.
  const persist = async (next) => {
    setEntries(next);
    _mdpSession.entries = next;
    try { saveVaultBlob(await mdpEncrypt(masterRef.current, next)); } catch (e) { setErr('Échec du chiffrement'); }
  };

  const createVault = async () => {
    setErr('');
    if (pw.length < 6) { setErr('Mot de passe maître : 6 caractères minimum'); return; }
    if (pw !== pw2)    { setErr('Les deux mots de passe ne correspondent pas'); return; }
    setBusy(true);
    try {
      let initial = [];
      try { initial = JSON.parse(localStorage.getItem(MDP_LEGACY_KEY)) || []; } catch {}
      saveVaultBlob(await mdpEncrypt(pw, initial));
      try { localStorage.removeItem(MDP_LEGACY_KEY); } catch {}  // efface l'ancien clair migré
      masterRef.current = pw; _mdpSession = { unlocked:true, pw, entries:initial };
      setEntries(initial); setPhase('unlocked'); setPw(''); setPw2('');
    } catch (e) { setErr('Erreur de création du coffre'); }
    setBusy(false);
  };

  const unlock = async () => {
    setErr(''); setBusy(true);
    try {
      const blob = loadVaultBlob();
      const data = await mdpDecrypt(pw, blob);
      // Upgrade transparent : un coffre v1 (300k itér.) est re-chiffré en v2 (600k)
      if ((blob.v || 1) < MDP_VAULT_V) { try { saveVaultBlob(await mdpEncrypt(pw, data)); } catch {} }
      masterRef.current = pw; _mdpSession = { unlocked:true, pw, entries:data };
      setEntries(data); setPhase('unlocked'); setPw('');
    } catch (e) { setErr('Mot de passe maître incorrect'); }
    setBusy(false);
  };

  const lock = () => {
    _mdpSession = { unlocked:false, pw:null, entries:null };
    masterRef.current = null;
    setEntries([]); setShown({}); setPw(''); setPhase('locked'); setMsg('');
  };

  const add = () => {
    const f = { identifiant: form.identifiant.trim(), mdp: form.mdp, url: form.url.trim(), comment: form.comment.trim() };
    if (!f.identifiant && !f.mdp && !f.url) return;
    persist([{ id: Date.now() + '_' + Math.random().toString(36).slice(2), ...f }, ...entries]);
    setForm({ identifiant:'', mdp:'', url:'', comment:'' });
  };
  const remove = id => persist(entries.filter(e => e.id !== id));

  // Export = télécharge le blob chiffré (sauvegarde de secours, déchiffrable avec le mot de passe maître).
  const exportVault = () => {
    const blob = loadVaultBlob(); if (!blob) return;
    const file = new Blob([JSON.stringify(blob)], { type:'application/json' });
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = 'gestion-mdp-sauvegarde.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    setMsg('Sauvegarde chiffrée exportée.');
  };
  const importVault = (ev) => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const blob = JSON.parse(r.result);
        if (!isVaultBlob(blob)) { setErr('Fichier invalide (pas une sauvegarde de coffre)'); return; }
        // Un coffre existe déjà : confirmer avant de l'écraser (perte définitive sinon —
        // les entrées ajoutées depuis la sauvegarde importée disparaîtraient en silence).
        // Le blob actuel est conservé en copie de secours dans le localStorage.
        const existing = loadVaultBlob();
        if (existing) {
          if (!confirm('Un coffre existe déjà sur cet appareil.\n\nL\'importer le REMPLACERA (les entrées ajoutées depuis cette sauvegarde seront perdues).\nUne copie de secours du coffre actuel sera conservée (spotifyplus_mdp_vault_prev).\n\nContinuer ?')) return;
          try { localStorage.setItem('spotifyplus_mdp_vault_prev', JSON.stringify(existing)); } catch {}
        }
        saveVaultBlob(blob);
        _mdpSession = { unlocked:false, pw:null, entries:null }; masterRef.current = null;
        setEntries([]); setPw(''); setErr(''); setMsg('Sauvegarde importée — déverrouille avec son mot de passe maître.');
        setPhase('locked');
      } catch (e) { setErr('Fichier illisible'); }
    };
    r.readAsText(f);
    ev.target.value = '';
  };

  const pwInput = (val, setVal, ph) => (
    <input type="password" value={val} placeholder={ph} autoComplete="new-password"
      onChange={e => setVal(e.target.value)}
      onKeyDown={e => { if (e.key === 'Enter') (phase === 'setup' ? createVault() : unlock()); }}
      style={{ width:'100%', boxSizing:'border-box', background:'#111', border:`1px solid ${val ? MDP_PURPLE : C.border}`, borderRadius:6, padding:'6px 10px', fontSize:11, color:C.text, outline:'none', fontFamily:'inherit' }} />
  );
  const card = { background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:'10px 12px', display:'flex', flexDirection:'column', gap:8 };
  const bigBtn = { background:`${MDP_PURPLE}22`, border:`1px solid ${MDP_PURPLE}66`, borderRadius:6, color:MDP_PURPLE, fontSize:11, fontWeight:700, padding:'7px 0', cursor:'pointer' };

  // ─ Création du mot de passe maître ─
  if (phase === 'setup') {
    return (
      <div style={card}>
        <div style={{ fontSize:11, color:C.text, fontWeight:700 }}>🔒 Créer le coffre chiffré</div>
        <div style={{ fontSize:9.5, color:C.muted, lineHeight:1.4 }}>Choisis un mot de passe maître. Il chiffre tous tes identifiants et n'est jamais stocké. <b style={{ color:'#e0a050' }}>S'il est oublié, les données sont irrécupérables.</b></div>
        {pwInput(pw, setPw, 'Mot de passe maître (min. 6)')}
        {pwInput(pw2, setPw2, 'Confirmer')}
        {err && <div style={{ fontSize:10, color:'#e05050' }}>{err}</div>}
        <button onClick={createVault} disabled={busy} style={bigBtn}>{busy ? '…' : '🔐 Créer le coffre'}</button>
      </div>
    );
  }

  // ─ Coffre verrouillé ─
  if (phase === 'locked') {
    return (
      <div style={card}>
        <div style={{ fontSize:11, color:C.text, fontWeight:700 }}>🔒 Coffre verrouillé</div>
        {pwInput(pw, setPw, 'Mot de passe maître')}
        {err && <div style={{ fontSize:10, color:'#e05050' }}>{err}</div>}
        {msg && <div style={{ fontSize:10, color:MDP_PURPLE }}>{msg}</div>}
        <button onClick={unlock} disabled={busy} style={bigBtn}>{busy ? '…' : '🔓 Déverrouiller'}</button>
        <div style={{ height:1, background:C.border, margin:'2px 0' }} />
        <button onClick={() => fileRef.current && fileRef.current.click()} style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:6, color:C.muted, fontSize:10, padding:'5px 0', cursor:'pointer' }}>↥ Importer une sauvegarde</button>
        <input ref={fileRef} type="file" accept="application/json,.json" onChange={importVault} style={{ display:'none' }} />
      </div>
    );
  }

  // ─ Coffre déverrouillé ─
  const field = (k, ph) => (
    <input type="text" value={form[k]} placeholder={ph}
      onChange={e => setForm(f => ({ ...f, [k]: e.target.value }))}
      onKeyDown={e => { if (e.key === 'Enter') add(); }}
      style={{ width:'100%', boxSizing:'border-box', background:'#111', border:`1px solid ${form[k] ? MDP_PURPLE : C.border}`, borderRadius:6, padding:'5px 10px', fontSize:11, color:C.text, outline:'none', fontFamily:'inherit' }} />
  );
  return (
    <div style={card}>
      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
        <div style={{ flex:1, fontSize:9.5, color:MDP_PURPLE, fontFamily:'DM Mono,monospace' }}>🔓 Coffre chiffré déverrouillé</div>
        <button onClick={exportVault} title="Exporter une sauvegarde chiffrée" style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:6, color:C.muted, fontSize:9.5, padding:'3px 7px', cursor:'pointer' }}>↧ Exporter</button>
        <button onClick={lock} title="Verrouiller" style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:6, color:C.muted, fontSize:9.5, padding:'3px 7px', cursor:'pointer' }}>🔒 Verrouiller</button>
      </div>
      {msg && <div style={{ fontSize:9.5, color:MDP_PURPLE }}>{msg}</div>}
      {/* Formulaire d'ajout repliable */}
      <button onClick={() => setShowAdd(v => !v)} style={{ ...bigBtn, display:'flex', alignItems:'center', justifyContent:'center', gap:6 }}>
        {showAdd ? '▾ Masquer le formulaire' : '+ Ajouter un identifiant'}
      </button>
      {showAdd && (
        <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
          {field('identifiant', 'Identifiant / login')}
          {field('mdp', 'Mot de passe')}
          {field('url', 'URL (https://…)')}
          {field('comment', 'Commentaire')}
          <button onClick={add} style={bigBtn}>✓ Enregistrer</button>
        </div>
      )}
      {/* Recherche */}
      {entries.length > 0 && (
        <input type="text" value={query} placeholder="🔍 Rechercher…"
          onChange={e => setQuery(e.target.value)}
          style={{ width:'100%', boxSizing:'border-box', background:'#111', border:`1px solid ${query ? MDP_PURPLE : C.border}`, borderRadius:6, padding:'5px 10px', fontSize:11, color:C.text, outline:'none', fontFamily:'inherit' }} />
      )}
      {(() => {
        const q = query.trim().toLowerCase();
        const list = q ? entries.filter(e => (
          (e.identifiant || '').toLowerCase().includes(q) ||
          (e.url || '').toLowerCase().includes(q) ||
          (e.comment || '').toLowerCase().includes(q)
        )) : entries;
        if (entries.length === 0) return (
          <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'6px 0', fontFamily:'DM Mono,monospace' }}>Aucun identifiant enregistré</div>
        );
        if (list.length === 0) return (
          <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'6px 0', fontFamily:'DM Mono,monospace' }}>Aucun résultat</div>
        );
        return (
        <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
          {list.map(e => (
            <div key={e.id} style={{ background:C.surfaceHigh, borderRadius:8, padding:'7px 9px', display:'flex', flexDirection:'column', gap:3 }}>
              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                <div style={{ flex:1, minWidth:0, fontSize:12, fontWeight:700, color:C.text, wordBreak:'break-word' }}>{e.identifiant || '—'}</div>
                <button onClick={() => remove(e.id)} title="Supprimer" style={{ background:'none', border:'none', color:'#e05050', fontSize:15, lineHeight:1, padding:'0 2px', cursor:'pointer', flexShrink:0 }}>×</button>
              </div>
              {e.mdp && (
                <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                  <code style={{ flex:1, minWidth:0, fontSize:11, color:MDP_PURPLE, fontFamily:'DM Mono,monospace', wordBreak:'break-all' }}>{shown[e.id] ? e.mdp : '••••••••'}</code>
                  <button onClick={() => setShown(s => ({ ...s, [e.id]: !s[e.id] }))} title="Afficher / masquer" style={{ background:'none', border:'none', fontSize:12, cursor:'pointer', padding:0, flexShrink:0 }}>{shown[e.id] ? '🙈' : '👁'}</button>
                  <button onClick={() => mdpCopyPassword(e.mdp)} title="Copier (presse-papiers purgé après 10 min)" style={{ background:'none', border:'none', fontSize:11, cursor:'pointer', padding:0, flexShrink:0 }}>📋</button>
                </div>
              )}
              {e.url && (safeHref(e.url)
                ? <a href={safeHref(e.url)} target="_blank" rel="noreferrer" style={{ fontSize:10, color:'#5aa9ff', wordBreak:'break-all', textDecoration:'none' }}>↗ {e.url}</a>
                : <span title="Lien non affiché (schéma non autorisé)" style={{ fontSize:10, color:C.muted, wordBreak:'break-all' }}>↗ {e.url}</span>)}
              {e.comment && <div style={{ fontSize:10, color:C.muted, wordBreak:'break-word' }}>{e.comment}</div>}
            </div>
          ))}
        </div>
        );
      })()}
    </div>
  );
}

// REMEMBER — sections fixes (Véhicule/Médecin/Sport) avec date du prochain rappel +
// rappels PERSONNALISÉS (libellé + date). Une notification est émise À L'OUVERTURE de
// l'app (notifyDueReminders, throttlée 1×/jour) aux jalons J-30/J-7/J-1/jour J + rappels
// en retard. localStorage.
// ════════════════════════════════════════════════
const RAPPEL_PURPLE = '#c792ea';
const RAPPEL_LS_KEY = 'spotifyplus_rappels';            // dates des items fixes : { "<section>.<item>": date }
const REMEMBER_CUSTOM_KEY = 'spotifyplus_remember_custom'; // rappels persos : [{ id, label, date }]
const RAPPEL_SECTIONS = [
  { key:'administratif',label:'Administratif',icon:'📄', items:[['impots',"Déclaration d'impôts"], ['cni',"Carte d'identité"], ['passeport','Passeport'], ['carte_europeenne','Carte européenne']] },
  { key:'logement',     label:'Logement',     icon:'🏠', items:[['ag','AG'], ['detecteur_fumee','Détecteur de fumée'], ['hotte','Nettoyer hotte cuisine'], ['vmc','Nettoyer VMC'], ['aerations_fenetres','Nettoyer aérations fenêtres']] },
  { key:'vehicule',     label:'Véhicule',     icon:'🚗', items:[['ct','Contrôle technique'], ['assurance_auto','Assurance auto'], ['carte_navigo','Carte navigo'], ['permis_conduire','Permis de conduire']] },
  { key:'medecin',      label:'Médecin',      icon:'🩺', items:[['generaliste','Généraliste'], ['dentiste','Dentiste'], ['depistage','Dépistage'], ['checkup','Check Up complet'], ['orl','ORL'], ['ophtalmo','Ophtalmologiste'], ['dermato','Dermatologue'], ['osteo','Ostéopathe'], ['kine','Kiné'], ['mutuelle','Mutuelle']] },
  { key:'travail',      label:'Travail',      icon:'💼', items:[['entretien',"Entretien annuel d'évaluation"], ['visite_medicale','Visite médicale du travail']] },
  { key:'finance',      label:'Finance',      icon:'💰', items:[['faire_comptes','Faire ses comptes'], ['dca','DCA']] },
  { key:'sport',        label:'Sport',        icon:'🏃', items:[['licence_course','Licence Course à pied']] },
  { key:'anniversaire', label:'Anniversaire', icon:'🎂', items:[['anniv_papa','Anniversaire Papa'], ['anniv_maman','Anniv Maman'], ['fete_peres','Fête des pères'], ['fete_meres','Fête des mères'], ['anniv_cecile','Anniversaire Cécile']] },
  { key:'autre',        label:'Autre',        icon:'📌', items:[['lunettes','Lunettes'], ['carte_restaurant','Carte restaurant expiration']] },
];
function loadRappels() { try { return JSON.parse(localStorage.getItem(RAPPEL_LS_KEY)) || {}; } catch { return {}; } }
function saveRappels(v) { try { localStorage.setItem(RAPPEL_LS_KEY, JSON.stringify(v)); } catch {} }
function loadRemembers() { try { return JSON.parse(localStorage.getItem(REMEMBER_CUSTOM_KEY)) || []; } catch { return []; } }
function saveRemembers(v) { try { localStorage.setItem(REMEMBER_CUSTOM_KEY, JSON.stringify(v)); } catch {} }
// Jours restants jusqu'à la date (négatif = en retard), ou null si pas de date.
function rappelDelta(dateStr) {
  if (!dateStr) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  return Math.round((d - t) / 86400000);
}
function rappelBadge(days) {
  if (days == null)  return { txt:'à définir',           color:C.dim };
  if (days < 0)      return { txt:`en retard ${-days} j`, color:'#e05050' };
  if (days === 0)    return { txt:"aujourd'hui",          color:'#f5a623' };
  if (days <= 30)    return { txt:`dans ${days} j`,       color:'#f5a623' };
  return { txt:`dans ${days} j`, color:'#46c46a' };
}
// Tous les rappels datés (fixes + persos) avec leur nb de jours restants { label, days }.
function rememberAllWithDelta() {
  const out = [];
  const dates = loadRappels();
  RAPPEL_SECTIONS.forEach(sec => sec.items.forEach(([ik, label]) => {
    const d = rappelDelta(dates[sec.key + '.' + ik]);
    if (d != null) out.push({ label, days: d });
  }));
  loadRemembers().forEach(r => { const d = rappelDelta(r.date); if (d != null) out.push({ label: r.label, days: d }); });
  return out;
}
// Liste des rappels ÉCHUS (date ≤ aujourd'hui) — items fixes + persos.
function rememberDueList() {
  return rememberAllWithDelta().filter(r => r.days <= 0).map(r => r.label);
}
// Notification à l'ouverture de l'app aux JALONS J-30 (1 mois), J-7, J-1 et le jour J
// (+ rappels en retard) — throttlée 1×/jour.
function notifyDueReminders() {
  const alerts = rememberAllWithDelta().filter(r => r.days === 30 || r.days === 7 || r.days === 1 || r.days <= 0);
  if (!alerts.length) return;
  const today = new Date().toISOString().slice(0, 10);
  const KEY = 'spotifyplus_remember_notified';
  try { if (localStorage.getItem(KEY) === today) return; localStorage.setItem(KEY, today); } catch {}
  const when = d => d < 0 ? `en retard de ${-d} j` : d === 0 ? "aujourd'hui" : d === 1 ? 'demain' : `dans ${d} j`;
  const names = alerts.map(a => `${a.label} (${when(a.days)})`).join(', ');
  notify('Spotify+ — Remember', alerts.length === 1 ? `Rappel : ${names}` : `${alerts.length} rappels : ${names}`);
}

function RappelPanel() {
  const [dates, setDates]   = React.useState(loadRappels);
  const [customs, setCustoms] = React.useState(loadRemembers);
  const [cLabel, setCLabel] = React.useState('');
  const [cDate, setCDate]   = React.useState('');

  const setDate = (key, val) => {
    const next = { ...dates };
    if (val) next[key] = val; else delete next[key];
    setDates(next); saveRappels(next);
  };
  const updateCustoms = next => { setCustoms(next); saveRemembers(next); };
  const addCustom = () => {
    const label = cLabel.trim();
    if (!label || !cDate) return;
    updateCustoms([...customs, { id: Date.now() + '_' + Math.random().toString(36).slice(2), label, date: cDate }]);
    setCLabel(''); setCDate('');
  };
  const removeCustom = id => updateCustoms(customs.filter(c => c.id !== id));
  const setCustomDate = (id, val) => updateCustoms(customs.map(c => c.id === id ? { ...c, date: val } : c));

  // Rappels échus (pour le bandeau) — fixes + persos
  const due = [];
  RAPPEL_SECTIONS.forEach(sec => sec.items.forEach(([ik, label]) => { const d = rappelDelta(dates[sec.key + '.' + ik]); if (d != null && d <= 0) due.push(label); }));
  customs.forEach(c => { const d = rappelDelta(c.date); if (d != null && d <= 0) due.push(c.label); });

  const dateInput = (val, onChange) => (
    <input type="date" value={val} onChange={onChange}
      style={{ background:'#111', border:`1px solid ${val ? RAPPEL_PURPLE : C.border}`, borderRadius:6, padding:'3px 6px', fontSize:10, color:C.text, outline:'none', fontFamily:'inherit', colorScheme:'dark', flexShrink:0 }} />
  );

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
      {due.length > 0 && (
        <div style={{ background:'#e0505022', border:'1px solid #e0505066', borderRadius:10, padding:'8px 11px', fontSize:11, color:'#ff8a8a', fontWeight:700, lineHeight:1.4 }}>
          🔔 {due.length} rappel{due.length > 1 ? 's' : ''} à traiter : {due.join(', ')}
        </div>
      )}
      {RAPPEL_SECTIONS.map(sec => (
        <StatsCollapse key={sec.key} title={`${sec.icon} ${sec.label}`} color={RAPPEL_PURPLE}>
          {sec.items.map(([ik, label]) => {
            const key = sec.key + '.' + ik;
            const val = dates[key] || '';
            const b = rappelBadge(rappelDelta(val));
            return (
              <div key={ik} style={{ display:'flex', alignItems:'center', gap:8 }}>
                <div style={{ flex:1, minWidth:0, fontSize:11, color:C.text, wordBreak:'break-word' }}>{label}</div>
                <span style={{ fontSize:9, fontFamily:'DM Mono,monospace', color:b.color, whiteSpace:'nowrap', flexShrink:0 }}>{b.txt}</span>
                {dateInput(val, e => setDate(key, e.target.value))}
              </div>
            );
          })}
        </StatsCollapse>
      ))}
      {/* Rappels personnalisés — notif à l'ouverture de l'app quand la date est atteinte */}
      <StatsCollapse title="🔔 Mes rappels" color={RAPPEL_PURPLE}>
        <div style={{ fontSize:8.5, color:C.muted, fontFamily:'DM Mono,monospace', lineHeight:1.4 }}>Notification à l'ouverture de l'app quand la date arrive.</div>
        {customs.length === 0
          ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', fontFamily:'DM Mono,monospace' }}>Aucun rappel personnalisé</div>
          : customs.map(c => {
              const b = rappelBadge(rappelDelta(c.date));
              return (
                <div key={c.id} style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <div style={{ flex:1, minWidth:0, fontSize:11, color:C.text, wordBreak:'break-word' }}>{c.label}</div>
                  <span style={{ fontSize:9, fontFamily:'DM Mono,monospace', color:b.color, whiteSpace:'nowrap', flexShrink:0 }}>{b.txt}</span>
                  {dateInput(c.date || '', e => setCustomDate(c.id, e.target.value))}
                  <button onClick={() => removeCustom(c.id)} title="Supprimer" style={{ background:'none', border:'none', color:'#e05050', fontSize:14, lineHeight:1, padding:'0 2px', cursor:'pointer', flexShrink:0 }}>×</button>
                </div>
              );
            })}
        <div style={{ display:'flex', gap:6, alignItems:'center' }}>
          <input type="text" value={cLabel} placeholder="Nouveau rappel…"
            onChange={e => setCLabel(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addCustom(); }}
            style={{ flex:1, minWidth:0, background:'#111', border:`1px solid ${cLabel ? RAPPEL_PURPLE : C.border}`, borderRadius:6, padding:'5px 8px', fontSize:11, color:C.text, outline:'none', fontFamily:'inherit', boxSizing:'border-box' }} />
          {dateInput(cDate, e => setCDate(e.target.value))}
          <button onClick={addCustom} title="Ajouter" style={{ background:`${RAPPEL_PURPLE}22`, border:`1px solid ${RAPPEL_PURPLE}66`, borderRadius:6, color:RAPPEL_PURPLE, fontSize:16, lineHeight:1, padding:'0 10px', cursor:'pointer', flexShrink:0 }}>+</button>
        </div>
      </StatsCollapse>
    </div>
  );
}

function FeedList({ isMobile=false }) {
  const { feed, listenStats, filteredFeed, now, artists,
          filterType, setFilterType, sortBy, setSortBy,
          artistSearch, setArtistSearch, genreFilter, setGenreFilter, resetFilters,
          removeFromFeed, setTrackLiked, navigateFeed, snoozeTrack } = useStore();

  const hidden      = Math.max(0, (listenStats.remaining || 0) - feed.length);
  const filtersOn   = filterType !== 'all' || sortBy !== 'default' || artistSearch.trim() || genreFilter;

  // Genres proposés : agrégés depuis les artistes scannés, triés par fréquence (top 30)
  const genreOptions = React.useMemo(() => {
    const counts = new Map();
    (artists || []).forEach(a => (a.genres || []).forEach(g => counts.set(g, (counts.get(g) || 0) + 1)));
    const top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 30).map(([g]) => g);
    if (genreFilter && !top.includes(genreFilter)) top.unshift(genreFilter); // garder la sélection visible
    return top;
  }, [artists, genreFilter]);

  // Bannières de date (mobile) : repère visuel inséré à chaque changement de jour de sortie
  // entre deux items consécutifs — uniquement en tri "Ordre d'ajout" / "Date sortie ↑"
  // (le tri "Artiste A→Z" mélange les dates, une bannière par ligne n'aurait aucun sens)
  const showDayBanners = isMobile && sortBy !== 'artist';
  const dayOf = item => (item.rawDate || '').slice(0, 10);
  const fmtDayBanner = raw => {
    const d = (raw || '').slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return raw || 'Date inconnue'; // release_date partielle (YYYY ou YYYY-MM)
    const [y, m, j] = d.split('-').map(Number);
    return new Date(y, m - 1, j).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
  };

  const btnFilter = active => ({
    background: active ? `${C.accent}22` : 'none',
    border: active ? `1px solid ${C.accent}55` : `1px solid ${C.border}`,
    borderRadius: 6, padding: '3px 8px', cursor: 'pointer',
    color: active ? C.accent : C.muted, fontSize: 10, fontWeight: active ? 700 : 400,
  });

  // Si une recherche/filtre est active, garder la toolbar visible même quand 0 résultat
  // (sinon le champ de recherche disparaîtrait et on ne pourrait plus l'effacer)
  if (feed.length === 0 && !filtersOn) {
    return <div style={{ fontSize:11, color:C.dim, padding:'40px 0', textAlign:'center', fontFamily:'DM Mono,monospace' }}>Aucune musique en attente.</div>;
  }

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
      {/* Toolbar filtre + tri + reset */}
      <div style={{ display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>
        {[['all','Tous'],['single','Singles'],['album','Albums'],['dw','Découvertes']].map(([k,n]) => (
          <button key={k} onClick={() => setFilterType(k)} style={btnFilter(filterType===k)}>{n}</button>
        ))}
        <div style={{ marginLeft:'auto', display:'flex', gap:4, alignItems:'center' }}>
          {genreOptions.length > 0 && (
            <select value={genreFilter} onChange={e => setGenreFilter(e.target.value)}
              style={{ background:'#111', border:`1px solid ${genreFilter ? C.accent : C.border}`, borderRadius:6, padding:'3px 7px', fontSize:10, color: genreFilter ? C.accent : C.muted, outline:'none', cursor:'pointer', maxWidth:120 }}>
              <option value="">Genre : tous</option>
              {genreOptions.map(g => <option key={g} value={g}>{g}</option>)}
            </select>
          )}
          <select value={sortBy} onChange={e => setSortBy(e.target.value)}
            style={{ background:'#111', border:`1px solid ${C.border}`, borderRadius:6, padding:'3px 7px', fontSize:10, color:C.muted, outline:'none', cursor:'pointer' }}>
            <option value="default">Ordre d'ajout</option>
            <option value="date_asc">Date sortie ↑</option>
            <option value="artist">Artiste A→Z</option>
          </select>
          {filtersOn && (
            <button onClick={resetFilters} title="Réinitialiser les filtres"
              style={{ width:22, height:22, borderRadius:6, border:`1px solid #5a2020`, background:'#2a0e0e', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', color:'#e05050', fontSize:12, flexShrink:0 }}>
              🗑
            </button>
          )}
        </div>
      </div>

      {/* Filtre artiste */}
      <div style={{ position:'relative' }}>
        <input type="text" placeholder="Filtrer par artiste…" value={artistSearch}
          onChange={e => setArtistSearch(e.target.value)}
          style={{ width:'100%', background:'#111', border:`1px solid ${artistSearch ? C.accent : C.border}`, borderRadius:6, padding:'5px 28px 5px 10px', fontSize:11, color:C.text, outline:'none', fontFamily:'inherit', boxSizing:'border-box' }}
        />
        {artistSearch && (
          <button onClick={() => setArtistSearch('')}
            style={{ position:'absolute', right:6, top:'50%', transform:'translateY(-50%)', background:'none', border:'none', cursor:'pointer', color:C.muted, fontSize:14, lineHeight:1, padding:0 }}>
            ×
          </button>
        )}
      </div>

      {/* Bannière titres masqués — masquée dès qu'un filtre/tri est actif (la requête balaie
          alors toute la DB, le cap des 1000 ne masque plus de résultats correspondants) */}
      {hidden > 0 && !filtersOn && (
        <div style={{ fontSize:10, color:'#c8956c', background:'#1a1208', border:'1px solid #3a2a10', borderRadius:6, padding:'6px 10px', textAlign:'center' }}>
          ⚠ {hidden} titre{hidden > 1 ? 's' : ''} masqué{hidden > 1 ? 's' : ''} — purge pour les afficher
        </div>
      )}

      <div style={{ display:'flex', flexDirection:'column' }}>
        {/* Clé stable (URI seule) : avec l'index concaténé, retirer un titre changeait
            la clé de tous les suivants → remount complet, React.memo inopérant.
            La clé est portée par le Fragment (la bannière de date n'a pas de clé propre :
            elle appartient à l'item qu'elle précède) */}
        {filteredFeed.map((item, i) => (
          <React.Fragment key={item.id}>
            {showDayBanners && (i === 0 || dayOf(filteredFeed[i - 1]) !== dayOf(item)) && (
              <div style={{ display:'flex', alignItems:'center', gap:8, padding:'10px 2px 4px' }}>
                <span style={{ fontSize:9, fontWeight:700, letterSpacing:'0.08em', color:C.dim, fontFamily:'DM Mono,monospace', whiteSpace:'nowrap' }}>
                  📅 {fmtDayBanner(item.rawDate)}
                </span>
                <div style={{ flex:1, height:1, background:C.border }} />
              </div>
            )}
            <FeedItem item={item} i={i} isMobile={isMobile}
              isNowPlaying={now?.uri === item.spotifyUri}
              removeFromFeed={removeFromFeed} setTrackLiked={setTrackLiked} navigateFeed={navigateFeed} snoozeTrack={snoozeTrack} />
          </React.Fragment>
        ))}
        {filteredFeed.length === 0 && <div style={{ fontSize:11, color:C.dim, padding:'20px 0', textAlign:'center', fontFamily:'DM Mono,monospace' }}>Aucun titre pour ce filtre.</div>}
      </div>
    </div>
  );
}

function formatListenedAt(s) {
  if (!s) return '';
  const str = String(s).trim();
  // Deux formats possibles : 'YYYY-MM-DD HH:MM:SS' (datetime('now'), UTC) et 'YYYY-MM-DD'
  // seul (last_scraped_at posé par la ligne « légère » d'un scan partiel). Une date sans
  // heure suffixée 'Z' donne Invalid Date → on la parse à midi local (delta en jours correct).
  const d = /^\d{4}-\d{2}-\d{2}$/.test(str)
    ? new Date(str + 'T12:00:00')
    : new Date(str.replace(' ', 'T') + 'Z');
  if (isNaN(d)) return '';
  const diff = Date.now() - d.getTime();
  const min  = Math.floor(diff / 60000);
  if (min < 1)  return "à l'instant";
  if (min < 60) return `il y a ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24)   return `il y a ${h} h`;
  const j = Math.floor(h / 24);
  if (j === 1)  return 'hier';
  if (j < 7)    return `il y a ${j} j`;
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}
