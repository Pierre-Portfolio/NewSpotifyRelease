            <div style={{ fontSize:10, color:C.muted, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
              {item.artist}{item.subtitle ? ` · ${item.subtitle}` : ''}
            </div>
          </div>
          {item.listenedAt && (
            <span style={{ fontSize:9, color:C.dim, fontFamily:'DM Mono,monospace', flexShrink:0, whiteSpace:'nowrap' }}>{formatListenedAt(item.listenedAt)}</span>
          )}
          <button onClick={() => playTrack(item.spotifyUri)}
            title="Réécouter"
            style={{ width:28, height:28, borderRadius:'50%', border:'none', background:`${C.accent}22`, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
            <svg width="9" height="10" viewBox="0 0 9 10" fill={C.accent}><path d="M0 0l9 5-9 5V0z"/></svg>
          </button>
        </div>
      ))}
    </div>
  );
}

// Formatage compact des grands nombres (abonnés) : 1234 → "1,2 k", 2_500_000 → "2,5 M"
function fmtCompactNum(n) {
  if (n == null || isNaN(n)) return '—';
  if (n < 1000) return String(n);
  if (n < 1e6)  return (n / 1e3).toFixed(n < 1e4 ? 1 : 0).replace('.', ',') + ' k';
  return (n / 1e6).toFixed(1).replace('.', ',') + ' M';
}

// ════════════════════════════════════════════════
// ARTISTS PANEL — liste des artistes scrappés + filtres
// (id, dernière date de scrapping + métadonnées gratuites de l'API Spotify)
// ════════════════════════════════════════════════
function ArtistsPanel() {
  const { artists } = useStore();
  const [search,   setSearch]   = React.useState('');
  const [sortBy,   setSortBy]   = React.useState('recent');
  const [status,   setStatus]   = React.useState('all'); // 'all' | 'ok' | 'error'
  const filtersOn = search.trim() || sortBy !== 'recent' || status !== 'all';
  const reset = () => { setSearch(''); setSortBy('recent'); setStatus('all'); };

  const view = React.useMemo(() => {
    let r = (artists || []).filter(a => {
      if (status === 'ok'      && a.lastScanStatus !== 'ok' && a.lastScanStatus != null) return false;
      if (status === 'partial' && a.lastScanStatus !== 'partial') return false;
      if (status === 'error'   && a.lastScanStatus !== 'error') return false;
      const q = search.trim().toLowerCase();
      if (q) return (a.name || '').toLowerCase().includes(q) || (a.id || '').toLowerCase().includes(q);
      return true;
    });
    return [...r].sort((a, b) => {
      if (sortBy === 'name')       return (a.name || '~').localeCompare(b.name || '~');
      if (sortBy === 'popularity') return (b.popularity || 0) - (a.popularity || 0);
      if (sortBy === 'tracks')     return (b.totalTracksAdded || 0) - (a.totalTracksAdded || 0);
      if (sortBy === 'scans')      return (b.scanCount || 0) - (a.scanCount || 0);
      if (sortBy === 'oldest')     return (a.lastScrapedAt || '').localeCompare(b.lastScrapedAt || ''); // scan le plus ancien d'abord
      return (b.lastScrapedAt || '').localeCompare(a.lastScrapedAt || ''); // recent
    });
  }, [artists, search, sortBy, status]);

  const btnFilter = active => ({
    background: active ? `${C.accent}22` : 'none',
    border: active ? `1px solid ${C.accent}55` : `1px solid ${C.border}`,
    borderRadius: 6, padding: '3px 8px', cursor: 'pointer',
    color: active ? C.accent : C.muted, fontSize: 10, fontWeight: active ? 700 : 400,
  });

  if ((artists || []).length === 0) {
    return (
      <div style={{ fontSize:11, color:C.dim, padding:'40px 0', textAlign:'center', fontFamily:'DM Mono,monospace' }}>
        Aucun artiste scrappé pour l'instant.<br/>
        <span style={{ fontSize:10, color:C.muted }}>Lancez une synchro : chaque artiste scanné apparaîtra ici.</span>
      </div>
    );
  }

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
      {/* Toolbar : statut + tri + reset */}
      <div style={{ display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>
        {[['all','Tous'],['ok','✓ OK'],['partial','⏳ Partiel'],['error','⚠ Erreur']].map(([k,n]) => (
          <button key={k} onClick={() => setStatus(k)} style={btnFilter(status===k)}>{n}</button>
        ))}
        <div style={{ marginLeft:'auto', display:'flex', gap:4, alignItems:'center' }}>
          <select value={sortBy} onChange={e => setSortBy(e.target.value)}
            style={{ background:'#111', border:`1px solid ${C.border}`, borderRadius:6, padding:'3px 7px', fontSize:10, color:C.muted, outline:'none', cursor:'pointer' }}>
            <option value="recent">Scan récent</option>
            <option value="oldest">Scan ancien</option>
            <option value="name">Nom A→Z</option>
            <option value="popularity">Popularité ↓</option>
            <option value="tracks">Titres ajoutés ↓</option>
            <option value="scans">Nb de scans ↓</option>
          </select>
          {filtersOn && (
            <button onClick={reset} title="Réinitialiser les filtres"
              style={{ width:22, height:22, borderRadius:6, border:`1px solid #5a2020`, background:'#2a0e0e', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', color:'#e05050', fontSize:12, flexShrink:0 }}>
              🗑
            </button>
          )}
        </div>
      </div>

      {/* Recherche nom / id */}
      <div style={{ position:'relative' }}>
        <input type="text" placeholder="Rechercher un artiste (nom ou id)…" value={search}
          onChange={e => setSearch(e.target.value)}
          style={{ width:'100%', background:'#111', border:`1px solid ${search ? C.accent : C.border}`, borderRadius:6, padding:'5px 28px 5px 10px', fontSize:11, color:C.text, outline:'none', fontFamily:'inherit', boxSizing:'border-box' }}
        />
        {search && (
          <button onClick={() => setSearch('')}
            style={{ position:'absolute', right:6, top:'50%', transform:'translateY(-50%)', background:'none', border:'none', cursor:'pointer', color:C.muted, fontSize:14, lineHeight:1, padding:0 }}>
            ×
          </button>
        )}
      </div>

      <div style={{ fontSize:9, color:C.dim, fontFamily:'DM Mono,monospace', padding:'0 2px' }}>
        {view.length} / {artists.length} artiste{artists.length > 1 ? 's' : ''}
      </div>

      {/* Liste */}
      <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
        {view.map(a => (
          <ArtistRow key={a.id} a={a} />

      </div>
    </div>
  );
}

// ════════════════════════════════════════════════
// COMPACT PLAYER — vue ultra-compacte (split-screen / fenêtre du bas sur tel)
// N'affiche QUE les contrôles : précédent / play-pause / suivant
// ════════════════════════════════════════════════
function CompactPlayer() {
  const { now, feed, filteredFeed, filteredFeedIndex, seek, setTrackLiked, likedTracks, markListened } = useStore();
  const [isLiked, setIsLiked] = React.useState(false);

  // Vérifier si le titre en cours est liké — local d'abord, API seulement si inconnu
  React.useEffect(() => {
    const feedItem = now?.uri ? feed.find(f => f.spotifyUri === now.uri) : null;
    const inLocal  = likedTracks.some(t => t.spotifyUri === now?.uri) || !!feedItem?.liked;
    setIsLiked(inLocal);
    if (!now?.uri) return;
    if (feedItem || inLocal) return;
    libraryContains([now.uri])
      .then(data => { if (data) setIsLiked(data[0]); })
      .catch(() => {});
  }, [now?.uri]);

  const _cu = _effUri(now?.uri);
  const currentIndex = _cu ? (filteredFeedIndex.get(_cu) ?? -1) : -1;
  const hasFeed      = filteredFeed.length > 0;

  const togglePlayPause = async () => {
    if (!now) return;
    if (now.playing) await apiPut('https://api.spotify.com/v1/me/player/pause');
    else             await apiPut('https://api.spotify.com/v1/me/player/play');
  };
  const prevTrack = async () => {
    const idx = currentIndex > 0 ? currentIndex - 1 : filteredFeed.length - 1;
    if (filteredFeed[idx]) await playTrack(filteredFeed[idx].spotifyUri);
  };
  const nextTrack = async () => {
    // URI du titre quitté (avant calcul du suivant) : on le retire tout de suite, sans
    // attendre le poll 5s. Couvre le double-clic rapide où now.uri saute le titre intermédiaire.
    const leaving = currentIndex >= 0 ? filteredFeed[currentIndex]?.spotifyUri : null;
    const idx = currentIndex >= 0 && currentIndex < filteredFeed.length - 1 ? currentIndex + 1 : 0;
    if (!filteredFeed[idx]) return;
    await playTrack(filteredFeed[idx].spotifyUri);
    const dur = filteredFeed[idx].duration_ms;
    if (dur > 0) setTimeout(() => seek(Math.floor(dur * 0.25)), 400);
    if (leaving) markListened(leaving);
  };

  const toggleLike = async () => {
    if (!now?.uri) return;
    if (isLiked) {
      const res = await libraryRemove(now.uri);
      if (libraryScopeAlert(res)) return;
      setIsLiked(false);
      setTrackLiked(now.uri, false);
    } else {
      const res = await librarySave(now.uri);
      if (libraryScopeAlert(res)) return;
      setIsLiked(true);
      setTrackLiked(now.uri, true);
    }
  };

  const btn = { background:'none', border:'none', cursor:'pointer', padding:12, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 };

  return (
    <div style={{ width:'100%', height:'100%', background:'linear-gradient(180deg,#131313 0%,#0a0a0a 100%)', color:C.text, display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center', gap:10, padding:'8px 16px', overflow:'hidden' }}>
      {now ? (
        <>
          {/* Titre + artiste (une ligne chacun) */}
          <div style={{ textAlign:'center', maxWidth:'100%', minWidth:0 }}>
            <div style={{ fontSize:13, fontWeight:700, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', color:C.text }}>{now.title}</div>
            <div style={{ fontSize:11, color:C.muted, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
              {now.artist}{currentIndex >= 0 ? ` · ${currentIndex + 1}/${filteredFeed.length}` : ''}
            </div>
          </div>
          {/* Contrôles : précédent / play-pause / suivant */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:18 }}>
            <button onClick={prevTrack} style={{ ...btn, opacity: hasFeed ? 1 : 0.3 }} title="Précédent">
              <svg width="28" height="28" viewBox="0 0 16 16" fill={C.muted}><rect x="1" y="1" width="2" height="14" rx="1"/><path d="M13 1L4 8l9 7V1z"/></svg>
            </button>
            <button onClick={togglePlayPause} style={{ width:60, height:60, borderRadius:'50%', background:C.accent, border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }} title={now.playing ? 'Pause' : 'Lecture'}>
              {now.playing
                ? <svg width="18" height="20" viewBox="0 0 12 14" fill="#000"><rect x="0" y="0" width="4" height="14" rx="1"/><rect x="8" y="0" width="4" height="14" rx="1"/></svg>
                : <svg width="18" height="20" viewBox="0 0 12 14" fill="#000"><path d="M1 0l11 7-11 7V0z"/></svg>}
            </button>
            <button onClick={nextTrack} style={{ ...btn, opacity: hasFeed ? 1 : 0.3 }} title="Suivant">
              <svg width="28" height="28" viewBox="0 0 16 16" fill={C.muted}><rect x="13" y="1" width="2" height="14" rx="1"/><path d="M3 1l9 7-9 7V1z"/></svg>
            </button>
            <button onClick={toggleLike} style={{ ...btn }} title={isLiked ? 'Retirer des likés' : 'Liker'}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill={isLiked ? '#e05050' : 'none'} stroke={isLiked ? '#e05050' : C.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </button>
          </div>
        </>
      ) : (
        <span style={{ fontFamily:'DM Mono,monospace', fontSize:11, color:C.dim, textAlign:'center' }}>Aucune lecture en cours sur Spotify…</span>
      )}
    </div>
  );
}

          <div style={{ padding:'12px 14px', display:'flex', flexDirection:'column', gap:10 }}>
            <div style={{ fontSize:10, fontWeight:700, color:METEO_BLUE, letterSpacing:'0.07em' }}>MÉTÉO</div>
            <MeteoPanel />
          </div>
        )}
        {tab === 'finance' && (
          <div style={{ padding:'12px 14px', display:'flex', flexDirection:'column', gap:10 }}>
            <div style={{ fontSize:10, fontWeight:700, color:FINANCE_BLUE, letterSpacing:'0.07em' }}>FINANCE</div>
            <FinancePanel />
          </div>
        )}
        {tab === 'tvtime' && (
          <div style={{ padding:'12px 14px', display:'flex', flexDirection:'column', gap:10 }}>
            <div style={{ fontSize:10, fontWeight:700, color:TVTIME_COLOR, letterSpacing:'0.07em' }}>TV TIME</div>

          <div style={{ padding:'12px 14px', display:'flex', flexDirection:'column', gap:10 }}>
            <div style={{ fontSize:10, fontWeight:700, color:TODO_PURPLE, letterSpacing:'0.07em' }}>TO DO</div>
            <TodoPanel />
          </div>

        {tab === 'maps' && (
          <div style={{ padding:'12px 14px', display:'flex', flexDirection:'column', gap:10 }}>

        {tab === 'mdp' && (
          <div style={{ padding:'12px 14px', display:'flex', flexDirection:'column', gap:10 }}>

  );
}

// ════════════════════════════════════════════════
// DESKTOP APP
// ════════════════════════════════════════════════
function WebApp() {
  const s = useStore();
  // 'scrapping' | 'artistes' | 'ecoutes' | 'historique' | 'meteo' | 'finance' | 'tvtime' | 'todo' | 'mdp' | 'remember'
  const [view, setView] = React.useState('scrapping');
  const navBtn = active => ({
    background: active ? `${C.accent}18` : 'none',
    border: active ? `1px solid ${C.accent}40` : `1px solid transparent`,
    color: active ? C.accent : C.muted, borderRadius:6, padding:'4px 11px',
    cursor:'pointer', fontSize:12, fontWeight: active ? 700 : 500, whiteSpace:'nowrap', flexShrink:0,
  });
  // Modules désactivés dans le Paramétrage (À propos) → onglets masqués (clé desktop)
  const disabledDesktop = React.useMemo(() => {
    const set = new Set();
    TOGGLE_MODULES.forEach(m => { if (!moduleEnabled(s.moduleToggles, m.id)) set.add(m.desktop); });
    return set;
  }, [s.moduleToggles]);
  // Onglets de la barre du haut : Scrapping + Artistes + les ex-sections de la colonne de droite
  const navItems = [
    ['scrapping',  'Scrapping'],
    ['artistes',   `Artistes${s.artists.length > 0 ? ` · ${s.artists.length}` : ''}`],
    ['stats',      'Stats'],
    ['ecoutes',    'À propos'],
    ['historique', `Historique${s.history.length > 0 ? ` · ${s.history.length}` : ''}`],
    ['meteo',      'Météo'],
    ['finance',    'Finance'],
    ['tvtime',     'TV Time'],
    ['todo',       'To do'],
    ['maps',       'Maps'],
    ['mdp',        'Mot de passe'],
    ['remember',   'Remember'],
  ];
  // Sections affichées une à la fois dans le contenu central (heading coloré + panneau)
  const SECTION = {
    stats:      { heading:'STATS',        color:C.dim,         node:<StatsPanel /> },
    ecoutes:    { heading:'À PROPOS',     color:C.dim,         node:<VosEcoutesPanel /> },
    historique: { heading:'HISTORIQUE',   color:C.dim,         node:<HistoryPanel />, count:s.history.length },
    meteo:      { heading:'MÉTÉO',        color:METEO_BLUE,    node:<MeteoPanel /> },
    finance:    { heading:'FINANCE',      color:FINANCE_BLUE,  node:<FinancePanel /> },
    tvtime:     { heading:'TV TIME',      color:TVTIME_COLOR,  node:<TvTimePanel /> },
    todo:       { heading:'TO DO',        color:TODO_PURPLE,   node:<TodoPanel /> },
    maps:       { heading:'MAPS',         color:MAPS_COLOR,    node:<MapsPanel /> },
    mdp:        { heading:'MOT DE PASSE', color:MDP_PURPLE,    node:<GestionMdpPanel /> },
    remember:   { heading:'REMEMBER',     color:RAPPEL_PURPLE, node:<RappelPanel /> },
  };
  const sec = SECTION[view];
  // Si l'onglet actif vient d'être désactivé dans le Paramétrage → retour au Scrapping
  React.useEffect(() => {
    if (disabledDesktop.has(view)) setView('scrapping');
  }, [disabledDesktop, view]);
  return (
    <div style={{ width:'100%', height:'100%', background:C.bg, color:C.text, display:'flex', flexDirection:'column', fontSize:13, overflow:'hidden' }}>
      <div style={{ height:50, borderBottom:`1px solid ${C.border}`, background:C.surface, display:'flex', alignItems:'center', padding:'0 22px', gap:20, flexShrink:0 }}>
        <div style={{ fontWeight:800, fontSize:17, letterSpacing:'-0.03em' }}>
          <span style={{ color:C.accent }}>Spotify</span><span style={{ color:C.text }}>+</span>
        </div>
        <div style={{ flex:1, display:'flex', gap:6, overflowX:'auto', minWidth:0 }}>
          {navItems.filter(([k]) => !disabledDesktop.has(k)).map(([k, lbl]) => (
            <button key={k} onClick={() => setView(k)} style={navBtn(view === k)}>{lbl}</button>
          ))}
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <StatusDot active={true} />
          <UserChip size="sm" />
          <div style={{ minWidth:0 }}>
            <div style={{ fontSize:12, fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', maxWidth:160 }}>{s.user?.display_name || s.user?.id || '—'}</div>
            <div style={{ fontSize:10, color:C.muted }}>{s.user?.product || 'connecté'}</div>
          </div>
          <button onClick={s.logout} style={{ fontSize:11, color:C.muted, background:'none', border:`1px solid ${C.border}`, borderRadius:6, padding:'3px 10px', cursor:'pointer', marginLeft:4 }}>Déconnecter</button>
        </div>
      </div>

      <div style={{ flex:1, display:'flex', overflow:'hidden', minHeight:0 }}>
        <div style={{ width:280, borderRight:`1px solid ${C.border}`, background:C.surface, padding:'16px 14px', display:'flex', flexDirection:'column', gap:14, overflowY:'auto', flexShrink:0 }}>
          <DateRangePanel />
          <NextCallPanel />
          <LogsPanel />
        </div>

        <div style={{ flex:1, overflowY:'auto', padding:'22px 24px', minWidth:0 }}>
          {view === 'scrapping' ? (
            <>
              <div style={{ marginBottom:20 }}>
                <ScrapingStatusPanel />
              </div>
              <div>
                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14, flexWrap:'wrap', gap:10 }}>
                  <div>
                    <h1 style={{ fontSize:16, fontWeight:700, letterSpacing:'-0.02em', marginBottom:2 }}>Nouveautés pour vous</h1>
                    <p style={{ fontSize:11, color:C.muted }}>
                      Basées sur vos abonnements
                      {s.feed.length > 0 && ` · ${s.feed.length} sortie(s)`}
                    </p>
                  </div>
                </div>
                <FeedList />
              </div>
            </>
          ) : view === 'artistes' ? (
            <div>
              <div style={{ marginBottom:14 }}>
                <h1 style={{ fontSize:16, fontWeight:700, letterSpacing:'-0.02em', marginBottom:2 }}>Artistes suivis</h1>
                <p style={{ fontSize:11, color:C.muted }}>
                  Artistes scannés et métadonnées
                  {s.artists.length > 0 && ` · ${s.artists.length} artiste(s)`}
                </p>
              </div>
              <ArtistsPanel />
            </div>
          ) : sec ? (
            /* Section (ex-colonne de droite) affichée seule dans le contenu central */
            <div style={{ maxWidth:640 }}>
              <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.08em', color:sec.color, marginBottom:14 }}>
                {sec.heading}{sec.count > 0 ? <> · <span style={{ color:C.accent }}>{sec.count}</span></> : ''}
              </div>
              {sec.node}
            </div>
          ) : null}
        </div>
      </div>

      <PlayerBar />
    </div>
  );
}

// ROOT

// Toast "↩ Annuler" affiché 5 s après un retrait de titre (croix rouge / swipe gauche)
function UndoToast() {
  const { undoToast, undoRemove, clearUndo } = useStore();
  React.useEffect(() => {
    if (!undoToast) return;
    const id = setTimeout(() => clearUndo(), 5000);
    return () => clearTimeout(id);
  }, [undoToast]);
  if (!undoToast) return null;
  const it = undoToast.item || {};
  return (
    <div style={{ position:'fixed', left:'50%', bottom:96, transform:'translateX(-50%)', zIndex:9998, background:C.surfaceHigh, border:`1px solid ${C.border}`, borderRadius:10, padding:'9px 10px 9px 14px', display:'flex', alignItems:'center', gap:12, boxShadow:'0 8px 24px rgba(0,0,0,0.55)', maxWidth:'92vw' }}>
      <div style={{ minWidth:0 }}>
        <div style={{ fontSize:11, color:C.text, fontWeight:700 }}>Titre retiré</div>
        <div style={{ fontSize:10, color:C.muted, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', maxWidth:200 }}>{[it.artist, it.title].filter(Boolean).join(' — ') || '—'}</div>
      </div>
      <button onClick={undoRemove} style={{ background:`${C.accent}18`, border:`1px solid ${C.accent}55`, color:C.accent, borderRadius:8, padding:'6px 12px', fontSize:11, fontWeight:700, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>↩ Annuler</button>
    </div>
  );
}

function Shell() {
  const { authState, otherTab } = useStore();
  const isMobile      = useIsMobile();
  const shortViewport = useShortViewport();

  if (authState === 'loading') {
    return (
      <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:'#0a0a0a' }}>
        <div style={{ fontFamily:'DM Mono,monospace', fontSize:11, color:C.muted, letterSpacing:'0.1em' }}>// CHARGEMENT…</div>
      </div>
    );
  }
  // Viewport très court sur mobile (fenêtre du bas en split-screen) → vue compacte : uniquement les contrôles
  const content = authState === 'login'
    ? <Home isMobile={isMobile} />
    : (isMobile ? (shortViewport ? <CompactPlayer /> : <MobileApp />) : <WebApp />);
  return (
    <>
      {otherTab && (
        <div style={{ position:'fixed', top:0, left:0, right:0, zIndex:9999, background:'#3a1a0a', borderBottom:'1px solid #6a3a1a', color:'#e0a050', fontSize:11, fontFamily:'DM Mono,monospace', textAlign:'center', padding:'6px 12px' }}>
          ⚠ Spotify+ est déjà ouvert dans un autre onglet — fermez-en un (les sauvegardes s'écraseraient mutuellement)
        </div>
      )}
      {content}
      {authState === 'connected' && <UndoToast />}
    </>
  );
}

function App() {
  return (
    <StoreProvider>
      <Shell />
    </StoreProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
