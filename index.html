function actifsParseCsvRows(text) {

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;

    else if (ch === ',')  { rows[rows.length - 1].push(cur); cur = ''; }

    else if (ch !== '\r') cur += ch;

function actifsDate(raw) {

  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]).getTime();
  m = s.match(/^(\d{4})-(\d{1,2})$/);                       // ISO mois seul Â« 2026-06 Â»
  if (m) { const mo = +m[2]; if (mo >= 1 && mo <= 12) return new Date(+m[1], mo - 1, 1).getTime(); }

  if (m) {
    let d = +m[1], mo = +m[2];
    if (d <= 12 && mo > 12) { const t = d; d = mo; mo = t; }
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return new Date(+m[3], mo - 1, d).getTime();

  if (m) { const mo = +m[1]; if (mo >= 1 && mo <= 12) return new Date(+m[2], mo - 1, 1).getTime(); }

// CSV â†’ { months (desc, plus rÃ©cent en 1er), totals (lignes Â« Total 20XX Â») }
function actifsParseCsv(text) {
  const rows = actifsParseCsvRows(text);
  if (rows.length < 2) return null;
  const header = rows[0].map(actifsNorm);
  const col = {};
  for (const k in ACTIFS_FIELDS) col[k] = header.indexOf(ACTIFS_FIELDS[k]);
  for (const [k,, h] of ACTIFS_COMPTES)   col[k] = header.indexOf(h);
  for (const [k,, h] of ACTIFS_PHYSIQUES) col[k] = header.indexOf(h);
  const months = [], totals = [];
  for (const r of rows.slice(1)) {
    const a = (r[0] || '').trim();
    const t = actifsDate(a);
    const my = a.match(/^total\s+(\d{4})$/i);
    if (!t && !my) continue;
    const o = t ? { t } : { year: +my[1] };
    for (const k in col) if (col[k] >= 0) o[k] = actifsNum(r[col[k]]);
    (t ? months : totals).push(o);
  }
  months.sort((a, b) => b.t - a.t);
  totals.sort((a, b) => b.year - a.year);
  return { months, totals };
}

// Recherche Drive gÃ©nÃ©rique â€” throw 'AUTH' (401, token mort) / 'SCOPE' (403, consentement
// lecture pas encore accordÃ©) pour que l'UI affiche le bon message + bouton reconnexion
async function actifsDriveQuery(token, q, fields) {
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=${encodeURIComponent(fields)}&pageSize=10&orderBy=${encodeURIComponent('modifiedTime desc')}`,
    { headers: { Authorization: `Bearer ${token}` } });
  if (res.status === 401) { gdriveLogout(); throw new Error('AUTH'); }
  if (res.status === 403) throw new Error('SCOPE');
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return (await res.json()).files || [];
}

// Fetch complet : trouve le fichier, exporte la 1re feuille en CSV, parse, met en cache.
async function actifsFetch(force) {
  const token = gdriveToken();

  let file = await actifsFindFile(token);
  if (!file) throw new Error('NOTFOUND');
  const dl = id => fetch(`https://www.googleapis.com/drive/v3/files/${id}/export?mimeType=${encodeURIComponent('text/csv')}`,
    { headers: { Authorization: `Bearer ${token}` } });
  let res = await dl(file.id);
  if (res.status === 404) {            // id cachÃ© pÃ©rimÃ© (fichier dÃ©placÃ©/supprimÃ©) â†’ re-recherche
    try { localStorage.removeItem(ACTIFS_FILE_LS); } catch {}
    file = await actifsFindFile(token);
    if (!file) throw new Error('NOTFOUND');
    res = await dl(file.id);

  if (res.status === 403) throw new Error('SCOPE');
  if (!res.ok) throw new Error('HTTP ' + res.status);

    months: parsed.months, totals: parsed.totals };
  saveActifs(data);
  return data;
}

// â”€â”€ Rate-limit guard (module-level, PERSISTÃ‰) â”€â”€â”€â”€
// Une seule fenÃªtre "aucune requÃªte avant T", partagÃ©e par TOUS les appels
// (player, login, synchro) et relue au chargement du module : un blocage
// (429 player ou stop synchro min. 15 min) survit au F5 â€” avant, _rlUntil repartait
// Ã  0 au refresh et le poll player re-hammerait une API qui venait de throttle.
const RL_LS_KEY = 'spotifyplus_blocked_until';
let _rlUntil  = parseInt(localStorage.getItem(RL_LS_KEY) || '0') || 0;
let _rlNotify = null;
function _rlSet(retryMs) {
  _rlUntil = Date.now() + retryMs + 2000;
  try { localStorage.setItem(RL_LS_KEY, String(_rlUntil)); } catch {}
  if (_rlNotify) _rlNotify(_rlUntil);
}
function _rlCheck() {
  // rate_limited:true permet aux callers de distinguer "bloquÃ©" de "pas de donnÃ©es" (204/null)
  if (Date.now() < _rlUntil) return { error: 'rate_limited', rate_limited: true, blockedUntil: _rlUntil };
  return null;
}
// Retry-After blindÃ© : un header malformÃ© donnerait parseIntâ†’NaN â†’ _rlUntil=NaN (guard inopÃ©rant)
// â†’ retry immÃ©diat en boucle sur une API qui vient de throttle
function _parseRetryAfterMs(raw, fallbackMs) {
  const n = parseInt(raw);
  return Number.isFinite(n) && n >= 0 ? n * 1000 : fallbackMs;
}

async function apiGet(url, _retried = false) {
  const blocked = _rlCheck();
  if (blocked) return blocked;
  const token = await getToken();
  const res   = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (res.status === 401 && !_retried) {
    // Token expirÃ© cÃ´tÃ© serveur â€” un refresh puis un seul retry (sinon le body d'erreur remonte au caller)
    const ok = await refreshToken();
    if (ok) return apiGet(url, true);
  }
  if (res.status === 429) {
    const raw     = res.headers.get('Retry-After');
    const retryMs = _parseRetryAfterMs(raw, 60000);
    _rlSet(retryMs);
    const err = new Error('RATE_LIMIT');
    err.retryAfter = (retryMs/1000).toFixed(1);
    err.waitMs  = retryMs + 2000;
    err.waitSec = ((retryMs + 2000)/1000).toFixed(1);
    err.rawHeader = raw;
    throw err;
  }
  if (res.status === 204) return null; // Nothing playing â€” no body to parse
  // Garde : un 200 au corps vide/non-JSON (arrive parfois cÃ´tÃ© Spotify) ferait throw .json()
  // â†’ le poll player rejetterait au lieu de simplement ne rien afficher. On renvoie null.
  return res.json().catch(() => null);
}
async function apiPut(url, body, _retried = false) {
  const blocked = _rlCheck();
  if (blocked) return blocked;
  const token = await getToken();
  const res   = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401 && !_retried) {
    // MÃªme politique que apiGet : un refresh puis un seul retry (un like/play ne doit pas Ã©chouer en silence)
    const ok = await refreshToken();
    if (ok) return apiPut(url, body, true);
  }
  if (res.status === 429) {
    _rlSet(_parseRetryAfterMs(res.headers.get('Retry-After'), 30000));
    return { error: 'rate_limited', rate_limited: true, blockedUntil: _rlUntil };
  }
  if (res.status === 204) return { ok: true };
  if (res.status === 403) return { error: 'forbidden' };
  if (res.status === 404) return { error: 'no_active_device' };
  // 2xx avec un corps vide/non-JSON (frÃ©quent sur PUT /me/library) = SUCCÃˆS, pas une erreur.
  // Sans ce guard, res.json() throw â†’ { error:'unknown' } faisait Ã©chouer faussement un like.
  if (res.ok) return res.json().catch(() => ({ ok: true }));
  return res.json().catch(() => ({ error: 'http_' + res.status }));
}
async function apiDel(url, _retried = false) {
  const blocked = _rlCheck();
  if (blocked) return blocked;
  const token = await getToken();
  const res   = await fetch(url, { method:'DELETE', headers: { Authorization:`Bearer ${token}` } });
  if (res.status === 401 && !_retried) {
    const ok = await refreshToken();
    if (ok) return apiDel(url, true);
  }
  if (res.status === 429) { _rlSet(_parseRetryAfterMs(res.headers.get('Retry-After'), 30000)); return { error:'rate_limited', rate_limited: true }; }
  if (res.status === 403) return { error: 'forbidden' };
  // Ne PAS renvoyer { ok:true } aveuglÃ©ment : un 404/5xx (ou tout statut non-ok) signifie que
  // l'action (ex. libraryRemove) a Ã©chouÃ© cÃ´tÃ© Spotify. Sans Ã§a, l'app passait liked=0 en DB
  // locale alors que Spotify gardait le like â†’ au prochain syncInitialLikes (Spotify fait foi)
  // le titre unlikÃ© rÃ©apparaissait dans l'onglet â¤. On remonte l'Ã©chec au caller.
  if (!res.ok) return { error: 'http_' + res.status };
  return { ok: true };
}

// â”€â”€ Quota de scraping : 100 artistes max par fenÃªtre GLISSANTE de 24h â”€â”€
// Avant : remise Ã  zÃ©ro Ã  minuit (jour LOCAL) â€” on pouvait scraper 100 Ã  23h30
// puis 100 de plus Ã  00h30 (1h plus tard). DÃ©sormais, atteindre 100 dÃ©marre un
// compteur de 24h ; la prochaine session est refusÃ©e jusqu'Ã  expiration de cette
// fenÃªtre. Stockage : localStorage spotifyplus_daily_scrapings = { count, until, last }.
// `last` = timestamp ms du DERNIER artiste scrapÃ© : le compteur repart Ã  0 dÃ¨s que
// 24h se sont Ã©coulÃ©es depuis ce dernier scrap, MÃŠME si on n'a pas atteint 100
// (avant, scraper 95 puis revenir 3 jours plus tard affichait encore 95).
const QUOTA_LS_KEY = 'spotifyplus_daily_scrapings';
const QUOTA_MAX = 100;
const QUOTA_MS = 24 * 60 * 60 * 1000;
// Lit le quota persistÃ© ; le compteur repart Ã  0 si la fenÃªtre 100-atteint est
// expirÃ©e OU si plus de 24h se sont Ã©coulÃ©es depuis le dernier scrap (inactivitÃ©).
function loadQuota() {
  try {
    const d = JSON.parse(localStorage.getItem(QUOTA_LS_KEY) || 'null');
    if (d && typeof d.count === 'number') {
      if (d.until && Date.now() >= d.until) return { count: 0, until: 0, last: 0 }; // fenÃªtre 100 expirÃ©e
      if (d.last && Date.now() - d.last >= QUOTA_MS) return { count: 0, until: 0, last: 0 }; // â‰¥ 24h sans scrap
      return { count: d.count, until: d.until || 0, last: d.last || 0 };
    }
  } catch {}
  return { count: 0, until: 0, last: 0 };
}
function saveQuota(count, until, last) {
  try { localStorage.setItem(QUOTA_LS_KEY, JSON.stringify({ count, until: until || 0, last: last || 0 })); } catch {}
}
// Garantit qu'une fenÃªtre 24h existe dÃ¨s que le quota est atteint. Auto-rÃ©parant :
// un Ã©tat hÃ©ritÃ© de l'ancien format ({ date, count:100 } sans `until`) ou un arrÃªt
// qui n'aurait pas posÃ© de date laissait le compteur bloquÃ© Ã  100 SANS countdown ni
// date affichable. Si count â‰¥ 100 sans fenÃªtre valide â†’ ouvre/persiste 24h maintenant.
// Retourne le timestamp de fin de fenÃªtre (0 si quota non atteint).
function ensureQuotaWindow() {
  const q = loadQuota();
  if (q.count < QUOTA_MAX) return 0;
  if (q.until && q.until > Date.now()) return q.until;
  const until = Date.now() + QUOTA_MS;
  saveQuota(QUOTA_MAX, until, q.last);
  return until;
}
// Notification cross-plateforme : sur mobile (Android Chrome), `new Notification()`
// lÃ¨ve "Illegal constructor" quand un service worker est actif â†’ il faut passer par
// ServiceWorkerRegistration.showNotification(). On tente le SW d'abord, fallback constructeur.
function notify(title, body) {
  if (!('Notification' in window)) return;
  const show = () => {
    try {
      if (navigator.serviceWorker?.ready) {
        navigator.serviceWorker.ready
          .then(reg => reg.showNotification(title, { body, icon: './icon-192.png' }))
          .catch(() => { try { new Notification(title, { body, icon: './icon-192.png' }); } catch {} });
      } else {
        new Notification(title, { body, icon: './icon-192.png' });
      }
    } catch {}
  };
  if (Notification.permission === 'granted') show();
  else if (Notification.permission !== 'denied') Notification.requestPermission().then(p => { if (p === 'granted') show(); });
}

const IDB_KEY = 'spotifyplus_db';

// Connexion unique rÃ©utilisÃ©e : avant, chaque get/set ouvrait une nouvelle connexion jamais fermÃ©e
let _idbPromise = null;
function idbOpen() {
  if (_idbPromise) return _idbPromise;
  _idbPromise = new Promise((res, rej) => {
    const req = indexedDB.open('spotifyplus', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('db');
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => { _idbPromise = null; rej(e); };
  });
  return _idbPromise;
}
async function idbGet(key) {
  const db  = await idbOpen();
  return new Promise((res, rej) => {
    const tx  = db.transaction('db', 'readonly');
    const req = tx.objectStore('db').get(key);
    req.onsuccess = () => res(req.result);
    req.onerror   = rej;
  });
}
async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('db', 'readwrite');
    tx.objectStore('db').put(value, key);
    tx.oncomplete = res;
    tx.onerror    = rej;
  });
}

  try { _db.run("ALTER TABLE stats ADD COLUMN total_liked INTEGER DEFAULT 0"); } catch {}
  // MÃ©tadonnÃ©es artiste (gratuites : dÃ©jÃ  dans l'objet /me/following) + compteurs de scan
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN name TEXT"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN image_url TEXT"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN popularity INTEGER"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN followers INTEGER"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN genres TEXT"); } catch {}            // JSON array
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN spotify_url TEXT"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN last_release_count INTEGER DEFAULT 0"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN total_tracks_added INTEGER DEFAULT 0"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN last_scan_status TEXT"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN scan_count INTEGER DEFAULT 0"); } catch {}
  // MÃ©moire des titres purgÃ©s : le DELETE de la purge fait sortir l'URI de `tracks`, et un
  // re-scan du mÃªme album (cutoff tronquÃ© au jour, scan partiel non terminÃ©â€¦) rÃ©insÃ©rait le
  // titre comme NON Ã©coutÃ©. Table minuscule (une URI par ligne), alimentÃ©e par purgeListened
  // et chargÃ©e dans knownUris au boot â€” jamais purgÃ©e.
  _db.run("CREATE TABLE IF NOT EXISTS purged_uris (spotify_uri TEXT PRIMARY KEY)");

// SÃ©rialisation des sauvegardes : jamais deux exports/Ã©critures IndexedDB en parallÃ¨le.
// Pas de debounce temporel : chaque appel garantit une Ã©criture incluant ses donnÃ©es
// (la boucle do/while rÃ©-exporte si un appel est arrivÃ© pendant l'Ã©criture en cours).
let _savePromise = null;
let _saveQueued  = false;
async function saveDB() {
  if (!_db) return;
  if (_savePromise) { _saveQueued = true; return _savePromise; }
  _savePromise = (async () => {
    do {
      _saveQueued = false;
      const data = _db.export();
      await idbSet(IDB_KEY, data.buffer);
    } while (_saveQueued);
  })();
  try { await _savePromise; } finally { _savePromise = null; }
}

function dbRun(sql, params = []) {
  _db.run(sql, params);
}

function dbAll(sql, params = []) {
  const stmt = _db.prepare(sql);
  if (params.length) stmt.bind(params);
  const rows = [];
  while (stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}

function dbGet(sql, params = []) {
  return dbAll(sql, params)[0] || null;
}

  const s = dbGet(

// Charge les titres non Ã©coutÃ©s du feed depuis la DB, en appliquant les filtres/tri EN SQL
// (pas seulement sur les 1000 titres chargÃ©s en mÃ©moire) â†’ tout filtre/tri actif balaie
// TOUTE la base, hors du cap des 1000 :
// - filterType : 'single' | 'album' | 'dw' | 'all'  â†’ WHERE sur release_type
// - sortBy     : 'date_asc' | 'artist' | 'default'  â†’ ORDER BY release_date / artist_name / id
// - artistSearch : LIKE sur artist_name
// Le cap LIMIT 1000 reste (rendu), mais il s'applique APRÃˆS filtre/tri : on voit donc bien
// les Singles / les plus anciens / l'artiste recherchÃ© mÃªme au-delÃ  de la 1000e ligne.
function loadFeedFromDB({ artistSearch = '', filterType = 'all', sortBy = 'default', genre = '' } = {}) {
  const where = ['listened = 0'];
  const params = [];
  const s = (artistSearch || '').trim();
  if (s) {
    // Ã‰chappe les jokers SQL (% _ et l'Ã©chappeur \) : taper "100%" ou "_" doit chercher
    // ces caractÃ¨res littÃ©ralement, pas se comporter comme un joker LIKE
    where.push("LOWER(artist_name) LIKE '%' || LOWER(?) || '%' ESCAPE '\\'");
    params.push(s.replace(/[\\%_]/g, m => '\\' + m));
  }
  if (genre) {
    // Filtre par genre via les mÃ©tadonnÃ©es artiste (genres = JSON.stringify(genres[])) :
    // le motif '"<genre>"' matche l'entrÃ©e JSON exacte. Ne couvre que les titres dont
    // l'artist_name correspond Ã  un artiste scannÃ© (les tracks DÃ©couvertes multi-artistes
    // "A, B" ne matchent pas â€” assumÃ©).
    where.push("artist_name IN (SELECT name FROM artists_scraped WHERE genres LIKE '%' || ? || '%')");
    params.push('"' + genre + '"');
  }
  if (filterType === 'single')     where.push("release_type = 'single'");
  else if (filterType === 'dw')    where.push("release_type = 'discover_weekly'");
  else if (filterType === 'album') where.push("(release_type IS NULL OR release_type NOT IN ('single','discover_weekly'))");
  let order = 'id ASC';
  if (sortBy === 'date_asc')    order = 'release_date ASC, id ASC';
  else if (sortBy === 'artist') order = 'artist_name COLLATE NOCASE ASC, id ASC';
  const sql = `SELECT * FROM tracks WHERE ${where.join(' AND ')} ORDER BY ${order} LIMIT 1000`;
  return dbAll(sql, params).map(mapFeedRow);
}

const DW_LS_KEY      = 'spotifyplus_dw_last_import';
const DW_MAX_AGE_MS  = 7 * 24 * 60 * 60 * 1000; // 7 jours (cooldown aprÃ¨s un import rÃ©ussi)
const DW_FAIL_KEY    = 'spotifyplus_dw_last_fail';
const DW_FAIL_AGE_MS = 6 * 60 * 60 * 1000;      // 6 h (cooldown aprÃ¨s un Ã©chec â€” auto-rÃ©parant)

// Lit le contenu d'une playlist en tolÃ©rant l'Ã©tat de migration de l'app Spotify :
// essaie le nouvel endpoint /items PUIS l'ancien /tracks (certaines apps ont encore l'un
// ou l'autre). additional_types=track force le retour des pistes. Retourne { items } | { rate_limited }.
async function fetchPlaylistItems(playlistId) {
  const urls = [
    `https://api.spotify.com/v1/playlists/${playlistId}/items?limit=50&additional_types=track`,
    `https://api.spotify.com/v1/playlists/${playlistId}/tracks?limit=50&additional_types=track`,
  ];
  for (const url of urls) {
    const data = await apiGet(url);
    if (data?.rate_limited) return { rate_limited: true };
    if (Array.isArray(data?.items) && data.items.length) return { items: data.items };
  }
  return { items: [] };
}

// Collecte TOUTES les playlists dont le nom correspond Ã  Â« DÃ©couvertes de la semaine Â»
// (toutes pages) â€” pas seulement la premiÃ¨re : depuis la migration Spotify, l'Ã©ditoriale
// (owner 'spotify') n'est plus lisible, mais une COPIE PERSO du mÃªme nom (owner =
// l'utilisateur) l'est. On veut pouvoir tenter les deux. Retourne { candidates } |
// { rate_limited }. PartagÃ© par l'import auto ET le bouton d'accÃ¨s manuel.
async function dwFindCandidates() {
  const candidates = [];
  let nextUrl = 'https://api.spotify.com/v1/me/playlists?limit=50';
  while (nextUrl) {
    const data = await apiGet(nextUrl);
    if (data?.rate_limited) return { rate_limited: true, candidates };
    if (!data?.items) break;
    for (const p of data.items) {
      const n = (p.name || '').toLowerCase();
      const match = n.includes('dÃ©couvertes de la semaine') || n.includes('discover weekly')
        || (p.owner?.id === 'spotify' && (n.includes('dÃ©couvertes') || n.includes('discover')));
      if (match) candidates.push(p);
    }
    nextUrl = data.next || null;
  }
  return { candidates };
}

async function importDiscoverWeekly(addLog) {
  const lastOk   = localStorage.getItem(DW_LS_KEY);
  if (lastOk && Date.now() - parseInt(lastOk) < DW_MAX_AGE_MS) return;       // dÃ©jÃ  importÃ© rÃ©cemment
  const lastFail = localStorage.getItem(DW_FAIL_KEY);
  if (lastFail && Date.now() - parseInt(lastFail) < DW_FAIL_AGE_MS) return;  // Ã©chec rÃ©cent â€” petit cooldown
  if (Date.now() < _rlUntil) return; // fenÃªtre rate-limit active â€” ne pas insister, retentera au prochain login

  addLog('â”€â”€ Import DÃ©couvertes de la semaine â”€â”€', 'info');

  const found = await dwFindCandidates();
  if (found.rate_limited) return; // fenÃªtre 429 â€” retentera au prochain login
  const candidates = found.candidates;

  if (!candidates.length) {
    addLog('âš  Playlist "DÃ©couvertes de la semaine" introuvable dans tes playlists â€” ouvre-la sur Spotify et clique "Ajouter Ã  ta bibliothÃ¨que", puis reconnecte-toi.', 'warn');
    localStorage.setItem(DW_FAIL_KEY, Date.now().toString()); // re-tentera dans 6 h
    return;
  }

  // PrioritÃ© aux copies PERSO (owner â‰  'spotify' â†’ contenu lisible), l'Ã©ditoriale en dernier.
  candidates.sort((a, b) => (a.owner?.id === 'spotify' ? 1 : 0) - (b.owner?.id === 'spotify' ? 1 : 0));

  const today = new Date().toISOString().slice(0, 10);
  // Migration Spotify : /tracks â†’ /items, et le contenu n'est renvoyÃ© QUE pour les playlists
  // possÃ©dÃ©es/collaboratives. On essaie chaque candidate (copie perso d'abord) via /items ET
  // /tracks (fetchPlaylistItems) jusqu'Ã  en trouver une dont le contenu est lisible.
  let tracksData = null;
  for (const pl of candidates) {
    const d = await fetchPlaylistItems(pl.id);
    if (d.rate_limited) return; // fenÃªtre 429 â€” retentera au prochain login
    if (d.items.length) { tracksData = d; break; }
  }
  if (!tracksData) {
    addLog('âš  Contenu de "DÃ©couvertes de la semaine" inaccessible (403/vide). Depuis la migration Spotify, les playlists Ã‰DITORIALES Spotify (DÃ©couvertes, Radarâ€¦) ne sont plus lisibles par les apps tierces, mÃªme ajoutÃ©es Ã  ta bibliothÃ¨que. CONTOURNEMENT : sur Spotify, ouvre la playlist â†’ menu â‹¯ â†’ "Ajouter Ã  une autre playlist" â†’ "Nouvelle playlist" (garde "dÃ©couvertes" dans le nom) â†’ cette COPIE PERSO sera lisible et importÃ©e automatiquement. Nouvel essai dans 6 h.', 'warn');
    localStorage.setItem(DW_FAIL_KEY, Date.now().toString()); // cooldown court, auto-rÃ©parant
    return;
  }

  let added = 0;
  // Titres Ã©coutÃ©s puis purgÃ©s : leur URI n'est plus dans `tracks`, ne pas les rÃ©importer
  let dwPurged = new Set();
  try { dwPurged = new Set(dbAll("SELECT spotify_uri FROM purged_uris").map(r => r.spotify_uri)); } catch {}
  for (const entry of tracksData.items) {
    const t = entry.item || entry.track; // champ renommÃ© track â†’ item par la migration 2026
    if (!t?.uri || t.is_local) continue;
    if (dwPurged.has(t.uri)) continue;
    try {
      dbRun(
        "INSERT OR IGNORE INTO tracks (spotify_uri, artist_name, title, release_title, release_type, release_date, cover_url, duration_ms) VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
        [t.uri, t.artists?.map(a => a.name).join(', ') || '?', t.name, 'DÃ©couvertes de la semaine', 'discover_weekly', today, t.album?.images?.[1]?.url || t.album?.images?.[0]?.url || null, t.duration_ms || null]
      );
      added++;
    } catch {}
  }

  // SuccÃ¨s (contenu lu) : cooldown 7 j + on efface le marqueur d'Ã©chec
  localStorage.setItem(DW_LS_KEY, Date.now().toString());
  localStorage.removeItem(DW_FAIL_KEY);
  if (added > 0) {
    await saveDB();
    addLog(`âœ“ ${added} titre(s) de "DÃ©couvertes de la semaine" ajoutÃ©s au feed`, 'ok');
  } else {
    addLog('DÃ©couvertes de la semaine : tous les titres sont dÃ©jÃ  dans le feed', 'info');
  }
}

// AccÃ¨s MANUEL Ã  Â« DÃ©couvertes de la semaine Â» (bouton violet du Scrapping, sous les Logs) :

  let readable = null;

  return candidates[0].external_urls?.spotify || null;

// Une release_date Spotify a une prÃ©cision variable : 'day' ("2026-05-10"), 'month'
// ("2026-05") ou 'year' ("2026"). new Date("2026") â†’ 1er janvier : une nouveautÃ© datÃ©e Ã 
// l'annÃ©e seule passait alors SOUS le cutoff (ex. 2026-03-15) et Ã©tait ratÃ©e. On considÃ¨re
// la date comme une PÃ‰RIODE [dÃ©but, fin] et on garde la sortie si cette pÃ©riode CHEVAUCHE
// [cutoff, ceiling] â€” les doublons Ã©ventuels sont absorbÃ©s par INSERT OR IGNORE.
function releaseInRange(dateStr, cutoff, ceiling) {
  if (!dateStr) return false;
  const p = String(dateStr).split('-');
  const y = parseInt(p[0]);
  if (!Number.isFinite(y)) return false;
  let start, end;
  if (p.length >= 3)      { start = new Date(Date.UTC(y, (parseInt(p[1])||1) - 1, parseInt(p[2])||1)); end = start; }
  else if (p.length === 2){ const m = (parseInt(p[1])||1) - 1; start = new Date(Date.UTC(y, m, 1)); end = new Date(Date.UTC(y, m + 1, 0)); }
  else                    { start = new Date(Date.UTC(y, 0, 1)); end = new Date(Date.UTC(y, 11, 31)); }
  return end >= cutoff && start <= ceiling;
}

  const [user,     setUser]       = React.useState(null);

  const [dbReady,  setDbReady]          = React.useState(false);
  const [resumableSession, setResumableSession] = React.useState(null);
  // Undo du retrait d'un titre (croix rouge / swipe) â€” { uri, item, durMs, counted }
  const [undoToast, setUndoToast] = React.useState(null);
  const undoToastRef              = React.useRef(null);
  const setUndo = (v) => { undoToastRef.current = v; setUndoToast(v); };

  // â”€â”€ Ã‰tat de synchro unifiÃ© â€” UNE seule source de vÃ©ritÃ© au lieu de 3 boolÃ©ens â”€â”€
  // 'idle' | 'running' | 'paused' (pause manuelle) | 'rl_waiting' (attente 429)
  // Le ref est posÃ© de faÃ§on SYNCHRONE (setSync) : le guard anti double-clic de
  // startSync et le checkpoint lisent l'Ã©tat rÃ©el, pas celui du dernier render.
  const [syncState, setSyncState] = React.useState('idle');
  const syncStateRef              = React.useRef('idle');
  const setSync = (st) => { syncStateRef.current = st; setSyncState(st); };
  const scraping  = syncState !== 'idle';
  const paused    = syncState === 'paused';
  const rlWaiting = syncState === 'rl_waiting';

  const [otherTab, setOtherTab]   = React.useState(false); // autre onglet dÃ©tectÃ© (risque d'Ã©crasement DB)
  const knownUrisRef              = React.useRef(new Set());
  const listenedUrisRef           = React.useRef(new Set());
  const prevUriRef                = React.useRef(null);
  const [loopEnabled, setLoopEnabled] = React.useState(() => localStorage.getItem('spotifyplus_loop') === '1');
  const loopEnabledRef            = React.useRef(false);
  // ParamÃ©trage des modules (activer/dÃ©sactiver les onglets) â€” persistÃ© en localStorage
  const [moduleToggles, setModuleToggles] = React.useState(() => loadModuleToggles());
  const setModuleEnabled = React.useCallback((id, on) => {
    setModuleToggles(prev => { const next = { ...prev, [id]: !!on }; saveModuleToggles(next); return next; });
  }, []);
  const feedRef                   = React.useRef([]);
  const prevPositionRef           = React.useRef(0);
  const prevDurationRef           = React.useRef(0);
  const advancedForRef            = React.useRef(null); // URI pour laquelle on a dÃ©jÃ  dÃ©clenchÃ© l'avance
  const prevNowRef                = React.useRef({ playing:false, uri:null, current:0, duration:0 });
  React.useEffect(() => {
    loopEnabledRef.current = loopEnabled;
    localStorage.setItem('spotifyplus_loop', loopEnabled ? '1' : '0'); // persistant : survit au changement d'onglet / F5
  }, [loopEnabled]);
  // âš  l'effet de sync feedRef est dÃ©clarÃ© APRÃˆS le useState de feed (les deps [feed] sont Ã©valuÃ©es pendant le rendu)

  const [stats,         setStats]       = React.useState({ artists:0, total:0, releases:0, tracks:0 });
  const [listenStats,   setListenStats] = React.useState({ remaining:0, remaining_ms:0, this_month:0, this_year:0, all_time:0 });
  const [likedTracks,   setLikedTracks] = React.useState([]);
  const [history,       setHistory]     = React.useState([]); // titres Ã©coutÃ©s non purgÃ©s, plus rÃ©cent en haut
  const [artists,       setArtists]     = React.useState([]); // artistes scrappÃ©s (table artists_scraped) + mÃ©tadonnÃ©es
  const [progress,      setProgress]    = React.useState(0);
  const [currentArtist, setCurrentArtist] = React.useState('');
  const [statusMsg,     setStatusMsg]   = React.useState('PrÃªt.');
  const [statusMode,    setStatusMode]  = React.useState('green');
  const [nextCall,      setNextCall]    = React.useState(0);
  const [nextCallTotal, setNextCallTotal] = React.useState(0);
  const [eta,           setEta]         = React.useState('');
  const [dailyScrapings, setDailyScrapings] = React.useState(0);
  const [quotaUntil,    setQuotaUntil]  = React.useState(0);     // fenÃªtre 24h ouverte par les 100 artistes

  const [feed,          setFeed]        = React.useState([]);
  React.useEffect(() => { feedRef.current = feed; }, [feed]);

  const [blockedUntil, setBlockedUntil] = React.useState(0);     // fenÃªtre rate-limit persistÃ©e (spotifyplus_blocked_until)

  // Notification Chrome quand le scraping redevient disponible â€” programmÃ©e Ã  l'expiration
  // de la fenÃªtre bloquante (quota 24h OU rate-limit 429), la plus tardive des deux.
  const notifiedAvailAtRef = React.useRef(0);
  React.useEffect(() => {
    const block = Math.max(quotaUntil || 0, blockedUntil || 0);
    if (block <= Date.now()) return;
    // Demander la permission dÃ¨s maintenant (geste utilisateur rÃ©cent : clic Lancer)
    if ('Notification' in window && Notification.permission === 'default') {
      try { Notification.requestPermission(); } catch {}
    }
    const id = setTimeout(() => {
      if (notifiedAvailAtRef.current === block) return; // dÃ©jÃ  notifiÃ© pour cette fenÃªtre
      notifiedAvailAtRef.current = block;
      notify('Spotify+ â€” Scraping disponible', 'La fenÃªtre de blocage est terminÃ©e, tu peux relancer une synchro.');
    }, block - Date.now());
    return () => clearTimeout(id);
  }, [quotaUntil, blockedUntil]);

  // Filtres du feed â€” APRÃˆS feed (useMemo rÃ©fÃ©rence feed, doit Ãªtre dÃ©clarÃ© aprÃ¨s)
  const [filterType,   setFilterType]   = React.useState('all');
  const [sortBy,       setSortBy]       = React.useState('artist'); // tri par dÃ©faut : par artiste (Aâ†’Z)
  const [artistSearch, setArtistSearch] = React.useState('');
  const [genreFilter,  setGenreFilter]  = React.useState(''); // '' = tous â€” filtre SQL uniquement (via artists_scraped.genres)
  const resetFilters = () => { setFilterType('all'); setSortBy('artist'); setArtistSearch(''); setGenreFilter(''); };

  const filteredFeed = React.useMemo(() => {
    // #opt : sans filtre/tri actif (cas courant, notamment pendant la synchro oÃ¹ le feed
    // change Ã  chaque artiste), le filtre est un pass-through et le tri renvoie 0 â†’ on
    // retourne le tableau tel quel au lieu d'allouer + re-trier ~1000 items Ã  chaque fois.
    // Le chemin mÃ©moire ci-dessous DOUBLE volontairement le filtre/tri SQL de loadFeedFromDB :
    // il reste nÃ©cessaire pour la fenÃªtre de debounce 150ms (feed tient encore l'ancien
    // rÃ©sultat SQL) ET pour les items ajoutÃ©s par la synchro en cours (setFeed d'append qui
    // ne repasse pas par SQL). Il ne s'exÃ©cute qu'au changement de feed/filtre (useMemo).
    const q = artistSearch.trim().toLowerCase();   // #opt : calculÃ© UNE fois, pas par item (~1000Ã—)
    if (filterType === 'all' && sortBy === 'default' && !q) return feed || [];
    let r = (feed || []).filter(item => {
      if (filterType === 'single' && item.label !== 'Single') return false;
      if (filterType === 'album'  && item.label !== 'Album')  return false;
      if (filterType === 'dw'     && item.label !== 'DÃ©couvertes') return false;
      if (q) return (item.artist || '').toLowerCase().includes(q);
      return true;
    });
    if (sortBy === 'default') return r;   // ordre SQL dÃ©jÃ  correct â†’ pas de clone+sort inutile
    return [...r].sort((a, b) => {
      if (sortBy === 'date_asc') return (a.rawDate || '').localeCompare(b.rawDate || '');
      if (sortBy === 'artist')    return (a.artist || '').localeCompare(b.artist || '');
      return 0;
    });
  }, [feed, filterType, sortBy, artistSearch]);

  const filteredFeedRef = React.useRef([]);
  React.useEffect(() => { filteredFeedRef.current = filteredFeed; }, [filteredFeed]);

  // #opt : index URI â†’ position dans filteredFeed. O(1) au lieu des findIndex O(n) rÃ©pÃ©tÃ©s
  // par les 3 effets d'auto-avance (Ã  chaque tick du poll 5s) et les 3 players (Ã  chaque
  // render). âš  DÃ©clarÃ© APRÃˆS filteredFeed (useMemo Ã©valuÃ© pendant le rendu â€” var hoisting).
  const filteredFeedIndex = React.useMemo(() => {
    const m = new Map();
    filteredFeed.forEach((it, i) => { if (!m.has(it.spotifyUri)) m.set(it.spotifyUri, i); });
    return m;
  }, [filteredFeed]);
  const filteredFeedIndexRef = React.useRef(new Map());
  React.useEffect(() => { filteredFeedIndexRef.current = filteredFeedIndex; }, [filteredFeedIndex]);

  // Tout filtre/tri actif (type, recherche artiste, tri date/artiste) re-query la DB
  // (loadFeedFromDB applique filtre+tri EN SQL) â†’ on voit les titres mÃªme au-delÃ  du cap des
  // 1000 chargÃ©s en mÃ©moire. Retour Ã  'all'/'default'/'' â†’ recharge le feed de base. Debounce
  // 150ms (lisse la frappe). On remplace `feed` directement â†’ toute la machinerie existante
  // (auto-avance, marquage Ã©coutÃ©, players via feedRef/filteredFeed) fonctionne sur ces titres.
  const DEFAULT_QUERY_KEY = JSON.stringify(['', 'all', 'artist', '']);
  const lastQueryRef = React.useRef(DEFAULT_QUERY_KEY); // skip le 1er run (dÃ©fauts = chargement init)
  React.useEffect(() => {
    if (!dbReady) return;
    const s = artistSearch.trim();
    const key = JSON.stringify([s, filterType, sortBy, genreFilter]);
    if (key === lastQueryRef.current) return; // Ã©vite un reload inutile (ex. re-render)
    const t = setTimeout(() => {
      lastQueryRef.current = key;
      setFeed(loadFeedFromDB({ artistSearch: s, filterType, sortBy, genre: genreFilter }));
    }, 150);
    return () => clearTimeout(t);
  }, [artistSearch, filterType, sortBy, genreFilter, dbReady]);

  const [logs,          setLogs]        = React.useState([]);
  const [now,           setNow]         = React.useState(null);
  const [delayChoice,   setDelayChoice] = React.useState(30);
  const delayChoiceRef = React.useRef(30);
  React.useEffect(() => { delayChoiceRef.current = delayChoice; }, [delayChoice]);

  const log = React.useCallback((msg, type='info') => {
    const time = new Date().toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    setLogs(L => [...L, { time, msg, type }].slice(-500));
  }, []);

  const setStatus = React.useCallback((msg, mode='green') => {
    setStatusMsg(msg); setStatusMode(mode);
  }, []);

  // remaining = nombre TOTAL d'artistes restant Ã  scraper (la fin de la synchro complÃ¨te,
  // pas la fin de la session de 100/jour â€” celle-ci a son propre affichage dans NextCallPanel)
  const updateETA = React.useCallback((remaining, avgMs) => {
    if (remaining <= 0) { setEta(''); return; }
    const sec = Math.ceil((remaining * avgMs) / 1000);
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    setEta((h > 0 ? `${h}h ` : '') + (m > 0 || h > 0 ? `${m}m ` : '') + `${s}s`);
  }, []);

  // â”€â”€ Init OAuth + local DB â”€â”€
  React.useEffect(() => {
    (async () => {
      // Retour Google Drive (token dans le fragment #access_token=â€¦&state=gdrive) : stockÃ©
      // puis URL nettoyÃ©e, l'init Spotify normale reprend (le token Spotify est en localStorage)
      gdriveHandleRedirect();
      const params = new URLSearchParams(window.location.search);
      const code   = params.get('code');
      const returnedState = params.get('state');
      if (code && returnedState === 'dropbox') {
        // Retour du consentement Dropbox (state='dropbox') : Ã©change le code, puis reprend
        // l'init Spotify normale (le token Spotify est dÃ©jÃ  en localStorage)
        await dropboxExchange(code).catch(() => {});
        window.history.replaceState({}, '', window.location.pathname);
      } else if (code) {
        // Anti-CSRF : le state retournÃ© doit correspondre Ã  celui gÃ©nÃ©rÃ© au dÃ©part
        const stateOk = returnedState && returnedState === localStorage.getItem('pkce_state');
        const ok = stateOk && await exchangeCode(code);
        window.history.replaceState({}, '', window.location.pathname);
        if (!ok) { setAuthState('login'); return; }
      }
      const token = localStorage.getItem('spotify_token');
      if (!token) { setAuthState('login'); return; }
      try {
        const me = await apiGet('https://api.spotify.com/v1/me');
        // me.rate_limited : fenÃªtre 429 persistÃ©e active au boot â€” le token existe,
        // on entre quand mÃªme en mode connectÃ© (dÃ©gradÃ©) au lieu d'Ã©jecter vers le login
        if (me?.id || me?.rate_limited) {
          if (me?.id) setUser(me);
          setAuthState('connected');

          // âš  Le chargement Finance n'est PLUS lancÃ© au login : les APIs dÃ©diÃ©es (Alpha
          // Vantage, Twelve Data, CoinGecko, gold-api) ne sont appelÃ©es QUE lorsque
          // l'utilisateur ouvre l'onglet/section Finance (FinancePanel monte â†’ startFinanceLight).

          // Demander la persistance du stockage (rÃ©duit le risque d'Ã©viction IndexedDB, surtout iOS)
          try { navigator.storage?.persist?.(); } catch {}

          // Remember : notification Ã  l'ouverture de l'app pour tout rappel Ã©chu (1Ã—/jour)
          try { notifyDueReminders(); } catch {}
          // Remember â†’ To do : ajoute au carrousel Â« Aujourd'hui Â» les rappels Ã  â‰¤ 3 j de l'Ã©chÃ©ance
          try { syncRemembersToTodos(); } catch {}

          // TV Time / YouTube : au login, vÃ©rifie les nouvelles vidÃ©os des chaÃ®nes/playlists
          // suivies (TTL 6h par item). Une sÃ©rie Â« vue Â» avec une nouvelle vidÃ©o repasse en cours.
          // Fire-and-forget (ne bloque pas l'init) â€” Ã©crit directement en localStorage.
          try { ytCheckNewVideos(); } catch {}

          // Init local DB
          await initDB();

          // Check month/year reset
          const now2      = new Date();
          // Mois/annÃ©e LOCAUX (pas toISOString() qui est en UTC) : sinon le compteur mensuel
          // bascule Ã  minuit UTC (â‰ˆ 01h/02h en France) au lieu de minuit local.
          const curMonth  = `${now2.getFullYear()}-${String(now2.getMonth() + 1).padStart(2, '0')}`;
          const curYear   = now2.getFullYear().toString();
          const statsRow  = dbGet("SELECT last_reset_month, last_reset_year FROM stats WHERE id = 1");
          if (statsRow?.last_reset_month !== curMonth) {
            dbRun("UPDATE stats SET listened_this_month = 0, last_reset_month = ? WHERE id = 1", [curMonth]);
          }
          if (statsRow?.last_reset_year !== curYear) {
            dbRun("UPDATE stats SET listened_this_year = 0, last_reset_year = ? WHERE id = 1", [curYear]);
          }

          // Import DÃ©couvertes de la semaine si besoin (1x par semaine)
          const initMsgs = [];
          const addInitLog = (msg, type='info') => {
            const t = new Date().toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
            initMsgs.push({ time: t, msg, type });
          };
          await importDiscoverWeekly(addInitLog).catch(() => {});

          // Load known URIs for dedup (inclut les DW tracks fraÃ®chement importÃ©es)
          const uriRows = dbAll("SELECT spotify_uri FROM tracks");
          uriRows.forEach(r => knownUrisRef.current.add(r.spotify_uri));
          // + les titres purgÃ©s : sortis de `tracks` par la purge, ils ne doivent jamais
          // Ãªtre rÃ©insÃ©rÃ©s par un re-scan (cf. purged_uris)
          try { dbAll("SELECT spotify_uri FROM purged_uris").forEach(r => knownUrisRef.current.add(r.spotify_uri)); } catch {}

          // Load feed (not listened) â€” voir loadFeedFromDB (les filtres/tri re-query la DB, hors cap 1000)
          // tri par dÃ©faut : par artiste (Aâ†’Z), alignÃ© sur l'Ã©tat initial de sortBy
          setFeed(loadFeedFromDB({ sortBy: 'artist' }));

          // Load listen stats
          setListenStats(loadListenStatsFromDB());
          setLikedTracks(loadLikedTracksFromDB());
          setHistory(loadHistoryFromDB());
          setArtists(loadArtistsFromDB());
          // syncInitialLikes est appelÃ© aprÃ¨s setDbReady(true) via useEffect

          // VÃ©rifier si une synchro Ã©tait en cours (reprise possible)
          try {
            const saved = localStorage.getItem('spotifyplus_sync_progress');
            if (saved) {
              const p = JSON.parse(saved);
              if (p?.artists_scanned > 0) setResumableSession(p);
            }
          } catch {}

          try {
            setDailyScrapings(loadQuota().count);
            const until = ensureQuotaWindow(); // expose/ouvre la fenÃªtre 24h si quota atteint
            if (until) setQuotaUntil(until);
          } catch {}

          // FenÃªtre rate-limit persistÃ©e (dÃ©jÃ  relue dans _rlUntil au chargement du module)
          try {
            if (_rlUntil > Date.now()) setBlockedUntil(_rlUntil);
            else localStorage.removeItem(RL_LS_KEY);
          } catch {}

          if (initMsgs.length > 0) setLogs(initMsgs);
          setDbReady(true);

          // Proposition de sauvegarde 1Ã—/semaine â€” diffÃ©rÃ©e pour laisser l'UI s'afficher
          // avant le confirm bloquant (DB dÃ©jÃ  prÃªte, buildBackup fonctionne)
          setTimeout(() => { try { maybeWeeklyBackupPrompt(); } catch {} }, 2500);
        } else {
          setAuthState('login');
        }
      } catch { setAuthState('login'); }
    })();
  }, []);

  // â”€â”€ Poll lecture en cours toutes les 5s â”€â”€
  React.useEffect(() => {
    if (authState !== 'connected') return;
    let stop = false;
    const tick = async () => {
      if (document.visibilityState === 'hidden') return; // onglet cachÃ© : ne pas dÃ©penser de requÃªtes
      try {
        const r = await apiGet('https://api.spotify.com/v1/me/player/currently-playing');
        // FenÃªtre 429 active : garder l'Ã©tat affichÃ© tel quel â€” setNow(null) ferait
        // disparaÃ®tre le player et polluerait les effets d'auto-avance alors que la musique joue
        if (r?.rate_limited) return;
        if (!stop && r?.item) {
          const next = {
            title:    r.item.name,
            artist:   r.item.artists.map(a => a.name).join(', '),
            duration: Math.floor(r.item.duration_ms / 1000),
            current:  Math.floor((r.progress_ms || 0) / 1000),
            image:    r.item.album?.images?.[1]?.url || r.item.album?.images?.[0]?.url,
            playing:  r.is_playing,
            uri:      r.item.uri,
          };
          // Bail-out : si rien n'a changÃ© (lecture en pause), garder la mÃªme rÃ©fÃ©rence â†’ pas de re-render global
          setNow(prev => (prev &&
            prev.uri === next.uri && prev.current === next.current &&
            prev.playing === next.playing && prev.duration === next.duration &&
            prev.title === next.title && prev.artist === next.artist &&
            prev.image === next.image) ? prev : next);
        } else if (!stop && !r?.item) {
          setNow(n => n === null ? n : null);
        }
      } catch {}
    };
    tick();
    const id = setInterval(tick, 5000);
    const onVis = () => { if (document.visibilityState === 'visible') tick(); }; // rattrapage immÃ©diat au retour
    document.addEventListener('visibilitychange', onVis);
    return () => { stop = true; clearInterval(id); document.removeEventListener('visibilitychange', onVis); };
  }, [authState]);

  // â”€â”€ Countdown UI â”€â”€
  React.useEffect(() => {
    if (nextCall <= 0) return;
    const id = setInterval(() => setNextCall(v => Math.max(0, v - 1)), 1000);
    return () => clearInterval(id);
  }, [nextCall]);

  // â”€â”€ Marquer comme Ã©coutÃ© quand le morceau se termine (URI change) â”€â”€
  React.useEffect(() => {
    const currentUri = now?.uri || null;
    const prevUri    = prevUriRef.current;
    prevUriRef.current = currentUri;

    // Le marqueur d'auto-avance ne vaut que pour le titre qu'on vient de quitter :
    // le reset permet de rÃ©-avancer si l'utilisateur rÃ©Ã©coute le mÃªme titre plus tard dans la session
    if (currentUri && advancedForRef.current && advancedForRef.current !== currentUri) {
      advancedForRef.current = null;
    }

    if (!prevUri || prevUri === currentUri) return;

    // Auto-avance â€” AVANT le check listenedUrisRef pour ne pas Ãªtre bloquÃ©
    // DÃ©clenche si : loop dÃ©sactivÃ© ET (rien ne joue OU le nouveau titre n'est pas dans le feed)
    if (!loopEnabledRef.current && dbReady) {
      const f = filteredFeedRef.current;
      const idxMap = filteredFeedIndexRef.current;
      const prevIdx       = idxMap.get(prevUri) ?? -1;
      const currentInFeed = currentUri ? idxMap.has(currentUri) : false;
      // Garde anti-vol de lecture : n'avancer que si le titre quittÃ© Ã©tait PROCHE DE SA FIN
      // au dernier tick (poll 5s + marge). Sans Ã§a, lancer manuellement un titre hors feed
      // (ou stopper la lecture) dÃ©clenchait playTrack et Ã©crasait le choix de l'utilisateur.
      // prevNowRef est mis Ã  jour par l'effet `now` dÃ©clarÃ© plus bas â†’ il contient encore
      // l'Ã©tat du tick PRÃ‰CÃ‰DENT quand cet effet s'exÃ©cute (ordre de dÃ©claration des effets).
      const snap    = prevNowRef.current;
      const nearEnd = snap.uri === prevUri && snap.duration > 0 && (snap.duration - snap.current) <= 12;
      // advancedForRef : les effets 2 et 3 posent dÃ©jÃ  ce marqueur â€” le vÃ©rifier ET le poser
      // ici aussi, sinon deux effets peuvent dÃ©clencher chacun un playTrack pour le mÃªme titre
      if (prevIdx !== -1 && !currentInFeed && nearEnd && advancedForRef.current !== prevUri) {
        const next = f[prevIdx + 1] ?? f[0];
        if (next) {
          advancedForRef.current = prevUri;
          playTrack(next.spotifyUri);
        }
      }
    }

    if (listenedUrisRef.current.has(prevUri)) return;
    if (!dbReady) return;

    // Ã‰critures DB hors de l'updater setFeed (les updaters React doivent rester purs)
    const item = feedRef.current.find(f => f.spotifyUri === prevUri);
    if (!item) return;

    listenedUrisRef.current.add(prevUri);
    try {
      const trackRow = dbGet("SELECT duration_ms FROM tracks WHERE spotify_uri = ?", [prevUri]);
      const durMs = trackRow?.duration_ms || 0;
      dbRun("UPDATE tracks SET listened = 1, listened_at = datetime('now') WHERE spotify_uri = ?", [prevUri]);
      dbRun(
        "UPDATE stats SET total_listened = total_listened + 1, listened_this_month = listened_this_month + 1, listened_this_year = listened_this_year + 1, total_listened_ms = total_listened_ms + ? WHERE id = 1",
        [durMs]
      );
      recordListen(); // journal persistant (graphique) â€” survit Ã  la purge
      saveDB().catch(() => {});
      setListenStats(loadListenStatsFromDB());
      setHistory(loadHistoryFromDB());
    } catch {
      listenedUrisRef.current.delete(prevUri);
      return;
    }

    setFeed(F => F.map(f => f.spotifyUri === prevUri ? { ...f, removing: true } : f));
    setTimeout(() => setFeed(F2 => F2.filter(f => f.spotifyUri !== prevUri)), 600);
  }, [now?.uri, dbReady]);

  // â”€â”€ DÃ©tecter fin de titre (â‰¤ 3s restantes) â†’ passer au suivant â”€â”€
  React.useEffect(() => {
    if (!now) { prevPositionRef.current = 0; prevDurationRef.current = 0; return; }

    const prevPos = prevPositionRef.current;
    const prevDur = prevDurationRef.current;
    prevPositionRef.current = now.current;
    prevDurationRef.current = now.duration;

    if (loopEnabledRef.current) return;

    // Restart detection (mÃªme titre qui repart du dÃ©but).
    // âš  Garde anti-vol de lecture : n'avancer QUE si le tick prÃ©cÃ©dent portait dÃ©jÃ  la
    // MÃŠME URI (vrai rebouclage Spotify). Sans Ã§a, un changement de titre ou un seek manuel
    // au dÃ©but d'un titre dÃ©clenchait playTrack et Ã©crasait le choix de l'utilisateur.
    const sameUriRestart = prevNowRef.current.uri === now.uri;
    if (sameUriRestart && now.duration > 15 && now.current < 5 && prevPos > prevDur - 10 && prevDur > 0) {
      const f = filteredFeedRef.current;
      const idx = filteredFeedIndexRef.current.get(now.uri) ?? -1;

function useIsMobile(bp = 820) {

  // alors Ã  ~980px et `innerWidth < bp` seul basculait l'app en layout desktop sur
  // tÃ©lÃ©phone. Garde supplÃ©mentaire : appareil TACTILE Ã  petit Ã©cran PHYSIQUE

function SeekBar({ now }) {
  const { seek } = useStore();
  const barRef   = React.useRef(null);
  const [hover,    setHover]    = React.useState(false);
  const [dragging, setDragging] = React.useState(false);
  const [localPct, setLocalPct] = React.useState(null);

  const getPct = (clientX) => {
    const r = barRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(100, ((clientX - r.left) / r.width) * 100));
  };

  const startDrag = (clientX) => {
    setDragging(true);
    setLocalPct(getPct(clientX));
  };
  const onMouseDown = (e) => {
    e.preventDefault();
    startDrag(e.clientX);
    const onMove = (ev) => setLocalPct(getPct(ev.clientX));
    const onUp   = (ev) => {
      const p = getPct(ev.clientX);
      setDragging(false); setLocalPct(null);
      seek((p / 100) * now.duration * 1000);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup',   onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup',   onUp);
  };
  const onTouchStart = (e) => {
    e.preventDefault();
    startDrag(e.touches[0].clientX);
    const onMove = (ev) => setLocalPct(getPct(ev.touches[0].clientX));
    const onEnd  = (ev) => {
      const p = getPct(ev.changedTouches[0].clientX);
      setDragging(false); setLocalPct(null);
      seek((p / 100) * now.duration * 1000);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend',  onEnd);
    };
    window.addEventListener('touchmove', onMove, { passive:false });
    window.addEventListener('touchend',  onEnd);
  };

  const pct       = (dragging && localPct !== null) ? localPct : (now.current / Math.max(now.duration, 1)) * 100;
  const showThumb = hover || dragging;

  return (
    <div ref={barRef}
      onMouseDown={onMouseDown}
      onTouchStart={onTouchStart}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{ flex:1, height:28, display:'flex', alignItems:'center', cursor:'pointer', position:'relative', userSelect:'none', touchAction:'none' }}>
      <div style={{ width:'100%', height: showThumb ? 4 : 3, background:'#2a2a2a', borderRadius:99, overflow:'visible', transition:'height 0.12s', position:'relative' }}>
        <div style={{ width:`${pct}%`, height:'100%', background:C.accent, borderRadius:99, transition: dragging ? 'none' : 'width 0.6s linear' }} />
      </div>
      <div style={{
        position:'absolute', left:`${pct}%`, top:'50%',
        transform:'translate(-50%, -50%)',
        width:13, height:13, borderRadius:'50%', background:'#fff',
        boxShadow:'0 1px 6px rgba(0,0,0,0.6)',
        opacity: showThumb ? 1 : 0,
        transition: dragging ? 'none' : 'opacity 0.12s',
        pointerEvents:'none',
      }} />
    </div>
  );
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function MobilePlayer() {
  const { now, feed, filteredFeed, filteredFeedIndex, loopEnabled, setLoopEnabled, seek, setTrackLiked, likedTracks, markListened } = useStore();
  const [isLiked, setIsLiked] = React.useState(false);

  // VÃ©rifier si le titre en cours est likÃ© â€” local d'abord, API seulement si inconnu
  React.useEffect(() => {
    const feedItem = now?.uri ? feed.find(f => f.spotifyUri === now.uri) : null;
    const inLocal  = likedTracks.some(t => t.spotifyUri === now?.uri) || !!feedItem?.liked;
    setIsLiked(inLocal);
    if (!now?.uri) return;
    // Titre connu localement (feed ou likÃ©s) : la DB fait foi, pas besoin d'une
    // requÃªte /me/library/contains Ã  chaque changement de titre
    if (feedItem || inLocal) return;
    libraryContains([now.uri])
      .then(data => { if (data) setIsLiked(data[0]); })
      .catch(() => {});
  }, [now?.uri]);

  if (!now) return null;

  const _cuMob = _effUri(now.uri);
  const currentIndex = _cuMob ? (filteredFeedIndex.get(_cuMob) ?? -1) : -1;
  const hasFeed      = filteredFeed.length > 0;

  const togglePlayPause = async () => {
    if (now.playing) await apiPut('https://api.spotify.com/v1/me/player/pause');
    else             await apiPut('https://api.spotify.com/v1/me/player/play');
  };
  const prevTrack = async () => {
    const idx = currentIndex > 0 ? currentIndex - 1 : filteredFeed.length - 1;
    if (filteredFeed[idx]) await playTrack(filteredFeed[idx].spotifyUri);
  };
  const nextTrack = async () => {
    // URI du titre quittÃ© (avant calcul du suivant) : on le retire tout de suite, sans
    // attendre le poll 5s. Couvre le double-clic rapide oÃ¹ now.uri saute le titre intermÃ©diaire.
    const leaving = currentIndex >= 0 ? filteredFeed[currentIndex]?.spotifyUri : null;
    const idx = currentIndex >= 0 && currentIndex < filteredFeed.length - 1 ? currentIndex + 1 : 0;
    if (!filteredFeed[idx]) return;
    await playTrack(filteredFeed[idx].spotifyUri);
    const dur = filteredFeed[idx].duration_ms;
    if (dur > 0) setTimeout(() => seek(Math.floor(dur * 0.25)), 400);
    if (leaving) markListened(leaving);
  };
  const toggleLoop = async () => {
    const next = !loopEnabled;
    setLoopEnabled(next);
    await apiPut(`https://api.spotify.com/v1/me/player/repeat?state=${next ? 'track' : 'off'}`);
  };
  const toggleLike = async () => {
    if (!now.uri) return;
    if (isLiked) {
      const res = await libraryRemove(now.uri);
      if (libraryWriteFailed(res)) return;
      setIsLiked(false);
      setTrackLiked(now.uri, false);
    } else {
      const res = await librarySave(now.uri);
      if (libraryWriteFailed(res)) return;
      setIsLiked(true);
      setTrackLiked(now.uri, true);
    }
  };

  const btnCtrl = { background:'none', border:'none', cursor:'pointer', padding:10, display:'flex', alignItems:'center', justifyContent:'center' };

  return (
    <div style={{ height:'25vh', minHeight:160, background:'linear-gradient(180deg,#131313 0%,#0a0a0a 100%)', borderTop:`1px solid ${C.border}`, display:'flex', flexDirection:'column', padding:'10px 20px 16px', flexShrink:0, gap:6 }}>

      {/* Pochette + titre + artiste + position + like */}
      <div style={{ display:'flex', alignItems:'center', gap:14, flex:1, minHeight:0 }}>
        <AlbumArt size={80} letter={(now.title||'?')[0]} color={C.accent} image={now.image} />
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:15, fontWeight:700, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', color:C.text }}>{now.title}</div>
          <div style={{ fontSize:12, color:C.muted, marginTop:3, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{now.artist}</div>
          {currentIndex >= 0 && (
            <div style={{ fontSize:10, color:C.dim, fontFamily:'DM Mono,monospace', marginTop:5 }}>{currentIndex + 1} / {filteredFeed.length}</div>
          )}
        </div>
        {/* Bouton +1min */}
        <button onClick={() => seek(Math.min((now.current + 60) * 1000, now.duration * 1000 - 2000))}
          style={{ ...btnCtrl, flexShrink:0 }}>
          <span style={{ fontSize:11, fontWeight:700, color:C.muted, fontFamily:'DM Mono,monospace', letterSpacing:'-0.03em' }}>+1:00</span>
        </button>
        {/* Bouton Like */}
        <button onClick={toggleLike} style={{ ...btnCtrl, flexShrink:0 }}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill={isLiked ? '#e05050' : 'none'} stroke={isLiked ? '#e05050' : C.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
      </div>

      {/* Barre de progression */}
      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
        <span style={{ fontSize:10, color:C.dim, fontFamily:'DM Mono,monospace', width:32, textAlign:'right', flexShrink:0 }}>{fmt(now.current)}</span>
        <SeekBar now={now} />
        <span style={{ fontSize:10, color:C.dim, fontFamily:'DM Mono,monospace', width:32, flexShrink:0 }}>{fmt(now.duration)}</span>
      </div>

      {/* ContrÃ´les */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:16 }}>
        <button onClick={prevTrack} style={{ ...btnCtrl, opacity: hasFeed ? 1 : 0.3 }}>
          <svg width="26" height="26" viewBox="0 0 16 16" fill={C.muted}><rect x="1" y="1" width="2" height="14" rx="1"/><path d="M13 1L4 8l9 7V1z"/></svg>
        </button>
        <button onClick={togglePlayPause} style={{ width:56, height:56, borderRadius:'50%', background:C.accent, border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
          {now.playing
            ? <svg width="16" height="18" viewBox="0 0 12 14" fill="#000"><rect x="0" y="0" width="4" height="14" rx="1"/><rect x="8" y="0" width="4" height="14" rx="1"/></svg>
            : <svg width="16" height="18" viewBox="0 0 12 14" fill="#000"><path d="M1 0l11 7-11 7V0z"/></svg>}
        </button>
        <button onClick={nextTrack} style={{ ...btnCtrl, opacity: hasFeed ? 1 : 0.3 }}>
          <svg width="26" height="26" viewBox="0 0 16 16" fill={C.muted}><rect x="13" y="1" width="2" height="14" rx="1"/><path d="M3 1l9 7-9 7V1z"/></svg>
        </button>
        {/* Bouton Loop / Auto-avance */}
        <button onClick={toggleLoop} style={{ ...btnCtrl }} title={loopEnabled ? 'Passer Ã  la suivante' : 'Relancer en boucle'}>
          {loopEnabled
            ? /* IcÃ´ne boucle active (accent) */
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                <text x="9" y="15" fontSize="7" fill={C.accent} stroke="none" fontWeight="bold">1</text>
              </svg>
            : /* IcÃ´ne auto-avance (muted) */
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
              </svg>
          }
        </button>
      </div>
    </div>
  );
}

  const s = useStore();
  const total = Math.max(s.stats.total, 1);
  const pct   = (s.stats.artists / total) * 100;

    ? ((s.paused || s.rlWaiting) ? 'EN PAUSE' : 'EN COURS')

  // Countdown quota 24h re-rendu chaque seconde tant que la fenÃªtre est active (horloge partagÃ©e)
  useSharedTick(s.quotaUntil > Date.now());
  const quotaLeft = s.quotaUntil > Date.now() ? s.quotaUntil - Date.now() : 0;

  return (
    <div style={{ borderRadius:10, background:C.surface, border:`1px solid ${C.border}`, padding: compact?'10px 12px':'14px 16px' }}>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap: compact?6:10, marginBottom: compact?10:14 }}>

          ['Artistes', s.stats.total ? `${s.stats.artists}/${s.stats.total}` : s.stats.artists, C.accent, `${s.dailyScrapings}/100`],
          ['Sorties',  s.stats.releases, C.accent, null],
          ['Titres',   s.stats.tracks,   C.accent, null],
        ].map(([lbl, val, color, sub]) => (
          <div key={lbl} style={{ background:C.surfaceHigh, border: compact?'none':`1px solid ${C.border}`, borderRadius: compact?6:8, padding: compact?'8px 6px':'12px 14px', textAlign: compact?'center':'left' }}>
            <div style={{ fontSize: compact?14:24, fontWeight:700, color, fontFamily:'DM Mono,monospace', lineHeight:1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{val}</div>

          â³ Quota de 100 artistes atteint<br/>Prochaine synchro le <b>{fmtQuotaWhen(s.quotaUntil)}</b> (dans {fmtRemaining(quotaLeft)})

      <div style={{ marginTop: compact?8:10, display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>

        )}

function DateRangePanel({ compact=false }) {
  const s = useStore();
  const hasResume = !s.scraping && s.resumableSession;

  const blocked = s.blockedUntil > Date.now();
  const quotaBlocked = s.quotaUntil > Date.now();
  const anyBlock = blocked || quotaBlocked;
  useSharedTick(Math.max(s.blockedUntil, s.quotaUntil) > Date.now());
  const blockedMin = blocked ? Math.ceil((s.blockedUntil - Date.now()) / 60000) : 0;

  const onLancer = () => {
    if (hasResume) {
      if (!confirm('ÃŠtes-vous sÃ»r de vouloir recommencer la synchro de 0 ?\nLa progression en cours sera perdue.')) return;

    s.startSync();

          â³ Quota de 100 artistes atteint â€” prochaine synchro le <b>{fmtQuotaWhen(s.quotaUntil)}</b> (dans {fmtRemaining(s.quotaUntil - Date.now())})

          </div>

      <div style={{ display:'flex', gap: compact?8:6 }}>
        <button onClick={onLancer} disabled={s.scraping || anyBlock}
          style={{ flex:2, background: hasResume ? '#2a1a1a' : C.accent, border: hasResume ? '1px solid #5a2a2a' : 'none', borderRadius:6, padding: compact?'8px 0':'7px 0', cursor: (s.scraping || anyBlock)?'default':'pointer', color: hasResume ? '#c05050' : '#000', fontSize:11, fontWeight:700, opacity: (s.scraping || anyBlock)?0.6:1 }}>
          {s.scraping ? 'â–¶ En coursâ€¦' : hasResume ? 'â†º Recommencer la synchro de 0' : 'â–¶ Lancer la synchronisation'}
        </button>
        {s.scraping && (
          <button onClick={s.togglePause}
            style={{ flex:1, background:`${C.accent}18`, border:`1px solid ${C.accent}40`, borderRadius:6, padding: compact?'8px 0':'7px 0', cursor:'pointer', color:C.accent, fontSize:11, fontWeight:700 }}>
            {s.paused ? 'â–¶ Reprendre' : 'â¸ Pause'}
          </button>
        )}
      </div>
    </div>
  );
}

      )}
      {s.scraping && (() => {
        // Artistes restants dans la session du jour (max 100), MAIS plafonnÃ© au nombre
        // d'artistes qu'il reste rÃ©ellement Ã  scanner : si l'utilisateur suit < 100 artistes,
        // la session se termine avant d'atteindre le quota, l'ETA ne doit pas le surestimer.
        const quotaLeft   = Math.max(0, 100 - s.dailyScrapings);
        const followLeft  = s.stats.total > 0 ? Math.max(0, s.stats.total - s.stats.artists) : quotaLeft;
        const remainingToday = Math.min(quotaLeft, followLeft);

        // DÃ©lai moyen = dÃ©lai choisi + jitter moyen (2s)
        const avgMs = s.delayChoice * 1000 + 2000;
        const totalSec = Math.ceil((remainingToday * avgMs) / 1000);
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const sec = totalSec % 60;
        const label = (h > 0 ? `${h}h ` : '') + (m > 0 || h > 0 ? `${m}m ` : '') + `${sec}s`;
        return (
          <div style={{ display:'flex', justifyContent:'space-between', marginTop:4, fontSize:10, color:C.muted }}>
            <span>Temps total de la session</span>
            <span style={{ fontFamily:'DM Mono,monospace', color:C.accent }}>{label}</span>
          </div>
        );
      })()}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:10, paddingTop:8, borderTop:`1px solid ${C.border}` }}>
        <span style={{ fontSize:10, color:C.dim, letterSpacing:'0.07em', fontWeight:700 }}>DÃ‰LAI ENTRE ARTISTES</span>
        <select
          value={s.delayChoice}

          style={{ background:'#111', border:`1px solid ${C.accent}44`, borderRadius:6, padding:'3px 8px', fontSize:11, fontFamily:'DM Mono,monospace', color:C.accent, outline:'none', cursor:'pointer' }}>
          <option value={10}>10s</option>
          <option value={20}>20s</option>

    </div>
  );
}

// Curseur de navigation optimiste : le poll player n'interroge Spotify que toutes les 5s,
// donc `now.uri` reste pÃ©rimÃ© jusqu'Ã  5s aprÃ¨s un clic suivant/prÃ©cÃ©dent. Un 2e clic rapide
// recalculerait alors la position courante sur l'ANCIEN titre et relancerait le mÃªme titre.
// On mÃ©morise donc le dernier URI jouÃ© (timestamp) et on le prÃ©fÃ¨re Ã  `now.uri` tant que le
// poll ne l'a pas rattrapÃ© (fenÃªtre = poll 5s + marge). _effUri(pollUri) renvoie l'URI rÃ©el
// en cours de lecture pour le calcul de currentIndex dans tous les players.
let _navUri = null;
let _navAt  = 0;
function _effUri(pollUri) {
  if (_navUri && Date.now() - _navAt < 6500) return _navUri;
  return pollUri || null;
}

async function playTrack(spotifyUri) {
  if (!spotifyUri) return;
  _navUri = spotifyUri;
  _navAt  = Date.now();
  const result = await apiPut('https://api.spotify.com/v1/me/player/play', { uris: [spotifyUri] });
  if (result?.error === 'no_active_device') alert('Aucun appareil Spotify actif. Ouvre Spotify d\'abord.');
  if (result?.error === 'forbidden')        alert('Lecture impossible â€” compte Spotify Free ?');
}

const EXPORT_SECTIONS = [
  { key:'tous',     label:'Tous',         icon:'ðŸ“¦', hint:'sauvegarde complÃ¨te',        fields:null },
  { key:'artistes', label:'Artistes',     icon:'ðŸŽ¤', hint:'dates de scan + compteurs',  fields:['artists'] },

  { key:'maps',     label:'Maps',         icon:'ðŸ—ºï¸', hint:'trajets Google Timeline',    fields:['maps'] },

// TÃ©lÃ©charge la sauvegarde en JSON. `section` = entrÃ©e d'EXPORT_SECTIONS (dÃ©faut : Tous).
// Retourne l'objet (rÃ©utilisÃ© par la proposition hebdo).
function downloadBackup(section) {
  const fields = (section && section.fields) || null;
  const full = buildBackup();
  let data = full;
  if (fields) {
    data = { app: full.app, version: full.version, exported_at: full.exported_at, scope: fields };
    for (const f of fields) data[f] = full[f];
  }
  const file = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url  = URL.createObjectURL(file);
  const a    = document.createElement('a');
  a.href = url;
  const day = new Date().toISOString().slice(0, 10);
  a.download = fields ? `spotifyplus-${section.key}-${day}.json` : `spotifyplus-sauvegarde-${day}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);

// â”€â”€ Fusion TV Time (import) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// ClÃ© d'un item : type + id (un id TMDB peut coexister en movie/tv, YouTube Ã  part).
function _tvItemKey(it) { return (it && it.type ? it.type : 'tv') + ':' + (it ? it.id : ''); }
// Rang de progression d'un statut â€” le plus avancÃ© gagne Ã  la fusion.
function _tvStatusRank(s) { return { towatch: 0, paused: 1, watching: 2, done: 3 }[s] ?? 0; }
// Fusionne deux versions d'un mÃªme item (a = local, b = importÃ©) SANS perdre de progression :
// mÃ©tadonnÃ©es de la version la plus fraÃ®che (refreshedAt), progression = la plus avancÃ©e
// (watchedEps max, union des spÃ©ciaux/vidÃ©os vues, statut le plus avancÃ©, addedAt le plus ancien).
function mergeTvItem(a, b) {
  const aFresh = a.refreshedAt || 0, bFresh = b.refreshedAt || 0;
  const base = bFresh > aFresh ? { ...a, ...b } : { ...b, ...a };
  base.status = _tvStatusRank(a.status) >= _tvStatusRank(b.status) ? a.status : b.status;
  // Progression Ã©pisodes = UNION des ensembles vus (cochage individuel) â€” jamais de rÃ©gression
  if (a.watchedSet || b.watchedSet || a.watchedEps != null || b.watchedEps != null) {
    const u = [...new Set([...tvWatchedSet(a), ...tvWatchedSet(b)])];
    base.watchedSet = u;
    base.watchedEps = Math.max(u.length, a.watchedEps || 0, b.watchedEps || 0);
  }
  const sp = new Set([...(a.specialsSeen || []), ...(b.specialsSeen || [])]);
  if (sp.size) base.specialsSeen = [...sp].sort((x, y) => x - y);
  const wid = new Set([...(a.watchedIds || []), ...(b.watchedIds || [])]);
  if (wid.size) base.watchedIds = [...wid];
  const added = Math.min(a.addedAt || Infinity, b.addedAt || Infinity);
  if (isFinite(added)) base.addedAt = added;
  base.manga = !!(a.manga || b.manga);
  base.cartoon = !!(a.cartoon || b.cartoon);
  if (a.dropped || b.dropped) base.dropped = true;         // Â« ne plus suivre Â» conservÃ© Ã  la fusion
  if (a.unlimited || b.unlimited) base.unlimited = true;   // plafond 500 retirÃ© : on garde le plus permissif
  if (a.keepShorts || b.keepShorts) base.keepShorts = true; // tag Â« garder les Shorts Â» : on garde le plus permissif
  if (base.status === 'done') base.doneAt = a.doneAt || b.doneAt || Date.now();
  else delete base.doneAt;
  return base;
}
// Fusion d'une liste TV Time importÃ©e dans la liste locale (union par clÃ©, items communs fusionnÃ©s).
function mergeTvImport(current, incoming) {
  const byKey = new Map();
  for (const it of (Array.isArray(current) ? current : [])) if (it && it.id != null) byKey.set(_tvItemKey(it), it);
  for (const it of (Array.isArray(incoming) ? incoming : [])) {
    if (!it || it.id == null) continue;
    const k = _tvItemKey(it);
    byKey.set(k, byKey.has(k) ? mergeTvItem(byKey.get(k), it) : it);
  }
  return [...byKey.values()];
}

// Restaure une sauvegarde produite par buildBackup() (export local ou Dropbox).
// - artists_scraped : UPSERT prudent â€” la date de scan locale n'est JAMAIS rÃ©gressÃ©e
//   (MAX des deux), les cumuls scan_count/total_tracks_added sont fusionnÃ©s au MAX.
// - stats : appareil vierge (total_listened = 0) â†’ reprise intÃ©grale ; sinon fusion
//   prudente des compteurs cumulÃ©s uniquement (pas les compteurs mois/annÃ©e, liÃ©s aux
//   marqueurs de reset locaux).
// - todos / todos_done / rappels / remembers : REMPLACÃ‰S par la sauvegarde (si prÃ©sents).
// - tvtime : FUSIONNÃ‰ â€” union par clÃ© (type+id), progression la plus avancÃ©e conservÃ©e.
// - finance (historique local des prix) : FUSIONNÃ‰ â€” union par sÃ©rie, jamais Ã©crasÃ©.
// - music (table `tracks`) : UPSERT prudent â€” pistes du feed (en attente) + historique
//   restaurÃ©es, Ã©tat Ã©coutÃ©/likÃ© jamais rÃ©gressÃ© (MAX), listened_at conservÃ©.
function applyBackup(data) {
  if (!data || data.app !== 'spotifyplus') throw new Error('format invalide');
  let artistsRestored = 0, statsRestored = false;
  for (const a of (Array.isArray(data.artists) ? data.artists : [])) {
    if (!a?.spotify_id || !a?.last_scraped_at) continue;
    try {
      dbRun(
        `INSERT INTO artists_scraped (spotify_id, last_scraped_at, name, last_release_count, total_tracks_added, last_scan_status, scan_count)
         VALUES (?, ?, ?, ?, ?, ?, ?)
         ON CONFLICT(spotify_id) DO UPDATE SET
           last_scraped_at    = MAX(last_scraped_at, excluded.last_scraped_at),
           name               = COALESCE(name, excluded.name),
           last_release_count = MAX(last_release_count, excluded.last_release_count),
           total_tracks_added = MAX(total_tracks_added, excluded.total_tracks_added),
           scan_count         = MAX(scan_count, excluded.scan_count)`,
        [a.spotify_id, a.last_scraped_at, a.name || null, a.last_release_count || 0,
         a.total_tracks_added || 0, a.last_scan_status || null, a.scan_count || 0]
      );
      artistsRestored++;
    } catch {}
  }
  const b = data.stats;
  if (b && typeof b === 'object') {
    try {
      const local = dbGet("SELECT total_listened FROM stats WHERE id = 1");
      if (!local?.total_listened) {
        dbRun(
          "UPDATE stats SET total_listened = ?, listened_this_month = ?, listened_this_year = ?, last_reset_month = ?, last_reset_year = ?, total_listened_ms = ?, total_liked = ? WHERE id = 1",
          [b.total_listened || 0, b.listened_this_month || 0, b.listened_this_year || 0,
           b.last_reset_month || null, b.last_reset_year || null, b.total_listened_ms || 0, b.total_liked || 0]
        );
      } else {
        dbRun(
          "UPDATE stats SET total_listened = MAX(total_listened, ?), total_listened_ms = MAX(total_listened_ms, ?), total_liked = MAX(total_liked, ?) WHERE id = 1",
          [b.total_listened || 0, b.total_listened_ms || 0, b.total_liked || 0]
        );
      }
      statsRestored = true;
    } catch {}
  }
  // Musique : restaure les pistes (feed en attente + historique). UPSERT prudent â€”
  // une piste existante n'est jamais rÃ©gressÃ©e (listened/liked au MAX, listened_at conservÃ©).
  let musicRestored = 0;
  for (const t of (Array.isArray(data.music) ? data.music : [])) {
    if (!t?.spotify_uri || !t?.artist_name || !t?.title) continue;
    try {
      dbRun(
        `INSERT INTO tracks (spotify_uri, artist_name, title, release_title, release_type, release_date, cover_url, duration_ms, listened, liked, listened_at, added_at)
         VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, COALESCE(?, datetime('now')))
         ON CONFLICT(spotify_uri) DO UPDATE SET
           listened    = MAX(listened, excluded.listened),
           liked       = MAX(liked, excluded.liked),
           listened_at = COALESCE(listened_at, excluded.listened_at)`,
        [t.spotify_uri, t.artist_name, t.title, t.release_title || null, t.release_type || null,
         t.release_date || null, t.cover_url || null, t.duration_ms || null,
         t.listened ? 1 : 0, t.liked ? 1 : 0, t.listened_at || null, t.added_at || null]
      );
      musicRestored++;
    } catch {}
  }
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  if (Array.isArray(data.todos))      put('spotifyplus_todos', data.todos);
  if (Array.isArray(data.todos_done)) put('spotifyplus_todos_done', data.todos_done);
  // Journal d'Ã©coutes (graphique) â€” FUSIONNÃ‰ : union des timestamps (dÃ©dup), tri, cap 5000
  if (Array.isArray(data.listens)) {
    try {
      const cur = loadListenLog();
      const seen = new Set(cur.map(e => e && e.ts));
      const merged = cur.concat(data.listens.filter(e => e && typeof e.ts === 'number' && !seen.has(e.ts)))
        .sort((a, b) => a.ts - b.ts);
      saveListenLog(merged);
    } catch {}
  }
  if (data.rappels && typeof data.rappels === 'object') put('spotifyplus_rappels', data.rappels);
  if (data.rappels_time && typeof data.rappels_time === 'object') put('spotifyplus_rappels_time', data.rappels_time);
  if (Array.isArray(data.remembers))  put('spotifyplus_remember_custom', data.remembers);
  // TV Time â€” FUSIONNÃ‰ avec la liste locale (union par type+id, progression la plus avancÃ©e conservÃ©e)
  if (Array.isArray(data.tvtime)) {
    try { saveTvItems(mergeTvImport(loadTvItems(), data.tvtime)); }
    catch { put('spotifyplus_tvtime', data.tvtime); _tvItemsCache = null; } // Ã©criture directe â†’ invalide le cache mÃ©moire
  }
  // ClÃ© API TMDB : chaÃ®ne brute (PAS de JSON.stringify â€” tmdbKey() la lit telle quelle)
  if (typeof data.tmdb_key === 'string' && data.tmdb_key.trim()) {
    try { localStorage.setItem('spotifyplus_tmdb_key', data.tmdb_key.trim()); } catch {}
  }
  // ClÃ© API YouTube Data v3 : chaÃ®ne brute (ytKey() la lit telle quelle)
  if (typeof data.yt_key === 'string' && data.yt_key.trim()) {
    try { localStorage.setItem(YT_KEY_LS, data.yt_key.trim()); } catch {}
  }
  if (data.maps && typeof data.maps === 'object') { put('spotifyplus_maps', data.maps); _mapsCache = null; }
  // Bon Plan â€” jeux suivis FUSIONNÃ‰S : union par gameID, l'entrÃ©e locale gagne
  // (elle a le lastPrice/lastCheck le plus frais), les jeux absents sont ajoutÃ©s.
  if (Array.isArray(data.bonplan)) {
    try {
      const local = loadCmpWatch();
      const have = new Set(local.map(w => String(w.gameID)));
      const merged = local.concat(data.bonplan.filter(w => w && w.gameID && !have.has(String(w.gameID))));
      saveCmpWatch(merged);
    } catch {}
  }
  // Nourriture â€” profil REMPLACÃ‰ si prÃ©sent ; totaux quotidiens FUSIONNÃ‰S : un jour dÃ©jÃ 
  // suivi localement garde sa valeur locale (elle a le dÃ©tail des repas), les jours
  // absents sont complÃ©tÃ©s par la sauvegarde. La composition des repas n'est jamais
  // dans l'export â†’ rien Ã  restaurer pour spotifyplus_food_meals.
  if (data.food && typeof data.food === 'object') {
    if (data.food.profile && typeof data.food.profile === 'object') put(FOOD_PROFILE_KEY, data.food.profile);
    if (data.food.days && typeof data.food.days === 'object') {
      try {
        const local = loadFoodDays();
        const merged = { ...data.food.days, ...local };
        saveFoodDays(merged);
      } catch {}
    }
  }
  // (l'ancienne clÃ© yt_watchlater â€” liste locale Â« Ã  regarder plus tard Â» â€” est ignorÃ©e :
  // le bouton ðŸ•’ Ã©crit dÃ©sormais directement dans la playlist YouTube du compte)
  // ParamÃ©trage des modules (activÃ©s/dÃ©sactivÃ©s) â€” REMPLACÃ‰ si prÃ©sent
  if (data.modules && typeof data.modules === 'object' && !Array.isArray(data.modules)) put(MODULES_LS_KEY, data.modules);
  // Finance : historique local des prix â€” FUSIONNÃ‰ (pas remplacÃ©) : union par sÃ©rie,
  // tri par date, densitÃ© bornÃ©e (â‰¥ 30 min entre 2 points), cap FIN_HIST_MAX_PTS.
  // Un backup d'un autre appareil COMPLÃˆTE donc l'historique local sans l'Ã©craser.
  if (data.finance && typeof data.finance === 'object' && data.finance.series && typeof data.finance.series === 'object') {
    try {
      const h = loadFinHist();
      for (const k of Object.keys(data.finance.series)) {
        const arr = data.finance.series[k];
        if (!Array.isArray(arr)) continue;
        const merged = (h.series[k] || [])
          .concat(arr.filter(p => p && p.t != null && p.v != null && !isNaN(p.v)))
          .sort((a, b) => a.t - b.t);
        const out = [];
        for (const p of merged) if (!out.length || p.t - out[out.length - 1].t >= FIN_HIST_MIN_MS) out.push(p);
        h.series[k] = out.slice(-FIN_HIST_MAX_PTS);
      }
      saveFinHist();
    } catch {}
  }
  // Coffre MDP : blob chiffrÃ© â€” copie de secours de l'existant avant remplacement
  // (mÃªme filet que l'import de GestionMdpPanel : spotifyplus_mdp_vault_prev)
  if (isVaultBlob(data.mdp_vault)) {
    const existing = loadVaultBlob();
    if (existing) { try { localStorage.setItem('spotifyplus_mdp_vault_prev', JSON.stringify(existing)); } catch {} }
    saveVaultBlob(data.mdp_vault);
  }
  return { artistsRestored, statsRestored, musicRestored };
}
