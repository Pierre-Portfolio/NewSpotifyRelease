                )}
              </div>
            );
          })}
        </div>
        <div style={{ fontSize:9, color:C.dim, fontStyle:'italic', lineHeight:1.5, marginTop:10 }}>
          ℹ Les vidéos sont regroupées par année de publication (une « saison » = une année). Chaque vidéo se coche indépendamment. Les vidéos vues et leur durée alimentent les statistiques TV Time. Le bouton ↻ récupère les nouvelles vidéos via l'API YouTube.
        </div>
      </div>
    </div>
  );
}

function TvTimePanel() {
  const [items, setItems]     = React.useState(loadTvItems);
  const [query, setQuery]     = React.useState('');
  const [searchFocused, setSearchFocused] = React.useState(false); // n'affiche les filtres de recherche que quand l'input a le focus
  const [results, setResults] = React.useState(null); // null = pas de résultats affichés (tableau complet fetché, toutes pages)
  const [busy, setBusy]       = React.useState(false);
  // Pagination « lazy load » de la recherche : on n'affiche que `visibleCount` résultats
  // et « Voir plus » récupère la page TMDB suivante à la demande (au-delà des 8 premiers)
  const [visibleCount, setVisibleCount] = React.useState(8);
  const [searchMeta, setSearchMeta]     = React.useState(null); // { q, type, page, totalPages }
  const [loadingMore, setLoadingMore]   = React.useState(false);
  const [refreshing, setRefreshing] = React.useState(false);
  const [showKey, setShowKey] = React.useState(false);
  const [keyInput, setKeyInput] = React.useState('');
  // YouTube (chaînes/playlists par lien) — clé API séparée + widget d'ajout
  const [ytInput, setYtInput]     = React.useState('');
  const [ytBusy, setYtBusy]       = React.useState(false);
  const [ytMsg, setYtMsg]         = React.useState('');
  const [showYtKey, setShowYtKey] = React.useState(false);
  const [ytKeyInput, setYtKeyInput] = React.useState('');
  const [ytRefreshingId, setYtRefreshingId] = React.useState(null);
  const hasYtKey = !!ytKey();
  // Sections repliables (header cliquable + chevron) — seule EN COURS ouverte par défaut
  const [secOpen, setSecOpen] = React.useState({ watching: true, paused: false, towatch: false, upcoming: false, done: false, ytWatching: true, ytTowatch: false, ytDone: false });
  const toggleSec = k => setSecOpen(o => ({ ...o, [k]: !o[k] }));
  // Fiche série ouverte au clic sur l'affiche — { type, id } ; l'item est relu dans `items`
  // à chaque render pour que la fiche reflète les ±1 / coches saison en direct
  const [detail, setDetail] = React.useState(null);
  const detailItem = detail ? items.find(it => it.type === detail.type && it.id === detail.id) : null;
  // Fiche ouverte au clic sur l'affiche d'un RÉSULTAT DE RECHERCHE non encore enregistré :
  // item complet récupéré à la volée (1 requête TMDB), affiché tel quel. La 1re action
  // (statut, ± épisode, coche) l'ajoute à la liste (commitPreview) puis bascule sur sa vraie fiche.
  const [preview, setPreview] = React.useState(null);
  const [previewLoading, setPreviewLoading] = React.useState(false);
  // Filtre Films/Séries persisté — 'all' | 'movie' | 'tv'
  const [mediaFilter, setMediaFilter] = React.useState(() => {
    try { const v = localStorage.getItem(TVTIME_FILTER_LS); return (v === 'movie' || v === 'tv' || v === 'youtube') ? v : 'all'; } catch { return 'all'; }
  });
  const pickFilter = f => { setMediaFilter(f); try { localStorage.setItem(TVTIME_FILTER_LS, f); } catch {} };
  // Tri des listes (persisté) + filtre texte sur le nom (non persisté) — appliqués aux
  // sections En cours / À voir / Vus (Prochaines sorties garde son tri par date de diffusion)
  const [sortBy, setSortBy] = React.useState(() => {
    try { const v = localStorage.getItem(TVTIME_SORT_LS); return TVTIME_SORTS.some(s => s[0] === v) ? v : 'added_desc'; } catch { return 'added_desc'; }
  });
  const pickSort = v => { setSortBy(v); try { localStorage.setItem(TVTIME_SORT_LS, v); } catch {} };
  const [listFilter, setListFilter] = React.useState('');
  const hasKey = !!tmdbKey();

  // Pile d'annulation (en mémoire) : chaque action TV Time passe par `update`, qui empile
  // l'état PRÉCÉDENT → le bouton « retour en arrière » restaure le dernier état (cap 30).
  const [undoStack, setUndoStack] = React.useState([]);
  const update = next => { setUndoStack(s => [...s.slice(-29), items]); setItems(next); saveTvItems(next); };
  const undoLast = () => {
    setUndoStack(s => {
      if (!s.length) return s;
      const prev = s[s.length - 1];
      setItems(prev); saveTvItems(prev);
      return s.slice(0, -1);
    });
  };
  // Applique les champs frais du refresh SUR le dernier état persisté (une action utilisateur
  // pendant le refresh — ép. +1, ajout… — passe par update() qui sauvegarde : rien n'est perdu)
  const applyFresh = m => {
    if (!m || m.size === 0) return;
    const cur = loadTvItems();
    // Refresh (métadonnées auto) : PAS empilé dans l'annulation (ce n'est pas une action user)
    const next = cur.map(it => m.has(it.type + it.id) ? { ...it, ...m.get(it.type + it.id) } : it);
    setItems(next); saveTvItems(next);
  };

  // Refresh auto des prochaines sorties au montage (TTL 24h — 0 requête si cache frais)
  React.useEffect(() => {
    if (!hasKey) return;
    let cancelled = false;
    (async () => { const m = await tvRefreshShows(loadTvItems(), false); if (!cancelled) applyFresh(m); })();
    return () => { cancelled = true; };
  }, []);

  // YouTube : check des nouvelles vidéos au montage (TTL 6h par item — déjà lancé au login,
  // ici pour refléter dans un onglet TV Time déjà ouvert). Repasse en cours les séries « vues »
  // qui ont une nouvelle vidéo, puis recharge l'état local si quelque chose a changé.
  React.useEffect(() => {
    let cancelled = false;
    (async () => { const ch = await ytCheckNewVideos(); if (ch && !cancelled) setItems(loadTvItems()); })();
    return () => { cancelled = true; };
  }, []);

  const doRefresh = async () => {
    if (refreshing) return;
    setRefreshing(true);
    applyFresh(await tvRefreshShows(loadTvItems(), true));
    setRefreshing(false);
  };

  const saveKey = () => {
    const k = keyInput.trim();
    if (!k) return;
    try { localStorage.setItem(TMDB_KEY_LS, k); } catch {}
    setKeyInput(''); setShowKey(false);
  };
  const saveYtKey = () => {
    const k = ytKeyInput.trim();
    if (!k) return;
    try { localStorage.setItem(YT_KEY_LS, k); } catch {}
    setYtKeyInput(''); setShowYtKey(false); setYtMsg('Clé YouTube enregistrée ✓');
  };
  // Ajoute (ou met à jour) une chaîne / playlist YouTube depuis un lien
  const addYoutube = async () => {
    if (ytBusy) return;
    if (!ytKey()) { setYtMsg('Ajoute d\'abord ta clé API YouTube (bouton ⚙).'); setShowYtKey(true); return; }
    const raw = ytInput.trim();
    if (!raw) return;
    setYtBusy(true); setYtMsg('Récupération des vidéos… (peut prendre quelques secondes)');
    const built = await ytBuildItem(raw);
    setYtBusy(false);
    if (!built || built.error) { setYtMsg('⚠ ' + ((built && built.error) || 'Échec de la récupération.')); return; }
    const exist = items.find(x => x.type === 'youtube' && x.id === built.id);
    if (exist) {
      // Si l'existant avait le plafond retiré, on re-fetch sans limite pour ne pas régresser à 500
      let merged = built;
      if (exist.unlimited && !built.unlimited) {
        const full = await ytBuildItem(raw, { unlimited: true });
        if (full && !full.error) merged = full;
      }
      // Maj : nouvelles vidéos + métadonnées, mais on PRÉSERVE les vues / statut / manga / dessin animé / plafond
      update(items.map(x => (x.type === 'youtube' && x.id === built.id)
        ? { ...merged, watchedIds: x.watchedIds || [], status: x.status, doneAt: x.doneAt, manga: x.manga, cartoon: x.cartoon, dropped: x.dropped, addedAt: x.addedAt, unlimited: x.unlimited || merged.unlimited } : x));
      setYtMsg(`Mis à jour : ${merged.title} (${merged.totalEps} vidéos)`);
    } else {
      update([built, ...items]);
      setYtMsg(`Ajouté : ${built.title} (${built.totalEps} vidéos)`);
    }
    setYtInput('');
  };
  // Actualise une chaîne/playlist déjà suivie (bouton ↻ de la fiche) — préserve le plafond retiré
  const ytRefreshItem = async item => {
    if (ytRefreshingId) return;
    setYtRefreshingId(item.id);
    const built = await ytBuildItem(item.id, { unlimited: item.unlimited });
    setYtRefreshingId(null);
    if (!built || built.error) { setYtMsg('⚠ ' + ((built && built.error) || 'Échec de l\'actualisation.')); return; }
    update(items.map(x => (x.type === 'youtube' && x.id === item.id)
      ? { ...built, watchedIds: x.watchedIds || [], status: x.status, doneAt: x.doneAt, manga: x.manga, cartoon: x.cartoon, dropped: x.dropped, addedAt: x.addedAt, unlimited: x.unlimited || built.unlimited } : x));
  };
  // Retire le plafond de 500 vidéos pour CETTE chaîne : re-fetch complet (peut être long / coûteux en quota)
  const ytLoadAll = async item => {
    if (ytRefreshingId) return;
    if (!confirm(`Récupérer TOUTES les vidéos de « ${item.title} » (plus de plafond à 500) ?\n\nCela peut être long et consommer beaucoup de quota API + stockage local.`)) return;
    setYtRefreshingId(item.id);
    setYtMsg('Récupération de toutes les vidéos… (peut prendre du temps)');
    const built = await ytBuildItem(item.id, { unlimited: true });
    setYtRefreshingId(null);
    if (!built || built.error) { setYtMsg('⚠ ' + ((built && built.error) || 'Échec de la récupération.')); return; }
    update(items.map(x => (x.type === 'youtube' && x.id === item.id)
      ? { ...built, watchedIds: x.watchedIds || [], status: x.status, doneAt: x.doneAt, manga: x.manga, cartoon: x.cartoon, dropped: x.dropped, addedAt: x.addedAt } : x));
    setYtMsg(`Toutes les vidéos récupérées : ${built.title} (${built.totalEps} vidéos)`);
  };
  // Reverrouille une chaîne dont le plafond avait été retiré : ne conserve que les vidéos
  // COCHÉES (vues) + toutes celles de l'ANNÉE EN COURS ; supprime le reste (allège le stockage).
  const ytRelock = item => {
    const curYear = String(new Date().getFullYear());
    const seen = new Set(item.watchedIds || []);
    const kept = (item.videos || []).filter(v => seen.has(v.id) || (v.date || '').slice(0, 4) === curYear);
    if (!confirm(`Reverrouiller « ${item.title} » ?\n\nOn ne garde que les vidéos vues + celles de ${curYear} : ${kept.length} sur ${(item.videos || []).length} vidéos conservées, le reste est supprimé du suivi.`)) return;
    kept.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    const byYear = {};
    for (const v of kept) { const y = (v.date || '').slice(0, 4) || '—'; (byYear[y] = byYear[y] || []).push(v); }
    const seasons = Object.keys(byYear).sort().map(y => ({ n: y, eps: byYear[y].length }));
    const totalMin = kept.reduce((a, v) => a + (v.dur || 0), 0);
    const keptIds = new Set(kept.map(v => v.id));
    const watchedIds = (item.watchedIds || []).filter(id => keptIds.has(id));
    const totalEps = kept.length;
    let status = item.status, doneAt = item.doneAt;
    if (totalEps > 0) {
      if (watchedIds.length >= totalEps) { if (status !== 'done') { status = 'done'; doneAt = Date.now(); } }
      else if (status === 'done') { status = 'watching'; doneAt = undefined; }
    }
    update(items.map(x => (x.type === 'youtube' && x.id === item.id)
      ? { ...x, videos: kept, seasons, totalEps, epRuntime: totalEps ? Math.round(totalMin / totalEps) : 0,
          year: kept.length ? (kept[kept.length - 1].date || '').slice(0, 4) : x.year,
          watchedIds, status, doneAt, unlimited: false } : x));
    setYtMsg(`Chaîne reverrouillée : ${kept.length} vidéo(s) gardée(s) (vues + ${curYear}).`);
  };
  // Pose la liste des vidéos vues (cochage individuel) + statut auto done/en cours
  const ytSetWatched = (item, ids) => update(items.map(it => {
    if (it.type !== 'youtube' || it.id !== item.id) return it;
    const clean = [...new Set(ids)];
    const next = { ...it, watchedIds: clean };
    const tot = it.totalEps || (it.videos || []).length;
    if (tot > 0) {
      if (clean.length >= tot && it.status !== 'done') { next.status = 'done'; next.doneAt = Date.now(); }
      else if (clean.length < tot && it.status === 'done') next.status = 'watching';
    }
    return next;
  }));

  // Filtre de RECHERCHE Films/Séries — 'all' (« Les deux », défaut) | 'movie' | 'tv'.
  // Non persisté : repart sur « Les deux » à chaque montage. 'all' → /search/multi,
  // sinon /search/movie ou /search/tv (toujours 1 seule requête, résultats plus
  // pertinents qu'un filtrage client du multi).
  const [searchType, setSearchType] = React.useState('all');
  const search = async (typeArg = searchType) => {
    // Défensif : un onClick passe l'évènement en 1er argument → on ignore tout ce qui
    // n'est pas un type valide et on retombe sur le type sélectionné (sinon path = /search/tv)
    const type = (typeArg === 'all' || typeArg === 'movie' || typeArg === 'tv') ? typeArg : searchType;
    const q = query.trim();
    if (!q || busy) return;
    setBusy(true);
    const path = type === 'all' ? '/search/multi' : (type === 'movie' ? '/search/movie' : '/search/tv');
    const d = await tmdbGet(path, { query: q, include_adult: 'false' });
    // /search/movie et /search/tv ne renvoient pas media_type → on le pose depuis le filtre
    setResults(d ? (d.results || [])
      .map(r => ({ ...r, media_type: r.media_type || type }))
      .filter(r => r.media_type === 'movie' || r.media_type === 'tv') : []);
    setSearchMeta(d ? { q, type, page: 1, totalPages: d.total_pages || 1 } : null);
    setVisibleCount(8);   // on repart des 8 premiers à chaque nouvelle recherche
    setBusy(false);
  };
  // « Voir plus » : affiche 8 résultats de plus. Si tout le fetch courant est déjà affiché
  // et qu'il reste des pages TMDB, on récupère la page suivante à la demande (lazy load) —
  // permet de trouver un titre absent des 8 premiers résultats. Dédoublonnage par id+type.
  const loadMore = async () => {
    if (loadingMore) return;
    const next = visibleCount + 8;
    if (searchMeta && next > (results ? results.length : 0) && searchMeta.page < searchMeta.totalPages) {
      setLoadingMore(true);
      const path = searchMeta.type === 'all' ? '/search/multi' : (searchMeta.type === 'movie' ? '/search/movie' : '/search/tv');
      const d = await tmdbGet(path, { query: searchMeta.q, include_adult: 'false', page: searchMeta.page + 1 });
      setLoadingMore(false);
      const more = d ? (d.results || [])
        .map(r => ({ ...r, media_type: r.media_type || searchMeta.type }))
        .filter(r => r.media_type === 'movie' || r.media_type === 'tv') : [];
      setResults(prev => {
        const seen = new Set((prev || []).map(x => x.media_type + x.id));
        return [...(prev || []), ...more.filter(x => !seen.has(x.media_type + x.id))];
      });
      setSearchMeta(m => m ? { ...m, page: m.page + 1, totalPages: d ? (d.total_pages || m.totalPages) : m.totalPages } : m);
    }
    setVisibleCount(next);
  };
  const pickSearchType = t => {
    setSearchType(t);
    // Des résultats sont affichés → re-cherche immédiate avec le nouveau type
    if (results !== null && query.trim()) search(t);
  };

  const setStatus = (item, status) => update(items.map(it => {
    if (it.id !== item.id || it.type !== item.type) return it;
    // ✓ série terminée = tous les épisodes cochés (alimente les stats d'épisodes)
    const doneTv = status === 'done' && it.type === 'tv';
    const allKeys = doneTv ? tvAllKeys(it) : null;
    return {
      ...it, status,
      watchedSet: doneTv ? allKeys : it.watchedSet,
      watchedEps: doneTv ? (allKeys.length || it.totalEps || it.watchedEps || 0) : it.watchedEps,
      // ✓ chaîne/playlist YouTube terminée = toutes les vidéos cochées
      watchedIds: (status === 'done' && it.type === 'youtube') ? (it.videos || []).map(v => v.id) : it.watchedIds,
      doneAt: status === 'done' ? Date.now() : it.doneAt,
      // Repasser en actif (watching/towatch/paused) = re-suivre → on lève le drapeau « ne plus suivre »
      dropped: status === 'done' ? it.dropped : false,
    };
  }));
  // « Arrêter le visionnage » (depuis EN PAUSE) : passe en VUS mais CONSERVE la progression
  // actuelle — ne valide PAS les épisodes restants (contrairement au ✓ « tout vu »). Pose
  // `dropped` → la série est marquée « plus suivie » dans VUS (repasser en cours le lève).
  const abandonSeries = item => update(items.map(it => (it.id !== item.id || it.type !== item.type) ? it :
    { ...it, status: 'done', dropped: true, doneAt: Date.now() }));
  // « Arrêter de suivre » (chaînes YouTube — bouton ⏹ orange de la section YouTube EN COURS) :
  // passe en VUS avec la progression ACTUELLE (vidéos déjà vues, sans cocher les nouvelles) ET
  // pose `dropped` → la chaîne n'est plus vérifiée (ytCheckNewVideos la skippe) et ne resurgit
  // jamais avec de nouvelles vidéos. Équivalent du flux séries « en pause → arrêter le visionnage ».
  const unfollow = item => update(items.map(it => (it.id !== item.id || it.type !== item.type) ? it :
    { ...it, status: 'done', dropped: true, doneAt: Date.now() }));

  const addItem = async (r, status) => {
    if (busy) return;
    const exist = items.find(it => it.id === r.id && it.type === r.media_type);
    if (exist) { setStatus(exist, status); setResults(null); setQuery(''); return; }
    setBusy(true);
    const it = await tmdbFetchItem(r.media_type, r.id);   // 1 seule requête, tout est mis en cache
    setBusy(false);
    if (!it) { alert('Impossible de récupérer les détails TMDB (clé invalide ou réseau).'); return; }
    if (status === 'done') { if (it.type === 'tv') { it.watchedSet = tvAllKeys(it); it.watchedEps = it.watchedSet.length || it.totalEps; } it.doneAt = Date.now(); }
    update([{ ...it, status }, ...items]);
    setResults(null); setQuery('');
  };

  // Clic sur l'affiche d'un résultat de recherche → fiche détaillée, comme un titre enregistré.
  // Déjà suivi : on ouvre sa fiche. Sinon : 1 requête TMDB pour tout récupérer → fiche en aperçu.
  const openDetail = async r => {
    const exist = items.find(it => it.id === r.id && it.type === r.media_type);
    if (exist) { setDetail({ type: exist.type, id: exist.id }); return; }
    if (previewLoading) return;
    setPreviewLoading(true);
    const it = await tmdbFetchItem(r.media_type, r.id);
    setPreviewLoading(false);
    if (!it) { alert('Impossible de récupérer les détails TMDB (clé invalide ou réseau).'); return; }
    setPreview({ ...it, status: 'towatch', watchedEps: it.watchedEps || 0, watchedSet: it.watchedSet || [], specialsSeen: [] });
  };
  // 1re action dans la fiche d'un aperçu → l'enregistre (avec la modif) puis bascule sur sa vraie fiche
  const commitPreview = extra => {
    if (!preview) return;
    const base = { ...preview, addedAt: Date.now(), ...extra };
    update([base, ...items]);
    setPreview(null);
    setDetail({ type: base.type, id: base.id });
  };

  // Applique un nouvel ensemble d'épisodes vus + STATUT AUTO : tous les épisodes normaux
  // vus (les spéciaux ne comptent pas) → la série passe automatiquement en « ✓ Vu » ;
  // redescendre sous le total la repasse en « ▶ En cours ». `watchedEps` = taille du set
  // (maintenu pour les stats/listes qui lisent le compteur).
  const applyWatchedSet = (it, set) => {
    const arr = [...new Set(set)];
    const next = { ...it, watchedSet: arr, watchedEps: arr.length };
    if (it.type === 'tv' && (it.totalEps || 0) > 0) {
      if (arr.length >= it.totalEps && it.status !== 'done') { next.status = 'done'; next.doneAt = Date.now(); }
      else if (arr.length < it.totalEps && it.status === 'done') next.status = 'watching';
    }
    return next;
  };
  const setWatchedSet = (item, set) => update(items.map(it => (it.id !== item.id || it.type !== item.type) ? it :
    applyWatchedSet(it, set)));
  // +1 = coche le prochain épisode non vu · −1 = décoche le dernier vu (dans l'ordre)
  const bump = (item, d) => {
    const set = new Set(tvWatchedSet(item));
    if (d > 0) { const nx = tvNextToWatch(item); if (nx) set.add(nx); }
    else { const last = tvLastWatched(item); if (last) set.delete(last); }
    setWatchedSet(item, [...set]);
  };
  // Coche/décoche TOUTE une saison (tous ses épisodes) — cochage indépendant des autres saisons
  const toggleSeasonEps = (item, n, eps, check) => {
    const set = new Set(tvWatchedSet(item));
    for (let e = 1; e <= eps; e++) { const k = `S${n}E${e}`; check ? set.add(k) : set.delete(k); }
    setWatchedSet(item, [...set]);
  };
  // Coche/décoche UN épisode isolé
  const toggleEp = (item, n, e, seen) => {
    const set = new Set(tvWatchedSet(item));
    const k = `S${n}E${e}`; seen ? set.delete(k) : set.add(k);
    setWatchedSet(item, [...set]);
  };
  // Épisodes SPÉCIAUX vus (saison 0) — cochage INDIVIDUEL : specialsSeen = liste des n°
  // d'ép. vus (aucun effet sur le statut / la progression ; pas requis pour terminer la série)
  const setSpecials = (item, arr) => update(items.map(it => (it.id !== item.id || it.type !== item.type) ? it :
    { ...it, specialsSeen: [...new Set(arr)].filter(n => Number.isFinite(n) && n >= 0).sort((a, b) => a - b) }));
  // Label « manga / animé » (fiche) — non affiché dans les listes, exploité dans les stats
  const setManga = (item, v) => update(items.map(it => (it.id !== item.id || it.type !== item.type) ? it :
    { ...it, manga: !!v }));
  // Label « dessin animé » (fiche) — non affiché dans les listes, pas de stats pour l'instant
  const setCartoon = (item, v) => update(items.map(it => (it.id !== item.id || it.type !== item.type) ? it :
    { ...it, cartoon: !!v }));

  const removeItem = item => {
    if (confirm(`Retirer « ${item.title} » de TV Time ?`)) update(items.filter(it => it.id !== item.id || it.type !== item.type));
  };

  // Les sections par statut sont calculées sur la liste filtrée Films/Séries + nom, puis
  // triée (tri persisté). PROCHAINES SORTIES est 100% séries : masquée en mode Films
  // (pas d'état vide inutile) et garde son propre tri par date de diffusion.
  const tvCmp = (a, b) => {
    if (sortBy === 'name')      return (a.title || '').localeCompare(b.title || '', 'fr', { sensitivity: 'base' });
    if (sortBy === 'year_desc') return (parseInt(b.year) || 0) - (parseInt(a.year) || 0);
    if (sortBy === 'year_asc')  return (parseInt(a.year) || 9999) - (parseInt(b.year) || 9999);
    if (sortBy === 'added_asc') return (a.addedAt || 0) - (b.addedAt || 0);
    return (b.addedAt || 0) - (a.addedAt || 0); // 'added_desc' (défaut)
  };
  const nameQ = listFilter.trim().toLowerCase();
  // Les films/séries et YouTube sont SÉPARÉS : `visible` (films+séries) exclut les items
  // YouTube, qui ont leur propre bloc dédié (ytItems) plus bas.
  const filmTv = items.filter(it => it.type !== 'youtube');
  const visible = (mediaFilter === 'all' ? filmTv : filmTv.filter(it => it.type === mediaFilter))
    .filter(it => !nameQ || (it.title || '').toLowerCase().includes(nameQ))
    .slice().sort(tvCmp);
  const nbMovies = items.reduce((a, it) => a + (it.type === 'movie' ? 1 : 0), 0);
  const nbYoutube = items.reduce((a, it) => a + (it.type === 'youtube' ? 1 : 0), 0);
  const nbSeries = filmTv.length - nbMovies;
  // Bloc YouTube séparé : items 'youtube' filtrés par nom + triés, répartis par statut
  const ytItems = items.filter(it => it.type === 'youtube' && (!nameQ || (it.title || '').toLowerCase().includes(nameQ))).slice().sort(tvCmp);
  const ytWatching = ytItems.filter(it => it.status === 'watching' || it.status === 'paused');
  const ytTowatch  = ytItems.filter(it => it.status === 'towatch');
  const ytDone     = ytItems.filter(it => it.status === 'done');
  // Film PAS ENCORE SORTI = date de sortie STRICTEMENT future (jour J et au-delà → sorti).
  // Ces films vivent UNIQUEMENT dans PROCHAINES SORTIES ; le jour de la sortie (ou après)
  // ils basculent automatiquement dans À VOIR (ils ne sont plus "upcoming", donc réapparaissent
  // dans la liste towatch). Concept propre aux films — les séries gardent leur logique nextEp.
  const isUpcomingMovie = it => it.type === 'movie' && it.status !== 'done' && it.releaseDate && tvDaysUntil(it.releaseDate) > 0;
  // EN COURS exclut les séries « à jour » (prochain épisode pas encore sorti) : elles vivent
  // UNIQUEMENT dans PROCHAINES SORTIES tant que le nouvel épisode n'est pas diffusé.
  const watching = visible.filter(it => it.status === 'watching' && !tvCaughtUp(it));
  const paused   = visible.filter(it => it.status === 'paused');   // séries mises en pause (visionnage suspendu)
  const towatch  = visible.filter(it => it.status === 'towatch' && !isUpcomingMovie(it));
  const done     = visible.filter(it => it.status === 'done');
  // PROCHAINES SORTIES : séries (prochain épisode à diffuser) + films PAS ENCORE SORTIS.
  // Le contenu suit le filtre Films/Séries/Les deux :
  // Séries → prochains épisodes ; Films → films à venir ; Les deux → les deux, triés par date.
  const upSeries = items.filter(it => it.type === 'tv' && it.status !== 'done' && it.nextEp && it.nextEp.date);
  const upMovies = items.filter(isUpcomingMovie);
  const upDate = it => it.type === 'tv' ? it.nextEp.date : it.releaseDate;
  const upcoming = (mediaFilter === 'movie' ? upMovies : mediaFilter === 'tv' ? upSeries : [...upSeries, ...upMovies])
    .slice().sort((a, b) => { const da = upDate(a), db = upDate(b); return da < db ? -1 : da > db ? 1 : 0; });

  const inputStyle = { flex:1, minWidth:0, background:'#111', border:`1px solid ${C.border}`, borderRadius:6, padding:'5px 10px', fontSize:11, color:C.text, outline:'none', fontFamily:'inherit', boxSizing:'border-box' };
  const abtn = (color, title) => ({ background:'none', border:'none', color, fontSize:13, lineHeight:1, padding:'0 3px', cursor:'pointer', flexShrink:0 });
  const secTitle = (secKey, icon, label, count, extra, color = TVTIME_COLOR) => (
    <div onClick={() => toggleSec(secKey)} style={{ display:'flex', alignItems:'center', gap:6, marginTop:2, cursor:'pointer', userSelect:'none' }}>
      <div style={{ flex:1, fontSize:10, fontWeight:800, color, letterSpacing:'0.05em' }}>
        {icon} {label}{count > 0 && <span style={{ color:C.muted, fontWeight:400 }}> · {count}</span>}
      </div>
      {extra}
      <span style={{ display:'inline-block', color:C.dim, fontSize:11, lineHeight:1, flexShrink:0, transform: secOpen[secKey] ? 'rotate(90deg)' : 'none', transition:'transform 0.15s' }}>▶</span>
    </div>
  );
  // Affiche cliquable pour les séries de la liste (pas les résultats de recherche, qui
  // n'ont pas encore de `seasons`) → ouvre la fiche série TvDetailModal
  const poster = (it, onOverride) => {
    // Cliquable pour ouvrir la fiche : films (fiche = synopsis + statut) OU séries déjà
    // chargées (avec saisons). Les résultats de recherche passent par onOverride.
    const clickable = onOverride ? true : (it.type === 'movie' || it.type === 'youtube' || (it.type === 'tv' && (it.seasons || []).length > 0));
    const onClick = onOverride || (clickable ? () => setDetail({ type: it.type, id: it.id }) : undefined);
    const ttl = clickable ? (onOverride ? 'Voir les détails' : it.type === 'youtube' ? 'Vidéos par année' : 'Détail des saisons') : undefined;
    // YouTube : poster = URL directe (miniature ronde) ; TMDB : chemin préfixé
    const yt = it.type === 'youtube';
    const st = { width:26, height:39, borderRadius:4, objectFit:'cover', flexShrink:0, background:'#111', cursor: clickable ? 'pointer' : undefined };
    return it.poster
      ? <img src={yt ? it.poster : TMDB_IMG + it.poster} alt="" loading="lazy" onClick={onClick} title={ttl} style={st} />
      : <div onClick={onClick} title={ttl} style={{ ...st, display:'flex', alignItems:'center', justifyContent:'center', fontSize:12 }}>{it.type === 'movie' ? '🎬' : yt ? '▶️' : '📺'}</div>;
  };
  const row = (it, subtitle, buttons, onPoster) => (
    <div key={it.type + it.id} style={{ display:'flex', alignItems:'center', gap:8, background:C.surfaceHigh, borderRadius:8, padding:'6px 8px' }}>
      {poster(it, onPoster)}
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontSize:11, fontWeight:600, color:C.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
          {it.title}{it.year ? <span style={{ color:C.dim, fontWeight:400 }}> · {it.year}</span> : null}
        </div>
        <div style={{ fontSize:9, color:C.muted, fontFamily:'DM Mono,monospace', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{subtitle}</div>
      </div>
      {buttons}
    </div>
  );
  // Libellé de progression d'une série en cours : "5/20 ép. · prochain S2E5" / "à jour ✓"
  const progLabel = it => {
    if (it.type === 'movie') return `Film${it.runtime ? ` · ${it.runtime} min` : ''}`;
    if (it.type === 'youtube') return `${(it.watchedIds || []).length}/${it.totalEps || '?'} vidéos vues`;
    const nxt = tvNextToWatch(it);
    return `${it.watchedEps || 0}/${it.totalEps || '?'} ép.${nxt ? ` · prochain ${nxt}` : ' · à jour ✓'}`;
  };
  // Bouton « Arrêter de suivre » — équivalent YouTube du flux séries « en pause → arrêter le
  // visionnage » (les chaînes n'ont pas ce flux). Passe la chaîne en Vus avec les vidéos déjà
  // vues et empêche toute réapparition future (nouvelles vidéos).
  const unfollowBtn = it => (
    <button key="unfollow" onClick={() => unfollow(it)}
      title="Arrêter de suivre — passe en Vus avec les vidéos déjà vues, ne resurgira plus avec de nouvelles vidéos"
      style={abtn('#f5b81f')}>⏹</button>);

  return (
    <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:'10px 12px', display:'flex', flexDirection:'column', gap:8 }}>
      {/* Clé API TMDB */}
      {!hasKey && (
        <div style={{ fontSize:10, color:C.muted, lineHeight:1.55, background:'#111', borderRadius:8, padding:'8px 10px' }}>
          🔑 <b style={{ color:C.text }}>Clé API TMDB requise</b> — crée un compte gratuit sur <span style={{ color:TVTIME_COLOR }}>themoviedb.org</span>, génère une clé <i>API v3</i> dans <i>Paramètres → API</i> et colle-la ci-dessous. Elle est stockée uniquement sur cet appareil. L'API gratuite n'a pas de plafond journalier.
        </div>
      )}
      {(!hasKey || showKey) && (
        <div style={{ display:'flex', gap:6 }}>
          <input type="password" value={keyInput} placeholder="Clé API TMDB (v3)…" autoComplete="off"
            onChange={e => setKeyInput(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') saveKey(); }}
            style={{ ...inputStyle, borderColor: keyInput ? TVTIME_COLOR : C.border }} />
          <button onClick={saveKey} style={{ background:`${TVTIME_COLOR}22`, border:`1px solid ${TVTIME_COLOR}66`, borderRadius:6, color:TVTIME_COLOR, fontSize:11, fontWeight:700, padding:'0 11px', cursor:'pointer', flexShrink:0 }}>OK</button>
        </div>
      )}

      {hasKey && (
        <>
          {/* Recherche TMDB (films + séries en 1 requête /search/multi) */}
          <div style={{ display:'flex', gap:6 }}>
            <input type="text" value={query} placeholder="Chercher un film, une série…"
              onChange={e => setQuery(e.target.value)}
              onFocus={() => setSearchFocused(true)}
              onBlur={() => setSearchFocused(false)}
              onKeyDown={e => { if (e.key === 'Enter') search(); }}
              style={{ ...inputStyle, borderColor: query ? TVTIME_COLOR : C.border }} />
            <button onClick={() => search()} disabled={busy}
              style={{ background:`${TVTIME_COLOR}22`, border:`1px solid ${TVTIME_COLOR}66`, borderRadius:6, color:TVTIME_COLOR, fontSize:12, fontWeight:700, padding:'0 11px', cursor:'pointer', flexShrink:0, opacity: busy ? 0.5 : 1 }}>
              {busy ? '…' : '🔎'}
            </button>
            <button onClick={() => setShowKey(o => !o)} title="Changer la clé API TMDB"
              style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:6, color:C.dim, fontSize:11, padding:'0 8px', cursor:'pointer', flexShrink:0 }}>⚙</button>
          </div>

          {/* Filtre du TYPE recherché — affiché UNIQUEMENT quand l'input de recherche a le focus
              (ou tant que des résultats sont affichés, pour pouvoir changer de type après coup).
              onMouseDown preventDefault : cliquer un bouton ne retire pas le focus de l'input
              (sinon le blur masquerait la rangée avant que le clic ne s'enregistre). */}
          {(searchFocused || results !== null) && (
          <div style={{ display:'flex', gap:5 }}>
            {[['all', 'Les deux'], ['tv', '📺 Séries'], ['movie', '🎬 Films']].map(([k, label]) => {
              const active = searchType === k;
              return (
                <button key={k} onMouseDown={e => e.preventDefault()} onClick={() => pickSearchType(k)}
                  style={{ flex:1, background: active ? `${TVTIME_COLOR}22` : 'none', border:`1px solid ${active ? TVTIME_COLOR + '66' : C.border}`, borderRadius:6, color: active ? TVTIME_COLOR : C.dim, fontSize:9, fontWeight:700, padding:'3px 0', cursor:'pointer', fontFamily:'DM Mono,monospace' }}>
                  {label}
                </button>
              );
            })}
          </div>
          )}

          {/* Résultats de recherche */}
          {results !== null && (
            <div style={{ display:'flex', flexDirection:'column', gap:5, background:'#111', borderRadius:8, padding:'6px 6px' }}>
              <div style={{ display:'flex', alignItems:'center' }}>
                <div style={{ flex:1, fontSize:9, fontWeight:700, color:C.dim, letterSpacing:'0.05em' }}>RÉSULTATS · {Math.min(visibleCount, results.length)}{((searchMeta && searchMeta.page < searchMeta.totalPages) || visibleCount < results.length) ? '+' : ''}</div>
                <button onClick={() => { setResults(null); setQuery(''); setSearchMeta(null); }} style={abtn(C.dim)}>×</button>
              </div>
              {results.length === 0 && <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'4px 0' }}>Aucun résultat</div>}
              {results.slice(0, visibleCount).map(r => {
                // ★ si le titre est déjà suivi, quel que soit son statut (à voir / en cours / vu, film comme série)
                const exist = items.find(it => it.id === r.id && it.type === r.media_type);
                const mark  = !!exist;
                const markColor = exist ? (exist.status === 'done' ? '#4caf50' : exist.status === 'watching' ? TVTIME_COLOR : '#f5b81f') : C.dim;
                const markLabel = exist ? (exist.status === 'done' ? 'Déjà vu' : exist.status === 'watching' ? 'En cours' : 'À voir') : '';
                return row(
                  { id: r.id, type: r.media_type, title: (r.media_type === 'movie' ? (r.title || r.original_title) : (r.name || r.original_name)) || '?', year: ((r.media_type === 'movie' ? r.release_date : r.first_air_date) || '').slice(0, 4), poster: r.poster_path },
                  <>
                    {r.media_type === 'movie' ? 'Film' : 'Série'}
                    {mark && <span style={{ color: markColor, fontWeight:700 }}> · ★ {markLabel}</span>}
                  </>,
                  <>
                    {mark && <span title={markLabel} style={{ color: markColor, fontSize:12, flexShrink:0, padding:'0 2px' }}>★</span>}
                    <button onClick={() => addItem(r, 'towatch')}  title="À voir"    style={abtn('#f5b81f')}>📌</button>
                    <button onClick={() => addItem(r, 'watching')} title="En cours"  style={abtn(TVTIME_COLOR)}>▶</button>
                    <button onClick={() => addItem(r, 'done')}     title="Déjà vu"   style={abtn('#4caf50')}>✓</button>
                  </>,
                  () => openDetail(r)
                );
              })}
              {((searchMeta && searchMeta.page < searchMeta.totalPages) || visibleCount < results.length) && (
                <button onClick={loadMore} disabled={loadingMore}
                  style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:6, color: loadingMore ? C.dim : TVTIME_COLOR, fontSize:10, fontWeight:700, padding:'6px 0', cursor: loadingMore ? 'default' : 'pointer', fontFamily:'DM Mono,monospace', marginTop:2 }}>
                  {loadingMore ? 'Chargement…' : '▼ Voir plus de résultats'}
                </button>
              )}
            </div>
          )}

          {/* Recherche / ajout YouTube — chaîne ou playlist par lien (widget jumeau de la recherche TMDB) */}
          <div style={{ display:'flex', gap:6 }}>
            <input type="text" value={ytInput} placeholder="Lien d'une chaîne ou playlist YouTube…"
              onChange={e => setYtInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') addYoutube(); }}
              style={{ ...inputStyle, borderColor: ytInput ? YT_COLOR : C.border }} />
            <button onClick={addYoutube} disabled={ytBusy} title="Ajouter cette chaîne / playlist YouTube"
              style={{ background:`${YT_COLOR}22`, border:`1px solid ${YT_COLOR}66`, borderRadius:6, color:YT_COLOR, fontSize:14, fontWeight:700, padding:'0 11px', cursor:'pointer', flexShrink:0, opacity: ytBusy ? 0.5 : 1 }}>{ytBusy ? '…' : '＋'}</button>
            <button onClick={() => setShowYtKey(o => !o)} title="Clé API YouTube Data v3"
              style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:6, color:C.dim, fontSize:11, padding:'0 8px', cursor:'pointer', flexShrink:0 }}>⚙</button>
          </div>
          {(!hasYtKey || showYtKey) && (
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              {!hasYtKey && (
                <div style={{ fontSize:10, color:C.muted, lineHeight:1.5, background:'#111', borderRadius:8, padding:'8px 10px' }}>
                  ▶️ <b style={{ color:C.text }}>Clé API YouTube requise</b> — sur <span style={{ color:YT_COLOR }}>console.cloud.google.com</span>, active « YouTube Data API v3 » et crée une clé API. Colle-la ci-dessous (stockée uniquement sur cet appareil). Quota gratuit ~10 000 unités/jour.
                </div>
              )}
              <div style={{ display:'flex', gap:6 }}>
                <input type="password" value={ytKeyInput} placeholder="Clé API YouTube Data v3…" autoComplete="off"
                  onChange={e => setYtKeyInput(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') saveYtKey(); }}
                  style={{ ...inputStyle, borderColor: ytKeyInput ? YT_COLOR : C.border }} />
                <button onClick={saveYtKey} style={{ background:`${YT_COLOR}22`, border:`1px solid ${YT_COLOR}66`, borderRadius:6, color:YT_COLOR, fontSize:11, fontWeight:700, padding:'0 11px', cursor:'pointer', flexShrink:0 }}>OK</button>
              </div>
            </div>
          )}
          {ytMsg && <div style={{ fontSize:10, color: ytMsg.startsWith('⚠') ? '#e05050' : C.muted, fontFamily:'DM Mono,monospace', lineHeight:1.4 }}>{ytMsg}</div>}

          {/* Filtre Films / Séries / YouTube (persisté) — cliquer YT affiche tout le contenu YouTube */}
          {items.length > 0 && (
            <div style={{ display:'flex', gap:5 }}>
              {[['all', `Tous · ${filmTv.length}`, TVTIME_COLOR], ['tv', `📺 Séries · ${nbSeries}`, TVTIME_COLOR], ['movie', `🎬 Films · ${nbMovies}`, TVTIME_COLOR], ['youtube', `▶️ YT · ${nbYoutube}`, YT_COLOR]].map(([k, label, col]) => {
                const active = mediaFilter === k;
                return (
                  <button key={k} onClick={() => pickFilter(k)}
                    style={{ flex:1, background: active ? `${col}22` : 'none', border:`1px solid ${active ? col + '66' : C.border}`, borderRadius:6, color: active ? col : C.dim, fontSize:10, fontWeight:700, padding:'4px 0', cursor:'pointer', fontFamily:'DM Mono,monospace' }}>
                    {label}
                  </button>
                );
              })}
            </div>
          )}

          {/* Filtre par nom + tri des listes (tri persisté) */}
          {items.length > 0 && (
            <div style={{ display:'flex', gap:6 }}>
              <input type="text" value={listFilter} placeholder="Filtrer par nom…"
                onChange={e => setListFilter(e.target.value)}
                style={{ ...inputStyle, padding:'3px 8px', fontSize:10, borderColor: listFilter ? TVTIME_COLOR : C.border }} />
              {listFilter && (
                <button onClick={() => setListFilter('')} title="Effacer le filtre"
                  style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:6, color:C.dim, fontSize:11, padding:'0 7px', cursor:'pointer', flexShrink:0 }}>×</button>
              )}
              <select value={sortBy} onChange={e => pickSort(e.target.value)} title="Trier les listes"
                style={{ background:'#111', border:`1px solid ${sortBy !== 'added_desc' ? TVTIME_COLOR + '66' : C.border}`, borderRadius:6, padding:'3px 7px', fontSize:10, color: sortBy !== 'added_desc' ? TVTIME_COLOR : C.muted, outline:'none', cursor:'pointer', flexShrink:0, fontFamily:'DM Mono,monospace' }}>
                {TVTIME_SORTS.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
              </select>
            </div>
          )}

          {/* ══ FILMS & SÉRIES ══ (masqué quand le filtre YouTube est actif) */}
          {mediaFilter !== 'youtube' && <>
          {/* En cours de visionnage */}
          {secTitle('watching', '▶', 'EN COURS', watching.length)}
          {secOpen.watching && (watching.length === 0
            ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'2px 0', fontFamily:'DM Mono,monospace' }}>Rien en cours — cherche une série ci-dessus</div>
            : watching.map(it => row(it, progLabel(it),
                <>
                  {it.type === 'tv' && <button onClick={() => bump(it, -1)} title="−1 épisode vu" style={abtn(C.muted)}>−</button>}
                  {it.type === 'tv' && <button onClick={() => bump(it, +1)} title="+1 épisode vu" style={abtn(TVTIME_COLOR)}>＋</button>}
                  {it.type === 'tv' && <button onClick={() => setStatus(it, 'paused')} title="Mettre en pause (arrêter de regarder)" style={abtn('#f5b81f')}>⏸</button>}
                  {it.type === 'movie' && <button onClick={() => setStatus(it, 'towatch')} title="Repasser en À voir" style={abtn('#f5b81f')}>📌</button>}
                  <button onClick={() => setStatus(it, 'done')} title={it.type === 'tv' ? 'Série terminée (tout vu)' : it.type === 'youtube' ? 'Tout vu' : 'Film vu'} style={abtn('#4caf50')}>✓</button>
                  <button onClick={() => removeItem(it)} title="Retirer" style={abtn('#e05050')}>×</button>
                </>
              )))}

          {/* En pause (visionnage suspendu) — reprendre → EN COURS, arrêter → VUS */}
          {secTitle('paused', '⏸', 'EN PAUSE', paused.length)}
          {secOpen.paused && (paused.length === 0
            ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'2px 0', fontFamily:'DM Mono,monospace' }}>Aucune série en pause</div>
            : paused.map(it => row(it, progLabel(it),
                <>
                  <button onClick={() => setStatus(it, 'watching')} title="Reprendre le visionnage" style={abtn(TVTIME_COLOR)}>▶</button>
                  <button onClick={() => abandonSeries(it)} title="Arrêter le visionnage (passer en Vus, sans valider les épisodes restants)" style={abtn('#4caf50')}>⏹</button>
                  <button onClick={() => removeItem(it)} title="Retirer" style={abtn('#e05050')}>×</button>
                </>
              )))}

          {/* À voir */}
          {secTitle('towatch', '📌', 'À VOIR', towatch.length)}
          {secOpen.towatch && (towatch.length === 0
            ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'2px 0', fontFamily:'DM Mono,monospace' }}>Liste vide</div>
            : towatch.map(it => row(it, it.type === 'movie' ? `Film${it.runtime ? ` · ${it.runtime} min` : ''}` : it.type === 'youtube' ? `▶️ ${it.ytKind === 'playlist' ? 'Playlist' : 'Chaîne'} · ${it.totalEps || '?'} vidéos` : `Série · ${it.totalEps || '?'} ép.`,
                <>
                  <button onClick={() => setStatus(it, 'watching')} title="Commencer" style={abtn(TVTIME_COLOR)}>▶</button>
                  <button onClick={() => setStatus(it, 'done')} title="Déjà vu" style={abtn('#4caf50')}>✓</button>
                  <button onClick={() => removeItem(it)} title="Retirer" style={abtn('#e05050')}>×</button>
                </>
              )))}

          {/* Prochaines sorties (cache, refresh TTL 24h ou ↻ manuel) — séries (prochain
              épisode) ET films non encore sortis ; le contenu suit le filtre Films/Séries */}
          {true && (
            <>
              {secTitle('upcoming', '📅', 'PROCHAINES SORTIES', upcoming.length,
                <button onClick={e => { e.stopPropagation(); doRefresh(); }} disabled={refreshing} title="Actualiser les prochaines sorties (séries & films suivis)"
                  style={{ background:'none', border:'none', color: refreshing ? C.dim : TVTIME_COLOR, fontSize:12, cursor:'pointer', padding:'0 2px', flexShrink:0 }}>{refreshing ? '…' : '↻'}</button>
              )}
              {secOpen.upcoming && (upcoming.length === 0
                ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'2px 0', fontFamily:'DM Mono,monospace' }}>{mediaFilter === 'movie' ? 'Aucun film à venir' : mediaFilter === 'tv' ? 'Aucun épisode annoncé pour tes séries' : 'Aucune sortie à venir'}</div>
                : upcoming.map(it => {
                    if (it.type === 'movie') {
                      const dj = tvDaysUntil(it.releaseDate);
                      const when = dj === null ? '' : dj <= 0 ? "aujourd'hui" : dj === 1 ? 'demain' : `dans ${dj} j`;
                      const rd = new Date(it.releaseDate + 'T00:00:00');
                      return row(it,
                        `🎬 Sortie ciné · ${isNaN(rd) ? it.releaseDate : rd.toLocaleDateString('fr-FR')}`,
                        <span style={{ fontSize:9, fontFamily:'DM Mono,monospace', fontWeight:700, color: dj !== null && dj <= 1 ? TVTIME_COLOR : C.muted, flexShrink:0 }}>{when}</span>
                      );
                    }
                    const dj = tvDaysUntil(it.nextEp.date);
                    const when = dj === null ? '' : dj < 0 ? 'diffusé' : dj === 0 ? "aujourd'hui" : dj === 1 ? 'demain' : `dans ${dj} j`;
                    return row(it,
                      `S${it.nextEp.s}E${it.nextEp.e}${it.nextEp.name ? ` « ${it.nextEp.name} »` : ''} · ${new Date(it.nextEp.date + 'T00:00:00').toLocaleDateString('fr-FR')}`,
                      <span style={{ fontSize:9, fontFamily:'DM Mono,monospace', fontWeight:700, color: dj !== null && dj <= 1 ? TVTIME_COLOR : C.muted, flexShrink:0 }}>{when}</span>
                    );
                  }))}
            </>
          )}

          {/* Vus / terminés (repliés par défaut) */}
          {secTitle('done', '✓', 'VUS', done.length)}
          {secOpen.done && (done.length === 0
            ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'2px 0', fontFamily:'DM Mono,monospace' }}>Aucun film ou série vu·e</div>
            : done.map(it => row(it,
                it.type === 'movie' ? `Film${it.runtime ? ` · ${it.runtime} min` : ''}` : it.type === 'youtube' ? `${(it.watchedIds || []).length} vidéos vues` : `${it.watchedEps || 0} ép. vus${it.dropped ? ' · plus suivie' : ''}`,
                <>
                  <button onClick={() => setStatus(it, 'watching')} title="Repasser en cours" style={abtn(C.muted)}>↩</button>
                  <button onClick={() => removeItem(it)} title="Retirer" style={abtn('#e05050')}>×</button>
                </>
              )))}
          </>}

          {/* ══ CONTENU YOUTUBE ══ affiché quand le filtre YouTube est actif — chaînes &
              playlists suivies avec leurs propres sections EN COURS / À VOIR / VUS. */}
          {mediaFilter === 'youtube' && (
            <div style={{ marginTop:2 }}>
              {nbYoutube === 0
                ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'6px 0', fontFamily:'DM Mono,monospace' }}>Aucune chaîne — colle un lien YouTube dans le champ ci-dessus</div>
                : <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
                    {secTitle('ytWatching', '▶', 'EN COURS', ytWatching.length, null, YT_COLOR)}
                    {secOpen.ytWatching && (ytWatching.length === 0
                      ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'2px 0', fontFamily:'DM Mono,monospace' }}>Rien en cours</div>
                      : ytWatching.map(it => row(it, progLabel(it),
                          <>
                            <button onClick={() => setStatus(it, 'done')} title="Tout vu" style={abtn('#4caf50')}>✓</button>
                            {unfollowBtn(it)}
                            <button onClick={() => removeItem(it)} title="Retirer" style={abtn('#e05050')}>×</button>
                          </>
                        )))}
                    {secTitle('ytDone', '✓', 'VUS', ytDone.length, null, YT_COLOR)}
                    {secOpen.ytDone && (ytDone.length === 0
                      ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'2px 0', fontFamily:'DM Mono,monospace' }}>Aucune chaîne vue</div>
                      : ytDone.map(it => row(it, `${(it.watchedIds || []).length} vidéos vues${it.dropped ? ' · plus suivie' : ''}`,
                          <>
                            <button onClick={() => setStatus(it, 'watching')} title="Repasser en cours" style={abtn(C.muted)}>↩</button>
                            <button onClick={() => removeItem(it)} title="Retirer" style={abtn('#e05050')}>×</button>
                          </>
                        )))}
                  </div>}
            </div>
          )}

          {/* Retour en arrière — annule la dernière action TV Time (tout en bas) */}
          {undoStack.length > 0 && (
            <div style={{ marginTop:8, paddingTop:8, borderTop:`1px solid ${C.border}`, display:'flex', justifyContent:'center' }}>
              <button onClick={undoLast} title="Annuler la dernière action effectuée"
                style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:6, color:C.muted, fontSize:11, fontWeight:700, padding:'6px 16px', cursor:'pointer', fontFamily:'DM Mono,monospace' }}>
                ↩ Retour en arrière
              </button>
            </div>
          )}
        </>
      )}

      {/* Fiche d'un titre enregistré (clic sur une affiche) — YouTube a sa propre fiche */}
      {detailItem && detailItem.type === 'youtube' && <YtDetailModal item={detailItem}
        onClose={() => setDetail(null)}
        onSetWatched={ids => ytSetWatched(detailItem, ids)}
        onStatus={st => setStatus(detailItem, st)}
        onManga={v => setManga(detailItem, v)}
        onCartoon={v => setCartoon(detailItem, v)}
        onRefresh={() => ytRefreshItem(detailItem)}
        refreshing={ytRefreshingId === detailItem.id}
        onUnlimited={() => ytLoadAll(detailItem)}
        onRelock={() => ytRelock(detailItem)} />}
      {detailItem && detailItem.type !== 'youtube' && <TvDetailModal item={detailItem}
        onClose={() => setDetail(null)}
        onBump={d => bump(detailItem, d)}
        onSeasonToggle={s => toggleSeasonEps(detailItem, s.n, s.eps, s.watched < s.eps)}
        onToggleEp={(n, e, seen) => toggleEp(detailItem, n, e, seen)}
        onSetSpecials={arr => setSpecials(detailItem, arr)}
        onManga={v => setManga(detailItem, v)}
        onCartoon={v => setCartoon(detailItem, v)}
        onStatus={st => setStatus(detailItem, st)} />}
      {/* Fiche d'un résultat de recherche non enregistré — la 1re action l'ajoute à la liste */}
      {preview && (() => {
        // Applique un nouvel ensemble d'épisodes vus sur l'aperçu puis l'enregistre (status 'watching')
        const commitSet = arr0 => { const arr = [...new Set(arr0)]; commitPreview({ status:'watching', watchedSet: arr, watchedEps: arr.length }); };
        return <TvDetailModal item={preview}
          onClose={() => setPreview(null)}
          onBump={d => { const set = new Set(tvWatchedSet(preview)); if (d > 0) { const nx = tvNextToWatch(preview); if (nx) set.add(nx); } else { const last = tvLastWatched(preview); if (last) set.delete(last); } commitSet([...set]); }}
          onSeasonToggle={s => { const set = new Set(tvWatchedSet(preview)); for (let e = 1; e <= s.eps; e++) { const k = `S${s.n}E${e}`; (s.watched < s.eps) ? set.add(k) : set.delete(k); } commitSet([...set]); }}
          onToggleEp={(n, e, seen) => { const set = new Set(tvWatchedSet(preview)); const k = `S${n}E${e}`; seen ? set.delete(k) : set.add(k); commitSet([...set]); }}
          onSetSpecials={arr => commitPreview({ specialsSeen: [...new Set(arr)].filter(n => Number.isFinite(n) && n >= 0).sort((a, b) => a - b) })}
          onManga={v => commitPreview({ manga: !!v })}
          onCartoon={v => commitPreview({ cartoon: !!v })}
          onStatus={st => commitPreview({ status: st, ...(st === 'done' ? (preview.type === 'tv' ? { watchedSet: tvAllKeys(preview), watchedEps: tvAllKeys(preview).length, doneAt: Date.now() } : { doneAt: Date.now() }) : {}) })} />;
      })()}
    </div>
  );
}
