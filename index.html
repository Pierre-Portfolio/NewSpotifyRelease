// ════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════
const CLIENT_ID    = '672e41f0308f4378b4f2331844e08b20';
const REDIRECT_URI = 'https://pierre-portfolio.github.io/NewSpotifyRelease/';
// user-library-read/modify : requis par les endpoints /me/library (migration Spotify fév. 2026).
// Un compte connecté avant l'ajout de ces scopes doit se déconnecter/reconnecter pour les accorder.
const SCOPES       = 'user-follow-read user-read-private user-read-currently-playing user-modify-playback-state user-library-read user-library-modify';
const ESTIMATED_TOTAL = 1400;
// Version de l'app : MAJ.MIN.U = nombre de commits du dépôt découpé en
// major=floor(N/100), minor=floor(N/10)%10, patch=N%10 (ex. 243 → 2.4.3, 250 → 2.5.0).
// À incrémenter manuellement à chaque commit (= git rev-list --count HEAD après le commit).
// ⚠ Les commits automatiques de la GitHub Action (data/indices.json) gonflent aussi N.
const APP_VERSION = '3.5.3';

// ════════════════════════════════════════════════
// PKCE
// ════════════════════════════════════════════════
function generateRandomString(len) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  // Rejection sampling : 256 % 62 ≠ 0, un simple modulo biaiserait légèrement la
  // distribution vers les premiers caractères. On rejette les octets ≥ 248 (= 4×62).
  const LIMIT = 256 - (256 % chars.length); // 248
  const out = [];
  while (out.length < len) {
    const buf = crypto.getRandomValues(new Uint8Array(len * 2));
    for (let i = 0; i < buf.length && out.length < len; i++) {
      if (buf[i] < LIMIT) out.push(chars[buf[i] % chars.length]);
    }
  }
  return out.join('');
}
async function generateCodeChallenge(verifier) {
  const data   = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

// ════════════════════════════════════════════════
// AUTH
// ════════════════════════════════════════════════
async function loginWithSpotify() {
  const verifier   = generateRandomString(64);
  const challenge  = await generateCodeChallenge(verifier);
  const state      = generateRandomString(16);
  localStorage.setItem('pkce_verifier', verifier);
  localStorage.setItem('pkce_state', state);
  const params = new URLSearchParams({
    client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI,
    scope: SCOPES, code_challenge_method: 'S256', code_challenge: challenge, state,
  });
  window.location = `https://accounts.spotify.com/authorize?${params}`;
}
async function exchangeCode(code) {
  const verifier = localStorage.getItem('pkce_verifier');
  const body = new URLSearchParams({
    client_id: CLIENT_ID, grant_type: 'authorization_code',
    code, redirect_uri: REDIRECT_URI, code_verifier: verifier,
  });
  const res  = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body,
  });
  const data = await res.json();
  localStorage.removeItem('pkce_verifier');
  localStorage.removeItem('pkce_state');
  if (data.access_token) {
    localStorage.setItem('spotify_token', data.access_token);
    localStorage.setItem('spotify_token_expiry', Date.now() + data.expires_in * 1000);
    if (data.refresh_token) localStorage.setItem('spotify_refresh', data.refresh_token);
    return true;
  }
  return false;
}
// Mutex : les refresh tokens Spotify PKCE sont à usage unique (rotation).
// Deux refresh simultanés (poll player + scraping) consommeraient le même token → invalid_grant → déconnexion.
let _refreshPromise = null;
function refreshToken() {
  if (_refreshPromise) return _refreshPromise;
  _refreshPromise = (async () => {
    const refresh = localStorage.getItem('spotify_refresh');
    if (!refresh) return false;
    const body = new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'refresh_token', refresh_token: refresh });
    const res  = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body,
    });
    const data = await res.json();
    if (data.access_token) {
      localStorage.setItem('spotify_token', data.access_token);
      localStorage.setItem('spotify_token_expiry', Date.now() + data.expires_in * 1000);
      if (data.refresh_token) localStorage.setItem('spotify_refresh', data.refresh_token); // rotation : stocker le nouveau
      return true;
    }
    if (data.error === 'invalid_grant') {
      // Refresh token définitivement mort : sans ça, le poll player enverrait des 401 toutes les 5s pour toujours
      logoutClear();
      window.location.reload();
    }
    return false;
  })().catch(() => false);
  _refreshPromise.finally(() => { _refreshPromise = null; });
  return _refreshPromise;
}
async function getToken() {
  const expiry = parseInt(localStorage.getItem('spotify_token_expiry') || '0');
  if (Date.now() > expiry - 60000) await refreshToken();
  return localStorage.getItem('spotify_token');
}
function logoutClear() {
  ['spotify_token','spotify_token_expiry','spotify_refresh','pkce_verifier','pkce_state'].forEach(k => localStorage.removeItem(k));
}

// ════════════════════════════════════════════════
// DROPBOX — sauvegarde optionnelle multi-appareils (OAuth 2.0 PKCE, offline access)
// ⚠ CONFIG REQUISE : créer une app sur https://www.dropbox.com/developers/apps
//   (type "Scoped access" · "App folder" · permission files.content.write/read),
//   coller son "App key" ci-dessous, et enregistrer REDIRECT_URI dans l'onglet
//   OAuth 2 → "Redirect URIs" de l'app. Tant que DROPBOX_APP_KEY est vide, l'UI
//   affiche un état "non configuré" (aucun appel réseau).
// La clé (App key) est PUBLIQUE par nature (comme le CLIENT_ID Spotify) : PKCE + offline
// donnent un refresh token stocké en localStorage — pas de secret client dans le code.
// ════════════════════════════════════════════════
const DROPBOX_APP_KEY = 'x9y0bei8lo9lx5i';
const DBX_BACKUP_PATH = '/spotifyplus-sauvegarde.json';
function dropboxConfigured() { return !!DROPBOX_APP_KEY; }
function dropboxConnected() { return !!localStorage.getItem('dropbox_refresh') || !!localStorage.getItem('dropbox_access'); }
function dropboxLogout() { ['dropbox_access','dropbox_expiry','dropbox_refresh','dropbox_pkce_verifier'].forEach(k => localStorage.removeItem(k)); }
async function dropboxLogin() {
  if (!DROPBOX_APP_KEY) return;
  const verifier  = generateRandomString(64);
  const challenge = await generateCodeChallenge(verifier);
  localStorage.setItem('dropbox_pkce_verifier', verifier);
  const params = new URLSearchParams({
    client_id: DROPBOX_APP_KEY, response_type: 'code', redirect_uri: REDIRECT_URI,
    code_challenge: challenge, code_challenge_method: 'S256',
    token_access_type: 'offline', state: 'dropbox', // state='dropbox' distingue le retour de celui de Spotify
  });
  window.location = `https://www.dropbox.com/oauth2/authorize?${params}`;
}
async function dropboxExchange(code) {
  const verifier = localStorage.getItem('dropbox_pkce_verifier');
  const body = new URLSearchParams({
    code, grant_type: 'authorization_code', redirect_uri: REDIRECT_URI,
    client_id: DROPBOX_APP_KEY, code_verifier: verifier || '',
  });
  const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body,
  });
  const d = await res.json();
  localStorage.removeItem('dropbox_pkce_verifier');
  if (d.access_token) {
    localStorage.setItem('dropbox_access', d.access_token);
    localStorage.setItem('dropbox_expiry', String(Date.now() + (d.expires_in || 14400) * 1000));
    if (d.refresh_token) localStorage.setItem('dropbox_refresh', d.refresh_token);
    return true;
  }
  return false;
}
async function dropboxToken() {
  const exp = parseInt(localStorage.getItem('dropbox_expiry') || '0') || 0;
  if (Date.now() < exp - 60000) return localStorage.getItem('dropbox_access');
  const refresh = localStorage.getItem('dropbox_refresh');
  if (refresh && DROPBOX_APP_KEY) {
    const body = new URLSearchParams({ grant_type: 'refresh_token', refresh_token: refresh, client_id: DROPBOX_APP_KEY });
    const res  = await fetch('https://api.dropboxapi.com/oauth2/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body,
    });
    const d = await res.json();
    if (d.access_token) {
      localStorage.setItem('dropbox_access', d.access_token);
      localStorage.setItem('dropbox_expiry', String(Date.now() + (d.expires_in || 14400) * 1000));
      return d.access_token;
    }
  }
  return localStorage.getItem('dropbox_access'); // dernier token connu (peut être expiré → l'upload renverra 401)
}
// Upload (overwrite) de la sauvegarde JSON dans le dossier de l'app Dropbox
async function dropboxUpload(dataObj) {
  const token = await dropboxToken();
  if (!token) throw new Error('Dropbox non connecté');
  const res = await fetch('https://content.dropboxapi.com/2/files/upload', {
    method: 'POST',
    headers: {
      Authorization: `Bearer ${token}`,
      'Dropbox-API-Arg': JSON.stringify({ path: DBX_BACKUP_PATH, mode: 'overwrite', mute: true }),
      'Content-Type': 'application/octet-stream',
    },
    body: JSON.stringify(dataObj),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// ════════════════════════════════════════════════
// GOOGLE DRIVE — sauvegarde optionnelle multi-appareils (OAuth 2.0 implicite)
// ⚠ CONFIG REQUISE : créer un projet sur https://console.cloud.google.com,
//   activer l'API "Google Drive API", créer un ID client OAuth (type "Application Web"),
//   ajouter REDIRECT_URI dans "Origines JavaScript autorisées" ET "URI de redirection
//   autorisés", puis coller l'ID client ci-dessous. Tant que GDRIVE_CLIENT_ID est vide,
//   l'UI affiche un état "non configuré" (aucun appel réseau).
// ⚠ Pas de PKCE possible côté Google pour une app statique : l'échange de code des clients
//   "Application Web" exige un client_secret (interdit dans du code public) → flux IMPLICITE
//   (response_type=token) : access token ~1h stocké en localStorage, PAS de refresh token.
//   À l'expiration, le bouton repasse en « Connecter » (reconnexion en 1 clic, consentement
//   déjà accordé → redirection quasi instantanée). L'ID client est public par nature.
// Scope drive.file : l'app ne voit QUE les fichiers qu'elle a elle-même créés.
// ════════════════════════════════════════════════
const GDRIVE_CLIENT_ID   = '';
const GDRIVE_BACKUP_NAME = 'spotifyplus-sauvegarde.json';
function gdriveConfigured() { return !!GDRIVE_CLIENT_ID; }
// Connecté = token présent ET non expiré (flux implicite : pas de refresh possible)
function gdriveConnected() {
  const exp = parseInt(localStorage.getItem('gdrive_expiry') || '0') || 0;
  return !!localStorage.getItem('gdrive_access') && Date.now() < exp - 60000;
}
function gdriveToken() { return gdriveConnected() ? localStorage.getItem('gdrive_access') : null; }
function gdriveLogout() { ['gdrive_access','gdrive_expiry','gdrive_file_id'].forEach(k => localStorage.removeItem(k)); }
function gdriveLogin() {
  if (!GDRIVE_CLIENT_ID) return;
  const params = new URLSearchParams({
    client_id: GDRIVE_CLIENT_ID, response_type: 'token', redirect_uri: REDIRECT_URI,
    scope: 'https://www.googleapis.com/auth/drive.file',
    include_granted_scopes: 'true', state: 'gdrive', // state='gdrive' distingue le retour (fragment #) de Spotify/Dropbox (query ?)
  });
  window.location = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
}
// Retour du consentement Google : le token arrive dans le FRAGMENT (#access_token=…&state=gdrive),
// jamais envoyé au serveur. Appelé tout en tête de l'init, avant le parsing des query params.
function gdriveHandleRedirect() {
  if (!window.location.hash || window.location.hash.indexOf('access_token') === -1) return;
  const h = new URLSearchParams(window.location.hash.slice(1));
  if (h.get('state') === 'gdrive' && h.get('access_token')) {
    try {
      localStorage.setItem('gdrive_access', h.get('access_token'));
      localStorage.setItem('gdrive_expiry', String(Date.now() + (parseInt(h.get('expires_in') || '3600') || 3600) * 1000));
    } catch {}
    window.history.replaceState({}, '', window.location.pathname);
  }
}
// Retrouve l'id du fichier de sauvegarde (cache localStorage → 1 seule recherche, puis PATCH direct)
async function gdriveFindBackupId(token) {
  const cached = localStorage.getItem('gdrive_file_id');
  if (cached) return cached;
  const q = encodeURIComponent(`name='${GDRIVE_BACKUP_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id)&pageSize=1`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const d  = await res.json();
  const id = (d.files && d.files[0] && d.files[0].id) || null;
  if (id) try { localStorage.setItem('gdrive_file_id', id); } catch {}
  return id;
}
// Upload (overwrite) de la sauvegarde JSON sur Google Drive : PATCH du fichier existant,
// sinon création multipart (métadonnées {name} + contenu). Même contenu que Dropbox (buildBackup complet).
async function gdriveUpload(dataObj) {
  const token = gdriveToken();
  if (!token) throw new Error('Google Drive non connecté');
  const body = JSON.stringify(dataObj);
  let id = null;
  try { id = await gdriveFindBackupId(token); } catch {}
  if (id) {
    const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
      method: 'PATCH', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body,
    });
    if (res.ok) return res.json();
    if (res.status !== 404) throw new Error('HTTP ' + res.status);
    try { localStorage.removeItem('gdrive_file_id'); } catch {} // fichier supprimé côté Drive → on le recrée
  }
  const boundary = 'spotifyplus' + Math.random().toString(36).slice(2);
  const multipart =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify({ name: GDRIVE_BACKUP_NAME }) +
    `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n` + body + `\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` }, body: multipart,
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const d = await res.json();
  if (d.id) try { localStorage.setItem('gdrive_file_id', d.id); } catch {}
  return d;
}

// API HELPERS (Spotify)
// ════════════════════════════════════════════════

// ── Rate-limit guard (module-level, PERSISTÉ) ────
// Une seule fenêtre "aucune requête avant T", partagée par TOUS les appels
// (player, login, synchro) et relue au chargement du module : un blocage
// (429 player ou stop synchro min. 15 min) survit au F5 — avant, _rlUntil repartait
// à 0 au refresh et le poll player re-hammerait une API qui venait de throttle.
const RL_LS_KEY = 'spotifyplus_blocked_until';
let _rlUntil  = parseInt(localStorage.getItem(RL_LS_KEY) || '0') || 0;
let _rlNotify = null;
function _rlSet(retryMs) {
  _rlUntil = Date.now() + retryMs + 2000;
  try { localStorage.setItem(RL_LS_KEY, String(_rlUntil)); } catch {}
  if (_rlNotify) _rlNotify(_rlUntil);
}
function _rlCheck() {
  // rate_limited:true permet aux callers de distinguer "bloqué" de "pas de données" (204/null)
  if (Date.now() < _rlUntil) return { error: 'rate_limited', rate_limited: true, blockedUntil: _rlUntil };
  return null;
}
// Retry-After blindé : un header malformé donnerait parseInt→NaN → _rlUntil=NaN (guard inopérant)
// → retry immédiat en boucle sur une API qui vient de throttle
function _parseRetryAfterMs(raw, fallbackMs) {
  const n = parseInt(raw);
  return Number.isFinite(n) && n >= 0 ? n * 1000 : fallbackMs;
}

async function apiGet(url, _retried = false) {
  const blocked = _rlCheck();
  if (blocked) return blocked;
  const token = await getToken();
  const res   = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (res.status === 401 && !_retried) {
    // Token expiré côté serveur — un refresh puis un seul retry (sinon le body d'erreur remonte au caller)
    const ok = await refreshToken();
    if (ok) return apiGet(url, true);
  }
  if (res.status === 429) {
    const raw     = res.headers.get('Retry-After');
    const retryMs = _parseRetryAfterMs(raw, 60000);
    _rlSet(retryMs);
    const err = new Error('RATE_LIMIT');
    err.retryAfter = (retryMs/1000).toFixed(1);
    err.waitMs  = retryMs + 2000;
    err.waitSec = ((retryMs + 2000)/1000).toFixed(1);
    err.rawHeader = raw;
    throw err;
  }
  if (res.status === 204) return null; // Nothing playing — no body to parse
  return res.json();
}
async function apiPut(url, body, _retried = false) {
  const blocked = _rlCheck();
  if (blocked) return blocked;
  const token = await getToken();
  const res   = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401 && !_retried) {
    // Même politique que apiGet : un refresh puis un seul retry (un like/play ne doit pas échouer en silence)
    const ok = await refreshToken();
    if (ok) return apiPut(url, body, true);
  }
  if (res.status === 429) {
    _rlSet(_parseRetryAfterMs(res.headers.get('Retry-After'), 30000));
    return { error: 'rate_limited', rate_limited: true, blockedUntil: _rlUntil };
  }
  if (res.status === 204) return { ok: true };
  if (res.status === 403) return { error: 'forbidden' };
  if (res.status === 404) return { error: 'no_active_device' };
  return res.json().catch(() => ({ error: 'unknown' }));
}
async function apiDel(url, _retried = false) {
  const blocked = _rlCheck();
  if (blocked) return blocked;
  const token = await getToken();
  const res   = await fetch(url, { method:'DELETE', headers: { Authorization:`Bearer ${token}` } });
  if (res.status === 401 && !_retried) {
    const ok = await refreshToken();
    if (ok) return apiDel(url, true);
  }
  if (res.status === 429) { _rlSet(_parseRetryAfterMs(res.headers.get('Retry-After'), 30000)); return { error:'rate_limited', rate_limited: true }; }
  if (res.status === 403) return { error: 'forbidden' };
  return { ok: true };
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ── Quota de scraping : 100 artistes max par fenêtre GLISSANTE de 24h ──
// Avant : remise à zéro à minuit (jour LOCAL) — on pouvait scraper 100 à 23h30
// puis 100 de plus à 00h30 (1h plus tard). Désormais, atteindre 100 démarre un
// compteur de 24h ; la prochaine session est refusée jusqu'à expiration de cette
// fenêtre. Stockage : localStorage spotifyplus_daily_scrapings = { count, until, last }.
// `last` = timestamp ms du DERNIER artiste scrapé : le compteur repart à 0 dès que
// 24h se sont écoulées depuis ce dernier scrap, MÊME si on n'a pas atteint 100
// (avant, scraper 95 puis revenir 3 jours plus tard affichait encore 95).
const QUOTA_LS_KEY = 'spotifyplus_daily_scrapings';
const QUOTA_MAX = 100;
const QUOTA_MS = 24 * 60 * 60 * 1000;
// Lit le quota persisté ; le compteur repart à 0 si la fenêtre 100-atteint est
// expirée OU si plus de 24h se sont écoulées depuis le dernier scrap (inactivité).
function loadQuota() {
  try {
    const d = JSON.parse(localStorage.getItem(QUOTA_LS_KEY) || 'null');
    if (d && typeof d.count === 'number') {
      if (d.until && Date.now() >= d.until) return { count: 0, until: 0, last: 0 }; // fenêtre 100 expirée
      if (d.last && Date.now() - d.last >= QUOTA_MS) return { count: 0, until: 0, last: 0 }; // ≥ 24h sans scrap
      return { count: d.count, until: d.until || 0, last: d.last || 0 };
    }
  } catch {}
  return { count: 0, until: 0, last: 0 };
}
function saveQuota(count, until, last) {
  try { localStorage.setItem(QUOTA_LS_KEY, JSON.stringify({ count, until: until || 0, last: last || 0 })); } catch {}
}
// Garantit qu'une fenêtre 24h existe dès que le quota est atteint. Auto-réparant :
// un état hérité de l'ancien format ({ date, count:100 } sans `until`) ou un arrêt
// qui n'aurait pas posé de date laissait le compteur bloqué à 100 SANS countdown ni
// date affichable. Si count ≥ 100 sans fenêtre valide → ouvre/persiste 24h maintenant.
// Retourne le timestamp de fin de fenêtre (0 si quota non atteint).
function ensureQuotaWindow() {
  const q = loadQuota();
  if (q.count < QUOTA_MAX) return 0;
  if (q.until && q.until > Date.now()) return q.until;
  const until = Date.now() + QUOTA_MS;
  saveQuota(QUOTA_MAX, until, q.last);
  return until;
}
// Notification cross-plateforme : sur mobile (Android Chrome), `new Notification()`
// lève "Illegal constructor" quand un service worker est actif → il faut passer par
// ServiceWorkerRegistration.showNotification(). On tente le SW d'abord, fallback constructeur.
function notify(title, body) {
  if (!('Notification' in window)) return;
  const show = () => {
    try {
      if (navigator.serviceWorker?.ready) {
        navigator.serviceWorker.ready
          .then(reg => reg.showNotification(title, { body, icon: './icon-192.png' }))
          .catch(() => { try { new Notification(title, { body, icon: './icon-192.png' }); } catch {} });
      } else {
        new Notification(title, { body, icon: './icon-192.png' });
      }
    } catch {}
  };
  if (Notification.permission === 'granted') show();
  else if (Notification.permission !== 'denied') Notification.requestPermission().then(p => { if (p === 'granted') show(); });
}
// "X h Y min" / "Y min" à partir d'une durée restante en ms (countdown quota / blocage)
function fmtRemaining(ms) {
  const mins = Math.max(0, Math.ceil(ms / 60000));
  const h = Math.floor(mins / 60), m = mins % 60;
  return (h > 0 ? `${h} h ` : '') + `${m} min`;
}
// Date/heure de réouverture du quota — ex. "19 juin à 18:10"
function fmtQuotaWhen(until) {
  return new Date(until).toLocaleString('fr-FR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).replace(',', ' à');
}

// LOCAL DB — sql.js + IndexedDB
// ════════════════════════════════════════════════
const IDB_KEY = 'spotifyplus_db';

// Connexion unique réutilisée : avant, chaque get/set ouvrait une nouvelle connexion jamais fermée
let _idbPromise = null;
function idbOpen() {
  if (_idbPromise) return _idbPromise;
  _idbPromise = new Promise((res, rej) => {
    const req = indexedDB.open('spotifyplus', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('db');
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => { _idbPromise = null; rej(e); };
  });
  return _idbPromise;
}
async function idbGet(key) {
  const db  = await idbOpen();
  return new Promise((res, rej) => {
    const tx  = db.transaction('db', 'readonly');
    const req = tx.objectStore('db').get(key);
    req.onsuccess = () => res(req.result);
    req.onerror   = rej;
  });
}
async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('db', 'readwrite');
    tx.objectStore('db').put(value, key);
    tx.oncomplete = res;
    tx.onerror    = rej;
  });
}

let _db = null;

async function initDB() {
  const SQL   = await initSqlJs({ locateFile: f => `./vendor/${f}` });
  const saved = await idbGet(IDB_KEY);
  if (saved) {
    _db = new SQL.Database(new Uint8Array(saved));
  } else {
    _db = new SQL.Database();
    _db.run(`
      CREATE TABLE IF NOT EXISTS tracks (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        spotify_uri TEXT UNIQUE NOT NULL,
        artist_name TEXT NOT NULL,
        title TEXT NOT NULL,
        release_title TEXT,
        release_type TEXT,
        release_date TEXT,
        cover_url TEXT,
        duration_ms INTEGER,
        listened INTEGER DEFAULT 0,
        added_at TEXT DEFAULT (datetime('now'))
      );
      CREATE TABLE IF NOT EXISTS artists_scraped (
        spotify_id TEXT PRIMARY KEY,
        last_scraped_at TEXT NOT NULL,
        name TEXT,                            -- nom de l'artiste (depuis /me/following)
        image_url TEXT,                       -- pochette artiste (images[0].url)
        popularity INTEGER,                   -- 0-100 (depuis /me/following)
        followers INTEGER,                    -- nombre d'abonnés (followers.total)
        genres TEXT,                          -- JSON.stringify(genres[]) — tableau de genres
        spotify_url TEXT,                     -- external_urls.spotify
        last_release_count INTEGER DEFAULT 0, -- sorties trouvées au dernier scan
        total_tracks_added INTEGER DEFAULT 0, -- cumul des titres ajoutés pour cet artiste
        last_scan_status TEXT,                -- 'ok' | 'error' (albums inaccessibles)
        scan_count INTEGER DEFAULT 0          -- nombre de scans réussis
      );
      CREATE TABLE IF NOT EXISTS stats (
        id INTEGER PRIMARY KEY CHECK (id = 1),
        total_listened INTEGER DEFAULT 0,
        listened_this_month INTEGER DEFAULT 0,
        listened_this_year INTEGER DEFAULT 0,
        last_reset_month TEXT,
        last_reset_year TEXT
      );
    `);
    _db.run("INSERT OR IGNORE INTO stats (id) VALUES (1)");
  }
  // Migrations idempotentes
  try { _db.run("ALTER TABLE tracks ADD COLUMN liked INTEGER DEFAULT 0"); } catch {}
  try { _db.run("ALTER TABLE tracks ADD COLUMN listened_at TEXT"); } catch {} // horodatage de l'écoute (historique)
  try { _db.run("ALTER TABLE stats ADD COLUMN total_listened_ms INTEGER DEFAULT 0"); } catch {}
  try { _db.run("ALTER TABLE stats ADD COLUMN total_liked INTEGER DEFAULT 0"); } catch {}
  // Métadonnées artiste (gratuites : déjà dans l'objet /me/following) + compteurs de scan
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN name TEXT"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN image_url TEXT"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN popularity INTEGER"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN followers INTEGER"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN genres TEXT"); } catch {}            // JSON array
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN spotify_url TEXT"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN last_release_count INTEGER DEFAULT 0"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN total_tracks_added INTEGER DEFAULT 0"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN last_scan_status TEXT"); } catch {}
  try { _db.run("ALTER TABLE artists_scraped ADD COLUMN scan_count INTEGER DEFAULT 0"); } catch {}
  // Mémoire des titres purgés : le DELETE de la purge fait sortir l'URI de `tracks`, et un
  // re-scan du même album (cutoff tronqué au jour, scan partiel non terminé…) réinsérait le
  // titre comme NON écouté. Table minuscule (une URI par ligne), alimentée par purgeListened
  // et chargée dans knownUris au boot — jamais purgée.
  _db.run("CREATE TABLE IF NOT EXISTS purged_uris (spotify_uri TEXT PRIMARY KEY)");
  return _db;
}

// Sérialisation des sauvegardes : jamais deux exports/écritures IndexedDB en parallèle.
// Pas de debounce temporel : chaque appel garantit une écriture incluant ses données
// (la boucle do/while ré-exporte si un appel est arrivé pendant l'écriture en cours).
let _savePromise = null;
let _saveQueued  = false;
async function saveDB() {
  if (!_db) return;
  if (_savePromise) { _saveQueued = true; return _savePromise; }
  _savePromise = (async () => {
    do {
      _saveQueued = false;
      const data = _db.export();
      await idbSet(IDB_KEY, data.buffer);
    } while (_saveQueued);
  })();
  try { await _savePromise; } finally { _savePromise = null; }
}

function dbRun(sql, params = []) {
  _db.run(sql, params);
}

function dbAll(sql, params = []) {
  const stmt = _db.prepare(sql);
  if (params.length) stmt.bind(params);
  const rows = [];
  while (stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}

function dbGet(sql, params = []) {
  return dbAll(sql, params)[0] || null;
}

function loadListenStatsFromDB() {
  // Une seule requête : la ligne stats + les deux agrégats sur tracks en sous-requêtes
  // (appelée après chaque écoute/like/purge — autant éviter 3 allers-retours sql.js)
  const s = dbGet(
    "SELECT s.*, " +
    "(SELECT COUNT(*) FROM tracks WHERE listened = 0) AS rem_count, " +
    "(SELECT SUM(duration_ms) FROM tracks WHERE listened = 0) AS rem_ms " +
    "FROM stats s WHERE s.id = 1"
  );
  return {
    remaining:    s?.rem_count || 0,
    remaining_ms: s?.rem_ms    || 0,
    this_month:   s?.listened_this_month  || 0,
    this_year:    s?.listened_this_year   || 0,
    all_time:     s?.total_listened       || 0,
    listened_ms:  s?.total_listened_ms    || 0,
    total_liked:  s?.total_liked          || 0,
  };
}

function loadLikedTracksFromDB() {
  return dbAll(
    "SELECT * FROM tracks WHERE liked = 1 ORDER BY id DESC LIMIT 500"
  ).map(r => ({
    id: r.id,

}

// Historique des écoutes : titres écoutés (listened=1) non purgés, le plus récent en haut.
// Les anciennes lignes sans listened_at (avant la migration) retombent en bas (NULL = dernier en DESC).
function loadHistoryFromDB() {

// Mappe une ligne DB `tracks` → item du feed (forme attendue par FeedList/les players)
function mapFeedRow(t) {
  return {
    id:         t.spotify_uri,
    spotifyUri: t.spotify_uri,
    label:      t.release_type === 'single' ? 'Single' : t.release_type === 'discover_weekly' ? 'Découvertes' : 'Album',
    artist:     t.artist_name,
    title:      t.title,
    subtitle:   t.release_type === 'discover_weekly' ? 'Découvertes de la semaine' : t.release_type !== 'single' ? t.release_title : null,
    date:       t.release_date ? new Date(t.release_date).toLocaleDateString('fr-FR', { day:'2-digit', month:'short' }) : '',
    scraped_at: t.added_at ? new Date(t.added_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'short' }) : null,
    image:      t.cover_url,
    isNew:       false,
    liked:       t.liked || 0,
    rawDate:     t.release_date || '',
    duration_ms: t.duration_ms || 0,
  };
}

// Charge les titres non écoutés du feed depuis la DB, en appliquant les filtres/tri EN SQL
// (pas seulement sur les 1000 titres chargés en mémoire) → tout filtre/tri actif balaie
// TOUTE la base, hors du cap des 1000 :
// - filterType : 'single' | 'album' | 'dw' | 'all'  → WHERE sur release_type
// - sortBy     : 'date_asc' | 'artist' | 'default'  → ORDER BY release_date / artist_name / id
// - artistSearch : LIKE sur artist_name
// Le cap LIMIT 1000 reste (rendu), mais il s'applique APRÈS filtre/tri : on voit donc bien
// les Singles / les plus anciens / l'artiste recherché même au-delà de la 1000e ligne.
function loadFeedFromDB({ artistSearch = '', filterType = 'all', sortBy = 'default', genre = '' } = {}) {
  const where = ['listened = 0'];
  const params = [];
  const s = (artistSearch || '').trim();
  if (s) {
    // Échappe les jokers SQL (% _ et l'échappeur \) : taper "100%" ou "_" doit chercher
    // ces caractères littéralement, pas se comporter comme un joker LIKE
    where.push("LOWER(artist_name) LIKE '%' || LOWER(?) || '%' ESCAPE '\\'");
    params.push(s.replace(/[\\%_]/g, m => '\\' + m));
  }
  if (genre) {
    // Filtre par genre via les métadonnées artiste (genres = JSON.stringify(genres[])) :
    // le motif '"<genre>"' matche l'entrée JSON exacte. Ne couvre que les titres dont
    // l'artist_name correspond à un artiste scanné (les tracks Découvertes multi-artistes
    // "A, B" ne matchent pas — assumé).
    where.push("artist_name IN (SELECT name FROM artists_scraped WHERE genres LIKE '%' || ? || '%')");
    params.push('"' + genre + '"');
  }
  if (filterType === 'single')     where.push("release_type = 'single'");
  else if (filterType === 'dw')    where.push("release_type = 'discover_weekly'");
  else if (filterType === 'album') where.push("(release_type IS NULL OR release_type NOT IN ('single','discover_weekly'))");
  let order = 'id ASC';
  if (sortBy === 'date_asc')    order = 'release_date ASC, id ASC';
  else if (sortBy === 'artist') order = 'artist_name COLLATE NOCASE ASC, id ASC';
  const sql = `SELECT * FROM tracks WHERE ${where.join(' AND ')} ORDER BY ${order} LIMIT 1000`;
  return dbAll(sql, params).map(mapFeedRow);
}

// Liste des artistes scrappés (table artists_scraped) + métadonnées, le plus
// récemment scanné en premier. Parse le JSON des genres de façon défensive.
function loadArtistsFromDB() {
  return dbAll(
    "SELECT * FROM artists_scraped ORDER BY last_scraped_at DESC"
  ).map(r => {
    let genres = [];
    try { genres = r.genres ? JSON.parse(r.genres) : []; } catch {}
    return {
      id:               r.spotify_id,
      name:             r.name || null,
      image:            r.image_url || null,
      popularity:       (r.popularity ?? null),
      followers:        (r.followers ?? null),
      genres:           Array.isArray(genres) ? genres : [],
      spotifyUrl:       r.spotify_url || null,
      lastScrapedAt:    r.last_scraped_at,
      lastReleaseCount: r.last_release_count || 0,
      totalTracksAdded: r.total_tracks_added || 0,
      lastScanStatus:   r.last_scan_status || null,
      scanCount:        r.scan_count || 0,
    };
  });
}

// ════════════════════════════════════════════════
// DÉCOUVERTES DE LA SEMAINE — import hebdo auto
// ════════════════════════════════════════════════
const DW_LS_KEY      = 'spotifyplus_dw_last_import';
const DW_MAX_AGE_MS  = 7 * 24 * 60 * 60 * 1000; // 7 jours (cooldown après un import réussi)
const DW_FAIL_KEY    = 'spotifyplus_dw_last_fail';
const DW_FAIL_AGE_MS = 6 * 60 * 60 * 1000;      // 6 h (cooldown après un échec — auto-réparant)

// Lit le contenu d'une playlist en tolérant l'état de migration de l'app Spotify :
// essaie le nouvel endpoint /items PUIS l'ancien /tracks (certaines apps ont encore l'un
// ou l'autre). additional_types=track force le retour des pistes. Retourne { items } | { rate_limited }.
async function fetchPlaylistItems(playlistId) {
  const urls = [
    `https://api.spotify.com/v1/playlists/${playlistId}/items?limit=50&additional_types=track`,
    `https://api.spotify.com/v1/playlists/${playlistId}/tracks?limit=50&additional_types=track`,
  ];
  for (const url of urls) {
    const data = await apiGet(url);
    if (data?.rate_limited) return { rate_limited: true };
    if (Array.isArray(data?.items) && data.items.length) return { items: data.items };
  }
  return { items: [] };
}

async function importDiscoverWeekly(addLog) {
  const lastOk   = localStorage.getItem(DW_LS_KEY);
  if (lastOk && Date.now() - parseInt(lastOk) < DW_MAX_AGE_MS) return;       // déjà importé récemment
  const lastFail = localStorage.getItem(DW_FAIL_KEY);
  if (lastFail && Date.now() - parseInt(lastFail) < DW_FAIL_AGE_MS) return;  // échec récent — petit cooldown
  if (Date.now() < _rlUntil) return; // fenêtre rate-limit active — ne pas insister, retentera au prochain login

  addLog('── Import Découvertes de la semaine ──', 'info');

  // Chercher la playlist parmi les playlists de l'utilisateur (toutes pages)
  let playlistId = null;
  let nextUrl = 'https://api.spotify.com/v1/me/playlists?limit=50';
  while (nextUrl && !playlistId) {
    const data = await apiGet(nextUrl);
    if (data?.rate_limited) return; // fenêtre 429 — retentera au prochain login
    if (!data?.items) break;
    const pl = data.items.find(p => {
      const n = (p.name || '').toLowerCase();
      // Discover Weekly est éditée par Spotify (owner 'spotify'), mais on tolère aussi un
      // owner différent au cas où le nom correspond (playlist clonée/renommée par l'utilisateur).
      return n.includes('découvertes de la semaine') || n.includes('discover weekly')
        || (p.owner?.id === 'spotify' && (n.includes('découvertes') || n.includes('discover')));
    });
    if (pl) playlistId = pl.id;
    nextUrl = data.next || null;
  }

  if (!playlistId) {
    addLog('⚠ Playlist "Découvertes de la semaine" introuvable dans tes playlists — ouvre-la sur Spotify et clique "Ajouter à ta bibliothèque", puis reconnecte-toi.', 'warn');
    localStorage.setItem(DW_FAIL_KEY, Date.now().toString()); // re-tentera dans 6 h
    return;
  }

  const today = new Date().toISOString().slice(0, 10);
  // Migration Spotify fév. 2026 : /tracks → /items, et le contenu n'est renvoyé QUE pour les
  // playlists possédées/collaboratives. "Découvertes de la semaine" appartient à Spotify → l'API
  // peut refuser (403) ou renvoyer sans items. On essaie /items ET /tracks (fetchPlaylistItems).
  const tracksData = await fetchPlaylistItems(playlistId);
  if (tracksData.rate_limited) return; // fenêtre 429 — retentera au prochain login
  if (!tracksData.items.length) {
    addLog('⚠ Contenu de "Découvertes de la semaine" inaccessible (403/vide). Depuis la migration Spotify de février 2026, les playlists éditoriales Spotify ne sont plus toujours lisibles par les apps tierces. Nouvel essai dans 6 h.', 'warn');
    localStorage.setItem(DW_FAIL_KEY, Date.now().toString()); // cooldown court, auto-réparant
    return;
  }

  let added = 0;
  // Titres écoutés puis purgés : leur URI n'est plus dans `tracks`, ne pas les réimporter
  let dwPurged = new Set();
  try { dwPurged = new Set(dbAll("SELECT spotify_uri FROM purged_uris").map(r => r.spotify_uri)); } catch {}
  for (const entry of tracksData.items) {
    const t = entry.item || entry.track; // champ renommé track → item par la migration 2026
    if (!t?.uri || t.is_local) continue;
    if (dwPurged.has(t.uri)) continue;
    try {
      dbRun(
        "INSERT OR IGNORE INTO tracks (spotify_uri, artist_name, title, release_title, release_type, release_date, cover_url, duration_ms) VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
        [t.uri, t.artists?.map(a => a.name).join(', ') || '?', t.name, 'Découvertes de la semaine', 'discover_weekly', today, t.album?.images?.[1]?.url || t.album?.images?.[0]?.url || null, t.duration_ms || null]
      );
      added++;
    } catch {}
  }

  // Succès (contenu lu) : cooldown 7 j + on efface le marqueur d'échec
  localStorage.setItem(DW_LS_KEY, Date.now().toString());
  localStorage.removeItem(DW_FAIL_KEY);
  if (added > 0) {
    await saveDB();
    addLog(`✓ ${added} titre(s) de "Découvertes de la semaine" ajoutés au feed`, 'ok');
  } else {
    addLog('Découvertes de la semaine : tous les titres sont déjà dans le feed', 'info');
  }
}

// Une release_date Spotify a une précision variable : 'day' ("2026-05-10"), 'month'
// ("2026-05") ou 'year' ("2026"). new Date("2026") → 1er janvier : une nouveauté datée à
// l'année seule passait alors SOUS le cutoff (ex. 2026-03-15) et était ratée. On considère
// la date comme une PÉRIODE [début, fin] et on garde la sortie si cette période CHEVAUCHE
// [cutoff, ceiling] — les doublons éventuels sont absorbés par INSERT OR IGNORE.
function releaseInRange(dateStr, cutoff, ceiling) {
  if (!dateStr) return false;
  const p = String(dateStr).split('-');
  const y = parseInt(p[0]);
  if (!Number.isFinite(y)) return false;
  let start, end;
  if (p.length >= 3)      { start = new Date(Date.UTC(y, (parseInt(p[1])||1) - 1, parseInt(p[2])||1)); end = start; }
  else if (p.length === 2){ const m = (parseInt(p[1])||1) - 1; start = new Date(Date.UTC(y, m, 1)); end = new Date(Date.UTC(y, m + 1, 0)); }
  else                    { start = new Date(Date.UTC(y, 0, 1)); end = new Date(Date.UTC(y, 11, 31)); }
  return end >= cutoff && start <= ceiling;
}
