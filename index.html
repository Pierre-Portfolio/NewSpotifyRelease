// ════════════════════════════════════════════════
// TV TIME — suivi perso séries & films via l'API TMDB v3 (gratuite : PAS de plafond
// journalier depuis 2019, seulement un rate-limit ~50 req/s — largement suffisant).
// Clé API à générer sur themoviedb.org (Paramètres → API) et à coller dans l'UI
// (stockée en localStorage) — ou en dur dans TMDB_API_KEY.
// ⚠ OPTIMISATION REQUÊTES : TOUT ce que renvoie l'API (titre, affiche, durée, saisons,
// nb d'épisodes, prochain épisode) est mis en cache dans localStorage à l'ajout (1 seule
// requête /tv/{id} ou /movie/{id}) — l'affichage et les stats ne redemandent JAMAIS rien.
// Seul le refresh des « prochaines sorties » ré-interroge /tv/{id} des séries suivies
// NON terminées, avec un TTL de 24h (+ bouton ↻ manuel).
// ════════════════════════════════════════════════
const TVTIME_COLOR = '#38c98a';   // vert-cyan de l'arc-en-ciel (entre Finance et To do)
const TMDB_API_KEY = '';          // clé v3 en dur (optionnelle) — sinon saisie dans l'UI
const TMDB_KEY_LS  = 'spotifyplus_tmdb_key';
const TVTIME_LS_KEY = 'spotifyplus_tvtime';
const TVTIME_FILTER_LS = 'spotifyplus_tvtime_filter';  // 'all' | 'movie' | 'tv' | 'youtube' — filtre persisté
const YT_KEY_LS = 'spotifyplus_yt_key';   // clé API YouTube Data v3 (séparée de la clé TMDB)
const YT_COLOR = '#ff4d4d';               // rouge YouTube (filtre + accents de la section)
const YT_MAX_VIDEOS = 500;                // plafond de vidéos récupérées par chaîne/playlist (quota + localStorage)
const YT_NEW_CHECK_TTL = 6 * 3600 * 1000; // 6h — TTL du check auto « nouvelles vidéos » au login (économie de quota)
const TVTIME_SORT_LS = 'spotifyplus_tvtime_sort';      // tri des listes (clé de TVTIME_SORTS) persisté
const TVTIME_SORTS = [
  ['added_desc', 'Ajout récent'],
  ['added_asc',  'Ajout ancien'],
  ['name',       'Nom A→Z'],
  ['year_desc',  'Sortie récente'],
  ['year_asc',   'Sortie ancienne'],
];
const TMDB_IMG = 'https://image.tmdb.org/t/p/w92';   // affiches (vignettes)
const TMDB_STILL = 'https://image.tmdb.org/t/p/w185'; // vignettes d'épisodes (16:9)
const TV_REFRESH_TTL = 24 * 60 * 60 * 1000;          // TTL du refresh « prochaines sorties »
const TVTIME_EPS_LS = 'spotifyplus_tvtime_eps';      // cache des épisodes par saison
const TV_EPS_TTL = 7 * 24 * 60 * 60 * 1000;          // TTL du cache épisodes (7 j)
const TV_EPS_CACHE_MAX = 80;                          // nb max de saisons en cache (éviction des plus anciennes)

function tmdbKey() { try { return (localStorage.getItem(TMDB_KEY_LS) || '').trim() || TMDB_API_KEY; } catch { return TMDB_API_KEY; } }
function loadTvItems() { try { return JSON.parse(localStorage.getItem(TVTIME_LS_KEY)) || []; } catch { return []; } }
function saveTvItems(items) { try { localStorage.setItem(TVTIME_LS_KEY, JSON.stringify(items)); } catch {} }

// GET https://api.themoviedb.org/3{path} — retourne le JSON ou null (erreur / clé absente)
async function tmdbGet(path, params = {}) {
  const key = tmdbKey();
  if (!key) return null;
  const q = new URLSearchParams({ api_key: key, language: 'fr-FR', ...params });
  try {
    const res = await fetch(`https://api.themoviedb.org/3${path}?${q}`);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

// ════════════════════════════════════════════════
// YouTube Data API v3 — chaînes & playlists suivies dans TV Time (type:'youtube').
// Clé dédiée (spotifyplus_yt_key). Coût quota : channels/playlists/videos.list = 1 unité,
// playlistItems.list = 1 unité/page de 50, search.list = 100 (utilisé en dernier recours).
// Récupération des uploads d'une chaîne = playlist "uploads" paginée → très économe.
// ════════════════════════════════════════════════
function ytKey() { try { return (localStorage.getItem(YT_KEY_LS) || '').trim(); } catch { return ''; } }

async function ytApi(path, params = {}) {
  const key = ytKey();
  if (!key) return null;
  const q = new URLSearchParams({ key, ...params });
  try {
    const res = await fetch(`https://www.googleapis.com/youtube/v3/${path}?${q}`);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

// Durée ISO 8601 (PT1H2M3S) → minutes arrondies
function ytParseDuration(iso) {
  const m = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso || '');
  if (!m) return 0;
  return Math.round((+(m[1] || 0)) * 60 + (+(m[2] || 0)) + (+(m[3] || 0)) / 60);
}

// Analyse un lien / id YouTube → { kind, id|handle|name|q }
function parseYoutubeInput(raw) {
  const s = (raw || '').trim();
  if (!s) return null;
  let m = s.match(/[?&]list=([\w-]+)/);
  if (m) return { kind: 'playlist', id: m[1] };
  if (/^(PL|UU|FL|OL|RD)[\w-]{10,}$/.test(s)) return { kind: 'playlist', id: s };
  m = s.match(/\/channel\/(UC[\w-]{20,})/);
  if (m) return { kind: 'channel', id: m[1] };
  if (/^UC[\w-]{20,}$/.test(s)) return { kind: 'channel', id: s };
  m = s.match(/\/@([\w.\-]+)/) || s.match(/^@([\w.\-]+)$/);
  if (m) return { kind: 'handle', handle: m[1] };
  m = s.match(/\/user\/([\w.\-]+)/);
  if (m) return { kind: 'user', name: m[1] };
  m = s.match(/\/c\/([\w.\-]+)/);
  if (m) return { kind: 'search', q: m[1] };
  if (/^[\w.\-]+$/.test(s)) return { kind: 'handle', handle: s };
  return { kind: 'search', q: s };
}

// Résout une chaîne → { channelId, uploads (playlist), title, thumb }
async function ytResolveChannel(parsed) {
  let d = null;
  if (parsed.kind === 'channel') d = await ytApi('channels', { part: 'snippet,contentDetails', id: parsed.id });
  else if (parsed.kind === 'handle') d = await ytApi('channels', { part: 'snippet,contentDetails', forHandle: '@' + parsed.handle.replace(/^@/, '') });
  else if (parsed.kind === 'user') d = await ytApi('channels', { part: 'snippet,contentDetails', forUsername: parsed.name });
  if (!d || !d.items || !d.items.length) {
    const q = parsed.q || parsed.handle || parsed.name;
    if (q) {
      const sr = await ytApi('search', { part: 'snippet', type: 'channel', maxResults: '1', q });
      const cid = sr && sr.items && sr.items[0] && sr.items[0].id && sr.items[0].id.channelId;
      if (cid) d = await ytApi('channels', { part: 'snippet,contentDetails', id: cid });
    }
  }
  const it = d && d.items && d.items[0];
  if (!it) return null;
  const th = (it.snippet && it.snippet.thumbnails) || {};
  return {
    channelId: it.id,
    uploads: it.contentDetails && it.contentDetails.relatedPlaylists && it.contentDetails.relatedPlaylists.uploads,
    title: (it.snippet && it.snippet.title) || 'Chaîne YouTube',
    thumb: (th.medium || th.default || {}).url || null,
  };
}

// Pagine une playlist → [{ id, title, date:'YYYY-MM-DD', still }] (plafonné à YT_MAX_VIDEOS,
// ou SANS limite si max = Infinity — bouton « récupérer toutes les vidéos » d'une chaîne).
async function ytFetchPlaylistVideos(playlistId, max = YT_MAX_VIDEOS) {
  const out = [];
  let pageToken = '';
  // 40 pages (2000 vidéos) par défaut ; garde-fou 1000 pages (50k) en mode illimité
  const pageCap = Number.isFinite(max) ? 40 : 1000;
  for (let i = 0; i < pageCap && out.length < max; i++) {
    const d = await ytApi('playlistItems', { part: 'snippet,contentDetails', maxResults: '50', playlistId, ...(pageToken ? { pageToken } : {}) });
    if (!d || !d.items) break;
    for (const e of d.items) {
      const vid = e.contentDetails && e.contentDetails.videoId;
      if (!vid) continue;
      const sn = e.snippet || {};
      const th = sn.thumbnails || {};
      out.push({
        id: vid,
        title: sn.title || '(sans titre)',
        date: (((e.contentDetails && e.contentDetails.videoPublishedAt) || sn.publishedAt) || '').slice(0, 10),
        still: (th.medium || th.default || {}).url || null,
      });
    }
    pageToken = d.nextPageToken || '';
    if (!pageToken) break;
  }
  return out.slice(0, max);
}

// Durées de vidéos (batch de 50) → Map id → minutes
async function ytFetchDurations(ids) {
  const map = new Map();
  for (let i = 0; i < ids.length; i += 50) {
    const d = await ytApi('videos', { part: 'contentDetails', id: ids.slice(i, i + 50).join(',') });
    if (d && d.items) for (const v of d.items) map.set(v.id, ytParseDuration(v.contentDetails && v.contentDetails.duration));
  }
  return map;
}

// Construit un item TV Time 'youtube' à partir d'un lien (chaîne ou playlist). Les vidéos
// sont groupées en « saisons » = ANNÉES de publication. Retourne l'item ou { error }.
async function ytBuildItem(raw, opts = {}) {
  if (!ytKey()) return { error: 'Clé API YouTube manquante.' };
  const parsed = parseYoutubeInput(raw);
  if (!parsed) return { error: 'Lien YouTube invalide.' };
  const cap = opts.unlimited ? Infinity : YT_MAX_VIDEOS;   // sans plafond si l'utilisateur l'a demandé
  let playlistId, title, thumb, ytKind, srcId;
  if (parsed.kind === 'playlist') {
    ytKind = 'playlist'; playlistId = parsed.id; srcId = parsed.id;
    const d = await ytApi('playlists', { part: 'snippet', id: parsed.id });
    const pi = d && d.items && d.items[0];
    if (!pi) return { error: 'Playlist introuvable (lien ou clé invalide).' };
    title = (pi.snippet && pi.snippet.title) || 'Playlist YouTube';
    const th = (pi.snippet && pi.snippet.thumbnails) || {};
    thumb = (th.medium || th.default || {}).url || null;
  } else {
    ytKind = 'channel';
    const ch = await ytResolveChannel(parsed);
    if (!ch || !ch.uploads) return { error: 'Chaîne introuvable (lien ou clé invalide).' };
    playlistId = ch.uploads; srcId = ch.channelId; title = ch.title; thumb = ch.thumb;
  }
  const videos = await ytFetchPlaylistVideos(playlistId, cap);
  if (!videos.length) return { error: 'Aucune vidéo trouvée pour ce lien.' };
  const durs = await ytFetchDurations(videos.map(v => v.id));
  for (const v of videos) v.dur = durs.get(v.id) || 0;
  videos.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));   // chrono croissant
  const byYear = {};
  for (const v of videos) { const y = (v.date || '').slice(0, 4) || '—'; (byYear[y] = byYear[y] || []).push(v); }
  const seasons = Object.keys(byYear).sort().map(y => ({ n: y, eps: byYear[y].length }));   // saison = année
  const totalMin = videos.reduce((a, v) => a + (v.dur || 0), 0);
  return {
    id: srcId, type: 'youtube', ytKind,
    title, poster: thumb,
    year: (videos[videos.length - 1].date || '').slice(0, 4),   // année la plus récente
    status: 'watching', addedAt: Date.now(),
    seasons, totalEps: videos.length,
    epRuntime: videos.length ? Math.round(totalMin / videos.length) : 0,
    videos, watchedIds: [],
    refreshedAt: Date.now(),
    unlimited: !!opts.unlimited,   // plafond 500 retiré pour cette chaîne
  };
}

// Appelé au login : ré-interroge l'API YouTube pour chaque chaîne/playlist suivie (TTL 6h par
// item via refreshedAt) et détecte les NOUVELLES vidéos. Une série marquée « vue » (status
// 'done') qui a une nouvelle vidéo repasse automatiquement EN COURS ('watching'). Préserve les
// vues (watchedIds), le statut (sauf le repassage en cours) et les labels manga/cartoon.
// Écrit directement dans localStorage (loadTvItems/saveTvItems) — ne dépend pas du montage du
// panneau TV Time. Retourne true si au moins un item a changé.
async function ytCheckNewVideos() {
  if (!ytKey()) return false;
  const cur = loadTvItems();
  const yts = cur.filter(x => x.type === 'youtube');
  if (!yts.length) return false;
  const now = Date.now();
  const patches = new Map();   // id → { built, hasNew }
  for (const it of yts) {
    if (it.dropped) continue;   // « ne plus suivre » → jamais de recherche de nouveautés
    if (now - (it.refreshedAt || 0) < YT_NEW_CHECK_TTL) continue;   // encore frais → skip (quota)
    const built = await ytBuildItem(it.id, { unlimited: it.unlimited });   // préserve le plafond retiré
    if (!built || built.error) continue;
    const oldIds = new Set((it.videos || []).map(v => v.id));
    const hasNew = (built.videos || []).some(v => !oldIds.has(v.id));
    patches.set(it.id, { built, hasNew });
  }
  if (!patches.size) return false;
  // Relit l'état le plus récent avant d'écrire (une action a pu se produire entre-temps)
  const latest = loadTvItems();
  let changed = false;
  const next = latest.map(x => {
    if (x.type !== 'youtube' || !patches.has(x.id)) return x;
    const { built, hasNew } = patches.get(x.id);
    const merged = { ...built, watchedIds: x.watchedIds || [], status: x.status,
      doneAt: x.doneAt, manga: x.manga, cartoon: x.cartoon, addedAt: x.addedAt, unlimited: x.unlimited || built.unlimited };
    // Nouvelle vidéo sur une série déjà « vue » → on la remet en cours
    if (hasNew && x.status === 'done') { merged.status = 'watching'; merged.doneAt = undefined; }
    changed = true;
    return merged;
  });
  if (changed) saveTvItems(next);
  return changed;
}

// Détails d'un film/série → item TV Time normalisé et AUTO-SUFFISANT (tout en cache).
// item = { id, type:'movie'|'tv', title, poster, year, status:'towatch'|'watching'|'done',
//          addedAt, doneAt? · film: runtime (min) · série: epRuntime (min/ép.), totalEps,
//          seasons:[{n,eps}], tvStatus, nextEp:{date,s,e,name}|null, refreshedAt, watchedEps }
async function tmdbFetchItem(type, id) {
  const d = await tmdbGet(`/${type}/${id}`);
  if (!d || !d.id) return null;
  const base = {
    id: d.id, type,
    title: (type === 'movie' ? (d.title || d.original_title) : (d.name || d.original_name)) || '?',
    poster: d.poster_path || null,
    year: ((type === 'movie' ? d.release_date : d.first_air_date) || '').slice(0, 4),
    addedAt: Date.now(),
  };
  if (type === 'movie') return { ...base, runtime: d.runtime || 0, overview: d.overview || '', releaseDate: d.release_date || '', refreshedAt: Date.now() };
  // Saisons "spéciales" (n°0) exclues du décompte des épisodes
  const seasons = (d.seasons || []).filter(s => s.season_number > 0 && s.episode_count > 0)
    .map(s => ({ n: s.season_number, eps: s.episode_count }));
  const specialEps = ((d.seasons || []).find(s => s.season_number === 0) || {}).episode_count || 0;
  return {
    ...base,
    specialEps,   // épisodes hors-série (saison 0) — suivis à part, JAMAIS comptés dans totalEps
    specialsSeen: [],   // n° des ép. spéciaux vus (fiche série) — cochage INDIVIDUEL, n'entre pas dans la progression
    epRuntime: (d.episode_run_time && d.episode_run_time[0]) || (d.last_episode_to_air && d.last_episode_to_air.runtime) || 35,
    totalEps: d.number_of_episodes || seasons.reduce((a, s) => a + s.eps, 0),
    seasons,
    tvStatus: d.status || '',   // 'Ended'/'Canceled' → exclue du refresh des prochaines sorties
    nextEp: d.next_episode_to_air
      ? { date: d.next_episode_to_air.air_date || '', s: d.next_episode_to_air.season_number, e: d.next_episode_to_air.episode_number, name: d.next_episode_to_air.name || '' }
      : null,
    refreshedAt: Date.now(),
    watchedEps: 0,
    watchedSet: [],   // épisodes vus (cochage individuel) — voir tvWatchedSet
  };
}

// Ensemble des épisodes vus (SOURCE DE VÉRITÉ, cochage INDIVIDUEL par épisode) — clés
// "S{n}E{e}" (saison, épisode ; hors épisodes spéciaux gérés à part via specialsSeen).
// Permet de cocher n'importe quelle saison/épisode isolément (ex. S28-S32 sans S1-S27).
// `watchedEps` (compteur) est maintenu = watchedSet.length pour les stats/listes.
// Migration : un ancien item n'a que le compteur plat `watchedEps` → on reconstitue le set
// en marquant les N premiers épisodes dans l'ordre des saisons (comportement historique).
function tvWatchedSet(item) {
  if (Array.isArray(item.watchedSet)) return item.watchedSet;
  const out = [];
  let rem = item.watchedEps || 0;
  for (const s of item.seasons || []) {
    for (let e = 1; e <= s.eps && rem > 0; e++, rem--) out.push(`S${s.n}E${e}`);
  }
  return out;
}
// Toutes les clés d'épisodes (hors spéciaux) d'une série — pour « tout vu »
function tvAllKeys(item) {
  const out = [];
  for (const s of item.seasons || []) for (let e = 1; e <= s.eps; e++) out.push(`S${s.n}E${e}`);
  return out;
}
// Dernier épisode vu dans l'ordre des saisons (pour le bouton −1) — clé "S{n}E{e}" ou null
function tvLastWatched(item) {
  const set = new Set(tvWatchedSet(item));
  let last = null;
  for (const s of item.seasons || []) for (let e = 1; e <= s.eps; e++) { const k = `S${s.n}E${e}`; if (set.has(k)) last = k; }
  return last;
}

// Prochain épisode À REGARDER (1er épisode non vu dans l'ordre) — "S2E5" (= clé du set)
function tvNextToWatch(item) {
  const set = new Set(tvWatchedSet(item));
  for (const s of item.seasons || []) {
    for (let e = 1; e <= s.eps; e++) { const k = `S${s.n}E${e}`; if (!set.has(k)) return k; }
  }
  return null; // tout est vu
}

// Série « à jour » (rattrapée) : tous les épisodes DIFFUSÉS sont vus et le prochain épisode
// à regarder n'est pas encore sorti (nextEp dans le futur). Une telle série ne doit PAS
// apparaître dans EN COURS (rien à regarder maintenant) — seulement dans PROCHAINES SORTIES.
function tvCaughtUp(item) {
  if (!item || item.type !== 'tv' || !item.nextEp || !item.nextEp.date) return false;
  if (tvDaysUntil(item.nextEp.date) <= 0) return false;   // le prochain épisode est déjà sorti → à regarder
  const nk = tvNextToWatch(item);   // 1er épisode non vu, ou null si tout vu
  if (!nk) return true;
  const m = nk.match(/^S(\d+)E(\d+)$/);
  if (!m) return true;
  const ns = +m[1], ne = +m[2];
  // À jour si le 1er épisode non vu est le prochain à diffuser (non sorti) ou au-delà :
  // tous les épisodes déjà diffusés sont donc vus.
  return ns > item.nextEp.s || (ns === item.nextEp.s && ne >= item.nextEp.e);
}

// Décompte des épisodes vus PAR SAISON (membres du set) — pour la fiche série.
// Retourne [{ n, eps, watched }] (chaque saison indépendante des autres)
function tvSeasonBreakdown(item) {
  const set = new Set(tvWatchedSet(item));
  return (item.seasons || []).map(s => {
    let watched = 0;
    for (let e = 1; e <= s.eps; e++) if (set.has(`S${s.n}E${e}`)) watched++;
    return { n: s.n, eps: s.eps, watched };
  });
}

// Épisodes spéciaux (saison 0) vus — modèle par ép. INDIVIDUEL (cocher un spécial ne
// coche PAS les précédents, contrairement aux saisons officielles qui restent cumulatives).
// Migration de l'ancien compteur plat `watchedSpecials` (int) → [1..n] (les ép. de saison 0
// TMDB sont généralement numérotés 1..N).
function tvSpecialsSeen(item) {
  if (Array.isArray(item.specialsSeen)) return item.specialsSeen;
  const n = Math.min(item.watchedSpecials || 0, item.specialEps || 0);
  return n > 0 ? Array.from({ length: n }, (_, i) => i + 1) : [];
}

// Épisodes d'une saison (fiche série dépliée) — 1 requête /tv/{id}/season/{n} PAR SAISON,
// uniquement au 1er dépliage, puis cache localStorage 7 j (+ cache mémoire session).
// Retourne [{ e, name, still }] ou null (erreur réseau / clé absente — le caller génère
// alors des épisodes placeholder pour que les coches restent utilisables hors-ligne).
const _tvEpsCache = {};   // mémoire session — évite de re-parser le localStorage à chaque render
async function tvFetchSeasonEps(tvId, n) {
  const key = `${tvId}:${n}`;
  if (_tvEpsCache[key]) return _tvEpsCache[key];
  let store = {};
  try { store = JSON.parse(localStorage.getItem(TVTIME_EPS_LS)) || {}; } catch {}
  const hit = store[key];
  if (hit && Date.now() - (hit.at || 0) < TV_EPS_TTL) { _tvEpsCache[key] = hit.eps; return hit.eps; }
  const d = await tmdbGet(`/tv/${tvId}/season/${n}`);
  if (!d || !Array.isArray(d.episodes)) return (hit && hit.eps) || null;  // échec → cache périmé plutôt que rien
  const eps = d.episodes.map(ep => ({ e: ep.episode_number, name: ep.name || '', still: ep.still_path || null, date: ep.air_date || null }));
  _tvEpsCache[key] = eps;
  store[key] = { at: Date.now(), eps };
  // Éviction des saisons les plus anciennes si le cache grossit trop
  const keys = Object.keys(store);
  if (keys.length > TV_EPS_CACHE_MAX) {
    keys.sort((a, b) => (store[a].at || 0) - (store[b].at || 0))
      .slice(0, keys.length - TV_EPS_CACHE_MAX).forEach(k => delete store[k]);
  }
  try { localStorage.setItem(TVTIME_EPS_LS, JSON.stringify(store)); } catch {}
  return eps;
}

// Statut de production TMDB → libellé FR pour la fiche série
function tvStatusFR(s) {
  if (/ended/i.test(s || '')) return 'Terminée';
  if (/canceled/i.test(s || '')) return 'Annulée';
  if (/returning/i.test(s || '')) return 'En cours de diffusion';
  if (/production|planned|pilot/i.test(s || '')) return 'En production';
  return s || '';
}

// Jours avant une date ISO 'YYYY-MM-DD' (minuit local) — 0 = aujourd'hui, négatif = passée
function tvDaysUntil(iso) {
  if (!iso) return null;
  // Tolère les dates PARTIELLES de TMDB (film annoncé "2027" ou "2027-06") : on complète
  // au 1er jour de la période (YYYY → YYYY-01-01, YYYY-MM → YYYY-MM-01). Sans ça,
  // new Date('2027T00:00:00') = Invalid → NaN → le film disparaissait des Prochaines sorties.
  let d = String(iso);
  if (/^\d{4}$/.test(d)) d += '-01-01';
  else if (/^\d{4}-\d{2}$/.test(d)) d += '-01';
  const t = new Date(d + 'T00:00:00');
  if (isNaN(t)) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((t - today) / 86400000);
}

// Rafraîchit les PROCHAINES SORTIES suivies dont le cache a plus de 24h :
// - séries non 'done' et non terminées (prochain épisode à diffuser)
// - films non vus dont la date de sortie est absente (backfill des films ajoutés avant
//   cette feature) ou encore à venir (aujourd'hui/futur) — une date passée est figée,
//   plus aucune requête.
// SÉQUENTIEL, 1 requête /tv|movie/{id} par titre. Retourne une Map "<type><id>" → champs
// frais (jamais watchedEps/status : les compteurs perso ne sont pas touchés).
async function tvRefreshShows(items, force) {
  const out = new Map();
  if (!tmdbKey()) return out;
  const stale = items.filter(it => {
    if (it.status === 'done') return false;
    if (it.type === 'youtube') return false;   // YouTube : actualisé via le bouton ↻ de sa fiche
    if (it.type === 'tv') return !/^(Ended|Canceled)$/i.test(it.tvStatus || '')
      && (force || Date.now() - (it.refreshedAt || 0) > TV_REFRESH_TTL);
    // Films : suit uniquement la date des films PAS ENCORE VUS
    if (it.releaseDate === undefined) return true;                     // backfill (ajouté avant la feature)
    const upcoming = !it.releaseDate || tvDaysUntil(it.releaseDate) >= 0;
    return upcoming && (force || Date.now() - (it.refreshedAt || 0) > TV_REFRESH_TTL);
  });
  for (let i = 0; i < stale.length; i++) {
    const it = stale[i];
    if (i > 0) await sleep(120);   // throttle : évite un burst si beaucoup de titres à backfill
    const f = await tmdbFetchItem(it.type, it.id);
    if (!f) continue;   // échec → refreshedAt inchangé : nouvel essai au prochain montage du panneau
    if (it.type === 'tv') out.set('tv' + it.id, { seasons: f.seasons, specialEps: f.specialEps, totalEps: f.totalEps, epRuntime: f.epRuntime, tvStatus: f.tvStatus, nextEp: f.nextEp, poster: f.poster || it.poster, refreshedAt: Date.now() });
    else out.set('movie' + it.id, { releaseDate: f.releaseDate, runtime: f.runtime || it.runtime, year: f.year || it.year, poster: f.poster || it.poster, refreshedAt: Date.now() });
  }
  return out;
}

// Stats TV Time (collapse « Stats Film » d'À propos) — 100% depuis le cache localStorage,
// AUCUNE requête API. Films : comptés/temps quand status='done'. Séries : épisodes vus
// (watchedEps, posé à totalEps quand une série est marquée terminée) × durée moyenne/ép.
function tvTimeStats() {
  let movies = 0, movieMin = 0, episodes = 0, epMin = 0, series = 0;
  let movieRemainMin = 0, epRemainMin = 0;   // temps restant à voir (films non vus / épisodes non vus)
  // Manga : label posé sur un film/série (fiche) — non affiché dans les listes, exploité ici
  let mangaTitles = 0, mangaEpisodes = 0, mangaMin = 0;
  // Dessin animé (cartoon) : même mécanique de label que manga
  let cartoonTitles = 0, cartoonEpisodes = 0, cartoonMin = 0;
  // YouTube : chaînes/playlists suivies (vidéos vues cochées individuellement)
  let ytChannels = 0, ytVideos = 0, ytMin = 0, ytRemainMin = 0;
  // Séries par statut (en cours = watching/paused, terminée = done)
  let seriesOngoing = 0, seriesDone = 0;
  // Temps de visionnage détaillé par série (pour le top 5 sous le temps total)
  const seriesTimes = [];
  for (const it of loadTvItems()) {
    let watchedMin = 0, watchedCount = 0;   // vu pour CE titre (film / épisodes / vidéos)
    if (it.type === 'movie') {
      if (it.status === 'done') { movies++; movieMin += it.runtime || 0; watchedMin = it.runtime || 0; }
      else movieRemainMin += it.runtime || 0;   // film à voir (towatch/watching)
    } else if (it.type === 'youtube') {
      const seen = new Set(it.watchedIds || []);
      ytChannels++;
      for (const v of (it.videos || [])) { if (seen.has(v.id)) { ytMin += v.dur || 0; } else { ytRemainMin += v.dur || 0; } }
      watchedCount = seen.size;
      watchedMin = (it.videos || []).reduce((a, v) => a + (seen.has(v.id) ? (v.dur || 0) : 0), 0);
      ytVideos += watchedCount;
    } else {
      // Les spéciaux vus (specialsSeen, cochés individuellement) comptent dans les stats
      // d'épisodes, mais jamais dans la progression / le passage en « Vu » d'une série
      const w = (it.watchedEps || 0) + Math.min(tvSpecialsSeen(it).length, it.specialEps || 0);
      if (w > 0) series++;
      episodes += w;
      watchedCount = w;
      watchedMin = w * (it.epRuntime || 0);
      epMin += watchedMin;
      if (watchedMin > 0) seriesTimes.push({ title: it.title || 'Série inconnue', min: watchedMin, eps: w, epRuntime: it.epRuntime || 0 });
      // Restant = épisodes non vus (hors spéciaux, non comptés dans totalEps)
      const remain = Math.max(0, (it.totalEps || 0) - (it.watchedEps || 0));
      epRemainMin += remain * (it.epRuntime || 0);
      // Statut de la série : terminée (done) vs encore en cours (watching/paused/towatch)
      if (it.status === 'done') seriesDone++; else seriesOngoing++;
    }
    if (it.manga) {
      mangaTitles++;
      if (it.type !== 'movie') mangaEpisodes += watchedCount;
      mangaMin += watchedMin;
    }
    if (it.cartoon) {
      cartoonTitles++;
      if (it.type !== 'movie') cartoonEpisodes += watchedCount;
      cartoonMin += watchedMin;
    }
  }
  // Top séries par temps de visionnage (desc) — alimente le classement sous le temps total
  const topSeries = seriesTimes.sort((a, b) => b.min - a.min).slice(0, 5);
  return { movies, movieMin, episodes, epMin, series, movieRemainMin, epRemainMin, mangaTitles, mangaEpisodes, mangaMin, cartoonTitles, cartoonEpisodes, cartoonMin, ytChannels, ytVideos, ytMin, ytRemainMin, seriesOngoing, seriesDone, topSeries };
}

// ── Fiche série (popup au clic sur l'affiche) — progression décortiquée par saison.
// Concept type TV Time : « Continuer le suivi » (prochain ép. + coche), une ligne par
// saison (barre + x/y + coche verte). Les épisodes spéciaux (saison 0) sont SUIVABLES
// (ligne dépliable + coches INDIVIDUELLES, liste specialsSeen) mais JAMAIS comptés dans
// les 100 % ni requis pour que la série passe en « Vu ».
function TvDetailModal({ item, onClose, onBump, onSeasonToggle, onToggleEp, onSetSpecials, onStatus, onManga, onCartoon }) {
  const isMovie = item.type === 'movie';
  const total   = item.totalEps || 0;
  const wset    = new Set(tvWatchedSet(item));   // épisodes vus (clés "S{n}E{e}") — cochage individuel
  const watched = Math.min(wset.size, total);
  const pct     = total ? Math.round(watched / total * 100) : 0;
  const rows    = tvSeasonBreakdown(item);
  // Pseudo-ligne « Épisodes spéciaux » (n=0) ajoutée en fin de liste — même mécanique
  // de dépliage/coches que les vraies saisons, mais cochage individuel (liste specialsSeen)
  const spEps   = item.specialEps || 0;
  const spSeen  = tvSpecialsSeen(item);   // n° des spéciaux vus (cochage individuel)
  const spW     = Math.min(spSeen.length, spEps);
  const allRows = spEps > 0
    ? rows.concat([{ n: 0, special: true, eps: spEps, watched: spW }])
    : rows;
  // Saison dépliée (liste des épisodes façon TV Time) — 1 fetch /tv/{id}/season/{n} au
  // 1er dépliage (cache 7 j), puis tout est local. Placeholders si l'API échoue.
  const [openSeason, setOpenSeason] = React.useState(null);
  const [epsMap, setEpsMap]         = React.useState({});
  const [epsLoading, setEpsLoading] = React.useState(null);
  const toggleSeason = async s => {
    if (openSeason === s.n) { setOpenSeason(null); return; }
    setOpenSeason(s.n);
    if (!epsMap[s.n]) {
      setEpsLoading(s.n);
      const eps = await tvFetchSeasonEps(item.id, s.n);
      const list = (eps && eps.length) ? eps : Array.from({ length: s.eps }, (_, i) => ({ e: i + 1, name: '', still: null }));
      setEpsMap(m => ({ ...m, [s.n]: list }));
      setEpsLoading(null);
    }
  };
  const nextKey  = tvNextToWatch(item);   // 1er épisode non vu (clé "S{n}E{e}") ou null
  const nextM    = nextKey && nextKey.match(/^S(\d+)E(\d+)$/);   // → [_, saison, épisode]
  const allSeen = total > 0 && watched >= total;
  const prodLbl = tvStatusFR(item.tvStatus);
  const Bar = ({ v, max, color, h = 4 }) => (
    <div style={{ height:h, background:'#222', borderRadius:h / 2, overflow:'hidden' }}>
      <div style={{ width:`${max ? Math.round(v / max * 100) : 0}%`, height:'100%', background:color, borderRadius:h / 2, transition:'width 0.25s' }} />
    </div>
  );
  // Coche circulaire (grise = incomplet, verte pleine = complet)
  const Check = ({ done, onClick, title }) => (
    <button onClick={onClick} title={title}
      style={{ width:24, height:24, borderRadius:'50%', flexShrink:0, cursor:'pointer',
        background: done ? '#4caf50' : 'none', border:`1px solid ${done ? '#4caf50' : C.border}`,
        color: done ? '#fff' : C.dim, fontSize:12, lineHeight:1, padding:0, fontWeight:800 }}>✓</button>
  );
  const STATUSES = [['towatch', '📌 À voir', '#f5b81f'], ['watching', '▶ En cours', TVTIME_COLOR], ['done', '✓ Vu', '#4caf50']];
  return (
    <div onClick={onClose} style={{ position:'fixed', inset:0, zIndex:200, background:'rgba(0,0,0,0.7)', display:'flex', alignItems:'center', justifyContent:'center', padding:16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:'16px 18px', width:'100%', maxWidth:420, maxHeight:'85vh', overflowY:'auto', boxShadow:'0 20px 60px rgba(0,0,0,0.6)' }}>
        {/* Croix de fermeture TOUJOURS visible (sticky) même en scrollant la fiche */}
        <div style={{ position:'sticky', top:0, zIndex:6, height:0, display:'flex', justifyContent:'flex-end', pointerEvents:'none' }}>
          <button onClick={onClose} title="Fermer" style={{ pointerEvents:'auto', background:C.surfaceHigh, border:`1px solid ${C.border}`, borderRadius:'50%', width:30, height:30, color:C.text, fontSize:18, lineHeight:1, cursor:'pointer', boxShadow:'0 2px 10px rgba(0,0,0,0.55)' }}>×</button>
        </div>
        {/* En-tête : affiche + titre + méta */}
        <div style={{ display:'flex', alignItems:'flex-start', gap:12, marginBottom:12, paddingRight:28 }}>
          {item.poster
            ? <img src={TMDB_IMG + item.poster} alt="" style={{ width:48, height:72, borderRadius:6, objectFit:'cover', flexShrink:0, background:'#111' }} />
            : <div style={{ width:48, height:72, borderRadius:6, background:'#111', display:'flex', alignItems:'center', justifyContent:'center', fontSize:20, flexShrink:0 }}>{isMovie ? '🎬' : '📺'}</div>}
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:15, fontWeight:800, color:C.text, lineHeight:1.25 }}>{item.title}</div>
            <div style={{ fontSize:10, color:C.muted, fontFamily:'DM Mono,monospace', marginTop:3 }}>
              {isMovie
                ? `${item.year ? item.year + ' · ' : ''}Film${item.runtime ? ` · ${item.runtime} min` : ''}`
                : `${item.year ? item.year + ' · ' : ''}${rows.length} saison${rows.length > 1 ? 's' : ''} · ${total} ép.${prodLbl ? ` · ${prodLbl}` : ''}`}
            </div>
            {/* Progression globale (séries uniquement) */}
            {!isMovie && <>
              <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:8 }}>
                <div style={{ flex:1 }}><Bar v={watched} max={total} color={allSeen ? '#4caf50' : TVTIME_COLOR} h={6} /></div>
                <div style={{ fontSize:11, fontWeight:800, fontFamily:'DM Mono,monospace', color: allSeen ? '#4caf50' : TVTIME_COLOR, flexShrink:0 }}>{pct}%</div>
              </div>
              <div style={{ fontSize:9, color:C.dim, fontFamily:'DM Mono,monospace', marginTop:3 }}>{watched}/{total} épisodes vus</div>
            </>}
          </div>
        </div>

        {/* Statut dans mes listes */}
        <div style={{ display:'flex', gap:5, marginBottom:12 }}>
          {STATUSES.map(([k, label, color]) => {
            const active = item.status === k;
            return (
              <button key={k} onClick={() => onStatus(k)}
                style={{ flex:1, background: active ? `${color}22` : 'none', border:`1px solid ${active ? color + '88' : C.border}`, borderRadius:6, color: active ? color : C.dim, fontSize:10, fontWeight:700, padding:'5px 0', cursor:'pointer', fontFamily:'DM Mono,monospace' }}>
                {label}
              </button>
            );
          })}
        </div>

        {/* Labels Manga / Dessin animé (non affichés dans les listes, pas de stats pour l'instant) */}
        <div style={{ display:'flex', gap:8, marginBottom:12 }}>
          <button onClick={() => onManga(!item.manga)} title="Marquer ce titre comme manga / animé (utilisé dans les stats)"
            style={{ flex:1, background: item.manga ? '#e0518022' : 'none', border:`1px solid ${item.manga ? '#e05180aa' : C.border}`, borderRadius:6, color: item.manga ? '#e05180' : C.dim, fontSize:10, fontWeight:700, padding:'5px 0', cursor:'pointer', fontFamily:'DM Mono,monospace' }}>
            🍥 {item.manga ? 'Manga ✓' : 'Manga'}
          </button>
          <button onClick={() => onCartoon(!item.cartoon)} title="Marquer ce titre comme dessin animé"
            style={{ flex:1, background: item.cartoon ? '#7aa5ff22' : 'none', border:`1px solid ${item.cartoon ? '#7aa5ffaa' : C.border}`, borderRadius:6, color: item.cartoon ? '#7aa5ff' : C.dim, fontSize:10, fontWeight:700, padding:'5px 0', cursor:'pointer', fontFamily:'DM Mono,monospace' }}>
            🎨 {item.cartoon ? 'Dessin animé ✓' : 'Dessin animé'}
          </button>
        </div>

        {/* Film : synopsis (pas de suivi par épisode) */}
        {isMovie && item.overview && (
          <div style={{ fontSize:11, color:C.muted, lineHeight:1.6, background:C.surfaceHigh, borderRadius:10, padding:'10px 12px' }}>{item.overview}</div>
        )}
        {isMovie && !item.overview && (
          <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'6px 0' }}>Pas de synopsis disponible.</div>
        )}

        {/* Sections de suivi par épisode — séries uniquement */}
        {!isMovie && <>
        {/* Continuer le suivi */}
        <div style={{ fontSize:10, fontWeight:800, color:TVTIME_COLOR, letterSpacing:'0.05em', marginBottom:6 }}>▶ CONTINUER LE SUIVI</div>
        <div style={{ display:'flex', alignItems:'center', gap:10, background:C.surfaceHigh, borderRadius:10, padding:'10px 12px', marginBottom:12 }}>
          {allSeen ? (
            <div style={{ flex:1, fontSize:11, fontWeight:700, color:'#4caf50' }}>Série entière vue ✓ <span style={{ color:C.dim, fontWeight:400 }}>(hors épisodes spéciaux)</span></div>
          ) : (
            <>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:16, fontWeight:900, fontFamily:'DM Mono,monospace', color:C.text }}>
                  {nextM ? `S${nextM[1].padStart(2, '0')} | E${nextM[2].padStart(2, '0')}` : '—'}
                </div>
                <div style={{ fontSize:9, color:C.muted, fontFamily:'DM Mono,monospace', marginTop:2 }}>prochain épisode non vu</div>
              </div>
              <button onClick={() => onBump(-1)} disabled={watched === 0} title="−1 épisode vu"
                style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:8, color: watched === 0 ? '#333' : C.muted, fontSize:14, lineHeight:1, padding:'6px 10px', cursor: watched === 0 ? 'default' : 'pointer', flexShrink:0 }}>−</button>
              <button onClick={() => onBump(+1)} title="Épisode vu (+1)"
                style={{ width:34, height:34, borderRadius:'50%', flexShrink:0, cursor:'pointer', background:TVTIME_COLOR, border:'none', color:'#0c1210', fontSize:15, fontWeight:900, lineHeight:1, padding:0 }}>✓</button>
            </>
          )}
        </div>

        {/* Saisons */}
        <div style={{ fontSize:10, fontWeight:800, color:TVTIME_COLOR, letterSpacing:'0.05em', marginBottom:6 }}>TOUTES LES SAISONS</div>
        <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
          {allRows.map(s => {
            const done = s.watched >= s.eps;
            const open = openSeason === s.n;
            // Cochage INDIVIDUEL par épisode (wset), pour les vraies saisons comme pour les
            // spéciaux (specialsSeen). Chaque saison/épisode est indépendant des autres :
            // cocher la saison 28 n'affecte pas les saisons 1-27.
            // « Tout cocher » les spéciaux : n° réels si la saison 0 est chargée, sinon 1..spEps
            const allSpNums = ((epsMap[0] || []).map(ep => ep.e).length ? (epsMap[0] || []).map(ep => ep.e) : Array.from({ length: spEps }, (_, i) => i + 1));
            return (
              <div key={s.n} style={{ background: s.special ? '#111' : C.surfaceHigh, borderRadius:10, padding:'8px 12px' }}>
                <div onClick={() => toggleSeason(s)} title={open ? 'Replier' : 'Voir les épisodes'}
                  style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6, cursor:'pointer', userSelect:'none' }}>
                  <span style={{ display:'inline-block', color:C.dim, fontSize:10, lineHeight:1, flexShrink:0, transform: open ? 'rotate(90deg)' : 'none', transition:'transform 0.15s' }}>▶</span>
                  <div style={{ flex:1, fontSize:12, fontWeight:800, color: s.special ? C.dim : C.text }}>{s.special ? 'Épisodes spéciaux' : `Saison ${s.n}`}</div>
                  <div style={{ fontSize:10, fontFamily:'DM Mono,monospace', color: done ? '#4caf50' : (s.special ? C.dim : C.muted), fontWeight:700 }}>{s.watched}/{s.eps}{s.special ? ' · non comptés' : ''}</div>
                  <Check done={done} onClick={e => { e.stopPropagation(); s.special ? onSetSpecials(done ? [] : allSpNums) : onSeasonToggle(s); }}
                    title={s.special
                      ? (done ? 'Décocher tous les épisodes spéciaux' : 'Marquer tous les épisodes spéciaux vus')
                      : (done ? `Décocher toute la saison ${s.n}` : `Cocher toute la saison ${s.n}`)} />
                </div>
                <Bar v={s.watched} max={s.eps} color={done ? '#4caf50' : (s.special ? C.dim : TVTIME_COLOR)} />
                {/* Liste des épisodes (dépliée) — vignette + S02 | E05 + nom + coche */}
                {open && (
                  epsLoading === s.n
                    ? <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'8px 0 2px', fontFamily:'DM Mono,monospace' }}>Chargement des épisodes…</div>
                    : (epsMap[s.n] || []).length > 0 && (
                        <div style={{ display:'flex', flexDirection:'column', gap:5, marginTop:8 }}>
                          {epsMap[s.n].map(ep => {
                            // Coché = cet épisode est dans l'ensemble vu (individuel).
                            // Spéciaux : lu dans specialsSeen ; saisons officielles : dans wset.
                            const seen = s.special ? spSeen.includes(ep.e) : wset.has(`S${s.n}E${ep.e}`);
                            return (
                              <div key={ep.e} style={{ display:'flex', alignItems:'center', gap:10, background: s.special ? '#0a0a0a' : '#111', borderRadius:8, padding:6, minHeight:52 }}>
                                {ep.still
                                  ? <img src={TMDB_STILL + ep.still} alt="" loading="lazy" style={{ width:82, height:46, borderRadius:6, objectFit:'cover', flexShrink:0, background:'#1a1a1a' }} />
                                  : <div style={{ width:82, height:46, borderRadius:6, background:'#1a1a1a', display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, flexShrink:0 }}>📺</div>}
                                <div style={{ flex:1, minWidth:0 }}>
                                  <div style={{ fontSize:13, fontWeight:900, fontFamily:'DM Mono,monospace', color:C.text }}>
                                    S{String(s.n).padStart(2, '0')} | E{String(ep.e).padStart(2, '0')}
                                  </div>
                                  {ep.name && <div style={{ fontSize:10, color:C.muted, marginTop:2, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{ep.name}</div>}
                                  {/* Date de diffusion (si l'API la fournit) — à venir = accent « sort le … », déjà diffusé = date grisée */}
                                  {ep.date && (() => {
                                    const dj = tvDaysUntil(ep.date);
                                    const dstr = new Date(ep.date + 'T00:00:00').toLocaleDateString('fr-FR');
                                    const future = dj !== null && dj > 0;
                                    return <div style={{ fontSize:9, marginTop:2, fontFamily:'DM Mono,monospace', color: future ? TVTIME_COLOR : C.dim }}>
                                      {future ? `🗓 sort le ${dstr}${dj === 1 ? ' · demain' : dj <= 14 ? ` · dans ${dj} j` : ''}` : dstr}
                                    </div>;
                                  })()}
                                </div>
                                <Check done={seen}
                                  onClick={() => s.special
                                    ? onSetSpecials(seen ? spSeen.filter(n => n !== ep.e) : [...spSeen, ep.e])
                                    : onToggleEp(s.n, ep.e, seen)}
                                  title={s.special
                                    ? (seen ? `Décocher le spécial E${ep.e}` : `Cocher le spécial E${ep.e}`)
                                    : (seen ? `Décocher S${s.n}E${ep.e}` : `Cocher S${s.n}E${ep.e}`)} />
                              </div>
                            );
                          })}
                        </div>
                      )
                )}
              </div>
            );
          })}
        </div>
        <div style={{ fontSize:9, color:C.dim, fontStyle:'italic', lineHeight:1.5, marginTop:10 }}>
          ℹ Chaque épisode se coche individuellement : tu peux cocher n'importe quelle saison ou n'importe quel épisode isolément (ex. les saisons 28 à 32 sans cocher les précédentes). Les épisodes hors-série (saison 0) sont suivables mais ne comptent pas dans la progression : la série passe automatiquement en « Vu » dès que tous les épisodes normaux sont vus.
        </div>
        </>}
      </div>
    </div>
  );
}

// ── Fiche YouTube (clic sur l'affiche d'une chaîne/playlist suivie) — vidéos groupées

  const allSeen = total > 0 && watched >= total;

    <div style={{ height:5, background:'#222', borderRadius:3, overflow:'hidden' }}>

  const toggleYear = (y, vids) => {
    const ids = vids.map(v => v.id);
    const allY = ids.every(id => seen.has(id));

    <div onClick={onClose} style={{ position:'fixed', inset:0, zIndex:200, background:'rgba(0,0,0,0.7)', display:'flex', alignItems:'center', justifyContent:'center', padding:16 }}>

        {/* Croix de fermeture TOUJOURS visible (sticky) même en scrollant la fiche */}
        <div style={{ position:'sticky', top:0, zIndex:6, height:0, display:'flex', justifyContent:'flex-end', pointerEvents:'none' }}>
          <button onClick={onClose} title="Fermer" style={{ pointerEvents:'auto', background:C.surfaceHigh, border:`1px solid ${C.border}`, borderRadius:'50%', width:30, height:30, color:C.text, fontSize:18, lineHeight:1, cursor:'pointer', boxShadow:'0 2px 10px rgba(0,0,0,0.55)' }}>×</button>
        </div>
        <div style={{ display:'flex', alignItems:'flex-start', gap:12, marginBottom:12, paddingRight:28 }}>
          {item.poster
            ? <img src={item.poster} alt="" style={{ width:56, height:56, borderRadius:'50%', objectFit:'cover', flexShrink:0, background:'#111' }} />
            : <div style={{ width:56, height:56, borderRadius:'50%', background:'#111', display:'flex', alignItems:'center', justifyContent:'center', fontSize:22, flexShrink:0 }}>▶️</div>}
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:15, fontWeight:800, color:C.text, lineHeight:1.25 }}>{item.title}</div>
            <div style={{ fontSize:10, color:C.muted, fontFamily:'DM Mono,monospace', marginTop:3 }}>
              {item.ytKind === 'playlist' ? '▶️ Playlist' : '▶️ Chaîne'} · {years.length} année(s) · {total} vidéo(s)
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:8 }}>
              <div style={{ flex:1 }}><Bar v={watched} max={total} /></div>
              <div style={{ fontSize:11, fontWeight:800, fontFamily:'DM Mono,monospace', color: allSeen ? '#4caf50' : YT_COLOR, flexShrink:0 }}>{pct}%</div>
            </div>
          </div>
        </div>

        {/* Statut + refresh */}
        <div style={{ display:'flex', gap:5, marginBottom:8 }}>
          {STATUSES.map(([k, label, color]) => {
            const active = item.status === k;
            return (
              <button key={k} onClick={() => onStatus(k)}
                style={{ flex:1, background: active ? `${color}22` : 'none', border:`1px solid ${active ? color + '88' : C.border}`, borderRadius:6, color: active ? color : C.dim, fontSize:10, fontWeight:700, padding:'5px 0', cursor:'pointer', fontFamily:'DM Mono,monospace' }}>

            style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:6, color: refreshing ? C.dim : YT_COLOR, fontSize:12, padding:'0 9px', cursor: refreshing ? 'default' : 'pointer', flexShrink:0 }}>{refreshing ? '…' : '↻'}</button>
        </div>

        {/* Labels Manga / Dessin animé */}
        <div style={{ display:'flex', gap:8, marginBottom:12 }}>
          <button onClick={() => onManga(!item.manga)} title="Marquer comme manga / animé (utilisé dans les stats)"
            style={{ flex:1, background: item.manga ? '#e0518022' : 'none', border:`1px solid ${item.manga ? '#e05180aa' : C.border}`, borderRadius:6, color: item.manga ? '#e05180' : C.dim, fontSize:10, fontWeight:700, padding:'5px 0', cursor:'pointer', fontFamily:'DM Mono,monospace' }}>
            🍥 {item.manga ? 'Manga ✓' : 'Manga'}
          </button>
          <button onClick={() => onCartoon(!item.cartoon)} title="Marquer comme dessin animé"
            style={{ flex:1, background: item.cartoon ? '#7aa5ff22' : 'none', border:`1px solid ${item.cartoon ? '#7aa5ffaa' : C.border}`, borderRadius:6, color: item.cartoon ? '#7aa5ff' : C.dim, fontSize:10, fontWeight:700, padding:'5px 0', cursor:'pointer', fontFamily:'DM Mono,monospace' }}>
            🎨 {item.cartoon ? 'Dessin animé ✓' : 'Dessin animé'}
          </button>
        </div>

        {/* Retirer le plafond de 500 vidéos pour cette chaîne — visible tant que non illimitée
            (proposé surtout quand le cap a été atteint, mais toujours dispo pour forcer un fetch complet) */}
        {!item.unlimited
          ? <button onClick={onUnlimited} disabled={refreshing} title="Récupérer toutes les vidéos de cette chaîne (au-delà de 500)"
              style={{ width:'100%', background:'none', border:`1px dashed ${C.border}`, borderRadius:8, color: refreshing ? C.dim : YT_COLOR, fontSize:10.5, fontWeight:700, padding:'7px 10px', cursor: refreshing ? 'default' : 'pointer', fontFamily:'DM Mono,monospace', marginBottom:12 }}>
              {refreshing ? '⏳ Récupération…' : `🔓 Récupérer toutes les vidéos (plafond de ${YT_MAX_VIDEOS} retiré)`}
            </button>
          : <div style={{ marginBottom:12 }}>

                <span style={{ color:YT_COLOR }}>🔓</span> Plafond de {YT_MAX_VIDEOS} retiré pour cette chaîne
              </div>
              <button onClick={onRelock} disabled={refreshing} title={`Reverrouiller : ne garder que les vidéos vues + celles de ${new Date().getFullYear()}`}
                style={{ width:'100%', background:'none', border:`1px dashed ${C.border}`, borderRadius:8, color: refreshing ? C.dim : C.muted, fontSize:10.5, fontWeight:700, padding:'7px 10px', cursor: refreshing ? 'default' : 'pointer', fontFamily:'DM Mono,monospace' }}>

              </button>
            </div>}

        {/* Vidéos par année (saison) */}
        <div style={{ fontSize:10, fontWeight:800, color:YT_COLOR, letterSpacing:'0.05em', marginBottom:6 }}>VIDÉOS PAR ANNÉE</div>
        <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
          {years.map(y => {
            const vids = byYear[y];
            const wY = vids.filter(v => seen.has(v.id)).length;
            const doneY = wY >= vids.length;
            const open = openYear === y;
            return (
              <div key={y} style={{ background:C.surfaceHigh, borderRadius:10, padding:'8px 12px' }}>
                <div onClick={() => setOpenYear(open ? null : y)} title={open ? 'Replier' : 'Voir les vidéos'}
                  style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6, cursor:'pointer', userSelect:'none' }}>
                  <span style={{ display:'inline-block', color:C.dim, fontSize:10, lineHeight:1, flexShrink:0, transform: open ? 'rotate(90deg)' : 'none', transition:'transform 0.15s' }}>▶</span>
                  <div style={{ flex:1, fontSize:12, fontWeight:800, color:C.text }}>Saison {y}</div>
                  <div style={{ fontSize:10, fontFamily:'DM Mono,monospace', color: doneY ? '#4caf50' : C.muted, fontWeight:700 }}>{wY}/{vids.length}</div>
                  <Check done={doneY} onClick={e => { e.stopPropagation(); toggleYear(y, vids); }}
                    title={doneY ? `Décocher toute l'année ${y}` : `Marquer toute l'année ${y} vue`} />
                </div>
                <Bar v={wY} max={vids.length} />
                {open && (
                  <div style={{ display:'flex', flexDirection:'column', gap:5, marginTop:8 }}>
                    {vids.map(v => {
                      const vseen = seen.has(v.id);
                      return (
                        <div key={v.id} style={{ display:'flex', alignItems:'center', gap:10, background:'#111', borderRadius:8, padding:6, minHeight:52 }}>
                          {v.still
                            ? <img src={v.still} alt="" loading="lazy" style={{ width:82, height:46, borderRadius:6, objectFit:'cover', flexShrink:0, background:'#1a1a1a' }} />
                            : <div style={{ width:82, height:46, borderRadius:6, background:'#1a1a1a', display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, flexShrink:0 }}>▶️</div>}
                          <div style={{ flex:1, minWidth:0 }}>
                            <a href={`https://www.youtube.com/watch?v=${v.id}`} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()}
                              style={{ fontSize:11, fontWeight:600, color:C.text, textDecoration:'none', display:'block', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{v.title}</a>
                            <div style={{ fontSize:9, color:C.muted, fontFamily:'DM Mono,monospace', marginTop:2 }}>{v.date || '—'}{v.dur ? ` · ${v.dur} min` : ''}</div>
                          </div>
                          <Check done={vseen} onClick={() => toggleVideo(v)}
                            title={vseen ? 'Marquer non vue' : 'Marquer vue'} />
