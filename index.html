// PLAYER BARS
// ════════════════════════════════════════════════
function MobilePlayer() {
  const { now, feed, filteredFeed, filteredFeedIndex, loopEnabled, setLoopEnabled, seek, setTrackLiked, likedTracks, markListened } = useStore();
  const [isLiked, setIsLiked] = React.useState(false);

  // Vérifier si le titre en cours est liké — local d'abord, API seulement si inconnu
  React.useEffect(() => {
    const feedItem = now?.uri ? feed.find(f => f.spotifyUri === now.uri) : null;
    const inLocal  = likedTracks.some(t => t.spotifyUri === now?.uri) || !!feedItem?.liked;
    setIsLiked(inLocal);
    if (!now?.uri) return;
    // Titre connu localement (feed ou likés) : la DB fait foi, pas besoin d'une
    // requête /me/library/contains à chaque changement de titre
    if (feedItem || inLocal) return;
    libraryContains([now.uri])
      .then(data => { if (data) setIsLiked(data[0]); })
      .catch(() => {});
  }, [now?.uri]);

  if (!now) return null;

  const _cuMob = _effUri(now.uri);
  const currentIndex = _cuMob ? (filteredFeedIndex.get(_cuMob) ?? -1) : -1;
  const hasFeed      = filteredFeed.length > 0;

  const togglePlayPause = async () => {
    if (now.playing) await apiPut('https://api.spotify.com/v1/me/player/pause');
    else             await apiPut('https://api.spotify.com/v1/me/player/play');
  };
  const prevTrack = async () => {
    const idx = currentIndex > 0 ? currentIndex - 1 : filteredFeed.length - 1;
    if (filteredFeed[idx]) await playTrack(filteredFeed[idx].spotifyUri);
  };
  const nextTrack = async () => {
    // URI du titre quitté (avant calcul du suivant) : on le retire tout de suite, sans
    // attendre le poll 5s. Couvre le double-clic rapide où now.uri saute le titre intermédiaire.
    const leaving = currentIndex >= 0 ? filteredFeed[currentIndex]?.spotifyUri : null;
    const idx = currentIndex >= 0 && currentIndex < filteredFeed.length - 1 ? currentIndex + 1 : 0;
    if (!filteredFeed[idx]) return;
    await playTrack(filteredFeed[idx].spotifyUri);
    const dur = filteredFeed[idx].duration_ms;
    if (dur > 0) setTimeout(() => seek(Math.floor(dur * 0.25)), 400);
    if (leaving) markListened(leaving);
  };
  const toggleLoop = async () => {
    const next = !loopEnabled;
    setLoopEnabled(next);
    await apiPut(`https://api.spotify.com/v1/me/player/repeat?state=${next ? 'track' : 'off'}`);
  };
  const toggleLike = async () => {
    if (!now.uri) return;
    if (isLiked) {
      const res = await libraryRemove(now.uri);
      if (libraryScopeAlert(res)) return;
      setIsLiked(false);
      setTrackLiked(now.uri, false);
    } else {
      const res = await librarySave(now.uri);
      if (libraryScopeAlert(res)) return;
      setIsLiked(true);
      setTrackLiked(now.uri, true);
    }
  };

  const btnCtrl = { background:'none', border:'none', cursor:'pointer', padding:10, display:'flex', alignItems:'center', justifyContent:'center' };

  return (
    <div style={{ height:'25vh', minHeight:160, background:'linear-gradient(180deg,#131313 0%,#0a0a0a 100%)', borderTop:`1px solid ${C.border}`, display:'flex', flexDirection:'column', padding:'10px 20px 16px', flexShrink:0, gap:6 }}>

      {/* Pochette + titre + artiste + position + like */}
      <div style={{ display:'flex', alignItems:'center', gap:14, flex:1, minHeight:0 }}>
        <AlbumArt size={80} letter={(now.title||'?')[0]} color={C.accent} image={now.image} />
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:15, fontWeight:700, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', color:C.text }}>{now.title}</div>
          <div style={{ fontSize:12, color:C.muted, marginTop:3, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{now.artist}</div>
          {currentIndex >= 0 && (
            <div style={{ fontSize:10, color:C.dim, fontFamily:'DM Mono,monospace', marginTop:5 }}>{currentIndex + 1} / {filteredFeed.length}</div>
          )}
        </div>
        {/* Bouton +1min */}
        <button onClick={() => seek(Math.min((now.current + 60) * 1000, now.duration * 1000 - 2000))}
          style={{ ...btnCtrl, flexShrink:0 }}>
          <span style={{ fontSize:11, fontWeight:700, color:C.muted, fontFamily:'DM Mono,monospace', letterSpacing:'-0.03em' }}>+1:00</span>
        </button>
        {/* Bouton Like */}
        <button onClick={toggleLike} style={{ ...btnCtrl, flexShrink:0 }}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill={isLiked ? '#e05050' : 'none'} stroke={isLiked ? '#e05050' : C.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
      </div>

      {/* Barre de progression */}
      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
        <span style={{ fontSize:10, color:C.dim, fontFamily:'DM Mono,monospace', width:32, textAlign:'right', flexShrink:0 }}>{fmt(now.current)}</span>
        <SeekBar now={now} />
        <span style={{ fontSize:10, color:C.dim, fontFamily:'DM Mono,monospace', width:32, flexShrink:0 }}>{fmt(now.duration)}</span>
      </div>

      {/* Contrôles */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:16 }}>
        <button onClick={prevTrack} style={{ ...btnCtrl, opacity: hasFeed ? 1 : 0.3 }}>
          <svg width="26" height="26" viewBox="0 0 16 16" fill={C.muted}><rect x="1" y="1" width="2" height="14" rx="1"/><path d="M13 1L4 8l9 7V1z"/></svg>
        </button>
        <button onClick={togglePlayPause} style={{ width:56, height:56, borderRadius:'50%', background:C.accent, border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
          {now.playing
            ? <svg width="16" height="18" viewBox="0 0 12 14" fill="#000"><rect x="0" y="0" width="4" height="14" rx="1"/><rect x="8" y="0" width="4" height="14" rx="1"/></svg>
            : <svg width="16" height="18" viewBox="0 0 12 14" fill="#000"><path d="M1 0l11 7-11 7V0z"/></svg>}
        </button>
        <button onClick={nextTrack} style={{ ...btnCtrl, opacity: hasFeed ? 1 : 0.3 }}>
          <svg width="26" height="26" viewBox="0 0 16 16" fill={C.muted}><rect x="13" y="1" width="2" height="14" rx="1"/><path d="M3 1l9 7-9 7V1z"/></svg>
        </button>
        {/* Bouton Loop / Auto-avance */}
        <button onClick={toggleLoop} style={{ ...btnCtrl }} title={loopEnabled ? 'Passer à la suivante' : 'Relancer en boucle'}>
          {loopEnabled
            ? /* Icône boucle active (accent) */
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                <text x="9" y="15" fontSize="7" fill={C.accent} stroke="none" fontWeight="bold">1</text>
              </svg>
            : /* Icône auto-avance (muted) */
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
              </svg>
          }
        </button>
      </div>
    </div>
  );
}

function PlayerBar() {
  const { now, feed, filteredFeed, filteredFeedIndex, loopEnabled, setLoopEnabled, seek, markListened } = useStore();

  const togglePlayPause = async () => {
    if (!now) return;
    if (now.playing) {
      await apiPut('https://api.spotify.com/v1/me/player/pause');
    } else {
      await apiPut('https://api.spotify.com/v1/me/player/play');
    }
  };

  const toggleLoop = async () => {
    const next = !loopEnabled;
    setLoopEnabled(next);
    await apiPut(`https://api.spotify.com/v1/me/player/repeat?state=${next ? 'track' : 'off'}`);
  };

  const _cu = _effUri(now?.uri);
  const currentIndex = _cu ? (filteredFeedIndex.get(_cu) ?? -1) : -1;

  const prevTrack = async () => {
    const idx = currentIndex > 0 ? currentIndex - 1 : filteredFeed.length - 1;
    if (filteredFeed[idx]) await playTrack(filteredFeed[idx].spotifyUri);
  };
  const nextTrack = async () => {
    // URI du titre quitté (avant calcul du suivant) : on le retire tout de suite, sans
    // attendre le poll 5s. Couvre le double-clic rapide où now.uri saute le titre intermédiaire.
    const leaving = currentIndex >= 0 ? filteredFeed[currentIndex]?.spotifyUri : null;
    const idx = currentIndex >= 0 && currentIndex < filteredFeed.length - 1 ? currentIndex + 1 : 0;
    if (!filteredFeed[idx]) return;
    await playTrack(filteredFeed[idx].spotifyUri);
    const dur = filteredFeed[idx].duration_ms;
    if (dur > 0) setTimeout(() => seek(Math.floor(dur * 0.25)), 400);
    if (leaving) markListened(leaving);
  };

  const hasFeed = filteredFeed.length > 0;
  const btnStyle = active => ({ background:'none', border:'none', cursor: active ? 'pointer' : 'default', display:'flex', alignItems:'center', justifyContent:'center', padding:6, borderRadius:6, opacity: active ? 0.7 : 0.25 });

  if (!now) {
    return (
      <div style={{ height:68, background:C.surfaceHigh, borderTop:`1px solid ${C.border}`, display:'flex', alignItems:'center', padding:'0 22px', flexShrink:0 }}>
        <span style={{ fontFamily:'DM Mono,monospace', fontSize:11, color:C.dim }}>Aucune lecture en cours sur Spotify…</span>
      </div>
    );
  }
  return (
    <div style={{ height:68, background:C.surfaceHigh, borderTop:`1px solid ${C.border}`, display:'flex', alignItems:'center', padding:'0 22px', gap:18, flexShrink:0 }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, width:240, minWidth:0 }}>
        <AlbumArt size={42} letter={(now.title||'?')[0]} color={C.accent} image={now.image} />
        <div style={{ minWidth:0 }}>
          <div style={{ fontSize:13, fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{now.title}</div>
          <div style={{ fontSize:11, color:C.muted, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{now.artist}</div>
        </div>
      </div>
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:5 }}>
        <div style={{ display:'flex', alignItems:'center', gap:14 }}>
          <button onClick={prevTrack} disabled={!hasFeed} style={btnStyle(hasFeed)} title="Nouveauté précédente">
            <svg width="16" height="16" viewBox="0 0 16 16" fill={C.muted}>
              <rect x="1" y="1" width="2" height="14" rx="1"/>
              <path d="M13 1L4 8l9 7V1z"/>
            </svg>
          </button>
          <div onClick={togglePlayPause} style={{ width:34, height:34, borderRadius:'50%', background:C.accent, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, cursor:'pointer' }}>
            {now.playing
              ? <svg width="10" height="12" viewBox="0 0 12 14" fill="#000"><rect x="0" y="0" width="4" height="14" rx="1"/><rect x="8" y="0" width="4" height="14" rx="1"/></svg>
              : <svg width="10" height="12" viewBox="0 0 12 14" fill="#000"><path d="M1 0l11 7-11 7V0z"/></svg>}
          </div>
          <button onClick={nextTrack} disabled={!hasFeed} style={btnStyle(hasFeed)} title="Nouveauté suivante">
            <svg width="16" height="16" viewBox="0 0 16 16" fill={C.muted}>
              <rect x="13" y="1" width="2" height="14" rx="1"/>
              <path d="M3 1l9 7-9 7V1z"/>
            </svg>
          </button>
          <button onClick={toggleLoop} style={{ background:'none', border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', padding:6, borderRadius:6 }} title={loopEnabled ? 'Désactiver la boucle' : 'Répéter ce titre'}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={loopEnabled ? C.accent : C.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="17 1 21 5 17 9"/>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <polyline points="7 23 3 19 7 15"/>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
              {loopEnabled && <text x="9" y="15" fontSize="8" fill={C.accent} stroke="none" fontWeight="bold">1</text>}
            </svg>
          </button>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:8, width:'100%', maxWidth:420 }}>
          <span style={{ fontSize:10, color:C.dim, fontFamily:'DM Mono,monospace', width:30, textAlign:'right' }}>{fmt(now.current)}</span>
          <SeekBar now={now} />
          <span style={{ fontSize:10, color:C.dim, fontFamily:'DM Mono,monospace', width:30 }}>{fmt(now.duration)}</span>
        </div>
      </div>
      <div style={{ width:130, display:'flex', flexDirection:'column', alignItems:'flex-end', gap:2 }}>
        {currentIndex >= 0
          ? <span style={{ fontSize:10, color:C.accent, fontFamily:'DM Mono,monospace' }}>{currentIndex + 1} / {filteredFeed.length}</span>
          : <span style={{ fontSize:10, color:C.dim, fontFamily:'DM Mono,monospace' }}>En direct ↗</span>
        }
        {currentIndex >= 0 && filteredFeed[currentIndex]?.label &&
          <span style={{ fontSize:9, color:C.dim, letterSpacing:'0.05em' }}>{filteredFeed[currentIndex].label.toUpperCase()}</span>
        }
      </div>
    </div>
  );
}

function ScrapingStatusPanel({ compact=false }) {
  const s = useStore();
  const total = Math.max(s.stats.total, 1);
  const pct   = (s.stats.artists / total) * 100;
  const label = s.scraping
    ? ((s.paused || s.rlWaiting) ? 'EN PAUSE' : 'EN COURS')
    : (s.stats.artists > 0 ? 'TERMINÉ' : 'EN ATTENTE');

  // Countdown quota 24h re-rendu chaque seconde tant que la fenêtre est active (horloge partagée)
  useSharedTick(s.quotaUntil > Date.now());
  const quotaLeft = s.quotaUntil > Date.now() ? s.quotaUntil - Date.now() : 0;

  return (
    <div style={{ borderRadius:10, background:C.surface, border:`1px solid ${C.border}`, padding: compact?'10px 12px':'14px 16px' }}>
      <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom: compact?8:12 }}>
        <StatusDot active={s.scraping} mode={s.statusMode} />
        <span style={{ fontSize: compact?11:12, fontWeight:700, letterSpacing:'0.06em' }}>SCRAPING {label}</span>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap: compact?6:10, marginBottom: compact?10:14 }}>
        {[
          ['Artistes', s.stats.total ? `${s.stats.artists}/${s.stats.total}` : s.stats.artists, C.accent, `${s.dailyScrapings}/100`],
          ['Sorties',  s.stats.releases, C.accent, null],
          ['Titres',   s.stats.tracks,   C.accent, null],
        ].map(([lbl, val, color, sub]) => (
          <div key={lbl} style={{ background:C.surfaceHigh, border: compact?'none':`1px solid ${C.border}`, borderRadius: compact?6:8, padding: compact?'8px 6px':'12px 14px', textAlign: compact?'center':'left' }}>
            <div style={{ fontSize: compact?14:24, fontWeight:700, color, fontFamily:'DM Mono,monospace', lineHeight:1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{val}</div>
            <div style={{ fontSize:9, color:C.muted, marginTop: compact?3:6, textTransform:'uppercase', letterSpacing:'0.05em' }}>{lbl}</div>
            {sub && <div style={{ fontSize:9, color:C.accent, marginTop:2, fontFamily:'DM Mono,monospace', opacity:0.7 }}>{sub} sur 24h</div>}
          </div>
        ))}
      </div>
      <ProgressBar pct={pct} />
      {quotaLeft > 0 && (
        <div style={{ marginTop: compact?8:10, fontSize: compact?10:11, color:'#c08a40', background:'#181206', border:'1px solid #3a2a14', borderRadius:6, padding:'7px 10px', textAlign:'center', fontFamily:'DM Mono,monospace', lineHeight:1.5 }}>
          ⏳ Quota de 100 artistes atteint<br/>Prochaine synchro le <b>{fmtQuotaWhen(s.quotaUntil)}</b> (dans {fmtRemaining(quotaLeft)})
        </div>
      )}
      <div style={{ marginTop: compact?8:10, display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
        <span style={{ fontSize: compact?10:11, color:C.dim }}>{s.statusMsg}</span>
        {s.currentArtist && (
          <span style={{ fontSize: compact?10:11, background:'#1e1e1e', border:`1px solid ${C.border}`, borderRadius:99, padding:'2px 10px', color:C.muted }}>{s.currentArtist}</span>
        )}
      </div>
    </div>
  );
}

function DateRangePanel({ compact=false }) {
  const s = useStore();
  const hasResume = !s.scraping && s.resumableSession;

  // Blocage 429 (rate limit) OU quota 24h : countdown re-rendu chaque seconde tant qu'actif (horloge partagée)
  const blocked = s.blockedUntil > Date.now();
  const quotaBlocked = s.quotaUntil > Date.now();
  const anyBlock = blocked || quotaBlocked;
  useSharedTick(Math.max(s.blockedUntil, s.quotaUntil) > Date.now());
  const blockedMin = blocked ? Math.ceil((s.blockedUntil - Date.now()) / 60000) : 0;

  const onLancer = () => {
    if (hasResume) {
      if (!confirm('Êtes-vous sûr de vouloir recommencer la synchro de 0 ?\nLa progression en cours sera perdue.')) return;
    }
    s.startSync();
  };

  return (
    <div style={{ borderRadius:10, background: compact?C.surface:C.surfaceHigh, border:`1px solid ${C.border}`, padding: compact?'10px 12px':'12px 14px' }}>
      <div style={{ fontSize:10, color:C.dim, letterSpacing:'0.07em', fontWeight:700, marginBottom: compact?8:10 }}>SYNCHRONISATION</div>

      {/* Bandeau blocage rate-limit */}
      {blocked && (
        <div style={{ fontSize:10, color:'#c05050', background:'#1a0a0a', border:'1px solid #3a1a1a', borderRadius:6, padding:'6px 10px', marginBottom:8, textAlign:'center' }}>
          🚫 Rate limit Spotify — réessaie dans {blockedMin} min
        </div>
      )}

      {/* Bandeau quota 24h (100 artistes atteints) */}
      {quotaBlocked && !blocked && (
        <div style={{ fontSize:10, color:'#c08a40', background:'#181206', border:'1px solid #3a2a14', borderRadius:6, padding:'6px 10px', marginBottom:8, textAlign:'center' }}>
          ⏳ Quota de 100 artistes atteint — prochaine synchro le <b>{fmtQuotaWhen(s.quotaUntil)}</b> (dans {fmtRemaining(s.quotaUntil - Date.now())})
        </div>
      )}

      {/* Bouton Reprendre — affiché EN PREMIER si session en cours */}
      {hasResume && (

// Curseur de navigation optimiste : le poll player n'interroge Spotify que toutes les 5s,
// donc `now.uri` reste périmé jusqu'à 5s après un clic suivant/précédent. Un 2e clic rapide
// recalculerait alors la position courante sur l'ANCIEN titre et relancerait le même titre.
// On mémorise donc le dernier URI joué (timestamp) et on le préfère à `now.uri` tant que le
// poll ne l'a pas rattrapé (fenêtre = poll 5s + marge). _effUri(pollUri) renvoie l'URI réel
// en cours de lecture pour le calcul de currentIndex dans tous les players.
let _navUri = null;
let _navAt  = 0;
function _effUri(pollUri) {
  if (_navUri && Date.now() - _navAt < 6500) return _navUri;
  return pollUri || null;
}

async function playTrack(spotifyUri) {
  if (!spotifyUri) return;
  _navUri = spotifyUri;
  _navAt  = Date.now();
  const result = await apiPut('https://api.spotify.com/v1/me/player/play', { uris: [spotifyUri] });
  if (result?.error === 'no_active_device') alert('Aucun appareil Spotify actif. Ouvre Spotify d\'abord.');
  if (result?.error === 'forbidden')        alert('Lecture impossible — compte Spotify Free ?');
}

// React.memo + props explicites (pas de useStore) : seuls les items dont les props changent
// re-render — sans ça, les ~1000 lignes du feed re-rendaient à chaque tick du poll player (5s)
const FeedItem = React.memo(function FeedItem({ item, i, isMobile=false, isNowPlaying, removeFromFeed, setTrackLiked, navigateFeed, snoozeTrack }) {
  const [playing, setPlaying]       = React.useState(false);
  const [liked,   setLikedLocal]    = React.useState(item.liked || 0);
  const [swipeDx, setSwipeDx]       = React.useState(0);
  const touchStartX = React.useRef(0);
  const swiping     = React.useRef(false);

  // Sync liked depuis les mises à jour du store
  React.useEffect(() => { setLikedLocal(item.liked || 0); }, [item.liked]);

  const onPlay = async e => {
    e.stopPropagation();
    setPlaying(true);
    await playTrack(item.spotifyUri);
    setTimeout(() => setPlaying(false), 2000);
  };

  const onToggleLike = async e => {
    e.stopPropagation();
    const newVal = liked ? 0 : 1;
    setLikedLocal(newVal);
    if (item.spotifyUri) {
      const res = newVal ? await librarySave(item.spotifyUri) : await libraryRemove(item.spotifyUri);
      if (libraryScopeAlert(res)) { setLikedLocal(liked ? 1 : 0); return; }
    }
    setTrackLiked(item.spotifyUri, !!newVal);
  };

  const onTouchStart = e => {
    touchStartX.current = e.touches[0].clientX;
    swiping.current = true;
  };
  const onTouchMove = e => {
    if (!swiping.current) return;
    setSwipeDx(e.touches[0].clientX - touchStartX.current);
  };
  const onTouchEnd = () => {
    swiping.current = false;
    if (swipeDx < -60) removeFromFeed(item.spotifyUri);
    else if (swipeDx > 60) navigateFeed(-1);
    setSwipeDx(0);
  };

  const swipeColor = swipeDx < -30 ? '#e0505033' : swipeDx > 30 ? `${C.accent}33` : 'transparent';

  return (
    <div className={item.removing ? 'feed-removing' : ''}
      style={{ display:'flex', alignItems:'center', gap: isMobile?10:12, padding: isMobile?'7px 4px':'7px 8px', borderRadius:8,
        transition: swiping.current ? 'none' : 'background 0.15s, transform 0.2s',
        transform: `translateX(${swipeDx}px)`,
        background: swipeColor || (isNowPlaying ? `${C.accent}0d` : 'transparent') }}
      onMouseEnter={e => { if (!item.removing && !swipeDx) e.currentTarget.style.background = isNowPlaying ? `${C.accent}18` : C.surface; }}
      onMouseLeave={e => { e.currentTarget.style.background = isNowPlaying ? `${C.accent}0d` : 'transparent'; }}

      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}>

      <div style={{ width: isMobile?14:16, flexShrink:0, display:'flex', alignItems:'flex-end', justifyContent:'center', height:16 }}>
        {isNowPlaying
          ? <div style={{ display:'flex', alignItems:'flex-end', gap:2, height:14 }}>
              {[14, 10, 12].map((h, n) => (
                <div key={n} className="eq-bar" style={{ width:3, height:h, background:C.accent }} />
              ))}
            </div>
          : <span style={{ fontSize: isMobile?10:11, color:C.dim, fontFamily:'DM Mono,monospace' }}>{i+1}</span>
        }
      </div>

      <AlbumArt size={38} letter={item.artist[0]} color={item.isNew ? C.accent : item.label === 'Découvertes' ? 'oklch(0.65 0.18 300)' : C.blue} image={item.image} />

      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontSize:12, fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', color: isNowPlaying ? C.accent : C.text }}>
          {item.title}
        </div>
        <div style={{ fontSize: isMobile?10:11, color:C.muted, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
          {item.artist}{item.subtitle ? ` · ${item.subtitle}` : ''}
        </div>
      </div>

      {isMobile
        ? (item.label === 'Découvertes' ? <Tag color='oklch(0.65 0.18 300)'>DW</Tag> : item.isNew && <Tag color={C.accent}>NEW</Tag>)
        : (<>
            <Tag color={item.isNew ? C.accent : item.label === 'Découvertes' ? 'oklch(0.65 0.18 300)' : C.blue}>{item.label}</Tag>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', flexShrink:0, gap:1 }}>
              <span style={{ fontSize:10, color:C.dim, fontFamily:'DM Mono,monospace' }}>{item.date}</span>
              {item.scraped_at && <span style={{ fontSize:9, color:C.muted, fontFamily:'DM Mono,monospace' }} title="Date de scraping">↓ {item.scraped_at}</span>}
            </div>
          </>)}

      <button onClick={e => { e.stopPropagation(); snoozeTrack(item.spotifyUri); }}
        title="Réécouter plus tard — renvoyer en fin de liste"
        style={{ width:26, height:26, borderRadius:'50%', border:'1px solid #4a3f18', background:'#1c1708', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, color:'#c8b93c', fontSize:12, lineHeight:1, transition:'background 0.15s, border-color 0.15s' }}
        onMouseEnter={e => { e.currentTarget.style.background='#c8b93c'; e.currentTarget.style.borderColor='#c8b93c'; e.currentTarget.style.color='#000'; }}
        onMouseLeave={e => { e.currentTarget.style.background='#1c1708'; e.currentTarget.style.borderColor='#4a3f18'; e.currentTarget.style.color='#c8b93c'; }}>
        ⏰
      </button>
      <button onClick={e => { e.stopPropagation(); removeFromFeed(item.spotifyUri); }}
        title="Retirer de la liste"
        style={{ width:26, height:26, borderRadius:'50%', border:'1px solid #5a2020', background:'#2a0e0e', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, color:'#e05050', fontSize:15, lineHeight:1, transition:'background 0.15s, border-color 0.15s' }}
        onMouseEnter={e => { e.currentTarget.style.background='#e05050'; e.currentTarget.style.borderColor='#e05050'; e.currentTarget.style.color='#fff'; }}
        onMouseLeave={e => { e.currentTarget.style.background='#2a0e0e'; e.currentTarget.style.borderColor='#5a2020'; e.currentTarget.style.color='#e05050'; }}>
        ×
      </button>
      <button onClick={onToggleLike}
        title={liked ? 'Retirer le like' : 'Liker'}
        style={{ width:26, height:26, borderRadius:'50%', border:'none', background:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, transition:'transform 0.15s' }}
        onMouseEnter={e => e.currentTarget.style.transform='scale(1.2)'}
        onMouseLeave={e => e.currentTarget.style.transform='scale(1)'}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill={liked ? '#e05050' : 'none'} stroke={liked ? '#e05050' : C.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
      <button onClick={onPlay}
        style={{ width:28, height:28, borderRadius:'50%', border:'none', background: (playing || isNowPlaying) ? C.accent : `${C.accent}22`, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, transition:'background 0.2s' }}>
        <svg width="9" height="10" viewBox="0 0 9 10" fill={(playing || isNowPlaying) ? '#000' : C.accent}><path d="M0 0l9 5-9 5V0z"/></svg>
      </button>
    </div>
  );
});

// ── Export / sauvegarde des données ──
// Objet de sauvegarde : stats d'écoute, dernières dates de scrap des artistes, to do.
// Réutilisé par le bouton d'export, la proposition hebdo et la sync Dropbox.
function buildBackup() {
  let stats = null, artists = [];
  try { stats = dbGet("SELECT * FROM stats WHERE id = 1"); } catch {}
  try {
    artists = dbAll(
      "SELECT spotify_id, name, last_scraped_at, scan_count, total_tracks_added, last_release_count, last_scan_status FROM artists_scraped ORDER BY last_scraped_at DESC"
    );
  } catch {}
  const lsJson = k => { try { return JSON.parse(localStorage.getItem(k)) || null; } catch { return null; } };
  return {
    app: 'spotifyplus',
    version: APP_VERSION,
    exported_at: new Date().toISOString(),
    stats,
    artists,
    todos: lsJson('spotifyplus_todos') || [],
    todos_done: lsJson('spotifyplus_todos_done') || [],
    // Remember : dates des rappels fixes (clés "<section>.<item>") + rappels persos
    rappels: lsJson('spotifyplus_rappels') || {},
    remembers: lsJson('spotifyplus_remember_custom') || [],
    // TV Time : suivi séries/films (métadonnées TMDB en cache comprises)
    tvtime: lsJson('spotifyplus_tvtime') || [],
    // Clé API TMDB (chaîne brute, requise par TV Time) — restaurée telle quelle
    tmdb_key: tmdbKey() || null,
    // Maps : données du futur module Maps (placeholder tant que la section est vide)
    maps: lsJson('spotifyplus_maps') || {},   // trajets Google Timeline importés (section Maps)
    // Finance : historique local des prix (crypto, indices, actions, matières, EUR/USD)
    // échantillonné par l'app — sert de repli aux graphiques quand la source distante échoue
    finance: lsJson('spotifyplus_finance_history') || { version: 1, series: {} },
    // Mot de passe : blob CHIFFRÉ du coffre { v, salt, iv, ct } — jamais en clair,
    // déchiffrable uniquement avec le mot de passe maître
    mdp_vault: loadVaultBlob(),
    // Paramétrage : modules activés/désactivés (section Paramétrage d'À propos)
    modules: lsJson(MODULES_LS_KEY) || {},
  };
}
// Sections d'export séparées (À propos) : fields = clés de buildBackup() incluses
// dans le fichier ; fields:null = export complet. Un export partiel reste un fichier
// buildBackup() valide (app/version/exported_at + les clés choisies) → restaurable
// par le même bouton ↥ Restaurer (applyBackup ignore les clés absentes).
const EXPORT_SECTIONS = [
  { key:'tous',     label:'Tous',         icon:'📦', hint:'sauvegarde complète',        fields:null },
  { key:'artistes', label:'Artistes',     icon:'🎤', hint:'dates de scan + compteurs',  fields:['artists'] },
  { key:'tvtime',   label:'TV Time',      icon:'🎬', hint:'séries & films + clé TMDB',  fields:['tvtime', 'tmdb_key'] },
  { key:'todo',     label:'To do',        icon:'✅', hint:'tâches + journal terminées', fields:['todos', 'todos_done'] },
  { key:'maps',     label:'Maps',         icon:'🗺️', hint:'trajets Google Timeline',    fields:['maps'] },
  { key:'finance',  label:'Finance',      icon:'📈', hint:'historique local des prix (crypto…)', fields:['finance'] },
  { key:'mdp',      label:'Mot de passe', icon:'🔑', hint:'coffre chiffré',             fields:['mdp_vault'] },
  { key:'remember', label:'Remember',     icon:'🔔', hint:'rappels fixes + persos',     fields:['rappels', 'remembers'] },
  { key:'stats',    label:'Stats',        icon:'📊', hint:"compteurs d'écoute",         fields:['stats'] },
  { key:'modules',  label:'Paramétrage',  icon:'⚙️', hint:'modules activés/désactivés', fields:['modules'] },
];
// Télécharge la sauvegarde en JSON. `section` = entrée d'EXPORT_SECTIONS (défaut : Tous).
// Retourne l'objet (réutilisé par la proposition hebdo).
function downloadBackup(section) {
  const fields = (section && section.fields) || null;
  const full = buildBackup();
  let data = full;
  if (fields) {
    data = { app: full.app, version: full.version, exported_at: full.exported_at, scope: fields };
    for (const f of fields) data[f] = full[f];
  }
  const file = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url  = URL.createObjectURL(file);
  const a    = document.createElement('a');
  a.href = url;
  const day = new Date().toISOString().slice(0, 10);
  a.download = fields ? `spotifyplus-${section.key}-${day}.json` : `spotifyplus-sauvegarde-${day}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  // Seul l'export COMPLET compte comme sauvegarde (proposition hebdo)
  if (!fields) { try { localStorage.setItem('spotifyplus_last_backup', String(Date.now())); } catch {} }
  return data;
}
// Proposition de sauvegarde 1×/semaine au lancement (via confirm). Ne s'affiche que si
// l'utilisateur a des données (≥ 1 artiste scrapé) ET qu'aucune sauvegarde/proposition
// n'a eu lieu depuis 7 jours — pour ne pas harceler.
function maybeWeeklyBackupPrompt() {
  const WEEK = 7 * 24 * 60 * 60 * 1000, now = Date.now();
  const parse = k => { try { return parseInt(localStorage.getItem(k) || '0') || 0; } catch { return 0; } };
  if (now - parse('spotifyplus_backup_prompt_at') < WEEK) return;
  if (now - parse('spotifyplus_last_backup') < WEEK) return;
  let hasData = false;
  try { hasData = (dbGet("SELECT COUNT(*) c FROM artists_scraped")?.c || 0) > 0; } catch {}
  if (!hasData) return;
  try { localStorage.setItem('spotifyplus_backup_prompt_at', String(now)); } catch {}
  const ok = confirm('💾 Sauvegarde hebdomadaire\n\nTes données (stats, artistes, to do, remember) ne vivent que sur cet appareil.\nVeux-tu télécharger une sauvegarde maintenant ?');
  if (ok) { try { downloadBackup(); } catch {} }
}

// Restaure une sauvegarde produite par buildBackup() (export local ou Dropbox).
// - artists_scraped : UPSERT prudent — la date de scan locale n'est JAMAIS régressée
//   (MAX des deux), les cumuls scan_count/total_tracks_added sont fusionnés au MAX.
// - stats : appareil vierge (total_listened = 0) → reprise intégrale ; sinon fusion
//   prudente des compteurs cumulés uniquement (pas les compteurs mois/année, liés aux
//   marqueurs de reset locaux).
// - todos / todos_done / rappels / remembers : REMPLACÉS par la sauvegarde (si présents).
// - finance (historique local des prix) : FUSIONNÉ — union par série, jamais écrasé.
// La table `tracks` n'est pas dans la sauvegarde : le feed n'est pas touché.
function applyBackup(data) {
  if (!data || data.app !== 'spotifyplus') throw new Error('format invalide');
  let artistsRestored = 0, statsRestored = false;
  for (const a of (Array.isArray(data.artists) ? data.artists : [])) {
    if (!a?.spotify_id || !a?.last_scraped_at) continue;
    try {
      dbRun(
        `INSERT INTO artists_scraped (spotify_id, last_scraped_at, name, last_release_count, total_tracks_added, last_scan_status, scan_count)
         VALUES (?, ?, ?, ?, ?, ?, ?)
         ON CONFLICT(spotify_id) DO UPDATE SET
           last_scraped_at    = MAX(last_scraped_at, excluded.last_scraped_at),
           name               = COALESCE(name, excluded.name),
           last_release_count = MAX(last_release_count, excluded.last_release_count),
           total_tracks_added = MAX(total_tracks_added, excluded.total_tracks_added),
           scan_count         = MAX(scan_count, excluded.scan_count)`,
        [a.spotify_id, a.last_scraped_at, a.name || null, a.last_release_count || 0,
         a.total_tracks_added || 0, a.last_scan_status || null, a.scan_count || 0]
      );
      artistsRestored++;
    } catch {}
  }
  const b = data.stats;
  if (b && typeof b === 'object') {
    try {
      const local = dbGet("SELECT total_listened FROM stats WHERE id = 1");
      if (!local?.total_listened) {
        dbRun(
          "UPDATE stats SET total_listened = ?, listened_this_month = ?, listened_this_year = ?, last_reset_month = ?, last_reset_year = ?, total_listened_ms = ?, total_liked = ? WHERE id = 1",
          [b.total_listened || 0, b.listened_this_month || 0, b.listened_this_year || 0,
           b.last_reset_month || null, b.last_reset_year || null, b.total_listened_ms || 0, b.total_liked || 0]
        );
      } else {
        dbRun(
          "UPDATE stats SET total_listened = MAX(total_listened, ?), total_listened_ms = MAX(total_listened_ms, ?), total_liked = MAX(total_liked, ?) WHERE id = 1",
          [b.total_listened || 0, b.total_listened_ms || 0, b.total_liked || 0]
        );
      }
      statsRestored = true;
    } catch {}
  }
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  if (Array.isArray(data.todos))      put('spotifyplus_todos', data.todos);
  if (Array.isArray(data.todos_done)) put('spotifyplus_todos_done', data.todos_done);
  if (data.rappels && typeof data.rappels === 'object') put('spotifyplus_rappels', data.rappels);
  if (Array.isArray(data.remembers))  put('spotifyplus_remember_custom', data.remembers);
  if (Array.isArray(data.tvtime))     put('spotifyplus_tvtime', data.tvtime);
  // Clé API TMDB : chaîne brute (PAS de JSON.stringify — tmdbKey() la lit telle quelle)
  if (typeof data.tmdb_key === 'string' && data.tmdb_key.trim()) {
    try { localStorage.setItem('spotifyplus_tmdb_key', data.tmdb_key.trim()); } catch {}
  }
  if (data.maps && typeof data.maps === 'object') { put('spotifyplus_maps', data.maps); _mapsCache = null; }
  // Paramétrage des modules (activés/désactivés) — REMPLACÉ si présent
  if (data.modules && typeof data.modules === 'object' && !Array.isArray(data.modules)) put(MODULES_LS_KEY, data.modules);
  // Finance : historique local des prix — FUSIONNÉ (pas remplacé) : union par série,
  // tri par date, densité bornée (≥ 30 min entre 2 points), cap FIN_HIST_MAX_PTS.
  // Un backup d'un autre appareil COMPLÈTE donc l'historique local sans l'écraser.
  if (data.finance && typeof data.finance === 'object' && data.finance.series && typeof data.finance.series === 'object') {
    try {
      const h = loadFinHist();
      for (const k of Object.keys(data.finance.series)) {
        const arr = data.finance.series[k];
        if (!Array.isArray(arr)) continue;
        const merged = (h.series[k] || [])
          .concat(arr.filter(p => p && p.t != null && p.v != null && !isNaN(p.v)))
          .sort((a, b) => a.t - b.t);
        const out = [];
        for (const p of merged) if (!out.length || p.t - out[out.length - 1].t >= FIN_HIST_MIN_MS) out.push(p);
        h.series[k] = out.slice(-FIN_HIST_MAX_PTS);
      }
      saveFinHist();
    } catch {}
  }
  // Coffre MDP : blob chiffré — copie de secours de l'existant avant remplacement
  // (même filet que l'import de GestionMdpPanel : spotifyplus_mdp_vault_prev)
  if (isVaultBlob(data.mdp_vault)) {
    const existing = loadVaultBlob();
    if (existing) { try { localStorage.setItem('spotifyplus_mdp_vault_prev', JSON.stringify(existing)); } catch {} }
    saveVaultBlob(data.mdp_vault);
  }
  return { artistsRestored, statsRestored };
}

// ── Données des graphiques (À propos) ──
// Tableau des N derniers jours (locaux) : { key:'YYYY-MM-DD', label:'DD', full:'DD/MM/YYYY' }
function _lastNDays(n) {
  const arr = [], now = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(now); d.setDate(now.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    arr.push({ key, label: String(d.getDate()).padStart(2, '0'), full: d.toLocaleDateString('fr-FR') });
  }
  return arr;
}
// Écoutes par jour (listened_at est en UTC → date(...,'localtime') pour la date locale)
function listensPerDay(n = 14) {
  const days = _lastNDays(n), counts = {};
  try {
    dbAll("SELECT date(listened_at,'localtime') d, COUNT(*) c FROM tracks WHERE listened = 1 AND listened_at IS NOT NULL GROUP BY d")
      .forEach(r => { counts[r.d] = r.c; });
  } catch {}
  return days.map(d => ({ ...d, value: counts[d.key] || 0 }));
}
// Tâches terminées par jour (journal spotifyplus_todos_done : [{ ts, fav }])
function todosPerDay(n = 14) {
  const days = _lastNDays(n), counts = {};
  try {
    loadTodoDone().forEach(e => {
      const d = new Date(e.ts);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      counts[key] = (counts[key] || 0) + 1;
    });
  } catch {}
  return days.map(d => ({ ...d, value: counts[d.key] || 0 }));
}
// Petit bar chart en divs (aucune lib externe → rien à ajouter à la CSP)
function BarChart({ data, color }) {
  const max = Math.max(1, ...data.map(d => d.value));
  return (
    <div style={{ display:'flex', alignItems:'flex-end', gap:3, height:88 }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:2, minWidth:0 }}>
          <div style={{ fontSize:8, color:C.muted, fontFamily:'DM Mono,monospace', height:10 }}>{d.value || ''}</div>
          <div title={`${d.full} : ${d.value}`} style={{ width:'100%', height:`${(d.value / max) * 58}px`, minHeight: d.value > 0 ? 2 : 0, background:color, borderRadius:2 }} />
          <div style={{ fontSize:7, color:C.dim, fontFamily:'DM Mono,monospace', whiteSpace:'nowrap' }}>{d.label}</div>
        </div>
      ))}
    </div>
  );
}
// Contenu du toggle Graphique — recalcule ses données au montage (donc à l'ouverture du collapse)
function ListeningCharts() {
  const listens = listensPerDay(14);
  const todos   = todosPerDay(14);
  const totalL  = listens.reduce((a, b) => a + b.value, 0);
  const totalT  = todos.reduce((a, b) => a + b.value, 0);
  return (
    <>
      <div style={{ fontSize:10, fontWeight:700, color:C.accent, letterSpacing:'0.04em' }}>🎧 Écoutes / jour <span style={{ color:C.muted, fontWeight:400 }}>· 14 j · {totalL} total</span></div>
      <BarChart data={listens} color={C.accent} />
      <div style={{ fontSize:10, fontWeight:700, color:TODO_PURPLE, letterSpacing:'0.04em', marginTop:8 }}>✅ Tâches terminées / jour <span style={{ color:C.muted, fontWeight:400 }}>· 14 j · {totalT} total</span></div>
      <BarChart data={todos} color={TODO_PURPLE} />
    </>
  );
}

// Stats avancées (À propos) — calculées au montage (donc à l'ouverture du collapse),
// depuis les titres écoutés NON PURGÉS (la purge supprime les lignes `tracks` : ces
// stats repartent de la dernière purge, contrairement aux compteurs de la table stats).
function AdvancedStats() {
  const data = React.useMemo(() => {
    const out = { top: [], types: [], avg30: 0 };
    try {
      out.top = dbAll("SELECT artist_name a, COUNT(*) c FROM tracks WHERE listened = 1 GROUP BY artist_name ORDER BY c DESC, a LIMIT 5");
      out.types = dbAll(
        "SELECT CASE WHEN release_type = 'single' THEN 'Singles' WHEN release_type = 'discover_weekly' THEN 'Découvertes' ELSE 'Albums' END t, COUNT(*) c " +
        "FROM tracks WHERE listened = 1 GROUP BY t ORDER BY c DESC"
      );
      const r = dbGet("SELECT COUNT(*) c FROM tracks WHERE listened = 1 AND listened_at >= datetime('now', '-30 days')");
      out.avg30 = Math.round(((r?.c || 0) / 30) * 10) / 10;
    } catch {}
    return out;
  }, []);
  const AMBER = '#e0a050';
  const totalTypes = data.types.reduce((a, b) => a + b.c, 0);
  const sub = { fontSize:10, fontWeight:700, color:AMBER, letterSpacing:'0.04em' };
  const row = { display:'flex', alignItems:'center', gap:8, fontSize:11, color:C.text };
  const mono = { fontFamily:'DM Mono,monospace', color:AMBER, fontWeight:700, marginLeft:'auto', flexShrink:0 };
  if (data.top.length === 0) {
    return <div style={{ fontSize:10, color:C.dim, fontStyle:'italic', textAlign:'center', padding:'4px 0', fontFamily:'DM Mono,monospace' }}>Aucune écoute depuis la dernière purge</div>;
  }
  return (
    <>
      <div style={sub}>🏆 Top artistes écoutés <span style={{ color:C.muted, fontWeight:400 }}>· depuis la dernière purge</span></div>
      {data.top.map((r, i) => (
        <div key={r.a} style={row}>
          <span style={{ fontFamily:'DM Mono,monospace', color:C.dim, fontSize:10, width:18, flexShrink:0 }}>#{i + 1}</span>
          <span style={{ minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{r.a}</span>
          <span style={mono}>{r.c}</span>
        </div>
      ))}
      <div style={{ ...sub, marginTop:6 }}>🎼 Répartition des écoutes</div>
      {data.types.map(t => (
        <div key={t.t} style={row}>
          <span>{t.t}</span>
          <span style={mono}>{t.c} · {totalTypes > 0 ? Math.round((t.c / totalTypes) * 100) : 0}%</span>
        </div>
      ))}
      <div style={{ ...sub, marginTop:6 }}>📅 Rythme d'écoute</div>
      <div style={row}>
        <span>Moyenne / jour (30 derniers jours)</span>
        <span style={mono}>{data.avg30.toLocaleString('fr-FR')}</span>
      </div>
    </>
  );
}

// ════════════════════════════════════════════════
// MAPS — trajets Google Timeline (visuel type « Vos trajets » de Google Maps)
// ════════════════════════════════════════════════
// ⚠ STRATÉGIE « SCRAPING » GOOGLE MAPS : il n'existe AUCUNE API publique pour la
// Timeline, et depuis fin 2024 les trajets sont stockés SUR LE TÉLÉPHONE (plus sur
// le web) — un scraping direct depuis une app statique est impossible (auth Google
// + CORS). La récupération passe donc par l'EXPORT OFFICIEL que l'utilisateur
// importe ici : Google Maps → profil → Vos trajets → ⚙ → « Exporter les données de
// vos trajets » (location-history.json / Timeline.json), ou Google Takeout →
// « Historique des positions (ancien) » (Semantic Location History). L'app NE TRACE
// JAMAIS la position : elle ne fait que lire ces fichiers. Import incrémental (les
// jours importés remplacent les mêmes jours, les autres sont conservés).
// Carte : Leaflet 1.9.4 AUTO-HÉBERGÉ (vendor/leaflet.js + .css, chargé lazy au 1er
// affichage) + tuiles OpenStreetMap (img-src CSP). Marqueurs 100% vectoriels
// (circleMarker) → aucune image Leaflet requise.
// Données : localStorage `spotifyplus_maps` = { version, updated_at, days: {
//   'YYYY-MM-DD': [ segment ] } } — segment 'move' = { kind, mode, start, end,
//   distance_m, path:[[lat,lon],…] } · segment 'visit' = { kind, name, lat, lon,
//   start, end }. Déjà inclus dans buildBackup/applyBackup (clé `maps`) + Dropbox.
const MAPS_COLOR = '#e6d53f';
const MAPS_LS_KEY = 'spotifyplus_maps';
// Modes de déplacement : icône, libellé FR, couleur du tracé sur la carte
const MAPS_MODES = {
  walk:    { icon:'🚶', label:'À pied',     color:'#4ea3f5' },
  run:     { icon:'🏃', label:'Course',     color:'#e0608a' },
  bike:    { icon:'🚴', label:'Vélo',       color:'#45c552' },
  drive:   { icon:'🚗', label:'Voiture',    color:'#e6d53f' },
  transit: { icon:'🚆', label:'Transports', color:'#b06cf5' },
  fly:     { icon:'✈️', label:'Avion',      color:'#38c98a' },
  other:   { icon:'🧭', label:'Trajet',     color:'#c8956c' },
};

// Cache mémoire : évite de re-JSON.parse un blob potentiellement gros (plusieurs Mo)
// à chaque render de StatsPanel (qui re-rend au tick 5s du player). Invalidé par
// saveMaps et par applyBackup (restauration d'une sauvegarde).
let _mapsCache = null;
function loadMaps() {
  if (_mapsCache) return _mapsCache;
  let d = null;
  try { d = JSON.parse(localStorage.getItem(MAPS_LS_KEY)); } catch {}
  _mapsCache = (d && typeof d === 'object' && d.days && typeof d.days === 'object') ? d : { version: 1, days: {} };
  return _mapsCache;
}
function saveMaps(data) {
  data.version = 1;
  data.updated_at = new Date().toISOString();
  try { localStorage.setItem(MAPS_LS_KEY, JSON.stringify(data)); _mapsCache = data; return true; }
  catch (e) { alert('⚠ Stockage local plein : impossible d\'enregistrer les trajets.\nSupprime des données (ou importe un fichier plus court).'); return false; }
}

// Parse tous les formats de coordonnées rencontrés dans les exports Google :
// "48.76°, 2.03°" (export sur appareil) · "geo:48.76,2.03" (iOS) ·
// { latLng:"…" } · { latitudeE7, longitudeE7 } / { latE7, lngE7 } (Takeout)
function mapsParseLatLng(v) {
  if (!v) return null;
  if (typeof v === 'object') {
    if (v.latLng != null) return mapsParseLatLng(v.latLng);
    if (v.latitudeE7 != null && v.longitudeE7 != null) return mapsCheckLL(v.latitudeE7 / 1e7, v.longitudeE7 / 1e7);
    if (v.latE7 != null && v.lngE7 != null) return mapsCheckLL(v.latE7 / 1e7, v.lngE7 / 1e7);
    if (v.lat != null && (v.lng != null || v.lon != null)) return mapsCheckLL(parseFloat(v.lat), parseFloat(v.lng != null ? v.lng : v.lon));
    return null;
  }
  const m = String(v).replace(/^geo:/i, '').match(/(-?\d+(?:\.\d+)?)\s*°?\s*,\s*(-?\d+(?:\.\d+)?)/);
  return m ? mapsCheckLL(parseFloat(m[1]), parseFloat(m[2])) : null;
}
function mapsCheckLL(lat, lon) {
  return (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) ? [lat, lon] : null;
}
// Type d'activité Google (2 formats : "IN_PASSENGER_VEHICLE" / "in passenger vehicle") → mode
function mapsMode(t) {
  const s = String(t || '').toLowerCase().replace(/_/g, ' ');
  if (s.includes('walk')) return 'walk';
  if (s.includes('run')) return 'run';
  if (s.includes('cycl') || s.includes('bik')) return 'bike';
  if (s.includes('bus') || s.includes('train') || s.includes('subway') || s.includes('tram') || s.includes('ferry') || s.includes('transit')) return 'transit';
  if (s.includes('fly') || s.includes('plane') || s.includes('air')) return 'fly';
  if (s.includes('vehicle') || s.includes('driv') || s.includes('motorcycl') || s.includes('car')) return 'drive';
  return 'other';
}
function mapsVisitName(semanticType) {
  const s = String(semanticType || '').toLowerCase();
  if (s.includes('home')) return 'Domicile';
  if (s.includes('work')) return 'Travail';
  if (s.includes('searched')) return 'Adresse recherchée';
  return 'Lieu visité';
}
function mapsHaversineM(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function mapsPathDistanceM(path) {
  let d = 0;
  for (let i = 1; i < path.length; i++) d += mapsHaversineM(path[i - 1], path[i]);
  return d;
}
// Simplifie un tracé : coordonnées arrondies à 5 décimales (~1 m) + échantillonnage
// à `maxPts` points (premier/dernier conservés) — garde localStorage sous contrôle
function mapsSimplifyPath(path, maxPts = 150) {
  const pts = (path || []).filter(p => Array.isArray(p) && isFinite(p[0]) && isFinite(p[1]))
    .map(p => [Math.round(p[0] * 1e5) / 1e5, Math.round(p[1] * 1e5) / 1e5]);
  if (pts.length <= maxPts) return pts;
  const step = (pts.length - 1) / (maxPts - 1), out = [];
  for (let i = 0; i < maxPts; i++) out.push(pts[Math.round(i * step)]);
  return out;
}
// Jour LOCAL 'YYYY-MM-DD' d'un ISO (ou d'une Date) — même convention que _lastNDays
function mapsDayKey(iso) {
  const d = iso instanceof Date ? iso : new Date(iso);
  if (isNaN(d)) return null;
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Convertit un export Google Timeline en segments normalisés groupés par jour local.
// Formats supportés :
// 1. Export sur appareil (≥ fin 2024) : { semanticSegments:[ {visit} | {activity} |
//    {timelinePath} ] } — les timelinePath (points horodatés) sont rattachés aux
//    activités par chevauchement temporel (l'activité donne mode/distance, le
//    timelinePath donne le tracé détaillé) ; un timelinePath orphelin devient un
//    trajet 'other'.
// 2. Takeout « Historique des positions (ancien) » : { timelineObjects:[
//    {activitySegment} | {placeVisit} ] } (Semantic Location History/YYYY_MOIS.json).
// (Records.json — points GPS bruts, des centaines de Mo — n'est PAS supporté.)
function parseGoogleTimeline(json) {
  const moves = [], visits = [], rawPaths = [];
  const tsOf = (dur, k) => (dur && dur[k]) || (dur && dur[k + 'Ms'] ? new Date(+dur[k + 'Ms']).toISOString() : null);

  for (const seg of (Array.isArray(json && json.semanticSegments) ? json.semanticSegments : [])) {
    const start = seg.startTime || null, end = seg.endTime || seg.startTime || null;
    if (seg.visit) {
      const tc = seg.visit.topCandidate || {};
      const ll = mapsParseLatLng(tc.placeLocation);
      if (ll && start) visits.push({ kind:'visit', name: mapsVisitName(tc.semanticType), lat: ll[0], lon: ll[1], start, end });
    } else if (seg.activity) {
      const a = seg.activity;
      if (start && end) moves.push({
        kind:'move', mode: mapsMode(a.topCandidate && a.topCandidate.type), start, end,
        distance_m: Math.round(parseFloat(a.distanceMeters) || 0),
        path: [mapsParseLatLng(a.start), mapsParseLatLng(a.end)].filter(Boolean), _thin: true,
      });
    } else if (Array.isArray(seg.timelinePath) && seg.timelinePath.length) {
      const startMs = start ? new Date(start).getTime() : NaN;
      const pts = [];
      for (const p of seg.timelinePath) {
        const ll = mapsParseLatLng(p.point);
        if (!ll) continue;
        let t = p.time ? new Date(p.time).getTime() : NaN;
        // Ancien export sur appareil : offset en minutes depuis le début du segment
        if (!isFinite(t) && isFinite(startMs) && p.durationMinutesOffsetFromStartTime != null)
          t = startMs + parseFloat(p.durationMinutesOffsetFromStartTime) * 60000;
        pts.push({ ll, t: isFinite(t) ? t : null });
      }
      if (pts.length > 1) rawPaths.push({ start, end, pts, used: false });
    }
  }

  for (const o of (Array.isArray(json && json.timelineObjects) ? json.timelineObjects : [])) {
    if (o.placeVisit) {
      const pv = o.placeVisit;
      const ll = mapsParseLatLng(pv.location);
      const start = tsOf(pv.duration, 'startTimestamp'), end = tsOf(pv.duration, 'endTimestamp') || start;
      if (ll && start) visits.push({
        kind:'visit', name: (pv.location && (pv.location.name || pv.location.address)) || 'Lieu visité',
        lat: ll[0], lon: ll[1], start, end,
      });
    }
    if (o.activitySegment) {
      const a = o.activitySegment;
      const start = tsOf(a.duration, 'startTimestamp'), end = tsOf(a.duration, 'endTimestamp') || start;
      if (!start) continue;
      // Tracé : simplifiedRawPath (dense) sinon waypointPath, sinon segment départ→arrivée
      const raw = (a.simplifiedRawPath && a.simplifiedRawPath.points) || [];
      const wps = (a.waypointPath && a.waypointPath.waypoints) || [];
      const path = [];
      for (const p of (raw.length > wps.length ? raw : wps)) { const ll = mapsParseLatLng(p); if (ll) path.push(ll); }
      if (!path.length) {
        const s = mapsParseLatLng(a.startLocation), e = mapsParseLatLng(a.endLocation);
        if (s) path.push(s);
        if (e) path.push(e);
      }
      moves.push({ kind:'move', mode: mapsMode(a.activityType), start, end, distance_m: Math.round(a.distance || 0), path });
    }
  }

  // Rattache les timelinePath aux activités « maigres » du format 1 (± 2 min de marge)
  for (const mv of moves) {
    if (!mv._thin) continue;
    delete mv._thin;
    const s = new Date(mv.start).getTime() - 120000, e = new Date(mv.end).getTime() + 120000;
    const pts = [];
    for (const rp of rawPaths) {
      for (const p of rp.pts) if (p.t != null && p.t >= s && p.t <= e) { pts.push(p); rp.used = true; }
    }
    if (pts.length > 1) { pts.sort((x, y) => x.t - y.t); mv.path = pts.map(p => p.ll); }
  }
  // timelinePath sans activité correspondante → trajet 'other' (export sans segments activity)
  for (const rp of rawPaths) {
    if (rp.used) continue;
    const first = rp.pts[0], last = rp.pts[rp.pts.length - 1];
    const start = rp.start || (first.t != null ? new Date(first.t).toISOString() : null);
    const end = rp.end || (last.t != null ? new Date(last.t).toISOString() : null) || start;
    if (start) moves.push({ kind:'move', mode:'other', start, end, distance_m: 0, path: rp.pts.map(p => p.ll) });
  }

  // Normalisation : tracés simplifiés, distance recalculée si absente, groupement par jour local
  const days = {};
  let count = 0;
  for (const seg of moves.concat(visits)) {
    const key = mapsDayKey(seg.start);
    if (!key) continue;
    if (seg.kind === 'move') {
      seg.path = mapsSimplifyPath(seg.path);
      if (seg.path.length < 2 && !seg.distance_m) continue; // rien d'affichable
      if (!seg.distance_m && seg.path.length > 1) seg.distance_m = Math.round(mapsPathDistanceM(seg.path));
    }
    (days[key] = days[key] || []).push(seg);
    count++;
  }
  for (const k in days) days[k].sort((a, b) => new Date(a.start) - new Date(b.start));
  return { days, count };
}

// Fusion d'un import dans la base : les jours importés REMPLACENT les mêmes jours
// existants (Google = source de vérité), les autres jours sont conservés. Garde-fou
// localStorage (~5 Mo) : re-simplifie tous les tracés si la base devient trop grosse.
function mapsMergeImport(parsed) {
  const data = loadMaps();
  data.days = data.days || {};
  for (const k in parsed.days) data.days[k] = parsed.days[k];
  for (const cap of [null, 60, 25]) {
    if (cap) for (const k in data.days) for (const s of data.days[k]) if (s.kind === 'move') s.path = mapsSimplifyPath(s.path, cap);
    if (JSON.stringify(data).length < 4200000) break;
  }
  return saveMaps(data);
}

function fmtMapsKm(m) {
  if (!m) return '0 km';
  return m >= 1000 ? `${(m / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} km` : `${Math.round(m)} m`;
}
function fmtMapsDur(ms) {
  if (!isFinite(ms) || ms <= 0) return '';
  const min = Math.round(ms / 60000);
  if (min < 60) return `${min} min`;
  return `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, '0')}`;
}
// Stats Maps (collapse 🗺️ de StatsPanel) — distance parcourue jour/mois/année/total
function mapsStats() {
  const days = loadMaps().days || {};
  const today = mapsDayKey(new Date()), ym = today.slice(0, 7), y = today.slice(0, 4);
  let dToday = 0, dMonth = 0, dYear = 0, dAll = 0, trips = 0;
  const byMode = {};
  for (const k in days) {
    for (const s of days[k]) {
      if (s.kind !== 'move') continue;
      const m = s.distance_m || 0;
      dAll += m; trips++;
      byMode[s.mode] = (byMode[s.mode] || 0) + m;
      if (k === today) dToday += m;
      if (k.slice(0, 7) === ym) dMonth += m;
      if (k.slice(0, 4) === y) dYear += m;
    }
  }
  let topMode = null, topM = 0;
  for (const mo in byMode) if (byMode[mo] > topM) { topMode = mo; topM = byMode[mo]; }
  return { dToday, dMonth, dYear, dAll, trips, nDays: Object.keys(days).length, topMode, topM };
}

// Chargement lazy de Leaflet auto-hébergé (vendor/) — uniquement au 1er affichage de la carte
let _leafletPromise = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  if (_leafletPromise) return _leafletPromise;
  _leafletPromise = new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = './vendor/leaflet.css';
    document.head.appendChild(link);
    const s = document.createElement('script');
    s.src = './vendor/leaflet.js';
    s.onload = () => resolve();
    s.onerror = () => { _leafletPromise = null; reject(new Error('leaflet load failed')); };
    document.head.appendChild(s);
  });
  return _leafletPromise;
}
// Échappe le HTML injecté dans les popups Leaflet (bindPopup accepte du HTML ; les noms
// de lieux viennent d'un fichier importé → jamais de HTML brut, même via un backup piégé)
const mapsEsc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

// Carte Leaflet d'une journée : polylignes colorées par mode + lieux en circleMarker
// (vectoriel — aucune image marker requise). fitBounds à chaque changement de jour.
function MapsMap({ segs }) {
  const divRef = React.useRef(null);
  const mapRef = React.useRef(null);
  const layerRef = React.useRef(null);
  const [status, setStatus] = React.useState(window.L ? 'ready' : 'loading');
  React.useEffect(() => {
    let dead = false;
    loadLeaflet().then(() => { if (!dead) setStatus('ready'); }).catch(() => { if (!dead) setStatus('error'); });
    return () => { dead = true; };
  }, []);
  React.useEffect(() => {
    if (status !== 'ready' || !divRef.current) return;
    if (!mapRef.current) {
      const map = L.map(divRef.current, { zoomControl: true, scrollWheelZoom: true });
      map.setView([46.6, 2.4], 5); // vue France par défaut (avant fitBounds)
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, className: 'maps-dark-tiles', attribution: '© OpenStreetMap',
      }).addTo(map);
      layerRef.current = L.layerGroup().addTo(map);
      mapRef.current = map;
    }
    const grp = layerRef.current;
    grp.clearLayers();
    const bounds = [];
    for (const s of segs) {
      if (s.kind === 'move' && Array.isArray(s.path) && s.path.length > 1) {
        const md = MAPS_MODES[s.mode] || MAPS_MODES.other;
        L.polyline(s.path, { color: md.color, weight: 4, opacity: 0.85 }).addTo(grp)
          .bindPopup(`${md.icon} <b>${md.label}</b> · ${fmtMapsKm(s.distance_m)}<br>${fmtHM(s.start)} → ${fmtHM(s.end)}`);
        // Point de départ du trajet (petit disque de la couleur du mode)
        L.circleMarker(s.path[0], { radius: 4, color: md.color, weight: 2, fillColor: '#111', fillOpacity: 1 }).addTo(grp);
        for (const p of s.path) bounds.push(p);
      } else if (s.kind === 'visit') {
        L.circleMarker([s.lat, s.lon], { radius: 7, color: '#fff', weight: 2, fillColor: MAPS_COLOR, fillOpacity: 0.95 }).addTo(grp)
          .bindPopup(`📍 <b>${mapsEsc(s.name)}</b><br>${fmtHM(s.start)} → ${fmtHM(s.end)}`);
        bounds.push([s.lat, s.lon]);
      }
    }
    if (bounds.length) mapRef.current.fitBounds(bounds, { padding: [24, 24], maxZoom: 16 });
    // Le conteneur vient d'être monté/redimensionné : recale la taille des tuiles
    const t = setTimeout(() => { try { mapRef.current.invalidateSize(); } catch {} }, 80);
    return () => clearTimeout(t);
  }, [status, segs]);
  // Démontage (changement d'onglet) : détruit proprement l'instance Leaflet
  React.useEffect(() => () => {
    try { if (mapRef.current) mapRef.current.remove(); } catch {}
    mapRef.current = null; layerRef.current = null;
  }, []);
  if (status === 'error') return (
    <div style={{ height: 120, display:'flex', alignItems:'center', justifyContent:'center', background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, fontSize:11, color:C.muted }}>
      ⚠ Carte indisponible (Leaflet n'a pas pu être chargé)
    </div>
  );
  return <div ref={divRef} style={{ height: 320, borderRadius: 12, border:`1px solid ${C.border}`, overflow:'hidden', background:'#111' }} />;
}

// Section Maps — « Mes trajets » : carte du jour + timeline horodatée + import
function MapsPanel() {
  const [data, setData] = React.useState(() => ({ ...loadMaps() }));
  const todayKey = mapsDayKey(new Date());
  const [day, setDay] = React.useState(() => {
    // Aujourd'hui si des données existent pour ce jour (ou base vide), sinon le
    // dernier jour renseigné — on n'ouvre jamais sur une carte vide sans raison
    const keys = Object.keys(loadMaps().days || {}).sort();
    const t = mapsDayKey(new Date());
    return (!keys.length || keys.includes(t)) ? t : keys[keys.length - 1];
  });
  const [busy, setBusy] = React.useState(false);
  const fileRef = React.useRef(null);

  const dayKeys = React.useMemo(() => Object.keys(data.days || {}).sort(), [data]);
  const segs = (data.days || {})[day] || [];
  const movesOfDay = segs.filter(s => s.kind === 'move');
  const visitsOfDay = segs.filter(s => s.kind === 'visit');
  const totalM = movesOfDay.reduce((a, s) => a + (s.distance_m || 0), 0);
  const totalMoveMs = movesOfDay.reduce((a, s) => a + Math.max(0, (new Date(s.end) - new Date(s.start)) || 0), 0);

  const onFile = (ev) => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    setBusy(true);
    const r = new FileReader();
    r.onload = () => {
      try {
        const parsed = parseGoogleTimeline(JSON.parse(r.result));
        const keys = Object.keys(parsed.days).sort();
        if (!keys.length) {
          alert('Aucun trajet reconnu dans ce fichier.\n\nFormats acceptés :\n· Export « Vos trajets » de l\'appli Google Maps (location-history.json / Timeline.json)\n· Takeout « Historique des positions (ancien) » (Semantic Location History/AAAA_MOIS.json)\n\n(Records.json — points GPS bruts — n\'est pas supporté.)');
        } else if (mapsMergeImport(parsed)) {
          setData({ ...loadMaps() });
          setDay(keys[keys.length - 1]);
          alert(`✓ ${parsed.count} segment(s) importé(s) sur ${keys.length} jour(s) (${keys[0]} → ${keys[keys.length - 1]}).\nLes jours importés remplacent les mêmes jours déjà présents, les autres sont conservés.`);
        }
      } catch { alert('Fichier illisible : un export JSON Google Timeline est attendu.'); }
      setBusy(false);
    };
    r.onerror = () => setBusy(false);
    r.readAsText(f);
  };

  // ‹ › naviguent entre les JOURS RENSEIGNÉS (comme Google) ; l'input date reste libre
  const prevKey = [...dayKeys].reverse().find(k => k < day);
  const nextKey = dayKeys.find(k => k > day);
  const navBtn = (enabled) => ({
    background: C.surfaceHigh, border:`1px solid ${C.border}`, borderRadius:8, width:34, height:32,
    cursor: enabled ? 'pointer' : 'default', color: enabled ? MAPS_COLOR : C.dim, fontSize:16, fontWeight:800, lineHeight:1,
  });
  const chip = (icon, val) => (
    <div key={icon} style={{ background:C.surfaceHigh, border:`1px solid ${C.border}`, borderRadius:99, padding:'4px 10px', fontSize:10, color:C.text, display:'flex', alignItems:'center', gap:5 }}>
      <span>{icon}</span><span style={{ fontFamily:'DM Mono,monospace', fontWeight:500 }}>{val}</span>
    </div>
  );

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
      <input ref={fileRef} type="file" accept="application/json,.json" onChange={onFile} style={{ display:'none' }} />
      {!dayKeys.length ? (
        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:'14px 13px', fontSize:11, color:C.muted, lineHeight:1.65 }}>
          🗺️ <b style={{ color:C.text }}>Mes trajets</b> — visualise ici tes déplacements jour par jour (carte + horaires),
          comme dans l'onglet « Vos trajets » de Google Maps.<br /><br />
          Spotify+ <b style={{ color:C.text }}>ne trace jamais ta position</b> : les trajets viennent de Google Maps,
          via l'export officiel de ta Timeline (fichier JSON) à importer ci-dessous —
          voir « Comment récupérer mes trajets ».
        </div>
      ) : (
        <>
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            <button onClick={() => prevKey && setDay(prevKey)} disabled={!prevKey} style={navBtn(!!prevKey)} title="Jour renseigné précédent">‹</button>
            <input type="date" value={day} onChange={e => e.target.value && setDay(e.target.value)}
              style={{ flex:1, minWidth:0, background:C.surfaceHigh, border:`1px solid ${C.border}`, borderRadius:8, color:C.text, padding:'6px 8px', fontSize:12, fontFamily:'DM Mono,monospace', textAlign:'center', colorScheme:'dark' }} />
            <button onClick={() => nextKey && setDay(nextKey)} disabled={!nextKey} style={navBtn(!!nextKey)} title="Jour renseigné suivant">›</button>
            {day !== todayKey && (
              <button onClick={() => setDay(todayKey)}
                style={{ background:`${MAPS_COLOR}15`, border:`1px solid ${MAPS_COLOR}50`, borderRadius:8, height:32, padding:'0 10px', cursor:'pointer', color:MAPS_COLOR, fontSize:10, fontWeight:700 }}>
                Auj.
              </button>
            )}
          </div>
          <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
            {chip('📏', fmtMapsKm(totalM))}
            {chip('⏱', fmtMapsDur(totalMoveMs) || '0 min')}
            {chip('🧭', `${movesOfDay.length} trajet${movesOfDay.length > 1 ? 's' : ''}`)}
            {chip('📍', `${visitsOfDay.length} lieu${visitsOfDay.length > 1 ? 'x' : ''}`)}
          </div>
          <MapsMap segs={segs} />
          {segs.length ? (
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              {segs.map((s, i) => {
                const md = s.kind === 'move' ? (MAPS_MODES[s.mode] || MAPS_MODES.other) : null;
                const durMs = new Date(s.end) - new Date(s.start);
                return (
                  <div key={i} style={{ display:'flex', alignItems:'center', gap:10, background:C.surface, border:`1px solid ${C.border}`, borderLeft:`3px solid ${md ? md.color : MAPS_COLOR}`, borderRadius:10, padding:'8px 11px' }}>
                    <div style={{ fontSize:16, width:24, textAlign:'center', flexShrink:0 }}>{md ? md.icon : '📍'}</div>
                    <div style={{ minWidth:0, flex:1 }}>
                      <div style={{ fontSize:11.5, fontWeight:700, color:C.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                        {md ? md.label : s.name}
                        {md && s.distance_m ? <span style={{ color: md.color, fontWeight:800 }}> · {fmtMapsKm(s.distance_m)}</span> : null}
                      </div>
                      <div style={{ fontSize:9.5, color:C.muted, fontFamily:'DM Mono,monospace', marginTop:2 }}>
                        {fmtHM(s.start)} – {fmtHM(s.end)}{fmtMapsDur(durMs) ? ` · ${fmtMapsDur(durMs)}` : ''}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            <div style={{ fontSize:11, color:C.muted, fontStyle:'italic', textAlign:'center', padding:'14px 12px', border:`1px dashed ${C.border}`, borderRadius:10 }}>
              Aucun trajet renseigné ce jour — importe un export Google plus récent
            </div>
          )}
        </>
      )}
      <button onClick={() => fileRef.current && fileRef.current.click()} disabled={busy}
        style={{ background:`${MAPS_COLOR}12`, border:`1px solid ${MAPS_COLOR}40`, borderRadius:10, padding:'10px 14px', cursor: busy ? 'default' : 'pointer', color:MAPS_COLOR, fontSize:11, fontWeight:700, letterSpacing:'0.04em', textAlign:'left', opacity: busy ? 0.5 : 1 }}>
        📥 {busy ? 'Import en cours…' : 'Importer mes trajets Google'} <span style={{ fontWeight:400, opacity:0.7 }}>(JSON Timeline / Takeout)</span>
      </button>
      <StatsCollapse title="❓ COMMENT RÉCUPÉRER MES TRAJETS" color={MAPS_COLOR}>
        <div style={{ fontSize:10.5, color:C.muted, lineHeight:1.7 }}>
          Google ne fournit <b style={{ color:C.text }}>aucune API publique</b> pour la Timeline, et depuis fin 2024 les trajets
          sont stockés <b style={{ color:C.text }}>sur ton téléphone</b> (plus sur le web) : impossible de les « scraper »
          directement depuis une app statique (authentification Google + CORS). On passe donc par l'export officiel :<br /><br />
          📱 <b style={{ color:C.text }}>Android / iPhone (recommandé)</b> : Google Maps → ta photo de profil →
          « Vos trajets » → ⚙ → « Paramètres de localisation et de confidentialité » →
          <b style={{ color:C.text }}> « Exporter les données de vos trajets »</b> → importer ici le fichier
          <code style={{ color:MAPS_COLOR }}> location-history.json</code> (ou <code style={{ color:MAPS_COLOR }}>Timeline.json</code>).<br /><br />
          💻 <b style={{ color:C.text }}>Ancien historique (web)</b> : takeout.google.com → « Historique des positions (ancien) » →
          dossier <code style={{ color:MAPS_COLOR }}>Semantic Location History</code> → importer chaque fichier
          <code style={{ color:MAPS_COLOR }}> AAAA_MOIS.json</code>.<br /><br />
          ↻ À refaire de temps en temps (ex. 1×/semaine) : chaque import remplace les jours qu'il contient et conserve
          les autres. Les trajets sont inclus dans l'export 🗺️ Maps (À propos) et la sauvegarde Dropbox.
        </div>
      </StatsCollapse>
      {data.updated_at && (
        <div style={{ color:C.dim, fontSize:9.5, textAlign:'center' }}>
          Dernier import : {new Date(data.updated_at).toLocaleString('fr-FR', { dateStyle:'long', timeStyle:'short' })}
        </div>
      )}
    </div>
  );
}

// Sync Dropbox optionnelle (upload de la sauvegarde). Affiche un état "non configuré"
// tant que DROPBOX_APP_KEY est vide (aucun appel réseau).
function DropboxSync() {
  const [connected, setConnected] = React.useState(dropboxConnected());
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg]   = React.useState('');
  const DBX = '#0061ff';
  const btn = { background:`${DBX}15`, border:`1px solid ${DBX}55`, borderRadius:10, padding:'10px 14px', cursor:'pointer', color:'#5a9bff', fontSize:11, fontWeight:700, letterSpacing:'0.04em', textAlign:'left' };
  if (!dropboxConfigured()) {
    return (
      <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:'10px 12px', fontSize:10, color:C.muted, lineHeight:1.55 }}>
        ☁︎ <b style={{ color:C.text }}>Sync Dropbox</b> — non configurée. Crée une app sur <span style={{ color:'#5a9bff' }}>dropbox.com/developers/apps</span> (Scoped · App folder · <i>files.content.write</i>), colle son <i>App key</i> dans <code style={{ color:MDP_PURPLE }}>DROPBOX_APP_KEY</code> et enregistre l'URL de redirection de l'app.
      </div>
    );
  }
  const save = async () => {
    setBusy(true); setMsg('');
    try { await dropboxUpload(buildBackup()); try { localStorage.setItem('spotifyplus_last_backup', String(Date.now())); } catch {} setMsg('✓ Sauvegardé sur Dropbox'); }
    catch (e) { setMsg('✗ Échec : ' + (e.message || 'erreur')); }
    setBusy(false);
  };
  const disconnect = () => { dropboxLogout(); setConnected(false); setMsg(''); };
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
      {connected ? (
        <>
          <button onClick={save} disabled={busy} style={{ ...btn, opacity: busy ? 0.6 : 1 }}>☁︎ {busy ? 'Sauvegarde en cours…' : 'Sauvegarder sur Dropbox'} {!busy && <span style={{ fontWeight:400, opacity:0.7 }}>(tout, écrase la dernière version)</span>}</button>
          <button onClick={disconnect} style={{ background:'none', border:'none', color:C.muted, fontSize:10, cursor:'pointer', textAlign:'left', padding:'0 2px' }}>Déconnecter Dropbox</button>
        </>
      ) : (
        <button onClick={dropboxLogin} style={btn}>☁︎ Connecter Dropbox <span style={{ fontWeight:400, opacity:0.7 }}>(sauvegarde multi-appareils)</span></button>
      )}
      {msg && <div style={{ fontSize:10, color: msg.startsWith('✓') ? C.accent : '#e0708a' }}>{msg}</div>}
    </div>
  );
}

// Sync Google Drive optionnelle (upload de la sauvegarde) — même UX que DropboxSync.
// Affiche un état "non configuré" tant que GDRIVE_CLIENT_ID est vide (aucun appel réseau).
// Flux implicite (pas de refresh token) : à l'expiration du token (~1h), le bouton repasse
// automatiquement en « Connecter » (reconnexion en 1 clic).
function GoogleDriveSync() {
  const [connected, setConnected] = React.useState(gdriveConnected());
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg]   = React.useState('');
  const GD = '#34a853';
  const btn = { background:`${GD}15`, border:`1px solid ${GD}55`, borderRadius:10, padding:'10px 14px', cursor:'pointer', color:'#57c973', fontSize:11, fontWeight:700, letterSpacing:'0.04em', textAlign:'left' };
  if (!gdriveConfigured()) {
    return (
      <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:'10px 12px', fontSize:10, color:C.muted, lineHeight:1.55 }}>
        △ <b style={{ color:C.text }}>Sync Google Drive</b> — non configurée. Crée un projet sur <span style={{ color:'#57c973' }}>console.cloud.google.com</span> (activer l'<i>API Google Drive</i> + ID client OAuth type <i>Application Web</i>, avec l'URL de l'app en origine ET URI de redirection autorisées), puis colle l'<i>ID client</i> dans <code style={{ color:MDP_PURPLE }}>GDRIVE_CLIENT_ID</code>.
      </div>
    );
  }
  const save = async () => {
    if (!gdriveToken()) { setConnected(false); setMsg('✗ Session Google expirée — reconnecte-toi'); return; }
    setBusy(true); setMsg('');
    try { await gdriveUpload(buildBackup()); try { localStorage.setItem('spotifyplus_last_backup', String(Date.now())); } catch {} setMsg('✓ Sauvegardé sur Google Drive'); }
    catch (e) {
      // 401 = token révoqué/expiré côté Google → on repasse en état déconnecté
      if (String(e && e.message).indexOf('401') !== -1) { gdriveLogout(); setConnected(false); setMsg('✗ Session Google expirée — reconnecte-toi'); }
      else setMsg('✗ Échec : ' + ((e && e.message) || 'erreur'));
    }
    setBusy(false);
  };
  const disconnect = () => { gdriveLogout(); setConnected(false); setMsg(''); };
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
      {connected ? (
        <>
          <button onClick={save} disabled={busy} style={{ ...btn, opacity: busy ? 0.6 : 1 }}>△ {busy ? 'Sauvegarde en cours…' : 'Sauvegarder sur Google Drive'} {!busy && <span style={{ fontWeight:400, opacity:0.7 }}>(tout, écrase la dernière version)</span>}</button>
          <button onClick={disconnect} style={{ background:'none', border:'none', color:C.muted, fontSize:10, cursor:'pointer', textAlign:'left', padding:'0 2px' }}>Déconnecter Google Drive</button>
        </>
      ) : (
        <button onClick={gdriveLogin} style={btn}>△ Connecter Google Drive <span style={{ fontWeight:400, opacity:0.7 }}>(sauvegarde multi-appareils)</span></button>
      )}
      {msg && <div style={{ fontSize:10, color: msg.startsWith('✓') ? C.accent : '#e0708a' }}>{msg}</div>}
    </div>
  );
}

// Séparé d'À propos (VosEcoutesPanel) : Stats = les chiffres, À propos = export / restore /
// Dropbox / quota / purge / version.
function StatsPanel() {
  const { listenStats: ls, now } = useStore();
  const fmtN = n => Number(n).toLocaleString('fr-FR');
  const fmtDuration = ms => {
    const totalMin = Math.floor((ms || 0) / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  };
  const fmtListenedTime = ms => {
    const totalMin = Math.floor((ms || 0) / 60000);
    if (totalMin < 60) return `${totalMin} min`;
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return m > 0 ? `${h}h ${m}min` : `${h}h`;
  };

  // Total écouté = durée des tracks listened=1 + durée du titre en cours (now.duration en secondes → ms)
  const currentTrackMs = now?.duration ? now.duration * 1000 : 0;
  const totalListenedMs = (ls.listened_ms || 0) + currentTrackMs;

  // % likés = likes posés dans l'app (stats.total_liked, jamais purgé) / écoutes all-time
  const totalLiked = ls.total_liked || 0;
  const likedPct = ls.all_time > 0 ? (totalLiked / ls.all_time) * 100 : 0;
  const likedPctStr = `${(Math.round(likedPct * 10) / 10).toLocaleString('fr-FR')} %`;

  const cards = [

// À PROPOS — export / restauration / Dropbox / réinit quota / purge / version.
function VosEcoutesPanel() {
  const { listenStats: ls, purgeListened, resetQuota, restoreBackup, dailyScrapings, quotaUntil, dbReady, moduleToggles, setModuleEnabled } = useStore();
  const quotaActive = quotaUntil > Date.now();
  const restoreRef = React.useRef(null);
  // Restauration d'une sauvegarde exportée (fichier JSON de buildBackup)
  const onRestoreFile = (ev) => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || data.app !== 'spotifyplus') { alert('Fichier invalide : ce n\'est pas une sauvegarde Spotify+.'); return; }
        const n = Array.isArray(data.artists) ? data.artists.length : 0;
        const when = data.exported_at ? new Date(data.exported_at).toLocaleDateString('fr-FR') : '?';
        if (!confirm(`Restaurer la sauvegarde du ${when} ?\n\n· ${n} artiste(s) — dates de scan fusionnées (jamais régressées)\n· Stats d'écoute — fusion prudente\n· To do / Remember / TV Time / Maps / Coffre MDP — REMPLACÉS par la sauvegarde (seulement s'ils sont présents dans le fichier)`)) return;
        const res = await restoreBackup(data);

      } catch (e) { alert('Fichier illisible ou invalide.'); }
    };
    r.readAsText(f);

  const onResetQuota = () => {
    if (confirm('Réinitialiser le quota 24h ?\nLe compteur repart à 0/100 et tu pourras relancer une synchro immédiatement.')) resetQuota();
