// Tableau des N derniers jours (locaux) : { key:'YYYY-MM-DD', label:'DD', full:'DD/MM/YYYY' }
function _lastNDays(n) {
  const arr = [], now = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(now); d.setDate(now.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    arr.push({ key, label: String(d.getDate()).padStart(2, '0'), full: d.toLocaleDateString('fr-FR') });
  }
  return arr;
}
// Journal PERSISTANT des Ã©coutes â€” [{ ts }] en localStorage, bornÃ© Ã  5000 entrÃ©es.
// âš  SURVIT Ã€ LA PURGE (contrairement Ã  tracks.listened_at, supprimÃ© par Â« Purger les
// Ã©coutes Â») â†’ alimente durablement le graphique Ã‰coutes/jour. Inclus dans le backup (fusionnÃ©).
const LISTEN_LOG_KEY = 'spotifyplus_listens';
function loadListenLog() { try { return JSON.parse(localStorage.getItem(LISTEN_LOG_KEY)) || []; } catch { return []; } }
function saveListenLog(v) { lsSet(LISTEN_LOG_KEY, JSON.stringify(v.slice(-5000))); }
function recordListen()   { const ts = Date.now(); try { const l = loadListenLog(); l.push({ ts }); saveListenLog(l); } catch {} return ts; }
// undo du retrait â€” retire l'entrÃ©e EXACTE posÃ©e par le retrait (par son ts) plutÃ´t que la
// derniÃ¨re : une Ã©coute lÃ©gitime a pu s'intercaler entre le retrait et le clic Â« Annuler Â»
// (le poll player pousse une entrÃ©e toutes les 5 s), un simple pop() supprimerait la mauvaise.
function unrecordListen(ts) {
  try {
    const l = loadListenLog();
    if (ts != null) {
      for (let i = l.length - 1; i >= 0; i--) { if (l[i] && l[i].ts === ts) { l.splice(i, 1); break; } }
    } else { l.pop(); }
    saveListenLog(l);
  } catch {}
}

      counts[key] = (counts[key] || 0) + 1;

  return days.map(d => ({ ...d, value: counts[d.key] || 0 }));
}

// Convertit un export Google Timeline en segments normalisÃ©s groupÃ©s par jour local.
// Formats supportÃ©s :
// 1. Export sur appareil (â‰¥ fin 2024) : { semanticSegments:[ {visit} | {activity} |
//    {timelinePath} ] } â€” les timelinePath (points horodatÃ©s) sont rattachÃ©s aux
//    activitÃ©s par chevauchement temporel (l'activitÃ© donne mode/distance, le
//    timelinePath donne le tracÃ© dÃ©taillÃ©) ; un timelinePath orphelin devient un
//    trajet 'other'.
// 2. Takeout Â« Historique des positions (ancien) Â» : { timelineObjects:[
//    {activitySegment} | {placeVisit} ] } (Semantic Location History/YYYY_MOIS.json).
// (Records.json â€” points GPS bruts, des centaines de Mo â€” n'est PAS supportÃ©.)

        distance_m: Math.round(parseFloat(a.distanceMeters) || 0),

        lat: ll[0], lon: ll[1], start, end,

    }

  for (const mv of moves) {
    if (!mv._thin) continue;

    const pts = [];

    }

  }

  for (const rp of rawPaths) {

  const days = {};

      if (!seg.distance_m && seg.path.length > 1) seg.distance_m = Math.round(mapsPathDistanceM(seg.path));

}

// Fusion d'un import dans la base : les jours importÃ©s REMPLACENT les mÃªmes jours

// GET Riot via les proxies CORS. Contrairement Ã  corsFetchText, on lit le body MÃŠME sur
// un statut non-2xx : les erreurs Riot sont un JSON { status:{ status_code } } que les
// proxies relaient â€” indispensable pour distinguer Â« pas en partie Â» (404 Spectator),
// Â« clÃ© expirÃ©e Â» (401/403) et Â« Riot ID introuvable Â» (404 account).
async function lolApiGet(url) {
  const full = url + (url.includes('?') ? '&' : '?') + 'api_key=' + encodeURIComponent(lolKey());
  const tries = [
    'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(full),
    'https://cors.eu.org/' + full,
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(full),
  ];
  for (const u of tries) {
    try {
      const r = await fetch(u);
      const t = await r.text();
      if (!t || !t.trim()) continue;
      try {
        const j = JSON.parse(t);
        if (j && j.status && typeof j.status.status_code === 'number') return { __error: j.status.status_code };
        return j;
      } catch { continue; }              // le proxy a renvoyÃ© sa propre page d'erreur (HTML) â†’ suivant
    } catch (e) {}
  }
  return null;
}

// Plateforme Riot (euw1â€¦) â†’ slug de rÃ©gion op.gg (euwâ€¦)
const LOL_OPGG_REGION = { euw1:'euw', eun1:'eune', na1:'na', kr:'kr', br1:'br', la1:'lan', la2:'las', jp1:'jp', oc1:'oce', tr1:'tr', ru:'ru' };
const LOL_ROMAN = { 1:'I', 2:'II', 3:'III', 4:'IV' };

// GET op.gg : fetch DIRECT d'abord (les API op.gg servent du CORS pour leur front),
// puis les proxies CORS. Retourne le JSON parsÃ© ou null (rÃ©seau/HTML d'erreur).
async function opggGet(url) {
  try {
    const r = await fetch(url);
    const t = await r.text();
    if (t && t.trim()) { try { return JSON.parse(t); } catch {} }
  } catch {}
  const tries = [
    'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(url),
    'https://cors.eu.org/' + url,
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
  ];
  for (const u of tries) {
    try {
      const r = await fetch(u);
      const t = await r.text();
      if (!t || !t.trim()) continue;
      try { return JSON.parse(t); } catch { continue; }
    } catch {}
  }
  return null;
}

// Riot ID â†’ summoner op.gg { id, level, iconUrl, name, tag } | { error }
async function opggFindSummoner(riotId, platform) {
  const region = LOL_OPGG_REGION[platform] || 'euw';
  const j = await opggGet(`https://lol-api-summoner.op.gg/api/v3/${region}/summoners?riot_id=${encodeURIComponent(riotId)}&hl=en_US`);
  if (!j) return { error: 'NET' };
  // Formes rencontrÃ©es : { data: [ â€¦ ] } ou { data: { summoners: [ â€¦ ] } }
  const arr = Array.isArray(j.data) ? j.data : (j.data && Array.isArray(j.data.summoners)) ? j.data.summoners : null;
  if (!Array.isArray(arr) || !arr.length) return { error: 'NOTFOUND' };
  const [n, t] = riotId.split('#');
  const norm = s => String(s || '').trim().toLowerCase();
  const hit = arr.find(s => norm(s.game_name) === norm(n) && norm(s.tagline) === norm(t)) || arr[0];
  if (!hit || !hit.summoner_id) return { error: 'NOTFOUND' };
  return { id: hit.summoner_id, level: hit.level || null, iconUrl: hit.profile_image_url || null, name: hit.game_name, tag: hit.tagline };
}

// league_stats op.gg â†’ entrÃ©es au format Riot (queueType/tier/rank/LP/wins/losses),
// la forme que TOUTE l'UI consomme dÃ©jÃ .
function opggLeagueToEntries(ls) {
  const out = [];
  for (const e of (Array.isArray(ls) ? ls : [])) {
    if (!e) continue;
    const gt = String((e.queue_info && e.queue_info.game_type) || e.game_type || '').toUpperCase();
    const queueType = gt === 'SOLORANKED' ? 'RANKED_SOLO_5x5' : gt === 'FLEXRANKED' ? 'RANKED_FLEX_SR' : null;
    if (!queueType) continue;
    const ti = e.tier_info || {};
    if (!ti.tier) continue;   // non classÃ© dans cette file
    out.push({
      queueType, tier: String(ti.tier).toUpperCase(),
      rank: LOL_ROMAN[ti.division] || '', leaguePoints: ti.lp || 0,
      wins: e.win || 0, losses: e.lose || 0,
    });
  }
  return out;
}

// Profil op.gg { level, iconUrl, entries[] } | null
async function opggSummary(platform, summonerId) {
  const region = LOL_OPGG_REGION[platform] || 'euw';
  const j = await opggGet(`https://lol-api-summoner.op.gg/api/${region}/summoners/${encodeURIComponent(summonerId)}/summary?hl=en_US`);
  const s = j && j.data && (j.data.summoner || j.data);
  if (!s || typeof s !== 'object') return null;
  return { level: s.level || null, iconUrl: s.profile_image_url || null, entries: opggLeagueToEntries(s.league_stats) };
}

// Partie en cours op.gg â†’ forme normalisÃ©e { queueLabel, startedAt, participants:[{ puuid
// (= summoner_id op.gg, clÃ© opaque compat UI), riotId, championId, teamId 100|200 }] }.
// null = pas en partie (JSON reÃ§u sans participants) Â· { error:true } = endpoints injoignables.
async function opggSpectate(platform, summonerId) {
  const region = LOL_OPGG_REGION[platform] || 'euw';
  const sid = encodeURIComponent(summonerId);
  const urls = [
    `https://lol-web-api.op.gg/api/v1.0/internal/bypass/spectates/${region}/${sid}?hl=en_US`,
    `https://lol-api-summoner.op.gg/api/${region}/summoners/${sid}/spectates?hl=en_US`,
  ];
  let sawJson = false;
  for (const u of urls) {
    const j = await opggGet(u);
    if (!j) continue;
    sawJson = true;
    const d = j.data || j;
    const parts = d && (d.participants || (d.spectate && d.spectate.participants));
    if (Array.isArray(parts) && parts.length) {
      return {
        queueLabel: (d.queue_info && (d.queue_info.queue_translate || d.queue_info.game_type)) || 'Partie',
        startedAt: d.created_at ? Date.parse(d.created_at) : null,
        participants: parts.map(p => ({
          puuid: (p.summoner && p.summoner.summoner_id) || p.summoner_id || null,
          riotId: p.summoner ? `${p.summoner.game_name || '?'}#${p.summoner.tagline || ''}` : (p.riot_id || ''),
          championId: p.champion_id != null ? p.champion_id : p.championId,
          teamId: p.team_key != null ? (String(p.team_key).toUpperCase() === 'RED' ? 200 : 100) : (p.teamId || 100),
        })),
      };
    }
  }
  return sawJson ? null : { error: true };
}

// Map championId (numÃ©rique) â†’ { name, id (clÃ© texte pour l'icÃ´ne) } via Data Dragon.
// CORS natif, sans clÃ© â€” cachÃ© 7 j en localStorage + cache mÃ©moire session.
let _lolChampsCache = null;
async function lolChampMap() {
  if (_lolChampsCache) return _lolChampsCache;
  try {
    const c = JSON.parse(localStorage.getItem(LOL_CHAMPS_LS));
    if (c && c.byKey && Date.now() - c.fetchedAt < 7 * 864e5) { _lolChampsCache = c; return c; }
  } catch {}
  try {
    const vers = await (await fetch('https://ddragon.leagueoflegends.com/api/versions.json')).json();
    const v = vers[0];
    const dd = await (await fetch(`https://ddragon.leagueoflegends.com/cdn/${v}/data/fr_FR/champion.json`)).json();
    const byKey = {};
    Object.values(dd.data).forEach(ch => { byKey[ch.key] = { name: ch.name, id: ch.id }; });
    const c = { v, fetchedAt: Date.now(), byKey };
    _lolChampsCache = c;
    try { localStorage.setItem(LOL_CHAMPS_LS, JSON.stringify(c)); } catch {}
    return c;
  } catch { return null; }
}

// â”€â”€ Repli Riot (clÃ© optionnelle) : profil complet via l'API officielle â”€â”€
// Riot ID â†’ puuid (account-v1) â†’ niveau/icÃ´ne (summoner-v4) + rangs (league-v4)
// + top 3 maÃ®trises (mastery-v4). UtilisÃ© UNIQUEMENT si op.gg Ã©choue ET qu'une clÃ©
// est enregistrÃ©e.
async function lolRiotProfile(cfg, cachedPuuid) {
  const [name, tag] = cfg.riotId.split('#');
  const errOf = r => (r && (r.__error === 401 || r.__error === 403)) ? 'KEY' : (r && r.__error === 404) ? 'NOTFOUND' : 'NET';
  let puuid = cachedPuuid || null;      // Ã©conomise la requÃªte account si dÃ©jÃ  connu
  if (!puuid) {
    const routing = LOL_ROUTING[cfg.platform] || 'europe';
    const acc = await lolApiGet(`https://${routing}.api.riotgames.com/riot/account/v1/accounts/by-riot-id/${encodeURIComponent(name.trim())}/${encodeURIComponent(tag.trim())}`);
    if (!acc || acc.__error || !acc.puuid) return { error: errOf(acc) };
    puuid = acc.puuid;
  }
  const base = `https://${cfg.platform}.api.riotgames.com`;
  const sum = await lolApiGet(`${base}/lol/summoner/v4/summoners/by-puuid/${puuid}`);
  if (!sum || sum.__error) return { error: sum && sum.__error ? errOf(sum) : 'NET' };
  const entries = await lolApiGet(`${base}/lol/league/v4/entries/by-puuid/${puuid}`);
  const mastery = await lolApiGet(`${base}/lol/champion-mastery/v4/champion-masteries/by-puuid/${puuid}/top?count=3`);
  return {
    source: 'riot', riotId: cfg.riotId, platform: cfg.platform, puuid, fetchedAt: Date.now(),
    level: sum.summonerLevel, icon: sum.profileIconId, iconUrl: null,
    ranked: Array.isArray(entries) ? entries : [],
    mastery: Array.isArray(mastery) ? mastery : [],
  };
}

// Profil : op.gg (sans clÃ©) d'abord, repli Riot si Ã©chec ET clÃ© prÃ©sente.
// `puuid` du profil = summoner_id op.gg OU puuid Riot selon `source` (clÃ© opaque pour
// l'UI et le cache des rangs). Cache 1 h (re-fetchable, PAS dans buildBackup).
async function lolFetchProfile(force) {
  const cfg = loadLolCfg();
  if (!cfg || !cfg.riotId) return { error: 'CONFIG' };
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(LOL_CACHE_LS)); } catch {}
  // `cache.source` requis : invalide les caches d'avant la migration op.gg (leur puuid
  // Riot serait pris pour un summoner_id op.gg)
  const sameTarget = cache && cache.source && cache.riotId === cfg.riotId && cache.platform === cfg.platform;
  if (!force && sameTarget && Date.now() - cache.fetchedAt < LOL_TTL) return cache;
  if (!cfg.riotId.includes('#')) return { error: 'RIOTID' };

  // 1. op.gg â€” sans clÃ©
  const found = await opggFindSummoner(cfg.riotId, cfg.platform);
  if (!found.error) {
    const sum = await opggSummary(cfg.platform, found.id);
    if (sum) {
      const out = {
        source: 'opgg', riotId: cfg.riotId, platform: cfg.platform, puuid: found.id, fetchedAt: Date.now(),
        level: sum.level || found.level, icon: null, iconUrl: sum.iconUrl || found.iconUrl,
        ranked: sum.entries, mastery: [],
      };
      try { localStorage.setItem(LOL_CACHE_LS, JSON.stringify(out)); } catch {}
      return out;
    }
  }
  // 2. repli Riot (clÃ© optionnelle)
  if (lolKey()) {
    const out = await lolRiotProfile(cfg, sameTarget && cache.source === 'riot' ? cache.puuid : null);
    if (!out.error) { try { localStorage.setItem(LOL_CACHE_LS, JSON.stringify(out)); } catch {} }
    return out;
  }
  return { error: found.error || 'NET' };
}

// Partie en cours, forme UNIQUE quel que soit le backend :
// { source, queueLabel, mins|null, participants:[{ puuid, riotId, championId, teamId }] }.
// null = pas en partie. Toujours re-fetchÃ©e (jamais cachÃ©e).
async function lolFetchLive(profile) {
  if (profile.source === 'opgg') {
    const g = await opggSpectate(profile.platform, profile.puuid);
    if (g && !g.error) {
      return { source: 'opgg', queueLabel: g.queueLabel,
        mins: g.startedAt ? Math.max(0, Math.floor((Date.now() - g.startedAt) / 60000)) : null,
        participants: g.participants };
    }
    if (g === null) return null;   // op.gg a rÃ©pondu : pas en partie
    // endpoints op.gg spectate injoignables â†’ repli Riot complet si clÃ© prÃ©sente
    if (!lolKey()) return null;
    const [name, tag] = profile.riotId.split('#');
    const routing = LOL_ROUTING[profile.platform] || 'europe';
    const acc = await lolApiGet(`https://${routing}.api.riotgames.com/riot/account/v1/accounts/by-riot-id/${encodeURIComponent((name || '').trim())}/${encodeURIComponent((tag || '').trim())}`);
    if (!acc || acc.__error || !acc.puuid) return null;
    return lolRiotLive(profile.platform, acc.puuid);
  }
  return lolRiotLive(profile.platform, profile.puuid);
}
async function lolRiotLive(platform, puuid) {
  const g = await lolApiGet(`https://${platform}.api.riotgames.com/lol/spectator/v5/active-games/by-summoner/${puuid}`);
  if (!g || g.__error || !Array.isArray(g.participants)) return null;
  return {
    source: 'riot',
    queueLabel: LOL_QUEUES[g.gameQueueConfigId] || g.gameMode || 'Partie',
    mins: Math.max(0, Math.floor((g.gameLength || 0) / 60)),
    participants: g.participants.map(p => ({ puuid: p.puuid, riotId: p.riotId || '', championId: p.championId, teamId: p.teamId })),
  };
}

// Rangs classÃ©s (Ã©lo soloQ/flex, winrate, nb de games) de chaque joueur de la partie â€”
// 1 requÃªte par joueur INCONNU seulement : cache localStorage par identifiant (TTL 15 min
// LOL_RANKS_TTL), donc un â†» pendant la mÃªme partie ne re-fetch rien. 3 workers en
// parallÃ¨le. Backend selon la source de la partie : summary op.gg (sans clÃ©) ou
// league-v4 Riot. Retourne { id: entries[] } (entries au format Riot).
async function lolFetchRanks(profile, live) {
  const ids = live.participants.map(p => p.puuid).filter(Boolean);
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(LOL_RANKS_LS)) || {}; } catch {}
  const nowTs = Date.now();
  Object.keys(cache).forEach(k => { if (!cache[k] || nowTs - cache[k].fetchedAt > LOL_RANKS_TTL) delete cache[k]; });
  const missing = ids.filter(p => p && !cache[p]);
  const base = `https://${profile.platform}.api.riotgames.com`;
  let i = 0;
  const worker = async () => {
    while (i < missing.length) {
      const p = missing[i++];
      let entries = [];
      if (live.source === 'opgg') {
        const s = await opggSummary(profile.platform, p);
        entries = (s && s.entries) || [];
      } else {
        const r = await lolApiGet(`${base}/lol/league/v4/entries/by-puuid/${p}`);
        entries = Array.isArray(r) ? r : [];
      }
      cache[p] = { fetchedAt: Date.now(), entries };
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  try { localStorage.setItem(LOL_RANKS_LS, JSON.stringify(cache)); } catch {}
  const out = {};
  ids.forEach(p => { if (cache[p]) out[p] = cache[p].entries; });
  return out;
}

// MODULE DEV Â· STATS GITHUB (collapse Â« ðŸ’» DEV Â» en fin de StatsPanel)
// RÃ©utilise le PAT GitHub dÃ©jÃ  configurÃ© pour Dependabot (ghToken, localStorage
// spotifyplus_github_token â€” API GraphQL, CORS natif â†’ fetch direct, dÃ©jÃ  en CSP).
// 2 requÃªtes : viewer (profil + repos + contributions annÃ©e en cours) puis, si
// nÃ©cessaire, 1 requÃªte Ã  ALIAS PAR ANNÃ‰E (contributionsCollection est bornÃ© Ã  1 an)
// pour le total de contributions depuis la crÃ©ation du compte.
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
const DEV_COLOR    = '#6ea8fe';
const DEV_CACHE_LS = 'spotifyplus_devstats';   // cache re-fetchable (TTL 1 h) â†’ PAS dans buildBackup
const DEV_TTL      = 3600000;

async function ghFetchDevStats(force) {
  const token = ghToken();
  if (!token) return { error: 'CONFIG' };
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(DEV_CACHE_LS)); } catch {}
  if (!force && cache && Date.now() - cache.fetchedAt < DEV_TTL) return cache;
  const gql = async (query) => {
    const r = await fetch('https://api.github.com/graphql', {
      method: 'POST',
      headers: { 'Authorization': 'bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ query }),
    });
    if (r.status === 401) return { __err: 'KEY' };
    if (!r.ok) return { __err: 'NET' };
    const j = await r.json();
    if (j.errors && j.errors.length) return { __err: j.errors[0].type === 'FORBIDDEN' ? 'SCOPE' : 'NET' };
    return j.data;
  };
  try {
    const d1 = await gql(`query{viewer{login name createdAt followers{totalCount}
      repositories(first:100,ownerAffiliations:OWNER,isFork:false,orderBy:{field:STARGAZERS,direction:DESC}){totalCount nodes{name stargazerCount forkCount primaryLanguage{name}}}
      contributionsCollection{totalCommitContributions totalPullRequestContributions totalIssueContributions
        contributionCalendar{totalContributions weeks{contributionDays{contributionCount date}}}}}}`);
    if (d1.__err) return { error: d1.__err };
    const v = d1.viewer;
    const repos = v.repositories.nodes || [];
    const totalStars = repos.reduce((s, r) => s + (r.stargazerCount || 0), 0);
    const totalForks = repos.reduce((s, r) => s + (r.forkCount || 0), 0);
    const topRepo = repos[0] && repos[0].stargazerCount > 0 ? { name: repos[0].name, stars: repos[0].stargazerCount } : null;
    const langCount = {};
    repos.forEach(r => { const l = r.primaryLanguage && r.primaryLanguage.name; if (l) langCount[l] = (langCount[l] || 0) + 1; });
    const topLangs = Object.entries(langCount).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([name, count]) => ({ name, count }));
    // Streaks + jour record depuis le calendrier de contributions (annÃ©e glissante)
    const days = [];
    (v.contributionsCollection.contributionCalendar.weeks || []).forEach(w => (w.contributionDays || []).forEach(d => days.push(d)));
    days.sort((a, b) => a.date < b.date ? -1 : 1);
    let longest = 0, cur = 0, best = { date: null, count: 0 };
    days.forEach(d => {
      if (d.contributionCount > 0) { cur++; if (cur > longest) longest = cur; } else cur = 0;
      if (d.contributionCount > best.count) best = { date: d.date, count: d.contributionCount };
    });
    // Streak ACTUEL : remonte depuis aujourd'hui (le jour courant sans contribution ne casse pas encore)
    let current = 0;
    for (let i = days.length - 1; i >= 0; i--) {
      if (days[i].contributionCount > 0) current++;
      else if (i === days.length - 1) continue;
      else break;
    }
    // Total all-time : 1 alias contributionsCollection PAR ANNÃ‰E depuis la crÃ©ation du compte
    const y0 = new Date(v.createdAt).getFullYear();
    const yNow = new Date().getFullYear();
    let contribTotal = v.contributionsCollection.contributionCalendar.totalContributions;
    let commitsTotal = v.contributionsCollection.totalCommitContributions;
    if (yNow > y0) {
      const aliases = [];
      for (let y = y0; y < yNow; y++) aliases.push(`y${y}: contributionsCollection(from:"${y}-01-01T00:00:00Z",to:"${y}-12-31T23:59:59Z"){totalCommitContributions contributionCalendar{totalContributions}}`);
      const d2 = await gql(`query{viewer{${aliases.join(' ')}}}`);
      if (!d2.__err && d2.viewer) {
        // Somme des annÃ©es passÃ©es + l'annÃ©e GLISSANTE en cours dÃ©jÃ  comptÃ©e â†’ on
        // recompte proprement : annÃ©es civiles passÃ©es + annÃ©e civile en cours.
        contribTotal = 0; commitsTotal = 0;
        Object.values(d2.viewer).forEach(c => { contribTotal += c.contributionCalendar.totalContributions; commitsTotal += c.totalCommitContributions; });
        const dCur = await gql(`query{viewer{contributionsCollection(from:"${yNow}-01-01T00:00:00Z"){totalCommitContributions contributionCalendar{totalContributions}}}}`);
        if (!dCur.__err && dCur.viewer) {
          contribTotal += dCur.viewer.contributionsCollection.contributionCalendar.totalContributions;
          commitsTotal += dCur.viewer.contributionsCollection.totalCommitContributions;
        }
      }
    }
    const out = {
      fetchedAt: Date.now(), login: v.login, name: v.name, createdAt: v.createdAt,
      followers: v.followers.totalCount, repoCount: v.repositories.totalCount,
      totalStars, totalForks, topRepo, topLangs,
      contribYear: v.contributionsCollection.contributionCalendar.totalContributions,
      commitsYear: v.contributionsCollection.totalCommitContributions,
      prYear: v.contributionsCollection.totalPullRequestContributions,
      issuesYear: v.contributionsCollection.totalIssueContributions,
      contribTotal, commitsTotal, longestStreak: longest, currentStreak: current, bestDay: best,
    };
    try { localStorage.setItem(DEV_CACHE_LS, JSON.stringify(out)); } catch {}
    return out;
  } catch { return { error: 'NET' }; }
}

function StatsPanel() {
  const { listenStats: ls, now } = useStore();
  const fmtN = n => Number(n).toLocaleString('fr-FR');
  // Format Â« X Mois X Jours X Heure Â» (mois = 30 j) â€” temps d'Ã©coute + temps TV Time.
  // Mois et jours toujours affichÃ©s (Â« 0 mois 0 j 5 h Â» Ã  moins de 24 h).
  const fmtMonthsDaysHours = ms => {
    const totalH = Math.floor((ms || 0) / 3600000);
    const months = Math.floor(totalH / (24 * 30));
    const days   = Math.floor((totalH % (24 * 30)) / 24);
    const hours  = totalH % 24;
    return `${months} mois ${days} j ${hours} h`;
  };

  // Total Ã©coutÃ© = durÃ©e des tracks listened=1 + durÃ©e du titre en cours (now.duration en secondes â†’ ms)
  const currentTrackMs = now?.duration ? now.duration * 1000 : 0;
  const totalListenedMs = (ls.listened_ms || 0) + currentTrackMs;

  // % likÃ©s = likes posÃ©s dans l'app (stats.total_liked, jamais purgÃ©) / Ã©coutes all-time
  const totalLiked = ls.total_liked || 0;
  const likedPct = ls.all_time > 0 ? (totalLiked / ls.all_time) * 100 : 0;

// DÃ©codage des entitÃ©s HTML + retrait des balises (titres RSS, CDATA)
function actuDecode(s) {
  if (!s) return '';
  return String(s)
    .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(+n))
    .replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCharCode(parseInt(n, 16)))
    .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&nbsp;/g, ' ')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
    .replace(/\s+/g, ' ').trim();
}

// Horodatage relatif Â« il y a X Â» depuis une date ISO/RSS
function actuAgo(dateStr) {
  if (!dateStr) return '';
  const t = Date.parse(dateStr);
  if (isNaN(t)) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 3600)  return `il y a ${Math.round(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  return `il y a ${Math.round(s / 86400)} j`;
}

// Parse un flux RSS/Atom â†’ [{ title, link, date, source }]
function actuParseRss(xml, max = 12) {
  if (!xml) return [];
  const out = [];
  const items = xml.match(/<item[\s>][\s\S]*?<\/item>/gi) || xml.match(/<entry[\s>][\s\S]*?<\/entry>/gi) || [];
  for (const it of items) {
    const tm = it.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    const title = actuDecode(tm ? tm[1] : '');
    if (!title) continue;
    let link = '';
    const lm = it.match(/<link[^>]*>([\s\S]*?)<\/link>/i);
    if (lm && lm[1].trim()) link = lm[1].trim();
    if (!link) { const lh = it.match(/<link[^>]*href="([^"]+)"/i); if (lh) link = lh[1]; }
    const dm = it.match(/<pubDate[^>]*>([\s\S]*?)<\/pubDate>/i)
      || it.match(/<published[^>]*>([\s\S]*?)<\/published>/i)
      || it.match(/<updated[^>]*>([\s\S]*?)<\/updated>/i);
    const sm = it.match(/<source[^>]*>([\s\S]*?)<\/source>/i);
    // URL du site source (attribut url de <source> â€” Google News la fournit) :
    // sert de base au favicon de secours quand l'article n'a pas de photo.
    const su = it.match(/<source[^>]+url="([^"]+)"/i);
    // Photo de l'article si le flux la fournit : media:content / media:thumbnail /
    // enclosure image, sinon 1re <img> dans la description (souvent en CDATA).
    let image = '';
    const im = it.match(/<media:content[^>]+url="([^"]+)"/i)
      || it.match(/<media:thumbnail[^>]+url="([^"]+)"/i)
      || it.match(/<enclosure[^>]+url="([^"]+)"[^>]*type="image/i)
      || it.match(/<enclosure[^>]+type="image[^"]*"[^>]*url="([^"]+)"/i);
    if (im) image = im[1];
    if (!image) { const di = it.match(/<img[^>]+src="([^"]+)"/i); if (di) image = di[1]; }
    out.push({ title, link: actuDecode(link), date: dm ? dm[1].trim() : null, source: sm ? actuDecode(sm[1]) : '', sourceUrl: su ? actuDecode(su[1]) : '', image: actuDecode(image) });
    if (out.length >= max) break;
  }
  return out;
}

}

// Fuites de donnÃ©es â€” bonjourlafuite.eu.org (pas d'API : HTML via proxy CORS, parseur heuristique)
async function actuFetchLeaks() {
  const html = await corsFetchText('https://bonjourlafuite.eu.org/');
  if (html) {
    // Chaque fuite = un <h2> qui contient une ancre interne Â« #<nom>-AAAA-MM-JJ Â» (la date ISO
    // est portÃ©e par l'ancre, PAS dans le texte du titre) + un emoji de statut et le nom.
    // La page est antÃ©chronologique â†’ on prend les 10 premiÃ¨res.
    const items = [], seen = new Set();
    const h2Re = /<h2\b[^>]*>([\s\S]*?)<\/h2>/gi;
    let m;
    while ((m = h2Re.exec(html)) && items.length < 10) {
      const inner = m[1];
      const dm = inner.match(/href="#[^"]*?(\d{4}-\d{2}-\d{2})"/i);   // date ISO dans l'ancre
      if (!dm) continue;
      const text = actuDecode(inner);
      if (!text || text.length < 2 || text.length > 220) continue;
      const key = text.slice(0, 60).toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);
      const anchor = (inner.match(/href="(#[^"]+)"/i) || [])[1] || '';
      items.push({ text, date: dm[1], link: 'https://bonjourlafuite.eu.org/' + anchor });
    }
    if (items.length) return { items, needsTuning: false };
  }
  // Repli : Have I Been Pwned â€” /api/v3/breaches est PUBLIC (sans clÃ©, seul

  // On trie par AddedDate desc et on ne CACHE que les 10 derniÃ¨res (la liste

  return { items: [], needsTuning: true };
}

async function actuFetchStatic() {

// GET /youtube/v3/{path} authentifiÃ© par le token OAuth Google (Bearer).
// Retourne le JSON, ou { __error: 'AUTH' | 'SCOPE' | 'QUOTA' | 'NET' }.
async function ytSubApi(path, params = {}) {
  const token = gdriveToken();
  if (!token) return { __error: 'AUTH' };
  try {
    const res = await fetch(`https://www.googleapis.com/youtube/v3/${path}?${new URLSearchParams(params)}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (res.status === 401) { gdriveLogout(); return { __error: 'AUTH' }; }
    if (res.status === 403) {
      // 403 = scope manquant (token prÃ©-scope youtube), API non activÃ©e ou quota Ã©puisÃ©
      let reason = '';
      try { const j = await res.json(); reason = j && j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason || ''; } catch {}
      return { __error: reason === 'quotaExceeded' || reason === 'rateLimitExceeded' ? 'QUOTA' : 'SCOPE' };
    }
    if (!res.ok) return { __error: 'NET' };
    return await res.json();
  } catch { return { __error: 'NET' }; }
}

// POST /youtube/v3/{path} authentifiÃ© (Ã©criture playlist). MÃªmes erreurs typÃ©es que
// ytSubApi + 'NOTFOUND' (playlist supprimÃ©e Ã  la main â†’ on la recrÃ©e).
async function ytSubPost(path, params = {}, body = null) {
  const token = gdriveToken();
  if (!token) return { __error: 'AUTH' };
  try {
    const res = await fetch(`https://www.googleapis.com/youtube/v3/${path}?${new URLSearchParams(params)}`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : null,
    });
    if (res.status === 401) { gdriveLogout(); return { __error: 'AUTH' }; }
    if (res.status === 403) {
      let reason = '';
      try { const j = await res.json(); reason = j && j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason || ''; } catch {}
      return { __error: reason === 'quotaExceeded' || reason === 'rateLimitExceeded' ? 'QUOTA' : 'SCOPE' };
    }
    if (res.status === 404) return { __error: 'NOTFOUND' };
    if (!res.ok) return { __error: 'NET' };
    return await res.json();
  } catch { return { __error: 'NET' }; }
}

    const hit = (d.items || []).find(p => p.snippet && p.snippet.title === YTSUB_WL_NAME);
    if (hit) { try { localStorage.setItem(YTSUB_WL_ID_LS, hit.id); } catch {} return hit.id; }
    pageToken = d.nextPageToken || '';
    if (!pageToken) break;
  }
  const c = await ytSubPost('playlists', { part: 'snippet,status' }, {
    snippet: { title: YTSUB_WL_NAME, description: 'VidÃ©os Ã  regarder plus tard â€” ajoutÃ©es depuis le Hub (section Actu).' },
    status: { privacyStatus: 'private' },
  });
  if (c.__error) return c;
  if (!c.id) return { __error: 'NET' };

  return c.id;
}

// Ajoute une vidÃ©o dans la playlist Â« Ã€ regarder plus tard (Hub) Â» du compte YouTube.
// Retourne { ok: true, playlistId } ou { __error }. Si la playlist cachÃ©e a Ã©tÃ©
// supprimÃ©e Ã  la main (404), on invalide le cache et on retente UNE fois (recrÃ©ation).
async function ytWatchLaterAdd(videoId) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const pid = await ytWlPlaylistId(attempt > 0);
    if (pid && pid.__error) return pid;
    if (!pid || typeof pid !== 'string') return { __error: 'NET' };
    const r = await ytSubPost('playlistItems', { part: 'snippet' }, {
      snippet: { playlistId: pid, resourceId: { kind: 'youtube#video', videoId } },
    });
    if (r.__error === 'NOTFOUND' && attempt === 0) { try { localStorage.removeItem(YTSUB_WL_ID_LS); } catch {} continue; }
    if (r.__error) return r;
    return { ok: true, playlistId: pid };
  }
  return { __error: 'NET' };
}

// Toutes les chaÃ®nes suivies â†’ [{ id, title }] (paginÃ©, cap YTSUB_MAX_CHANNELS)
async function ytSubsListChannels() {
  const subs = [];
  let pageToken = '';
  while (subs.length < YTSUB_MAX_CHANNELS) {
    const d = await ytSubApi('subscriptions', { part: 'snippet', mine: 'true', maxResults: '50', ...(pageToken ? { pageToken } : {}) });
    if (d.__error) return d;
    for (const it of (d.items || [])) {
      const cid = it.snippet && it.snippet.resourceId && it.snippet.resourceId.channelId;
      if (cid) subs.push({ id: cid, title: (it.snippet && it.snippet.title) || 'ChaÃ®ne' });
    }
    pageToken = d.nextPageToken || '';
    if (!pageToken) break;
  }
  return { subs };
}

// VidÃ©os les plus rÃ©centes de tous les abonnements, triÃ©es par date desc.
// Retourne { fetched_at, videos } (mis en cache) ou { __error }.
async function ytSubsFetchVideos(force) {
  const cached = loadYtSubs();
  if (!force && cached && Date.now() - cached.fetched_at < YTSUB_TTL) return cached;
  const ls = await ytSubsListChannels();
  if (ls.__error) return ls;
  const channels = ls.subs;
  if (!channels.length) { const data = { fetched_at: Date.now(), videos: [] }; saveYtSubs(data); return data; }
  const vids = [];
  let idx = 0;
  // 8 requÃªtes playlistItems en parallÃ¨le (une chaÃ®ne supprimÃ©e/sans upload â†’ 404 ignorÃ©)
  const worker = async () => {
    while (idx < channels.length) {
      const ch = channels[idx++];
      const d = await ytSubApi('playlistItems', {
        part: 'snippet,contentDetails', maxResults: String(YTSUB_PER_CHANNEL),
        playlistId: 'UU' + ch.id.slice(2),   // playlist uploads dÃ©rivÃ©e de l'id UCâ€¦ (0 requÃªte channels.list)
      });
      if (d.__error || !d.items) continue;
      for (const e of d.items) {
        const vid = e.contentDetails && e.contentDetails.videoId;
        if (!vid) continue;
        const sn = e.snippet || {};
        const th = sn.thumbnails || {};
        const date = (e.contentDetails && e.contentDetails.videoPublishedAt) || sn.publishedAt || '';
        if (!date) continue;                 // vidÃ©o privÃ©e/programmÃ©e non publiÃ©e
        vids.push({ id: vid, title: sn.title || '(sans titre)', channel: ch.title, date,
          thumb: (th.medium || th.default || {}).url || null });
      }
    }
  };
  await Promise.all(Array.from({ length: 8 }, worker));
  vids.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  // DurÃ©es (batch de 50) sur les ~300 plus rÃ©centes â†’ filtre Shorts (< YT_MIN_MINUTES, mÃªme rÃ¨gle que TV Time)
  const top = vids.slice(0, 300);
  const durMap = new Map();
  for (let i = 0; i < top.length; i += 50) {
    const d = await ytSubApi('videos', { part: 'contentDetails', id: top.slice(i, i + 50).map(v => v.id).join(',') });
    if (d && !d.__error && d.items) for (const v of d.items) durMap.set(v.id, ytParseDuration(v.contentDetails && v.contentDetails.duration));
  }
  const videos = top
    .map(v => ({ ...v, dur: durMap.get(v.id) || 0 }))
    .filter(v => !durMap.has(v.id) || v.dur >= YT_MIN_MINUTES)
    // Ordre final GARANTI : vidÃ©o sortie le plus rÃ©cemment en premier (timestamp numÃ©rique, robuste)
    .sort((a, b) => (new Date(b.date || 0).getTime() || 0) - (new Date(a.date || 0).getTime() || 0))
    // On ne conserve que les YTSUB_MAX_SHOW (100) vidÃ©os les plus rÃ©centes, tous abonnements confondus
    .slice(0, YTSUB_MAX_SHOW);
  const data = { fetched_at: Date.now(), videos };
  saveYtSubs(data);
  return data;
}

// Extraction heuristique de produits { name, price, link } dans le JSON embarquÃ©
// de ledenicheur.fr (__NEXT_DATA__ / JSON-LD) â€” les formes Prisjakt connues :
// { name, lowestPrice:{ amount } } / { name, price } / JSON-LD { name, offers:{ lowPrice } }
function cmpWalkProducts(data) {
  const out = [], seen = new Set();
  (function walk(o, depth) {
    if (!o || typeof o !== 'object' || depth > 14 || out.length >= 30) return;
    if (Array.isArray(o)) { for (const v of o) walk(v, depth + 1); return; }
    const name = typeof o.name === 'string' ? o.name.trim() : '';
    let price = null;
    const num = v => { const n = parseFloat(v && v.amount != null ? v.amount : v); return isNaN(n) ? null : n; };
    if (o.lowestPrice != null) price = num(o.lowestPrice);
    if (price == null && o.priceMin != null) price = num(o.priceMin);
    if (price == null && o.price != null && typeof o.price !== 'object') price = num(o.price);
    if (price == null && o.price && typeof o.price === 'object') price = num(o.price);
    if (price == null && o.offers) price = num(o.offers.lowPrice != null ? o.offers.lowPrice : o.offers.price);
    if (name && name.length >= 3 && name.length <= 120 && price != null && price > 0) {
      const key = name.toLowerCase();
      if (!seen.has(key)) {
        seen.add(key);
        let url = typeof o.url === 'string' ? o.url : (typeof o.path === 'string' ? o.path : '');
        if (url && url[0] === '/') url = 'https://ledenicheur.fr' + url;
        out.push({ name, price, link: /^https?:/.test(url) ? url : '' });
      }
    }
    for (const k in o) { const v = o[k]; if (v && typeof v === 'object') walk(v, depth + 1); }
  })(data, 0);
  return out;
}

async function cmpFetchDenicheur(q) {
  const html = await corsFetchText('https://ledenicheur.fr/search?search=' + encodeURIComponent(q));
  if (!html) return { items: [], error: true };
  let items = [];
  const nd = html.match(/<script[^>]*id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/i);
  if (nd) { try { items = cmpWalkProducts(JSON.parse(nd[1])); } catch {} }
  if (!items.length) {
    const lds = html.match(/<script[^>]*application\/ld\+json[^>]*>[\s\S]*?<\/script>/gi) || [];
    for (const b of lds) {
      const m = b.match(/>([\s\S]*)<\/script>/i);
      if (!m) continue;
      try { items = items.concat(cmpWalkProducts(JSON.parse(m[1]))); } catch {}
    }
  }
  return { items: items.slice(0, 12), needsTuning: !items.length };
}

// RafraÃ®chit les meilleurs prix des jeux suivis (1 requÃªte pour tous : /games?ids=â€¦)
async function cmpRefreshWatch(list) {
  const ids = list.map(w => w.gameID).filter(Boolean);
  if (!ids.length) return list;
  try {
    const r = await fetch('https://www.cheapshark.com/api/1.0/games?ids=' + ids.join(','));
    if (!r.ok) return list;
    const j = await r.json();
    return list.map(w => {

      if (!g || !Array.isArray(g.deals) || !g.deals.length) return { ...w, lastCheck: Date.now() };
      let best = null, bestDeal = null;
      for (const d of g.deals) {

        if (!isNaN(p) && (best === null || p < best)) { best = p; bestDeal = d; }

      return { ...w, lastPrice: best, dealID: (bestDeal && bestDeal.dealID) || w.dealID,
        title: (g.info && g.info.title) || w.title, thumb: (g.info && g.info.thumb) || w.thumb,
        lastCheck: Date.now() };
    });
  } catch { return list; }
}

async function fetchMeteo(lat, lon, days = 3) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min`
    + `&timezone=Europe%2FParis&forecast_days=${days}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  const d = j.daily;
  return d.time.map((t, i) => ({
    date: t,
    code: d.weather_code[i],
    tmax: Math.round(d.temperature_2m_max[i]),
    tmin: Math.round(d.temperature_2m_min[i]),
  }));
}

// ressenti, prÃ©cipitations, proba pluie, vent + rafales + direction, UV, humiditÃ©,
// lever/coucher du soleil + dÃ©tail heure par heure de la journÃ©e.
async function fetchMeteoDetail(lat, lon, days = 3) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,`
    + `sunrise,sunset,uv_index_max,precipitation_sum,precipitation_probability_max,precipitation_hours,`
    + `wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant`
    + `&hourly=temperature_2m,precipitation_probability,relative_humidity_2m,weather_code`
    + `&timezone=Europe%2FParis&forecast_days=${days}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  const d = j.daily, h = j.hourly;
  const daysArr = d.time.map((t, i) => ({
    date: t, code: d.weather_code[i],
    tmax: Math.round(d.temperature_2m_max[i]), tmin: Math.round(d.temperature_2m_min[i]),
    feelMax: Math.round(d.apparent_temperature_max[i]), feelMin: Math.round(d.apparent_temperature_min[i]),
    sunrise: d.sunrise[i], sunset: d.sunset[i],
    uv: d.uv_index_max[i], precip: d.precipitation_sum[i], precipProb: d.precipitation_probability_max[i],
    precipHours: d.precipitation_hours[i],
    wind: Math.round(d.wind_speed_10m_max[i]), gusts: Math.round(d.wind_gusts_10m_max[i]),
    windDir: d.wind_direction_10m_dominant[i],
  }));
  // Index horaire groupÃ© par date
  const hourly = {};
  (h?.time || []).forEach((t, i) => {
    const day = t.slice(0, 10);
    (hourly[day] = hourly[day] || []).push({
      hour: t.slice(11, 16), temp: Math.round(h.temperature_2m[i]),
      precipProb: h.precipitation_probability[i], humidity: h.relative_humidity_2m[i], code: h.weather_code[i],
    });
  });
  return { days: daysArr, hourly };
}

function windCardinal(deg) {
  if (deg == null || isNaN(deg)) return 'â€”';

}

  ['Nancy',48.6921,6.1844],['Avignon',43.9493,4.8055],['Poitiers',46.5802,0.3404],
  ['La Rochelle',46.1591,-1.1520],['Cannes',43.5528,7.0174],['Bayonne',43.4929,-1.4748],
  ['Troyes',48.2973,4.0744],['ChambÃ©ry',45.5646,5.9178],['Valence',44.9334,4.8924],
  ['Chartres',48.4439,1.4895],['Beauvais',49.4295,2.0807],['CompiÃ¨gne',49.4179,2.8261],
];
function nearestCityFR(lat, lon) {
  let best = null, bestD = Infinity;
  const cl = Math.cos(lat * Math.PI / 180);
  for (const c of FR_CITIES) {
    const dy = c[1] - lat, dx = (c[2] - lon) * cl;
    const d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = c[0]; }
  }
  return best;
}

// Reverse-geocoding â†’ nom de la ville/commune la plus proche.
// ChaÃ®ne de providers gratuits/sans clÃ© : le PREMIER qui renvoie un nom gagne.
// Plusieurs sources car selon la position/le rÃ©seau certaines Ã©chouent (CORS,
// rate-limit, champ vide). Chacune isolÃ©e dans son try/catch. En DERNIER recours
// (tous les providers bloquÃ©s/HS), fallback HORS-LIGNE nearestCityFR â†’ jamais null.
async function reverseGeocode(lat, lon) {
  // 1) BigDataCloud â€” pensÃ© pour le navigateur, CORS permissif, pas de rate-limit
  try {
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fr`);
    if (r.ok) {
      const j = await r.json();
      const c = j.city || j.locality || j.principalSubdivision;
      if (c) return c;
    }
  } catch (e) {}
  // 2) Photon (Komoot) â€” CORS large, basÃ© OSM
  try {
    const r = await fetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}&lang=fr`);
    if (r.ok) {
      const j = await r.json();
      const p = (j.features && j.features[0] && j.features[0].properties) || {};
      const c = p.city || p.name || p.locality || p.district || p.county || p.state;
      if (c) return c;
    }
  } catch (e) {}
  // 3) Nominatim (OpenStreetMap) â€” rate-limit 1 req/s
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=12&accept-language=fr`);
    if (r.ok) {
      const j = await r.json();
      const a = j.address || {};
      const c = a.city || a.town || a.village || a.municipality || a.suburb || a.county || a.state;
      if (c) return c;
    }
  } catch (e) {}
  // Tous les providers rÃ©seau ont Ã©chouÃ© (bloqueur, rate-limit, hors-ligne) â†’
  // ville franÃ§aise la plus proche calculÃ©e localement (jamais null)
  return nearestCityFR(lat, lon);
}

// GÃ©ocodage DIRECT (nom de ville â†’ coordonnÃ©es) via l'API de gÃ©ocodage Open-Meteo
// (gratuite, sans clÃ©, CORS natif â€” origine geocoding-api.open-meteo.com ajoutÃ©e Ã  la CSP).
// Retourne { name, lat, lon } de la meilleure correspondance, ou null si introuvable.
async function geocodeCity(name) {
  const q = (name || '').trim();
  if (!q) return null;
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=fr&format=json`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  const r = j.results && j.results[0];
  if (!r) return null;
  const extra = r.admin1 || r.country; // "Lyon, Auvergne-RhÃ´ne-Alpes" ou "Lyon, France"
  return { name: extra ? `${r.name}, ${extra}` : r.name, lat: r.latitude, lon: r.longitude };
}

function meteoDayLabel(iso, i) {

function meteoFullDate(iso) {

}

      <div style={{ display:'flex', flexDirection:'column', gap:4 }}>

const FIN_UP = '#1ed760', FIN_DOWN = '#e0608a';

// Formatage d'un prix (gros nombres sans dÃ©cimale, petits avec prÃ©cision)
function fmtPrice(v, cur='$') {
  if (v == null || isNaN(v)) return 'â€”';
  const n = Number(v);
  if (n >= 1000) return cur + n.toLocaleString('en-US', { maximumFractionDigits:0 });
  if (n >= 1)    return cur + n.toLocaleString('en-US', { maximumFractionDigits:2 });
  if (n >= 0.01) return cur + n.toFixed(4);
  return cur + n.toPrecision(3); // ex. PEPE 0.00000120
}

function FinancePct({ v }) {
  if (v == null || isNaN(v)) return null;
  const up = Number(v) >= 0;
  return <span style={{ fontSize:10, fontWeight:700, fontFamily:'DM Mono,monospace', color: up ? FIN_UP : FIN_DOWN }}>{up?'+':''}{Number(v).toFixed(2)}%</span>;
}

// Stooq (source EU, pas de mur de consentement RGPD contrairement Ã  Yahoo) n'envoie
// pas d'en-tÃªte CORS â†’ on passe par des proxies CORS keyless SANS inscription. On en
// essaie plusieurs (le 1er qui rÃ©pond gagne) car selon le rÃ©seau certains sont bloquÃ©s.
// Chaque tentative est bornÃ©e Ã  12 s (AbortController) : un proxy qui NE RÃ‰POND
// JAMAIS (connexion pendante) ne gÃ¨le plus toute la carte â€” on passe au suivant.
// La variante allorigins /get (JSON { contents }) est plus fiable que /raw sur
// certains contenus (encodage) â†’ essayÃ©e en avant-dernier, mÃªme host dÃ©jÃ  en CSP.
async function corsFetchText(url) {
  const tries = [
    ['https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(url), 'text'],
    ['https://cors.eu.org/' + url, 'text'],             // proxy CORS europÃ©en, sans clÃ©
    ['https://api.allorigins.win/raw?url=' + encodeURIComponent(url), 'text'],
    ['https://api.allorigins.win/get?url=' + encodeURIComponent(url), 'json'],
    [url, 'text'],                                      // direct en dernier recours
  ];
  for (const [u, kind] of tries) {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), 12000) : null;
    try {
      const r = await fetch(u, ctrl ? { signal: ctrl.signal } : undefined);
      if (r.ok) {
        if (kind === 'json') {
          const j = await r.json();
          const t = j && j.contents;
          if (t && String(t).trim()) return String(t);
        } else {
          const t = await r.text();
          if (t && t.trim()) return t;
        }
      }
    } catch (e) {}
    finally { if (timer) clearTimeout(timer); }
  }
  return null;
}

// Cours via Stooq (CSV lÃ©ger, gratuit sans clÃ©) â€” 1 requÃªte par valeur.
// Variation = (close - open) / open de la sÃ©ance.
async function fetchStooq(symbol) {
  try {
    const txt = await corsFetchText(`https://stooq.com/q/l/?s=${encodeURIComponent(symbol)}&f=sd2t2ohlcv&h&e=csv`);
    if (!txt) return null;
    const lines = txt.trim().split('\n');

    const open = parseFloat(cols[3]);

    if (isNaN(close)) return null;
    const pct = (!isNaN(open) && open) ? ((close - open) / open) * 100 : undefined;
    return { price: close, pct };

}

// GRAPHIQUES FINANCE â€” clic sur une ligne â†’ modal avec l'historique du prix.
// Sources par type de ligne (toutes DÃ‰JÃ€ autorisÃ©es dans la CSP connect-src) :
//  â€¢ coingecko   (crypto)                       : /coins/{id}/market_chart â€” CORS natif, sans clÃ©
//  â€¢ frankfurter (EUR/USD)                      : /{start}..{end} â€” BCE, CORS natif, sans clÃ©

//  â€¢ alpha       (pÃ©trole WTI, sucre)           : sÃ©rie complÃ¨te Alpha Vantage (âš  1 req du quota ~25/j)

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
const _chartCache = {};
const CHART_RANGE_DAYS = { '24h':1, '7j':7, '1m':31, '3m':92, '1a':366, '5a':1830, '10a':3660 };

// PÃ©riodes proposÃ©es selon la source. DÃ©faut = '7j' quand la pÃ©riode existe (indices,
// actions, mÃ©taux, pÃ©trole, EUR/USD ouvrent sur la semaine â€” donnÃ©es quotidiennes, ~5
// points), sinon 2e entrÃ©e (sucre mensuel â†’ '5a').
function chartRanges(spec) {

// RÃ©-Ã©chantillonnage : garde â‰¤ maxPts points (premier/dernier conservÃ©s) pour un SVG lÃ©ger
function chartDownsample(pts, maxPts = 400) {
  if (pts.length <= maxPts) return pts;
  const step = (pts.length - 1) / (maxPts - 1), out = [];
  for (let i = 0; i < maxPts; i++) out.push(pts[Math.round(i * step)]);
  return out;
}

// Les sources d'historique distantes des indices/actions/or (Stooq via proxies CORS)
// Ã©chouent souvent â†’ l'app CONSTITUE elle-mÃªme l'historique en Ã©chantillonnant les prix
// affichÃ©s, **une seule fois par jour et par donnÃ©e**, et **UNIQUEMENT pour les valeurs du
// mode Light** (les valeurs Full n'enregistrent rien). StockÃ© dans localStorage
// `spotifyplus_finance_history` (`{ version:1, series: { '<clÃ©>': [{ t, v }, â€¦] } }`, clÃ©s =
// `finHistKey(spec)` : `cg:bitcoin` / `stooq:^spx` / `alpha:WTI` / `fx:EURUSD`). On ne garde
// pas plus d'~1 an. Quand la source distante ne rÃ©pond pas, `FinanceChartModal` retombe sur
// ces points locaux (bandeau âš ). Inclus dans buildBackup/applyBackup (clÃ© `finance`, FUSIONNÃ‰).
const FIN_HIST_LS = 'spotifyplus_finance_history';
const FIN_HIST_MIN_MS = 20 * 3600 * 1000;   // densitÃ© mini entre 2 points (fusion backup) â‰ˆ 1/jour
const FIN_HIST_MAX_PTS = 370;               // cap par sÃ©rie â‰ˆ 1 an de points quotidiens
const FIN_HIST_MAX_AGE = 366 * 864e5;       // on ne garde pas plus d'~1 an d'historique
let _finHistCache = null;                    // cache mÃ©moire (Ã©vite le JSON.parse Ã  chaque notify)
function loadFinHist() {
  if (_finHistCache) return _finHistCache;
  try { _finHistCache = JSON.parse(localStorage.getItem(FIN_HIST_LS)) || null; } catch (e) { _finHistCache = null; }
  if (!_finHistCache || typeof _finHistCache !== 'object' || !_finHistCache.series) _finHistCache = { version: 1, series: {} };
  return _finHistCache;
}
function saveFinHist() { try { localStorage.setItem(FIN_HIST_LS, JSON.stringify(loadFinHist())); } catch (e) {} }
// Jour calendaire LOCAL d'un timestamp (dÃ©dup Â« 1 point/jour Â»)
function _finDayKey(t) { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
// Ajoute un point Ã  une sÃ©rie â€” max 1 par jour calendaire par sÃ©rie, purge > 1 an. â†’ true si ajoutÃ©
function finHistRecord(h, key, v) {
  if (v == null || isNaN(v)) return false;
  const s = h.series[key] || (h.series[key] = []);
  const last = s[s.length - 1];
  if (last && _finDayKey(last.t) === _finDayKey(Date.now())) return false;   // dÃ©jÃ  un point aujourd'hui
  s.push({ t: Date.now(), v: Number(v) });
  const cutoff = Date.now() - FIN_HIST_MAX_AGE;   // purge les points de plus d'~1 an
  let i = 0; while (i < s.length && s[i].t < cutoff) i++;
  if (i > 0) s.splice(0, i);
  if (s.length > FIN_HIST_MAX_PTS) s.splice(0, s.length - FIN_HIST_MAX_PTS);
  return true;
}
// Snapshot des valeurs LIGHT prÃ©sentes dans `_finance` â†’ sÃ©ries locales. AppelÃ© par
// `_finNotify` (Ã  chaque prix qui arrive) ; n'Ã©crit dans localStorage que si un point a Ã©tÃ©
// ajoutÃ© (throttle 1/jour par sÃ©rie). **Seules les valeurs du mode Light sont enregistrÃ©es**
// (Bitcoin, PEPE, S&P 500, NASDAQ-100, NVIDIA, Take-Two, Or, PÃ©trole, EUR/USD) â€” les valeurs
// Full (autres cryptos, CAC 40, autres actions, argent, sucre) n'enregistrent RIEN.
function finHistSnapshot() {
  try {
    const f = _finance, h = loadFinHist();
    let dirty = false;
    const cg = (f.crypto && f.crypto !== 'error') ? f.crypto : null;
    if (cg) {
      dirty = finHistRecord(h, 'cg:bitcoin', cg.bitcoin && cg.bitcoin.usd) || dirty;
      dirty = finHistRecord(h, 'cg:pepe',    cg.pepe && cg.pepe.usd) || dirty;
    }
    if (f.idx) {
      dirty = finHistRecord(h, 'stooq:^spx', f.idx.spx && f.idx.spx.price) || dirty;   // S&P 500
      dirty = finHistRecord(h, 'stooq:^ndq', f.idx.ndq && f.idx.ndq.price) || dirty;   // NASDAQ-100
    }
    dirty = finHistRecord(h, 'stooq:nvda.us', f.stocks.nvda && f.stocks.nvda.price) || dirty;   // NVIDIA
    dirty = finHistRecord(h, 'stooq:ttwo.us', f.stocks.ttwo && f.stocks.ttwo.price) || dirty;   // Take-Two
    dirty = finHistRecord(h, 'stooq:xauusd',  f.gold && f.gold.price) || dirty;   // Or
    dirty = finHistRecord(h, 'alpha:WTI',     f.oil && f.oil.price) || dirty;     // PÃ©trole WTI
    dirty = finHistRecord(h, 'fx:EURUSD',     f.eurusd) || dirty;                 // EUR/USD
    if (dirty) saveFinHist();

}
// ClÃ© de sÃ©rie locale pour un spec de graphique (mÃªmes clÃ©s que finHistSnapshot)

  }
  pts.sort((a, b) => a.t - b.t);
  if (pts.length < 2) return null;

// Points du graphique pour un spec + une pÃ©riode â†’ [{ t, v }] triÃ©s, ou null si Ã©chec.
async function fetchChartPoints(spec, range) {

      // 24h, horaire sur 7j, quotidien au-delÃ ) â€” chacun cachÃ© sÃ©parÃ©ment.
      const key = 'cg:' + spec.id + ':' + range;

      if (pts.length < 2) return null;

function fmtChartDate(t, range) {
  const d = new Date(t);
  if (range === '24h') return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  if (range === '5a' || range === '10a') return d.toLocaleDateString('fr-FR', { month: 'short', year: 'numeric' });
  if (range === '1a') return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: '2-digit' });

// Courbe SVG pure (aucune lib â†’ CSP inchangÃ©e) : aire dÃ©gradÃ©e + ligne 2px, couleur
// hausse/baisse sur la pÃ©riode (FIN_UP/FIN_DOWN), 3 gridlines discrÃ¨tes, crosshair
// au survol/drag tactile (readout date Â· valeur dans un slot fixe au-dessus).
function FinanceChart({ pts, fmtV, range }) {
  const [hover, setHover] = React.useState(null);        // index du point survolÃ© | null
  const svgRef = React.useRef(null);
  const W = 400, H = 170, PT = 8, PB = 6, PL = 4, PR = 4;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, tSpan = (t1 - t0) || 1;
  let vmin = Infinity, vmax = -Infinity;
  for (const p of pts) { if (p.v < vmin) vmin = p.v; if (p.v > vmax) vmax = p.v; }
  if (vmax === vmin) { const e = Math.abs(vmax) * 0.01 || 1; vmax += e; vmin -= e; }
  const X = t => PL + ((t - t0) / tSpan) * (W - PL - PR);
  const Y = v => PT + (1 - (v - vmin) / (vmax - vmin)) * (H - PT - PB);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const up  = pts[pts.length - 1].v >= pts[0].v;
  const col = up ? FIN_UP : FIN_DOWN;

  const onMove = e => {
    const rect = svgRef.current && svgRef.current.getBoundingClientRect();
    if (!rect || !rect.width) return;
    const t = t0 + ((e.clientX - rect.left) / rect.width) * tSpan;
    let best = 0, bd = Infinity;
    for (let i = 0; i < pts.length; i++) { const d = Math.abs(pts[i].t - t); if (d < bd) { bd = d; best = i; } }
    setHover(best);
  };
  const hp = hover != null ? pts[hover] : null;

  return (
    <div>
      <div style={{ height:16, fontSize:11, fontWeight:700, fontFamily:'DM Mono,monospace', color: hp ? C.text : C.dim, textAlign:'center', marginBottom:2 }}>
        {hp ? `${fmtChartDate(hp.t, range)} Â· ${fmtV(hp.v)}` : ''}
      </div>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{ width:'100%', height:'auto', display:'block', touchAction:'none', cursor:'crosshair' }}
        onPointerMove={onMove} onPointerDown={onMove} onPointerLeave={() => setHover(null)}>
        <defs>
          <linearGradient id="finchartgrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stopColor={col} stopOpacity="0.25" />
            <stop offset="1" stopColor={col} stopOpacity="0" />
          </linearGradient>
        </defs>
        {[0.25, 0.5, 0.75].map(f => {
          const gy = PT + f * (H - PT - PB);
          return (
            <g key={f}>
              <line x1={PL} x2={W - PR} y1={gy} y2={gy} stroke={C.border} strokeWidth="1" strokeDasharray="3 4" />
              <text x={PL + 1} y={gy - 3} fill={C.muted} fontSize="8.5" fontFamily="DM Mono,monospace">{fmtV(vmax - f * (vmax - vmin))}</text>
            </g>
          );
        })}
        <path d={`${line}L${X(t1).toFixed(1)},${H}L${X(t0).toFixed(1)},${H}Z`} fill="url(#finchartgrad)" />
        <path d={line} fill="none" stroke={col} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        <circle cx={X(t1)} cy={Y(pts[pts.length - 1].v)} r="3" fill={col} />
        {hp && (
          <g>
            <line x1={X(hp.t)} x2={X(hp.t)} y1={PT} y2={H - PB} stroke={C.muted} strokeWidth="1" strokeDasharray="2 3" />
            <circle cx={X(hp.t)} cy={Y(hp.v)} r="4" fill={col} stroke={C.surface} strokeWidth="2" />
          </g>
        )}
      </svg>
      <div style={{ display:'flex', justifyContent:'space-between', fontSize:9, color:C.dim, fontFamily:'DM Mono,monospace', marginTop:3 }}>
        <span>{fmtChartDate(t0, range)}</span>
        <span>{fmtChartDate(t1, range)}</span>
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', fontSize:10, color:C.muted, fontFamily:'DM Mono,monospace', marginTop:6 }}>
        <span>â¬‡ {fmtV(vmin)}</span>
        <span>â¬† {fmtV(vmax)}</span>
      </div>
    </div>
  );
}

// âš  Twelve Data plan "Basic 8" = 8 requÃªtes/MINUTE. Pour ne JAMAIS dÃ©passer
// "Minutely maximum" (8), TOUS les appels TD (fetchTD / fetchQuote) passent par une
// file globale qui garantit â‰¥ TD_GAP_MS entre deux appels. Crypto (CoinGecko), or
// (gold-api) et le repli Stooq ne comptent PAS pour TD â†’ lancÃ©s en parallÃ¨le, immÃ©diats.
const TD_GAP_MS = 8000; // â‰¥7,5s entre 2 appels TD = max 8/min, marge de sÃ©curitÃ© incluse
let _tdChain = Promise.resolve();
let _tdLastAt = 0;
// `label` (optionnel) = nom lisible de la valeur en cours ; il est posÃ© quand la tÃ¢che
// arrive EN TÃŠTE de file (la file Ã©tant strictement sÃ©rielle, le libellÃ© est donc
// toujours juste, mÃªme si Light et Full empilent des appels en mÃªme temps).
function tdSpaced(fn, label) {
  const run = _tdChain.then(async () => {
    if (label) { _finance.nextLabel = label; _finNotify(); }
    const wait = TD_GAP_MS - (Date.now() - _tdLastAt);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    _tdLastAt = Date.now();
    return fn();
  });
  _tdChain = run.then(() => {}, () => {}); // ne jamais casser la chaÃ®ne sur erreur
  return run;
}

// la limite par minute d'AV. `jobs` = [ [() => Promise<{price,pct}>, setter], ... ].

// â”€â”€ Calculatrice (mode 'calc' de Finance, entre Full et Mes Actifs) â”€â”€
// Calculatrice de poche classique (accumulateur + opÃ©ration en attente), 100 % locale
// (aucun appel rÃ©seau, rien Ã  persister). Clavier physique supportÃ© quand le panneau
// est montÃ©. Pas d'eval : petite machine Ã  Ã©tats + calcApply.
function calcApply(a, b, op) {
  switch (op) {
    case '+': return a + b;
    case 'âˆ’': return a - b;
    case 'Ã—': return a * b;
    case 'Ã·': return b === 0 ? NaN : a / b;
    default: return b;
  }
}
// Format d'affichage : coupe le bruit des flottants (0.1+0.2 â†’ 0.3), 'Erreur' si NaN/âˆž
function calcFmt(n) {
  if (typeof n !== 'number' || !isFinite(n)) return 'Erreur';
  return String(parseFloat(n.toPrecision(12)));
}
function FinanceCalcPanel() {
  const [display, setDisplay] = React.useState('0');
  const [acc, setAcc]         = React.useState(null);
  const [op, setOp]           = React.useState(null);
  const [fresh, setFresh]     = React.useState(true);   // prochaine saisie REMPLACE l'affichage
  const [hist, setHist]       = React.useState([]);     // 5 derniers calculs (session)
  const cur = () => parseFloat(display.replace(',', '.')) || 0;

  const inputDigit = d => {
    if (display === 'Erreur' || fresh) { setDisplay(d); setFresh(false); return; }
    if (display.replace('-', '').replace('.', '').length >= 15) return;
    setDisplay(display === '0' ? d : display + d);
  };
  const inputDot = () => {
    if (display === 'Erreur' || fresh) { setDisplay('0.'); setFresh(false); return; }
    if (!display.includes('.')) setDisplay(display + '.');
  };
  const doOp = o => {
    if (display === 'Erreur') return;
    if (op !== null && !fresh) {
      const r = calcApply(acc, cur(), op);
      setAcc(isFinite(r) ? r : null);
      setDisplay(calcFmt(r));
    } else {
      setAcc(cur());
    }
    setOp(o); setFresh(true);
  };
  const equals = () => {
    if (op === null || display === 'Erreur') return;
    const b = cur();
    const r = calcApply(acc, b, op);
    setHist(h => [`${calcFmt(acc)} ${op} ${calcFmt(b)} = ${calcFmt(r)}`, ...h].slice(0, 5));
    setDisplay(calcFmt(r)); setAcc(null); setOp(null); setFresh(true);
  };
  const clearAll = () => { setDisplay('0'); setAcc(null); setOp(null); setFresh(true); };
  const backspace = () => {
    if (fresh || display === 'Erreur') return;
    const s = display.slice(0, -1);
    setDisplay(!s || s === '-' ? '0' : s);
  };
  const negate  = () => { if (display !== 'Erreur' && display !== '0') setDisplay(display.startsWith('-') ? display.slice(1) : '-' + display); };
  const percent = () => { if (display !== 'Erreur') { setDisplay(calcFmt(cur() / 100)); setFresh(true); } };

  // Clavier physique (montÃ© avec le panneau uniquement) â€” ignore les champs de saisie
  React.useEffect(() => {
    const onKey = e => {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      const k = e.key;
      if (/^[0-9]$/.test(k)) inputDigit(k);
      else if (k === '.' || k === ',') inputDot();
      else if (k === '+') doOp('+');
      else if (k === '-') doOp('âˆ’');
      else if (k === '*') doOp('Ã—');
      else if (k === '/') { e.preventDefault(); doOp('Ã·'); }
      else if (k === 'Enter' || k === '=') equals();
      else if (k === 'Backspace') backspace();
      else if (k === 'Escape') clearAll();
      else if (k === '%') percent();
      else return;
      e.preventDefault();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  const KEYS = [
    ['C', clearAll, 'fn'], ['âŒ«', backspace, 'fn'], ['%', percent, 'fn'], ['Ã·', () => doOp('Ã·'), 'op'],
    ['7', () => inputDigit('7')], ['8', () => inputDigit('8')], ['9', () => inputDigit('9')], ['Ã—', () => doOp('Ã—'), 'op'],
    ['4', () => inputDigit('4')], ['5', () => inputDigit('5')], ['6', () => inputDigit('6')], ['âˆ’', () => doOp('âˆ’'), 'op'],
    ['1', () => inputDigit('1')], ['2', () => inputDigit('2')], ['3', () => inputDigit('3')], ['+', () => doOp('+'), 'op'],
    ['Â±', negate], ['0', () => inputDigit('0')], ['.', inputDot], ['=', equals, 'eq'],
  ];
  const keyStyle = kind => ({
    background: kind === 'eq' ? `${FINANCE_CYAN}33` : kind === 'op' ? `${FINANCE_CYAN}18` : C.surfaceHigh,
    border: `1px solid ${kind ? FINANCE_CYAN + '55' : C.border}`,
    color: kind ? FINANCE_CYAN : C.text,
    borderRadius:8, padding:'12px 0', fontSize:16, fontWeight:700, cursor:'pointer',
    fontFamily:'DM Mono,monospace', lineHeight:1, userSelect:'none',
  });

  return (
    <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:'12px', display:'flex', flexDirection:'column', gap:10, maxWidth:340 }}>
      {/* Ã‰cran */}
      <div style={{ background:'#111', border:`1px solid ${C.border}`, borderRadius:8, padding:'10px 12px', textAlign:'right' }}>
        <div style={{ fontSize:10, color:C.dim, fontFamily:'DM Mono,monospace', minHeight:13 }}>
          {op !== null ? `${calcFmt(acc)} ${op}` : 'Â '}
        </div>
        <div style={{ fontSize:26, fontWeight:800, color: display === 'Erreur' ? '#e05050' : FINANCE_CYAN, fontFamily:'DM Mono,monospace', wordBreak:'break-all', lineHeight:1.15 }}>
          {display}
        </div>

// GET https://api.themoviedb.org/3{path} â€” retourne le JSON ou null (erreur / clÃ© absente)
async function tmdbGet(path, params = {}) {

// ClÃ© dÃ©diÃ©e (spotifyplus_yt_key). CoÃ»t quota : channels/playlists/videos.list = 1 unitÃ©,
// playlistItems.list = 1 unitÃ©/page de 50, search.list = 100 (utilisÃ© en dernier recours).

function ytKey() { try { return (localStorage.getItem(YT_KEY_LS) || '').trim(); } catch { return ''; } }

async function ytApi(path, params = {}) {
  const key = ytKey();
  if (!key) return null;
  const q = new URLSearchParams({ key, ...params });
  try {
    const res = await fetch(`https://www.googleapis.com/youtube/v3/${path}?${q}`);

// DurÃ©e ISO 8601 (PT1H2M3S) â†’ minutes arrondies
function ytParseDuration(iso) {
  const m = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso || '');
  if (!m) return 0;
  return Math.round((+(m[1] || 0)) * 60 + (+(m[2] || 0)) + (+(m[3] || 0)) / 60);
}

// Analyse un lien / id YouTube â†’ { kind, id|handle|name|q }
function parseYoutubeInput(raw) {
  const s = (raw || '').trim();
  if (!s) return null;
  let m = s.match(/[?&]list=([\w-]+)/);
  if (m) return { kind: 'playlist', id: m[1] };
  if (/^(PL|UU|FL|OL|RD)[\w-]{10,}$/.test(s)) return { kind: 'playlist', id: s };
  m = s.match(/\/channel\/(UC[\w-]{20,})/);
  if (m) return { kind: 'channel', id: m[1] };
  if (/^UC[\w-]{20,}$/.test(s)) return { kind: 'channel', id: s };
  m = s.match(/\/@([\w.\-]+)/) || s.match(/^@([\w.\-]+)$/);
  if (m) return { kind: 'handle', handle: m[1] };
  m = s.match(/\/user\/([\w.\-]+)/);
  if (m) return { kind: 'user', name: m[1] };
  m = s.match(/\/c\/([\w.\-]+)/);
  if (m) return { kind: 'search', q: m[1] };
  if (/^[\w.\-]+$/.test(s)) return { kind: 'handle', handle: s };
  return { kind: 'search', q: s };
}

// RÃ©sout une chaÃ®ne â†’ { channelId, uploads (playlist), title, thumb }
async function ytResolveChannel(parsed) {
  let d = null;
  if (parsed.kind === 'channel') d = await ytApi('channels', { part: 'snippet,contentDetails', id: parsed.id });
  else if (parsed.kind === 'handle') d = await ytApi('channels', { part: 'snippet,contentDetails', forHandle: '@' + parsed.handle.replace(/^@/, '') });
  else if (parsed.kind === 'user') d = await ytApi('channels', { part: 'snippet,contentDetails', forUsername: parsed.name });
  if (!d || !d.items || !d.items.length) {
    const q = parsed.q || parsed.handle || parsed.name;
    if (q) {
      const sr = await ytApi('search', { part: 'snippet', type: 'channel', maxResults: '1', q });
      const cid = sr && sr.items && sr.items[0] && sr.items[0].id && sr.items[0].id.channelId;
      if (cid) d = await ytApi('channels', { part: 'snippet,contentDetails', id: cid });
    }
  }
  const it = d && d.items && d.items[0];
  if (!it) return null;
  const th = (it.snippet && it.snippet.thumbnails) || {};
  return {
    channelId: it.id,
    uploads: it.contentDetails && it.contentDetails.relatedPlaylists && it.contentDetails.relatedPlaylists.uploads,
    title: (it.snippet && it.snippet.title) || 'ChaÃ®ne YouTube',
    thumb: (th.medium || th.default || {}).url || null,
  };
}

// Pagine une playlist â†’ [{ id, title, date:'YYYY-MM-DD', still }] (plafonnÃ© Ã  YT_MAX_VIDEOS,
// ou SANS limite si max = Infinity â€” bouton Â« rÃ©cupÃ©rer toutes les vidÃ©os Â» d'une chaÃ®ne).
async function ytFetchPlaylistVideos(playlistId, max = YT_MAX_VIDEOS) {
  const out = [];
  let pageToken = '';
  // 40 pages (2000 vidÃ©os) par dÃ©faut ; garde-fou 1000 pages (50k) en mode illimitÃ©
  const pageCap = Number.isFinite(max) ? 40 : 1000;
  for (let i = 0; i < pageCap && out.length < max; i++) {
    const d = await ytApi('playlistItems', { part: 'snippet,contentDetails', maxResults: '50', playlistId, ...(pageToken ? { pageToken } : {}) });
    if (!d || !d.items) break;
    for (const e of d.items) {
      const vid = e.contentDetails && e.contentDetails.videoId;
      if (!vid) continue;
      const sn = e.snippet || {};
      const th = sn.thumbnails || {};
      out.push({
        id: vid,
        title: sn.title || '(sans titre)',
        date: (((e.contentDetails && e.contentDetails.videoPublishedAt) || sn.publishedAt) || '').slice(0, 10),
        still: (th.medium || th.default || {}).url || null,
      });
    }
    pageToken = d.nextPageToken || '';
    if (!pageToken) break;
  }
  return out.slice(0, max);
}

// DurÃ©es de vidÃ©os (batch de 50) â†’ Map id â†’ minutes
async function ytFetchDurations(ids) {
  const map = new Map();
  for (let i = 0; i < ids.length; i += 50) {
    const d = await ytApi('videos', { part: 'contentDetails', id: ids.slice(i, i + 50).join(',') });
    if (d && d.items) for (const v of d.items) map.set(v.id, ytParseDuration(v.contentDetails && v.contentDetails.duration));
  }
  return map;
}

// Construit un item TV Time 'youtube' Ã  partir d'un lien (chaÃ®ne ou playlist). Les vidÃ©os
// sont groupÃ©es en Â« saisons Â» = ANNÃ‰ES de publication. Retourne l'item ou { error }.
async function ytBuildItem(raw, opts = {}) {
  if (!ytKey()) return { error: 'ClÃ© API YouTube manquante.' };
  const parsed = parseYoutubeInput(raw);
  if (!parsed) return { error: 'Lien YouTube invalide.' };
  const cap = opts.unlimited ? Infinity : YT_MAX_VIDEOS;   // sans plafond si l'utilisateur l'a demandÃ©
  let playlistId, title, thumb, ytKind, srcId;
  if (parsed.kind === 'playlist') {
    ytKind = 'playlist'; playlistId = parsed.id; srcId = parsed.id;
    const d = await ytApi('playlists', { part: 'snippet', id: parsed.id });
    const pi = d && d.items && d.items[0];
    if (!pi) return { error: 'Playlist introuvable (lien ou clÃ© invalide).' };
    title = (pi.snippet && pi.snippet.title) || 'Playlist YouTube';
    const th = (pi.snippet && pi.snippet.thumbnails) || {};
    thumb = (th.medium || th.default || {}).url || null;
  } else {
    ytKind = 'channel';
    const ch = await ytResolveChannel(parsed);
    if (!ch || !ch.uploads) return { error: 'ChaÃ®ne introuvable (lien ou clÃ© invalide).' };
    playlistId = ch.uploads; srcId = ch.channelId; title = ch.title; thumb = ch.thumb;
  }
  const videosRaw = await ytFetchPlaylistVideos(playlistId, cap);
  if (!videosRaw.length) return { error: 'Aucune vidÃ©o trouvÃ©e pour ce lien.' };
  const durs = await ytFetchDurations(videosRaw.map(v => v.id));
  for (const v of videosRaw) v.dur = durs.get(v.id) || 0;
  // Ignore les vidÃ©os < 3 min (Shorts / clips courts) â€” sauf si le tag Â« garder les Shorts Â»
  // est activÃ© pour cette chaÃ®ne/playlist (opts.keepShorts).
  const videos = opts.keepShorts ? videosRaw : videosRaw.filter(v => (v.dur || 0) >= YT_MIN_MINUTES);
  if (!videos.length) return { error: opts.keepShorts ? 'Aucune vidÃ©o trouvÃ©e pour ce lien.' : 'Aucune vidÃ©o de plus de 3 min trouvÃ©e pour ce lien.' };
  videos.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));   // chrono croissant
  const byYear = {};
  for (const v of videos) { const y = (v.date || '').slice(0, 4) || 'â€”'; (byYear[y] = byYear[y] || []).push(v); }
  const seasons = Object.keys(byYear).sort().map(y => ({ n: y, eps: byYear[y].length }));   // saison = annÃ©e
  const totalMin = videos.reduce((a, v) => a + (v.dur || 0), 0);
  return {
    id: srcId, type: 'youtube', ytKind,
    title, poster: thumb,
    year: (videos[videos.length - 1].date || '').slice(0, 4),   // annÃ©e la plus rÃ©cente
    status: 'watching', addedAt: Date.now(),
    seasons, totalEps: videos.length,
    epRuntime: videos.length ? Math.round(totalMin / videos.length) : 0,
    videos, watchedIds: [],
    refreshedAt: Date.now(),
    unlimited: !!opts.unlimited,   // plafond 500 retirÃ© pour cette chaÃ®ne
    keepShorts: !!opts.keepShorts, // tag Â« garder les Shorts (< 3 min) Â» pour cette chaÃ®ne/playlist
  };
}

// AppelÃ© au login : rÃ©-interroge l'API YouTube pour chaque chaÃ®ne/playlist suivie (TTL 6h par
// item via refreshedAt) et dÃ©tecte les NOUVELLES vidÃ©os. Une sÃ©rie marquÃ©e Â« vue Â» (status
// 'done') qui a une nouvelle vidÃ©o repasse automatiquement EN COURS ('watching'). PrÃ©serve les
// vues (watchedIds), le statut (sauf le repassage en cours) et les labels manga/cartoon.
// Ã‰crit directement dans localStorage (loadTvItems/saveTvItems) â€” ne dÃ©pend pas du montage du
// panneau TV Time. Retourne true si au moins un item a changÃ©.
async function ytCheckNewVideos() {
  if (!ytKey()) return false;
  const cur = loadTvItems();
  const yts = cur.filter(x => x.type === 'youtube');
  if (!yts.length) return false;
  const now = Date.now();
  const patches = new Map();   // id â†’ { built, hasNew }
  for (const it of yts) {
    if (it.dropped) continue;   // Â« ne plus suivre Â» â†’ jamais de recherche de nouveautÃ©s
    if (now - (it.refreshedAt || 0) < YT_NEW_CHECK_TTL) continue;   // encore frais â†’ skip (quota)
    const built = await ytBuildItem(it.id, { unlimited: it.unlimited, keepShorts: it.keepShorts });   // prÃ©serve plafond retirÃ© + tag Shorts
    if (!built || built.error) continue;
    const oldIds = new Set((it.videos || []).map(v => v.id));
    const hasNew = (built.videos || []).some(v => !oldIds.has(v.id));
    patches.set(it.id, { built, hasNew });
  }
  if (!patches.size) return false;
  // Relit l'Ã©tat le plus rÃ©cent avant d'Ã©crire (une action a pu se produire entre-temps)
  const latest = loadTvItems();
  let changed = false;
  const next = latest.map(x => {
    if (x.type !== 'youtube' || !patches.has(x.id)) return x;
    const { built, hasNew } = patches.get(x.id);
    const merged = { ...built, watchedIds: x.watchedIds || [], status: x.status,
      doneAt: x.doneAt, manga: x.manga, cartoon: x.cartoon, addedAt: x.addedAt, unlimited: x.unlimited || built.unlimited, keepShorts: x.keepShorts };
    // Nouvelle vidÃ©o sur une sÃ©rie dÃ©jÃ  Â« vue Â» â†’ on la remet en cours
    if (hasNew && x.status === 'done') { merged.status = 'watching'; merged.doneAt = undefined; }
    changed = true;
    return merged;
  });
  if (changed) saveTvItems(next);
  return changed;
}

// DÃ©tails d'un film/sÃ©rie â†’ item TV Time normalisÃ© et AUTO-SUFFISANT (tout en cache).
// item = { id, type:'movie'|'tv', title, poster, year, status:'towatch'|'watching'|'done',
//          addedAt, doneAt? Â· film: runtime (min) Â· sÃ©rie: epRuntime (min/Ã©p.), totalEps,
//          seasons:[{n,eps}], tvStatus, nextEp:{date,s,e,name}|null, refreshedAt, watchedEps }
async function tmdbFetchItem(type, id) {
  const d = await tmdbGet(`/${type}/${id}`);
  if (!d || !d.id) return null;
  const base = {
    id: d.id, type,

    poster: d.poster_path || null,

    addedAt: Date.now(),
  };
  if (type === 'movie') return { ...base, runtime: d.runtime || 0, overview: d.overview || '', releaseDate: d.release_date || '', refreshedAt: Date.now() };
  // Saisons "spÃ©ciales" (nÂ°0) exclues du dÃ©compte des Ã©pisodes
  const seasons = (d.seasons || []).filter(s => s.season_number > 0 && s.episode_count > 0)
    .map(s => ({ n: s.season_number, eps: s.episode_count }));
  const specialEps = ((d.seasons || []).find(s => s.season_number === 0) || {}).episode_count || 0;
  return {
    ...base,
    specialEps,   // Ã©pisodes hors-sÃ©rie (saison 0) â€” suivis Ã  part, JAMAIS comptÃ©s dans totalEps
    specialsSeen: [],   // nÂ° des Ã©p. spÃ©ciaux vus (fiche sÃ©rie) â€” cochage INDIVIDUEL, n'entre pas dans la progression
    epRuntime: (d.episode_run_time && d.episode_run_time[0]) || (d.last_episode_to_air && d.last_episode_to_air.runtime) || 35,
    totalEps: d.number_of_episodes || seasons.reduce((a, s) => a + s.eps, 0),
    seasons,
    tvStatus: d.status || '',   // 'Ended'/'Canceled' â†’ exclue du refresh des prochaines sorties
    nextEp: d.next_episode_to_air
      ? { date: d.next_episode_to_air.air_date || '', s: d.next_episode_to_air.season_number, e: d.next_episode_to_air.episode_number, name: d.next_episode_to_air.name || '' }
      : null,
    refreshedAt: Date.now(),
    watchedEps: 0,
    watchedSet: [],   // Ã©pisodes vus (cochage individuel) â€” voir tvWatchedSet
  };
}

// Ensemble des Ã©pisodes vus (SOURCE DE VÃ‰RITÃ‰, cochage INDIVIDUEL par Ã©pisode) â€” clÃ©s
// "S{n}E{e}" (saison, Ã©pisode ; hors Ã©pisodes spÃ©ciaux gÃ©rÃ©s Ã  part via specialsSeen).
// Permet de cocher n'importe quelle saison/Ã©pisode isolÃ©ment (ex. S28-S32 sans S1-S27).
// `watchedEps` (compteur) est maintenu = watchedSet.length pour les stats/listes.
// Migration : un ancien item n'a que le compteur plat `watchedEps` â†’ on reconstitue le set
// en marquant les N premiers Ã©pisodes dans l'ordre des saisons (comportement historique).
function tvWatchedSet(item) {
  if (Array.isArray(item.watchedSet)) return item.watchedSet;
  const out = [];
  let rem = item.watchedEps || 0;
  for (const s of item.seasons || []) {
    for (let e = 1; e <= s.eps && rem > 0; e++, rem--) out.push(`S${s.n}E${e}`);
  }
  return out;
}
// Toutes les clÃ©s d'Ã©pisodes (hors spÃ©ciaux) d'une sÃ©rie â€” pour Â« tout vu Â»
function tvAllKeys(item) {
  const out = [];
  for (const s of item.seasons || []) for (let e = 1; e <= s.eps; e++) out.push(`S${s.n}E${e}`);
  return out;
}
// Dernier Ã©pisode vu dans l'ordre des saisons (pour le bouton âˆ’1) â€” clÃ© "S{n}E{e}" ou null
function tvLastWatched(item) {
  const set = new Set(tvWatchedSet(item));
  let last = null;
  for (const s of item.seasons || []) for (let e = 1; e <= s.eps; e++) { const k = `S${s.n}E${e}`; if (set.has(k)) last = k; }
  return last;
}

// Prochain Ã©pisode Ã€ REGARDER (1er Ã©pisode non vu dans l'ordre) â€” "S2E5" (= clÃ© du set)
function tvNextToWatch(item) {
  const set = new Set(tvWatchedSet(item));
  for (const s of item.seasons || []) {
    for (let e = 1; e <= s.eps; e++) { const k = `S${s.n}E${e}`; if (!set.has(k)) return k; }
  }
