// ════════════════════════════════════════════════
// ACTU — agrégateur d'actualités (0 backend, sources gratuites sans clé)
// Hacker News (techno/IA/science, CORS natif) + Presse FR (Google News RSS via
// proxy CORS) + Google Trends France (RSS via proxy) + fuites de données
// (bonjourlafuite.eu.org, HTML via proxy). Cache localStorage TTL 30 min.
// ⚠ Les tendances Twitter/X ne sont plus accessibles gratuitement (API fermée,
// aucune source keyless CORS) → Google Trends France en substitut.
// ════════════════════════════════════════════════
const ACTU_COLOR = '#5f8def';                 // entre Artistes (indigo) et Météo (bleu)
const ACTU_LS    = 'spotifyplus_actu';        // cache { fetched_at, hn, presse, trends, leaks }
const ACTU_TTL   = 30 * 60 * 1000;            // re-fetch auto au-delà de 30 min

let _actuCache;                                // cache mémoire
function loadActu() {
  if (_actuCache !== undefined) return _actuCache;
  try { _actuCache = JSON.parse(localStorage.getItem(ACTU_LS)) || null; } catch { _actuCache = null; }
  return _actuCache;
}
function saveActu(d) { _actuCache = d; try { localStorage.setItem(ACTU_LS, JSON.stringify(d)); } catch {} }

// Décodage des entités HTML + retrait des balises (titres RSS, CDATA)
function actuDecode(s) {
  if (!s) return '';
  return String(s)
    .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(+n))
    .replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCharCode(parseInt(n, 16)))
    .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&nbsp;/g, ' ')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
    .replace(/\s+/g, ' ').trim();
}

// Horodatage relatif « il y a X » depuis une date ISO/RSS
function actuAgo(dateStr) {
  if (!dateStr) return '';
  const t = Date.parse(dateStr);
  if (isNaN(t)) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 3600)  return `il y a ${Math.round(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  return `il y a ${Math.round(s / 86400)} j`;
}

// Parse un flux RSS/Atom → [{ title, link, date, source }]
function actuParseRss(xml, max = 12) {
  if (!xml) return [];
  const out = [];
  const items = xml.match(/<item[\s>][\s\S]*?<\/item>/gi) || xml.match(/<entry[\s>][\s\S]*?<\/entry>/gi) || [];
  for (const it of items) {
    const tm = it.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    const title = actuDecode(tm ? tm[1] : '');
    if (!title) continue;
    let link = '';
    const lm = it.match(/<link[^>]*>([\s\S]*?)<\/link>/i);
    if (lm && lm[1].trim()) link = lm[1].trim();
    if (!link) { const lh = it.match(/<link[^>]*href="([^"]+)"/i); if (lh) link = lh[1]; }
    const dm = it.match(/<pubDate[^>]*>([\s\S]*?)<\/pubDate>/i)
      || it.match(/<published[^>]*>([\s\S]*?)<\/published>/i)
      || it.match(/<updated[^>]*>([\s\S]*?)<\/updated>/i);
    const sm = it.match(/<source[^>]*>([\s\S]*?)<\/source>/i);
    out.push({ title, link: actuDecode(link), date: dm ? dm[1].trim() : null, source: sm ? actuDecode(sm[1]) : '' });
    if (out.length >= max) break;
  }
  return out;
}

// Hacker News via l'API Algolia (CORS natif, sans clé) — page d'accueil (top tech/IA/science)
async function actuFetchHN() {
  try {
    const r = await fetch('https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=12');
    if (!r.ok) return [];
    const j = await r.json();
    return (j.hits || []).filter(h => h.title).slice(0, 12).map(h => ({
      title:  h.title,
      link:   h.url || `https://news.ycombinator.com/item?id=${h.objectID}`,
      points: h.points || 0,
      date:   h.created_at || null,
    }));
  } catch { return []; }
}

// Presse FR (IA / science / techno) via le flux RSS Google News (proxy CORS)
async function actuFetchPresse() {
  const q = encodeURIComponent('intelligence artificielle OR science OR technologie');
  const xml = await corsFetchText(`https://news.google.com/rss/search?q=${q}&hl=fr&gl=FR&ceid=FR:fr`);
  return actuParseRss(xml, 12).map(a => {
    // Google News suffixe le titre par «  - Source » → on sépare
    const m = a.title.match(/^(.*)\s[-–]\s([^-–]+)$/);
    return m ? { ...a, title: m[1].trim(), source: a.source || m[2].trim() } : a;
  });
}

// Google Trends France — recherches tendance du jour (RSS via proxy CORS)
async function actuFetchTrends() {
  let xml = await corsFetchText('https://trends.google.fr/trends/trendingsearches/daily/rss?geo=FR');
  if (!xml || !/<item/i.test(xml)) xml = await corsFetchText('https://trends.google.com/trending/rss?geo=FR');
  if (!xml) return [];
  const out = [];
  const items = xml.match(/<item[\s>][\s\S]*?<\/item>/gi) || [];
  for (const it of items) {
    const tm = it.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    const title = actuDecode(tm ? tm[1] : '');
    if (!title) continue;
    const traf = it.match(/<ht:approx_traffic>([\s\S]*?)<\/ht:approx_traffic>/i);
    out.push({ rank: out.length + 1, title, traffic: traf ? actuDecode(traf[1]) : '',
      link: `https://www.google.com/search?q=${encodeURIComponent(title)}` });
    if (out.length >= 10) break;
  }
  return out;
}

// Fuites de données — bonjourlafuite.eu.org (pas d'API : HTML via proxy CORS, parseur heuristique)
async function actuFetchLeaks() {
  const html = await corsFetchText('https://bonjourlafuite.eu.org/');
  if (!html) return { items: [], needsTuning: false };
  const body = html.replace(/<script[\s\S]*?<\/script>/gi, ' ')
    .replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<head[\s\S]*?<\/head>/gi, ' ');
  const dateRe = /(\d{1,2}\s+(?:janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre)\s+\d{4})|(\d{4}-\d{2}-\d{2})|(\d{1,2}\/\d{1,2}\/\d{4})/i;
  const blocks = body.match(/<(?:article|li|tr|h1|h2|h3|h4)[\s>][\s\S]*?<\/(?:article|li|tr|h1|h2|h3|h4)>/gi) || [];
  const items = [], seen = new Set();
  for (const b of blocks) {
    const text = actuDecode(b);
    if (!text || text.length < 3 || text.length > 220) continue;
    const key = text.slice(0, 60).toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    const dm = text.match(dateRe);
    const hm = b.match(/href="([^"]+)"/i);
    const href = hm && /^https?:/.test(hm[1]) ? hm[1] : '';
    items.push({ text, date: dm ? dm[0] : null, link: href });
  }
  const dated = items.filter(i => i.date);      // on ne garde que les entrées vraiment datées (évite le bruit de nav)
  return { items: dated.slice(0, 5), needsTuning: dated.length === 0 };
}

// Récupère les 4 sources en parallèle et met en cache
async function actuFetchAll() {
  const [hn, presse, trends, leaks] = await Promise.all([
    actuFetchHN(), actuFetchPresse(), actuFetchTrends(), actuFetchLeaks(),
  ]);
  const data = { fetched_at: Date.now(), hn, presse, trends, leaks };
  saveActu(data);
  return data;
}

  React.useEffect(() => {

  const empty = txt => <div style={{ fontSize:11, color:C.dim, padding:'4px 0' }}>{loading ? 'Chargement…' : txt}</div>;

  const d = data || {};
  return (
    <div>

        <button onClick={refresh} disabled={loading}
          style={{ fontSize:11, color: loading ? C.dim : C.muted, background:'none', border:`1px solid ${C.border}`, borderRadius:6, padding:'4px 12px', cursor: loading ? 'default' : 'pointer' }}>

async function fetchMeteo(lat, lon, days = 3) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min`
    + `&timezone=Europe%2FParis&forecast_days=${days}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  const d = j.daily;
  return d.time.map((t, i) => ({
    date: t,
    code: d.weather_code[i],
    tmax: Math.round(d.temperature_2m_max[i]),
    tmin: Math.round(d.temperature_2m_min[i]),
  }));
}

// Prévision détaillée (clic sur un jour) — Open-Meteo, beaucoup plus de champs :
// ressenti, précipitations, proba pluie, vent + rafales + direction, UV, humidité,
// lever/coucher du soleil + détail heure par heure de la journée.
async function fetchMeteoDetail(lat, lon, days = 3) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,`
    + `sunrise,sunset,uv_index_max,precipitation_sum,precipitation_probability_max,precipitation_hours,`
    + `wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant`
    + `&hourly=temperature_2m,precipitation_probability,relative_humidity_2m,weather_code`
    + `&timezone=Europe%2FParis&forecast_days=${days}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  const d = j.daily, h = j.hourly;
  const daysArr = d.time.map((t, i) => ({
    date: t, code: d.weather_code[i],
    tmax: Math.round(d.temperature_2m_max[i]), tmin: Math.round(d.temperature_2m_min[i]),
    feelMax: Math.round(d.apparent_temperature_max[i]), feelMin: Math.round(d.apparent_temperature_min[i]),
    sunrise: d.sunrise[i], sunset: d.sunset[i],
    uv: d.uv_index_max[i], precip: d.precipitation_sum[i], precipProb: d.precipitation_probability_max[i],
    precipHours: d.precipitation_hours[i],
    wind: Math.round(d.wind_speed_10m_max[i]), gusts: Math.round(d.wind_gusts_10m_max[i]),
    windDir: d.wind_direction_10m_dominant[i],
  }));
  // Index horaire groupé par date
  const hourly = {};
  (h?.time || []).forEach((t, i) => {
    const day = t.slice(0, 10);
    (hourly[day] = hourly[day] || []).push({
      hour: t.slice(11, 16), temp: Math.round(h.temperature_2m[i]),
      precipProb: h.precipitation_probability[i], humidity: h.relative_humidity_2m[i], code: h.weather_code[i],
    });
  });
  return { days: daysArr, hourly };
}

// Direction du vent (degrés) → rose des vents FR
function windCardinal(deg) {
  if (deg == null || isNaN(deg)) return '—';
  const dirs = ['N','NE','E','SE','S','SO','O','NO'];
  return dirs[Math.round(deg / 45) % 8];
}

function nearestCityFR(lat, lon) {
  let best = null, bestD = Infinity;
  const cl = Math.cos(lat * Math.PI / 180);
  for (const c of FR_CITIES) {
    const dy = c[1] - lat, dx = (c[2] - lon) * cl;
    const d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = c[0]; }
  }
  return best;
}

// Reverse-geocoding → nom de la ville/commune la plus proche.
// Chaîne de providers gratuits/sans clé : le PREMIER qui renvoie un nom gagne.
// Plusieurs sources car selon la position/le réseau certaines échouent (CORS,
// rate-limit, champ vide). Chacune isolée dans son try/catch. En DERNIER recours
// (tous les providers bloqués/HS), fallback HORS-LIGNE nearestCityFR → jamais null.
async function reverseGeocode(lat, lon) {
  // 1) BigDataCloud — pensé pour le navigateur, CORS permissif, pas de rate-limit
  try {
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fr`);
    if (r.ok) {
      const j = await r.json();
      const c = j.city || j.locality || j.principalSubdivision;
      if (c) return c;
    }
  } catch (e) {}
  // 2) Photon (Komoot) — CORS large, basé OSM
  try {
    const r = await fetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}&lang=fr`);
    if (r.ok) {
      const j = await r.json();
      const p = (j.features && j.features[0] && j.features[0].properties) || {};
      const c = p.city || p.name || p.locality || p.district || p.county || p.state;
      if (c) return c;
    }
  } catch (e) {}
  // 3) Nominatim (OpenStreetMap) — rate-limit 1 req/s
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=12&accept-language=fr`);
    if (r.ok) {
      const j = await r.json();
      const a = j.address || {};
      const c = a.city || a.town || a.village || a.municipality || a.suburb || a.county || a.state;
      if (c) return c;
    }
  } catch (e) {}
  // Tous les providers réseau ont échoué (bloqueur, rate-limit, hors-ligne) →
  // ville française la plus proche calculée localement (jamais null)
  return nearestCityFR(lat, lon);
}

function meteoDayLabel(iso, i) {
  if (i === 0) return 'Auj.';
  const d = new Date(iso + 'T12:00:00');
  const s = d.toLocaleDateString('fr-FR', { weekday:'short' });
  return s.charAt(0).toUpperCase() + s.slice(1).replace('.', '');
}

// Date longue FR — "vendredi 26 juin"
function meteoFullDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  const s = d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const fmtHM = iso => { try { return new Date(iso).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }); } catch { return '—'; } };

function MeteoLoc({ loc, full }) {

function MeteoPanel() {
  const [data, setData] = React.useState({}); // key -> { name, days } | { name, error }
  // Light = 3 jours (défaut) · Full = 7 jours (tuiles plus petites). NON persisté.
  const [full, setFull] = React.useState(false);

  React.useEffect(() => {
    let cancelled = false;
    const nDays = full ? 7 : 3;
    const load = async (key, name, lat, lon) => {
      try {
        const days = await fetchMeteo(lat, lon, nDays);
        if (!cancelled) setData(prev => ({ ...prev, [key]: { name, days, lat, lon } }));
      } catch (e) {
        if (!cancelled) setData(prev => ({ ...prev, [key]: { name, error:true, lat, lon } }));
      }
    };
    METEO_LOCS.forEach(l => load(l.key, l.name, l.lat, l.lon));
    // Position actuelle de l'utilisateur (géolocalisation navigateur)
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        async pos => {
          if (cancelled) return;
          const { latitude, longitude } = pos.coords;
          const city = await reverseGeocode(latitude, longitude);
          if (!cancelled) load('me', city || 'Ma position', latitude, longitude);
        },
        ()  => { if (!cancelled) setData(prev => ({ ...prev, me: { name:'Ma position', error:true, denied:true } })); },
        { timeout: 10000, maximumAge: 600000 }
      );
    } else {
      setData(prev => ({ ...prev, me: { name:'Ma position', error:true } }));
    }
    return () => { cancelled = true; };
  }, [full]);

  const modeBtn = active => ({
    background: active ? `${METEO_BLUE}22` : 'none',
    border: active ? `1px solid ${METEO_BLUE}66` : `1px solid ${C.border}`,
    color: active ? METEO_BLUE : C.muted, borderRadius:6, padding:'3px 12px',
    cursor:'pointer', fontSize:10, fontWeight: active ? 700 : 500,
  });

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
      <div style={{ display:'flex', gap:4, justifyContent:'flex-end' }}>
        <button onClick={() => setFull(false)} style={modeBtn(!full)}>Light</button>
        <button onClick={() => setFull(true)}  style={modeBtn(full)}>Full</button>
      </div>
      <MeteoLoc loc={data.voisins} full={full} />
      <MeteoLoc loc={data.massy} full={full} />
      <MeteoLoc loc={data.boulogne} full={full} />
      <MeteoLoc loc={data.me} full={full} />
    </div>
  );
}

// Formatage d'un prix (gros nombres sans décimale, petits avec précision)
function fmtPrice(v, cur='$') {
  if (v == null || isNaN(v)) return '—';
  const n = Number(v);
  if (n >= 1000) return cur + n.toLocaleString('en-US', { maximumFractionDigits:0 });
  if (n >= 1)    return cur + n.toLocaleString('en-US', { maximumFractionDigits:2 });
  if (n >= 0.01) return cur + n.toFixed(4);
  return cur + n.toPrecision(3); // ex. PEPE 0.00000120
}

// Stooq (source EU, pas de mur de consentement RGPD contrairement à Yahoo) n'envoie
// pas d'en-tête CORS → on passe par des proxies CORS keyless SANS inscription. On en
// essaie plusieurs (le 1er qui répond gagne) car selon le réseau certains sont bloqués.
async function corsFetchText(url) {
  const tries = [
    'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(url),
    'https://cors.eu.org/' + url,                       // proxy CORS européen, sans clé
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
    url,                                                // direct en dernier recours
  ];
  for (const u of tries) {
    try {
      const r = await fetch(u);
      if (!r.ok) continue;
      const t = await r.text();
      if (t && t.trim()) return t;
    } catch (e) {}
  }
  return null;
}

// Cours via Stooq (CSV léger, gratuit sans clé) — 1 requête par valeur.
// Variation = (close - open) / open de la séance.
async function fetchStooq(symbol) {
  try {
    const txt = await corsFetchText(`https://stooq.com/q/l/?s=${encodeURIComponent(symbol)}&f=sd2t2ohlcv&h&e=csv`);
    if (!txt) return null;
    const lines = txt.trim().split('\n');
    if (lines.length < 2) return null;
    const cols = lines[1].split(',');           // Symbol,Date,Time,Open,High,Low,Close,Volume
    const open = parseFloat(cols[3]);
    const close = parseFloat(cols[6]);
    if (isNaN(close)) return null;
    const pct = (!isNaN(open) && open) ? ((close - open) / open) * 100 : undefined;
    return { price: close, pct };
  } catch (e) { return null; }
}

// proxy). Clé GRATUITE lecture seule (cf. README). ⚠ Clé publique par nature sur

// false = DÉSACTIVE tous les appels Twelve Data (EUR/USD repli Frankfurter, actions

async function fetchTD(symbol) {

    if (!r.ok) return null;

    return { price, pct: isNaN(pct) ? undefined : pct };

// ── Alpha Vantage : CORS natif (pas de proxy), clé gratuite (~25 req/jour). Endpoint
// WTI dédié → VRAI prix du pétrole (pas un ETF). Clé gratuite lecture seule (publique
// par nature sur une app statique, comme TWELVE_DATA_KEY).
const ALPHA_VANTAGE_KEY = 'OW6MAHXBO075AHI7';

// Matière première via un endpoint dédié Alpha Vantage (WTI, SUGAR, WHEAT, …) → VRAI prix
// (pas un ETF). La série `data` est triée du plus récent au plus ancien ; AV met "." pour
// les valeurs manquantes → on filtre. Variation = dernière période vs précédente.
async function fetchAlphaCommodity(func, interval = 'monthly') {
  if (!ALPHA_VANTAGE_KEY) return null;
  try {
    const r = await fetch(`https://www.alphavantage.co/query?function=${func}&interval=${interval}&apikey=${ALPHA_VANTAGE_KEY}`);
    if (!r.ok) return null;
    const j = await r.json();
    const data = j && j.data;
    if (!Array.isArray(data)) return null;
    const pts = data.filter(d => d && d.value && d.value !== '.' && !isNaN(parseFloat(d.value)));
    if (!pts.length) return null;
    const price = parseFloat(pts[0].value);
    const prev  = pts[1] ? parseFloat(pts[1].value) : null;
    const pct   = (prev != null && prev) ? ((price - prev) / prev) * 100 : undefined;
    return { price, pct };
  } catch (e) { return null; }
}

// GRAPHIQUES FINANCE — clic sur une ligne → modal avec l'historique du prix.
// Sources par type de ligne (toutes DÉJÀ autorisées dans la CSP connect-src) :
//  • coingecko   (crypto)                       : /coins/{id}/market_chart — CORS natif, sans clé
//  • frankfurter (EUR/USD)                      : /{start}..{end} — BCE, CORS natif, sans clé
//  • stooq       (indices, actions, or/argent)  : CSV historique quotidien via corsFetchText (proxies CORS)
//  • alpha       (pétrole WTI, sucre)           : série complète Alpha Vantage (⚠ 1 req du quota ~25/j)
// Tout est mis en cache session (_chartCache) : rouvrir un graphique ne refetch jamais.
// ════════════════════════════════════════════════
const _chartCache = {};
const CHART_RANGE_DAYS = { '24h':1, '7j':7, '1m':31, '3m':92, '1a':366, '5a':1830, '10a':3660 };

// Périodes proposées selon la source. Défaut = '7j' quand la période existe (indices,
// actions, métaux, pétrole, EUR/USD ouvrent sur la semaine — données quotidiennes, ~5
// points), sinon 2e entrée (sucre mensuel → '5a').
function chartRanges(spec) {
  if (spec.kind === 'coingecko') return ['24h', '7j', '1m', '1a'];
  if (spec.kind === 'alpha' && spec.interval === 'monthly') return ['1a', '5a', '10a'];
  return ['7j', '1m', '3m', '1a'];
}

// Ré-échantillonnage : garde ≤ maxPts points (premier/dernier conservés) pour un SVG léger
function chartDownsample(pts, maxPts = 400) {
  if (pts.length <= maxPts) return pts;
  const step = (pts.length - 1) / (maxPts - 1), out = [];
  for (let i = 0; i < maxPts; i++) out.push(pts[Math.round(i * step)]);
  return out;
}

// ── Historique LOCAL des prix (repli du graphique) ──
// Les sources d'historique distantes des indices/actions/or (Stooq via proxies CORS)
// échouent souvent → l'app CONSTITUE elle-même l'historique en échantillonnant les prix
// affichés, **une seule fois par jour et par donnée**, et **UNIQUEMENT pour les valeurs du
// mode Light** (les valeurs Full n'enregistrent rien). Stocké dans localStorage
// `spotifyplus_finance_history` (`{ version:1, series: { '<clé>': [{ t, v }, …] } }`, clés =
// `finHistKey(spec)` : `cg:bitcoin` / `stooq:^spx` / `alpha:WTI` / `fx:EURUSD`). On ne garde
// pas plus d'~1 an. Quand la source distante ne répond pas, `FinanceChartModal` retombe sur
// ces points locaux (bandeau ⚠). Inclus dans buildBackup/applyBackup (clé `finance`, FUSIONNÉ).
const FIN_HIST_LS = 'spotifyplus_finance_history';
const FIN_HIST_MIN_MS = 20 * 3600 * 1000;   // densité mini entre 2 points (fusion backup) ≈ 1/jour
const FIN_HIST_MAX_PTS = 370;               // cap par série ≈ 1 an de points quotidiens
const FIN_HIST_MAX_AGE = 366 * 864e5;       // on ne garde pas plus d'~1 an d'historique
let _finHistCache = null;                    // cache mémoire (évite le JSON.parse à chaque notify)
function loadFinHist() {
  if (_finHistCache) return _finHistCache;
  try { _finHistCache = JSON.parse(localStorage.getItem(FIN_HIST_LS)) || null; } catch (e) { _finHistCache = null; }
  if (!_finHistCache || typeof _finHistCache !== 'object' || !_finHistCache.series) _finHistCache = { version: 1, series: {} };
  return _finHistCache;
}
function saveFinHist() { try { localStorage.setItem(FIN_HIST_LS, JSON.stringify(loadFinHist())); } catch (e) {} }
// Jour calendaire LOCAL d'un timestamp (dédup « 1 point/jour »)
function _finDayKey(t) { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
// Ajoute un point à une série — max 1 par jour calendaire par série, purge > 1 an. → true si ajouté
function finHistRecord(h, key, v) {
  if (v == null || isNaN(v)) return false;
  const s = h.series[key] || (h.series[key] = []);
  const last = s[s.length - 1];
  if (last && _finDayKey(last.t) === _finDayKey(Date.now())) return false;   // déjà un point aujourd'hui
  s.push({ t: Date.now(), v: Number(v) });
  const cutoff = Date.now() - FIN_HIST_MAX_AGE;   // purge les points de plus d'~1 an
  let i = 0; while (i < s.length && s[i].t < cutoff) i++;
  if (i > 0) s.splice(0, i);
  if (s.length > FIN_HIST_MAX_PTS) s.splice(0, s.length - FIN_HIST_MAX_PTS);
  return true;
}
// Snapshot des valeurs LIGHT présentes dans `_finance` → séries locales. Appelé par
// `_finNotify` (à chaque prix qui arrive) ; n'écrit dans localStorage que si un point a été
// ajouté (throttle 1/jour par série). **Seules les valeurs du mode Light sont enregistrées**
// (Bitcoin, PEPE, S&P 500, NASDAQ-100, NVIDIA, Take-Two, Or, Pétrole, EUR/USD) — les valeurs
// Full (autres cryptos, CAC 40, autres actions, argent, sucre) n'enregistrent RIEN.
function finHistSnapshot() {
  try {
    const f = _finance, h = loadFinHist();
    let dirty = false;
    const cg = (f.crypto && f.crypto !== 'error') ? f.crypto : null;
    if (cg) {
      dirty = finHistRecord(h, 'cg:bitcoin', cg.bitcoin && cg.bitcoin.usd) || dirty;
      dirty = finHistRecord(h, 'cg:pepe',    cg.pepe && cg.pepe.usd) || dirty;
    }
    if (f.idx) {
      dirty = finHistRecord(h, 'stooq:^spx', f.idx.spx && f.idx.spx.price) || dirty;   // S&P 500
      dirty = finHistRecord(h, 'stooq:^ndq', f.idx.ndq && f.idx.ndq.price) || dirty;   // NASDAQ-100
    }
    dirty = finHistRecord(h, 'stooq:nvda.us', f.stocks.nvda && f.stocks.nvda.price) || dirty;   // NVIDIA
    dirty = finHistRecord(h, 'stooq:ttwo.us', f.stocks.ttwo && f.stocks.ttwo.price) || dirty;   // Take-Two
    dirty = finHistRecord(h, 'stooq:xauusd',  f.gold && f.gold.price) || dirty;   // Or
    dirty = finHistRecord(h, 'alpha:WTI',     f.oil && f.oil.price) || dirty;     // Pétrole WTI
    dirty = finHistRecord(h, 'fx:EURUSD',     f.eurusd) || dirty;                 // EUR/USD
    if (dirty) saveFinHist();
  } catch (e) {}
}
// Clé de série locale pour un spec de graphique (mêmes clés que finHistSnapshot)
function finHistKey(spec) {
  if (spec.kind === 'coingecko')   return 'cg:' + spec.id;
  if (spec.kind === 'frankfurter') return 'fx:EURUSD';
  if (spec.kind === 'alpha')       return 'alpha:' + spec.id;
  return 'stooq:' + spec.id;
}
// Points locaux pour un spec + une période (null si < 2 points dans la fenêtre)
function finHistPoints(spec, range) {
  const s = loadFinHist().series[finHistKey(spec)] || [];
  const since = Date.now() - (CHART_RANGE_DAYS[range] || 92) * 864e5;
  const pts = s.filter(p => p && p.t >= since && p.v != null && !isNaN(p.v));
  return pts.length >= 2 ? chartDownsample(pts) : null;
}

// Historique quotidien Stooq (1 an) — CSV `Date,Open,High,Low,Close,Volume`, via les
// mêmes proxies CORS que les cotations. Cache par symbole, découpé ensuite par période.
async function fetchStooqHistory(symbol) {
  const key = 'stooqhist:' + symbol;
  if (_chartCache[key]) return _chartCache[key];
  const fmt = d => d.toISOString().slice(0, 10).replace(/-/g, '');
  const txt = await corsFetchText(`https://stooq.com/q/d/l/?s=${encodeURIComponent(symbol)}&d1=${fmt(new Date(Date.now() - 366 * 864e5))}&d2=${fmt(new Date())}&i=d`);
  if (!txt) return null;
  const pts = [];
  for (const ln of txt.trim().split('\n').slice(1)) {
    const c = ln.split(',');
    const t = new Date(c[0]).getTime(), v = parseFloat(c[4]);
    if (!isNaN(t) && !isNaN(v)) pts.push({ t, v });
  }
  pts.sort((a, b) => a.t - b.t);
  if (pts.length < 2) return null;
  _chartCache[key] = pts; return pts;
}

// Historique EUR/USD via Frankfurter (BCE) — 1 an de fixings quotidiens en 1 requête.
async function fetchFxHistory() {
  const key = 'fxhist:EURUSD';
  if (_chartCache[key]) return _chartCache[key];
  try {
    const iso = d => d.toISOString().slice(0, 10);
    const r = await fetch(`https://api.frankfurter.app/${iso(new Date(Date.now() - 366 * 864e5))}..${iso(new Date())}?from=EUR&to=USD`);
    if (!r.ok) return null;
    const j = await r.json();
    const pts = Object.keys(j.rates || {}).sort()
      .map(d => ({ t: new Date(d).getTime(), v: j.rates[d] && j.rates[d].USD }))
      .filter(p => p.v != null && !isNaN(p.t));
    if (pts.length < 2) return null;
    _chartCache[key] = pts; return pts;
  } catch (e) { return null; }
}

// Série complète Alpha Vantage (WTI daily / SUGAR monthly) — même endpoint que
// fetchAlphaCommodity mais on garde TOUTE la série. ⚠ Consomme 1 requête du quota
// AV (~25/j) au premier clic seulement (cache session ensuite).
async function fetchAlphaSeries(func, interval) {
  const key = 'alphahist:' + func + ':' + interval;
  if (_chartCache[key]) return _chartCache[key];
  if (!ALPHA_VANTAGE_KEY) return null;
  try {
    const r = await fetch(`https://www.alphavantage.co/query?function=${func}&interval=${interval}&apikey=${ALPHA_VANTAGE_KEY}`);
    if (!r.ok) return null;
    const j = await r.json();
    if (!Array.isArray(j && j.data)) return null;
    const pts = j.data
      .filter(d => d && d.value && d.value !== '.' && !isNaN(parseFloat(d.value)))
      .map(d => ({ t: new Date(d.date).getTime(), v: parseFloat(d.value) }))
      .filter(p => !isNaN(p.t))
      .sort((a, b) => a.t - b.t);
    if (pts.length < 2) return null;
    _chartCache[key] = pts; return pts;
  } catch (e) { return null; }
}

// Points du graphique pour un spec + une période → [{ t, v }] triés, ou null si échec.
async function fetchChartPoints(spec, range) {
  try {
    if (spec.kind === 'coingecko') {
      // CoinGecko : 1 fetch PAR période (la granularité dépend de `days` : 5 min sur
      // 24h, horaire sur 7j, quotidien au-delà) — chacun caché séparément.
      const key = 'cg:' + spec.id + ':' + range;
      if (_chartCache[key]) return _chartCache[key];
      const r = await fetch(`https://api.coingecko.com/api/v3/coins/${encodeURIComponent(spec.id)}/market_chart?vs_currency=usd&days=${CHART_RANGE_DAYS[range] || 7}`);
      if (!r.ok) return null;
      const j = await r.json();
      const pts = chartDownsample((j.prices || []).map(p => ({ t: p[0], v: p[1] })).filter(p => p.v != null));
      if (pts.length < 2) return null;
      _chartCache[key] = pts; return pts;
    }
    let all = null;
    if (spec.kind === 'frankfurter') all = await fetchFxHistory();
    else if (spec.kind === 'stooq')  all = await fetchStooqHistory(spec.id);
    else if (spec.kind === 'alpha')  all = await fetchAlphaSeries(spec.id, spec.interval);
    if (!all) return null;
    const since = Date.now() - (CHART_RANGE_DAYS[range] || 92) * 864e5;
    const pts = chartDownsample(all.filter(p => p.t >= since));
    return pts.length >= 2 ? pts : null;
  } catch (e) { return null; }
}

function fmtChartDate(t, range) {
  const d = new Date(t);
  if (range === '24h') return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  if (range === '5a' || range === '10a') return d.toLocaleDateString('fr-FR', { month: 'short', year: 'numeric' });
  if (range === '1a') return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: '2-digit' });
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}

// Courbe SVG pure (aucune lib → CSP inchangée) : aire dégradée + ligne 2px, couleur
// hausse/baisse sur la période (FIN_UP/FIN_DOWN), 3 gridlines discrètes, crosshair
// au survol/drag tactile (readout date · valeur dans un slot fixe au-dessus).
function FinanceChart({ pts, fmtV, range }) {
  const [hover, setHover] = React.useState(null);        // index du point survolé | null
  const svgRef = React.useRef(null);
  const W = 400, H = 170, PT = 8, PB = 6, PL = 4, PR = 4;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, tSpan = (t1 - t0) || 1;
  let vmin = Infinity, vmax = -Infinity;
  for (const p of pts) { if (p.v < vmin) vmin = p.v; if (p.v > vmax) vmax = p.v; }
  if (vmax === vmin) { const e = Math.abs(vmax) * 0.01 || 1; vmax += e; vmin -= e; }
  const X = t => PL + ((t - t0) / tSpan) * (W - PL - PR);
  const Y = v => PT + (1 - (v - vmin) / (vmax - vmin)) * (H - PT - PB);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const up  = pts[pts.length - 1].v >= pts[0].v;
  const col = up ? FIN_UP : FIN_DOWN;

  const onMove = e => {
    const rect = svgRef.current && svgRef.current.getBoundingClientRect();
    if (!rect || !rect.width) return;
    const t = t0 + ((e.clientX - rect.left) / rect.width) * tSpan;
    let best = 0, bd = Infinity;
    for (let i = 0; i < pts.length; i++) { const d = Math.abs(pts[i].t - t); if (d < bd) { bd = d; best = i; } }
    setHover(best);
  };
  const hp = hover != null ? pts[hover] : null;

  return (
    <div>
      <div style={{ height:16, fontSize:11, fontWeight:700, fontFamily:'DM Mono,monospace', color: hp ? C.text : C.dim, textAlign:'center', marginBottom:2 }}>
        {hp ? `${fmtChartDate(hp.t, range)} · ${fmtV(hp.v)}` : ''}
      </div>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{ width:'100%', height:'auto', display:'block', touchAction:'none', cursor:'crosshair' }}
        onPointerMove={onMove} onPointerDown={onMove} onPointerLeave={() => setHover(null)}>
        <defs>
          <linearGradient id="finchartgrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stopColor={col} stopOpacity="0.25" />
            <stop offset="1" stopColor={col} stopOpacity="0" />
          </linearGradient>
        </defs>
        {[0.25, 0.5, 0.75].map(f => {
          const gy = PT + f * (H - PT - PB);
          return (
            <g key={f}>
              <line x1={PL} x2={W - PR} y1={gy} y2={gy} stroke={C.border} strokeWidth="1" strokeDasharray="3 4" />
              <text x={PL + 1} y={gy - 3} fill={C.muted} fontSize="8.5" fontFamily="DM Mono,monospace">{fmtV(vmax - f * (vmax - vmin))}</text>
            </g>
          );
        })}
        <path d={`${line}L${X(t1).toFixed(1)},${H}L${X(t0).toFixed(1)},${H}Z`} fill="url(#finchartgrad)" />
        <path d={line} fill="none" stroke={col} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        <circle cx={X(t1)} cy={Y(pts[pts.length - 1].v)} r="3" fill={col} />
        {hp && (
          <g>
            <line x1={X(hp.t)} x2={X(hp.t)} y1={PT} y2={H - PB} stroke={C.muted} strokeWidth="1" strokeDasharray="2 3" />
            <circle cx={X(hp.t)} cy={Y(hp.v)} r="4" fill={col} stroke={C.surface} strokeWidth="2" />
          </g>
        )}
      </svg>
      <div style={{ display:'flex', justifyContent:'space-between', fontSize:9, color:C.dim, fontFamily:'DM Mono,monospace', marginTop:3 }}>
        <span>{fmtChartDate(t0, range)}</span>
        <span>{fmtChartDate(t1, range)}</span>
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', fontSize:10, color:C.muted, fontFamily:'DM Mono,monospace', marginTop:6 }}>
        <span>⬇ {fmtV(vmin)}</span>
        <span>⬆ {fmtV(vmax)}</span>
      </div>
    </div>
  );
}

// Modal graphique (même gabarit que MeteoDetailModal) : header valeur + variation sur
// la période, chips de période, courbe. Fermeture par clic overlay ou ×.
function FinanceChartModal({ spec, onClose }) {
  const ranges = chartRanges(spec);
  const [range, setRange] = React.useState(ranges.includes('7j') ? '7j' : ranges[1]);
  const [state, setState] = React.useState({ loading: true, pts: null, local: false });
  React.useEffect(() => {
    let cancelled = false;
    setState({ loading: true, pts: null, local: false });
    (async () => {
      // Indices / actions / or (Stooq) : la source distante (proxies CORS) est peu fiable →
      // on PRIVILÉGIE l'historique local quotidien constitué par l'app (comme EUR/USD).
      // Repli sur le fetch distant seulement si le local n'a pas encore assez de points.
      if (spec.kind === 'stooq') {
        const localPts = finHistPoints(spec, range);
        if (localPts) { if (!cancelled) setState({ loading: false, pts: localPts, local: true }); return; }
        const remote = await fetchChartPoints(spec, range);
        if (!cancelled) setState({ loading: false, pts: remote, local: false });
        return;
      }
      const pts = await fetchChartPoints(spec, range);
      if (cancelled) return;
      // Source distante KO → repli sur l'historique local échantillonné par l'app
      if (pts) setState({ loading: false, pts, local: false });
      else setState({ loading: false, pts: finHistPoints(spec, range), local: true });
    })();
    return () => { cancelled = true; };
  }, [range]);

  const fmtV = spec.kind === 'frankfurter' ? (v => '$' + Number(v).toFixed(4)) : fmtPrice;
  const { loading, pts, local } = state;
  const first = pts && pts[0].v, last = pts && pts[pts.length - 1].v;
  const periodPct = (pts && first) ? ((last - first) / first) * 100 : null;

  const chip = active => ({
    background: active ? `${FINANCE_CYAN}22` : 'none',
    border: active ? `1px solid ${FINANCE_CYAN}66` : `1px solid ${C.border}`,
    color: active ? FINANCE_CYAN : C.muted, borderRadius:6, padding:'3px 10px',
    cursor:'pointer', fontSize:10, fontWeight: active ? 700 : 500, fontFamily:'DM Mono,monospace',
  });

  return (
    <div onClick={onClose} style={{ position:'fixed', inset:0, zIndex:200, background:'rgba(0,0,0,0.7)', display:'flex', alignItems:'center', justifyContent:'center', padding:16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:'16px 18px', width:'100%', maxWidth:440, maxHeight:'85vh', overflowY:'auto', boxShadow:'0 20px 60px rgba(0,0,0,0.6)' }}>
        <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:10, marginBottom:10 }}>
          <div style={{ minWidth:0 }}>
            <div style={{ fontSize:11, color:FINANCE_CYAN, fontWeight:700, letterSpacing:'0.05em', marginBottom:2, display:'flex', alignItems:'center', gap:6 }}>
              <span style={{ fontSize:14 }}>{spec.icon}</span> {spec.name}
            </div>
            <div style={{ fontSize:19, fontWeight:900, fontFamily:'DM Mono,monospace', color:C.text }}>
              {last != null ? fmtV(last) : '…'}{' '}
              {periodPct != null && <FinancePct v={periodPct} />}
              {periodPct != null && <span style={{ fontSize:9, color:C.dim, fontWeight:500, marginLeft:4 }}>sur {range}</span>}
            </div>
          </div>
          <button onClick={onClose} style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:8, color:C.muted, fontSize:16, lineHeight:1, padding:'3px 9px', cursor:'pointer', flexShrink:0 }}>×</button>
        </div>
        <div style={{ display:'flex', gap:4, marginBottom:10 }}>
          {ranges.map(rg => <button key={rg} onClick={() => setRange(rg)} style={chip(rg === range)}>{rg}</button>)}
        </div>
        {loading ? (
          <div style={{ fontSize:11, color:C.muted, padding:'40px 0', textAlign:'center', fontFamily:'DM Mono,monospace' }}>Chargement du graphique…</div>
        ) : !pts ? (
          <div style={{ fontSize:11, color:C.muted, padding:'40px 0', textAlign:'center', fontFamily:'DM Mono,monospace', lineHeight:1.6 }}>
            Graphique indisponible — pas encore assez d'historique local.<br/>
            <span style={{ fontSize:9, color:C.dim }}>Les prix affichés sont enregistrés automatiquement une fois par jour : la courbe se construira au fil des jours d'ouverture de Finance.</span>
          </div>
        ) : (
          <>
            <FinanceChart pts={pts} fmtV={fmtV} range={range} />
            {local && (
              <div style={{ fontSize:9, color:C.muted, textAlign:'center', marginTop:8, fontStyle:'italic' }}>
                📉 Courbe reconstituée depuis l'historique local (1 point/jour, échantillonné par l'app)
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════
// Gestionnaire Finance MODULE-LEVEL — lance le fetch UNE seule fois (dès le login),
// met en cache et notifie les abonnés (FinancePanel). Survit au démontage de l'onglet
// mobile : les valeurs sont prêtes quand l'utilisateur ouvre Finance.
// ════════════════════════════════════════════════
// ⚠ Twelve Data plan "Basic 8" = 8 requêtes/MINUTE. Pour ne JAMAIS dépasser
// "Minutely maximum" (8), TOUS les appels TD (fetchTD / fetchQuote) passent par une
// file globale qui garantit ≥ TD_GAP_MS entre deux appels. Crypto (CoinGecko), or
// (gold-api) et le repli Stooq ne comptent PAS pour TD → lancés en parallèle, immédiats.
const TD_GAP_MS = 8000; // ≥7,5s entre 2 appels TD = max 8/min, marge de sécurité incluse
let _tdChain = Promise.resolve();
let _tdLastAt = 0;
// `label` (optionnel) = nom lisible de la valeur en cours ; il est posé quand la tâche
// arrive EN TÊTE de file (la file étant strictement sérielle, le libellé est donc
// toujours juste, même si Light et Full empilent des appels en même temps).
function tdSpaced(fn, label) {
  const run = _tdChain.then(async () => {
    if (label) { _finance.nextLabel = label; _finNotify(); }
    const wait = TD_GAP_MS - (Date.now() - _tdLastAt);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    _tdLastAt = Date.now();
    return fn();
  });
  _tdChain = run.then(() => {}, () => {}); // ne jamais casser la chaîne sur erreur
  return run;
}

const _finance = {
  eurusd: null, crypto: null, gold: null, oil: null, idx: null, stocks: {},
  silver: null, sugar: null,   // matières (Full)
  loadingLight: true,   // true tant que les valeurs Light ne sont pas toutes chargées
  loadingFull: false,   // true pendant le chargement des valeurs Full
  nextLabel: null,      // nom de la valeur en cours/à charger (affiché dans le loading)
  startedLight: false, startedFull: false,
  subs: new Set(),
};
function _finNotify() {
  finHistSnapshot();   // échantillonne les prix affichés (repli local des graphiques)
  _finance.subs.forEach(fn => { try { fn(); } catch (e) {} });
}

// Piste Alpha Vantage : appels SÉQUENTIELS avec une pause (400ms) pour ne pas burster
// la limite par minute d'AV. `jobs` = [ [() => Promise<{price,pct}>, setter], ... ].
async function _runAlphaTrack(jobs) {
  for (const [fn, set] of jobs) {
    set(await fn()); _finNotify();
    await new Promise(r => setTimeout(r, 400));
  }
}

// Valeurs LIGHT — lancées dès le login (prioritaires). DEUX pistes en PARALLÈLE :
//  • piste Yahoo (NASDAQ-100 + pétrole) : rapide, hors file TD
//  • piste TD (EUR/USD + actions) : espacée de 8s (limite Basic 8)
// Crypto + or partent en parallèle immédiatement. `loadingLight` ne passe à false
// que quand LES DEUX pistes sont finies.
async function startFinanceLight() {
  if (_finance.startedLight) return;
  _finance.startedLight = true;
  // Non-TD immédiats : crypto + or
  (async () => {
    try {
      const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,bittensor,ripple,pepe&vs_currencies=usd&include_24hr_change=true');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      _finance.crypto = await r.json();
    } catch (e) { _finance.crypto = 'error'; }
    _finNotify();
  })();
  fetchGold().then(d => { _finance.gold = d; _finNotify(); });
  // VRAIS indices (NASDAQ-100 + S&P 500 + CAC 40) en UN SEUL fetch same-origin (JSON
  // généré par la GitHub Action). Immédiat, hors file TD et hors quota AV. Les 3 sont
  // chargés d'un coup (S&P/CAC ne sont affichés qu'en mode Full mais déjà en mémoire).
  fetchIndicesJSON().then(idx => { if (idx) _finance.idx = idx; _finNotify(); });
  // Piste Alpha Vantage (CORS natif) : pétrole WTI (vrai prix). Les indices ne passent
  // plus par AV (ETF) → quota AV réservé au pétrole + sucre (Full).
  const alphaTrack = _runAlphaTrack([
    [fetchAlphaOil, d => { _finance.oil = d; }],   // Pétrole WTI
  ]);
  // Piste TD (EUR/USD + actions), espacée 8s — pilote le libellé `nextLabel`
  const tdTrack = (async () => {
    await tdSpaced(async () => {
      const td = await fetchTD('EUR/USD');
      let rate = td && td.price != null ? td.price : null;
      if (rate == null) {
        try {
          const r = await fetch('https://api.frankfurter.app/latest?from=EUR&to=USD');
          const j = await r.json();
          rate = j.rates && j.rates.USD != null ? j.rates.USD : null;
        } catch (e) {}
      }
      _finance.eurusd = rate; _finNotify();
    }, 'EUR/USD');
    if (!TD_ENABLED) return;   // phase de test : pas d'actions TD
    const stocks = [
      ['NVDA', 'nvda.us', d => { _finance.stocks = { ..._finance.stocks, nvda: d }; }, 'NVIDIA'],
      ['TTWO', 'ttwo.us', d => { _finance.stocks = { ..._finance.stocks, ttwo: d }; }, 'Take-Two'],
    ];
    for (const [td, stq, set, label] of stocks) {
      const d = await tdSpaced(() => fetchQuote(td, stq), label);
      set(d); _finNotify();
    }
  })();
  await Promise.all([alphaTrack, tdTrack]);
  _finance.loadingLight = false; _finance.nextLabel = null; _finNotify();
}

// Valeurs FULL — chargées à la demande au 1er passage en mode Full. Même découpage :
// piste Yahoo (S&P 500 + CAC 40) en parallèle de la piste TD (actions, espacée 8s,
// partage la file de Light).
async function startFinanceFull() {
  if (_finance.startedFull) return;
  _finance.startedFull = true;
  _finance.loadingFull = true; _finNotify();
  // Piste Alpha Vantage (CORS natif) : Sucre (endpoint matière première DÉDIÉ, vrai
  // prix mondial). Séquentielle (pause 400ms) pour ne pas burster la limite AV par minute.
  // Les indices S&P 500 / CAC 40 ne passent plus par AV : ils sont déjà chargés en mode
  // Light via fetchIndicesJSON (data/indices.json) avec NASDAQ-100.
  const alphaTrack = _runAlphaTrack([
    [() => fetchAlphaCommodity('SUGAR'), d => { _finance.sugar = d; }],   // Sucre (mensuel)
  ]);
  // Argent via gold-api (CORS natif, sans clé) — parallèle, immédiate.
  const metalsTrack = fetchMetal('XAG').then(d => { _finance.silver = d; _finNotify(); });
  const tdTrack = (async () => {
    if (!TD_ENABLED) return;   // phase de test : pas d'actions TD
    const stocks = [
      ['GOOGL', 'googl.us', d => { _finance.stocks = { ..._finance.stocks, googl: d }; }, 'Google'],
      ['MSFT',  'msft.us',  d => { _finance.stocks = { ..._finance.stocks, msft: d }; },  'Microsoft'],
      ['AMZN',  'amzn.us',  d => { _finance.stocks = { ..._finance.stocks, amzn: d }; },  'Amazon'],
      ['TSLA',  'tsla.us',  d => { _finance.stocks = { ..._finance.stocks, tsla: d }; },  'Tesla'],
    ];
    for (const [td, stq, set, label] of stocks) {
      const d = await tdSpaced(() => fetchQuote(td, stq), label);
      set(d); _finNotify();
    }
  })();
  await Promise.all([alphaTrack, tdTrack, metalsTrack]);
  _finance.loadingFull = false; _finance.nextLabel = null; _finNotify();
}

// MES ACTIFS — panneau (3e mode de la section Finance, à côté de Light/Full)
// Affiche le patrimoine perso lu depuis le Google Sheets « Finance » du Drive
// (helpers module-level actifsFetch/loadActifs — voir le bloc MES ACTIFS plus haut).
// ════════════════════════════════════════════════
const ACTIFS_GOLD = '#e0c060';   // accent doré du panneau Mes Actifs

// Formatage € (fr-FR, pas de décimales au-delà de 100 €)
function fmtEur(v, dec) {
  if (v == null || isNaN(v)) return '—';
  const n = Number(v);
  const d = dec != null ? dec : (Math.abs(n) >= 100 ? 0 : 2);
  return n.toLocaleString('fr-FR', { maximumFractionDigits: d }) + ' €';
}
function fmtEurSigned(v) { return v == null || isNaN(v) ? '—' : (v >= 0 ? '+' : '') + fmtEur(v, 0); }
function fmtActifMonth(t) { return new Date(t).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); }

// Carte-section (même gabarit que FinanceSection, sans le badge EUR/USD)
function ActifSection({ title, right, children }) {
  return (
    <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:'8px 12px 6px' }}>
      <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:2, gap:8 }}>
        <div style={{ fontSize:11, fontWeight:700, color:ACTIFS_GOLD, letterSpacing:'0.05em' }}>{title}</div>
        {right != null && <div style={{ fontSize:9, color:C.muted, fontFamily:'DM Mono,monospace', textAlign:'right' }}>{right}</div>}
      </div>
      {children}
    </div>
  );
}

// Ligne clé/valeur simple
function ActifKV({ label, value, color, sub }) {
  return (
    <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:10, padding:'4px 0', borderTop:`1px solid ${C.border}` }}>
      <div style={{ fontSize:11, fontWeight:600, color:C.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{label}</div>
      <div style={{ textAlign:'right', flexShrink:0 }}>
        <span style={{ fontSize:12, fontWeight:800, fontFamily:'DM Mono,monospace', color: color || C.text }}>{value}</span>
        {sub != null && <span style={{ fontSize:9, color:C.muted, marginLeft:5 }}>{sub}</span>}
      </div>
    </div>
  );
}

// Ligne avec barre de proportion (comptes, actifs physiques, pyramide…)
function ActifBar({ label, value, pct, color, valueTxt }) {
  const p = pct == null || isNaN(pct) ? 0 : Math.max(0, pct);
  return (
    <div style={{ padding:'4px 0 5px', borderTop:`1px solid ${C.border}` }}>
      <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:10 }}>
        <span style={{ fontSize:11, fontWeight:600, color:C.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{label}</span>
        <span style={{ fontSize:11, fontWeight:800, fontFamily:'DM Mono,monospace', color:C.text, flexShrink:0 }}>
          {valueTxt != null ? valueTxt : fmtEur(value, 0)}
          {pct != null && !isNaN(pct) && <span style={{ fontSize:9, color:C.muted, fontWeight:500, marginLeft:5 }}>{p.toFixed(p >= 10 ? 0 : 1)}%</span>}
        </span>
      </div>
      <div style={{ height:4, background:C.surfaceHigh, borderRadius:2, marginTop:3 }}>
        <div style={{ width:`${Math.min(100, p)}%`, height:'100%', background: color || ACTIFS_GOLD, borderRadius:2 }} />
      </div>
    </div>
  );
}

function FinancePanel() {
  // Lit l'état depuis le gestionnaire module-level `_finance` et se ré-rend à chaque
  // notification. `startFinanceLight()` (idempotent) est déclenché ICI au montage du
  // panneau : c'est l'UNIQUE point d'entrée du chargement Finance (plus rien au login),
  // donc les APIs dédiées ne partent que quand l'utilisateur ouvre Finance.
  const [, forceRender] = React.useReducer(x => x + 1, 0);
  React.useEffect(() => {
    _finance.subs.add(forceRender);
    startFinanceLight();
    return () => { _finance.subs.delete(forceRender); };
  }, []);
  const { eurusd, crypto, gold, oil, idx, stocks, silver, sugar, loadingLight, loadingFull, nextLabel } = _finance;
  const cg = (crypto && crypto !== 'error') ? crypto : null;

  // Mode Light (défaut) : seulement l'essentiel (BTC, PEPE, Or, Pétrole, S&P 500,
  // NASDAQ-100, NVIDIA, Take-Two, EUR/USD). Mode Full : tout. Mode Mes Actifs : patrimoine
  // perso lu depuis le Google Sheets « Finance » du Drive (MesActifsPanel — remplace les
  // sections marché, ne déclenche AUCUN appel des APIs de cours). ⚠ NON persisté : on
  // repart TOUJOURS en Light à chaque (re)chargement / reconnexion.
  const [mode, setMode] = React.useState('light');   // 'light' | 'full' | 'actifs'
  const full   = mode === 'full';
  const actifs = mode === 'actifs';
  const modeBtn = active => ({
    background: active ? `${FINANCE_CYAN}22` : 'none',
    border: active ? `1px solid ${FINANCE_CYAN}66` : `1px solid ${C.border}`,
    color: active ? FINANCE_CYAN : C.muted, borderRadius:6, padding:'3px 12px',
    cursor:'pointer', fontSize:10, fontWeight: active ? 700 : 500,
  });

  // Valeurs Full chargées À LA DEMANDE au 1er passage en mode Full (idempotent côté
